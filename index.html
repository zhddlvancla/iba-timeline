<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1440, initial-scale=1"/>
<title>IBA · 국제기록보존기구 — 기록보관소</title>
<style>
/* ============================================================
   IBA-ARC — International Bureau of Archives · Archive Terminal
   ------------------------------------------------------------
   Aesthetic: 1949년 설립 이래 갱신되지 않은 관청 단말기 — dark navy field,
   amber/orange phosphor, mono pixel type, bracketed frames,
   tabular telemetry, scanlines.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

:root{
  --bg:           #040806;
  --bg-1:         #070d09;
  --bg-2:         #0b150f;
  --bg-3:         #11211a;
  --panel:        #040806;
  --panel-2:      #060b08;
  --line:         #1b3a27;
  --line-2:       #245034;

  --amber:        #2fae5e;      /* primary phosphor */
  --amber-2:      #56cf85;      /* bright */
  --amber-3:      #1e8a48;      /* deep */
  --amber-dim:    #2a6b44;      /* dim text */
  --amber-glow:   rgba(47,174,94,.45);
  --amber-soft:   rgba(47,174,94,.10);
  --amber-line:   rgba(47,174,94,.30);

  --rust:         #24804e;
  --red:          #ff4422;
  --red-glow:     rgba(255,68,34,.50);
  --darkred:      #7a1818;
  --darkred-2:    #9a1f1f;
  --darkred-glow: rgba(122,24,24,.45);
  --green:        #6fd99a;
  --cyan-acc:     #4ad6e0;       /* sparingly */

  --ink:          #12241a;       /* dim ground */
  --paper:        #e6f7ea;       /* used only when needed */

  --font-display: 'IBM Plex Mono','IBM Plex Sans KR',monospace;
  --font-mono:    'IBM Plex Mono','IBM Plex Sans KR',monospace;
  --font-px:      'IBM Plex Mono','IBM Plex Sans KR',monospace;
  --font-ui:      'IBM Plex Mono','IBM Plex Sans KR',monospace;
  --font-ko:      'IBM Plex Sans KR','IBM Plex Mono',sans-serif;

  --shadow-glow:  0 0 12px var(--amber-glow);
  --shadow-text:  0 0 6px var(--amber-glow);
  --bracket:      1.5px solid var(--amber);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font-ui);
  color:var(--amber);
  background:
    radial-gradient(120% 70% at 50% 0%, transparent, transparent 60%),
    radial-gradient(80% 60% at 100% 100%, rgba(217,106,48,.08), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-shadow:0 0 1px rgba(47,174,94,.25);
}

/* CRT scanlines overlay (global, faint) */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1000;
  background:repeating-linear-gradient(0deg,
    rgba(0,0,0,0) 0 2px,
    rgba(0,0,0,.18) 2px 3px);
  mix-blend-mode:multiply;
}
/* CRT vignette */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1001;
  background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--amber);color:var(--bg)}

/* ---------- BRACKET FRAME UTILITY ---------- */
.brk{position:relative}
.brk::before, .brk::after,
.brk > .brk-tl, .brk > .brk-tr, .brk > .brk-bl, .brk > .brk-br{
  content:'';position:absolute;width:12px;height:12px;border:var(--bracket);pointer-events:none;
}
.brk::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.brk::after{top:-1px;right:-1px;border-left:0;border-bottom:0}
.brk > .brk-bl{bottom:-1px;left:-1px;border-right:0;border-top:0}
.brk > .brk-br{bottom:-1px;right:-1px;border-left:0;border-top:0}

/* ---------- APP SHELL ---------- */
.app.timeline-root{
  display:flex;flex-direction:column;
  height:100vh;max-height:100vh;
  overflow:hidden; /* 페이지 전체가 viewport 안에 고정 — 자식이 길어도 페이지 늘어나지 않음 */
  position:relative;z-index:2;
}
.app .main{
  display:grid;
  grid-template-columns: 1fr;   /* 연표가 오른쪽 끝까지 사용 — 상세 패널은 위에 겹쳐 뜬다 */
  gap:14px;
  padding:14px;
  flex:1;
  min-height:0; /* flex 자식이 부모 높이를 넘지 않도록 — 내부 스크롤 활성화의 핵심 */
  position:relative;
  overflow:hidden;
}

/* ============================================================
   TOP BAR  —  IBA system tab bar [T] [D] [N] [S] [W] [M]
   ============================================================ */
.topbar{
  display:grid;
  grid-template-columns: minmax(0,1fr) auto auto;   /* 좁아지면 브랜드 칸만 줄어든다 — 오른쪽 정보 칸은 줄바꿈 금지 */
  align-items:stretch;
  background:var(--panel);
  border-bottom:1.5px solid var(--amber);
  padding:0;
  position:relative;
  min-height:72px;
}
.topbar::after{
  content:'';position:absolute;left:0;right:0;bottom:-3px;height:1px;
  background:repeating-linear-gradient(90deg, var(--amber) 0 6px, transparent 6px 12px);
  opacity:.6;
}
.topbar__brand{
  display:flex;align-items:center;gap:16px;min-width:0;
  padding:12px 22px;
  border-right:1.5px solid var(--amber);
  background:linear-gradient(180deg, transparent, transparent);
  position:relative;
}
/* REBOOT + 음량 조절 — 상단바 맨 오른쪽 칸에 위아래로 */
.topbar__ctl{display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:6px;margin:0 18px}
.topbar__ctl .topbar__back{display:flex;align-self:stretch;margin:0;justify-content:center}
/* 지속 채널(앰비언트·배경음악) 음량 조절 — REBOOT 아래 */
.topbar__volume{
  position:relative;
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:4px 8px;
  border:1.5px solid var(--amber-line);
  background:var(--panel-2);
  color:var(--amber);
  z-index:3;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.topbar__volume:hover{
  border-color:var(--amber);
  box-shadow:0 0 10px var(--amber-glow);
}
.topbar__volume svg{display:block;pointer-events:none}
.topbar__volume--muted{color:var(--amber-dim);border-color:var(--amber-dim)}
.topbar__volume__slider{
  -webkit-appearance:none;appearance:none;
  width:72px;height:4px;
  background:linear-gradient(to right,
    var(--amber) 0%, var(--amber) var(--vol-pct, 50%),
    rgba(47,174,94,0.15) var(--vol-pct, 50%), rgba(47,174,94,0.15) 100%);
  border:1px solid var(--amber-line);
  outline:none;cursor:pointer;
  margin:0;
}
.topbar__volume__slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:10px;height:14px;
  background:var(--amber);
  border:1px solid var(--bg);
  cursor:pointer;
  box-shadow:0 0 4px var(--amber-glow);
}
.topbar__volume__slider::-moz-range-thumb{
  width:10px;height:14px;
  background:var(--amber);
  border:1px solid var(--bg);
  cursor:pointer;
  box-shadow:0 0 4px var(--amber-glow);
}
.topbar__volume__btn{
  background:transparent;border:none;color:inherit;cursor:pointer;
  padding:0;display:flex;align-items:center;
}
/* ── 지속 채널 컨트롤 패널 — 기존 볼륨 컨트롤 자리에서 아래로 펼쳐진다.
      absolute 배치라 상단바 레이아웃(폭·높이)에 영향을 주지 않는다. ── */
.iba-aud{
  position:absolute;
  top:calc(100% + 6px);right:0;
  min-width:212px;
  padding:10px 12px 11px;
  border:1.5px solid var(--amber-line);
  background:var(--panel-2);
  box-shadow:0 6px 20px rgba(0,0,0,.55);
  z-index:40;
  cursor:default;
}
.iba-aud__hd{
  font-size:12px;letter-spacing:.12em;color:var(--amber-dim);
  padding-bottom:7px;margin-bottom:8px;border-bottom:1px solid var(--amber-line);
}
.iba-aud__ch{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.iba-aud__ch:last-of-type{margin-bottom:0}
.iba-aud__tg{
  flex:0 0 auto;min-width:60px;
  font-family:inherit;font-size:12px;letter-spacing:.04em;
  padding:3px 6px;cursor:pointer;
  background:transparent;border:1px solid var(--amber-line);color:var(--amber-dim);
}
.iba-aud__tg:hover{border-color:var(--amber);color:var(--amber)}
.iba-aud__tg.is-on{background:var(--amber);border-color:var(--amber);color:var(--bg);font-weight:700}
.iba-aud__row{display:flex;align-items:center;gap:7px;margin-top:9px}
.iba-aud__lb{font-size:12px;color:var(--amber-dim);letter-spacing:.05em;min-width:34px}
.iba-aud__vl{font-size:12px;color:var(--amber);min-width:24px;text-align:right}
.iba-aud__ft{
  margin-top:9px;padding-top:7px;border-top:1px solid var(--amber-line);
  font-size:12px;color:var(--amber-dim);letter-spacing:.04em;line-height:1.5;
}
.topbar__brand img{display:none}
.topbar__mark{
  font-family:var(--font-display);
  font-size:28px;line-height:1;
  color:var(--amber);
  letter-spacing:.04em;
  padding:8px 12px 6px;
  border:2px solid var(--amber);
  text-shadow:var(--shadow-text);
  display:inline-flex;align-items:center;gap:0;
  background:rgba(47,174,94,.06);
}
.topbar__mark span{color:var(--amber-2)}
.topbar__hourglass{color:var(--amber);flex:none;filter:drop-shadow(0 0 4px var(--amber-glow))}
/* 국제기록보존기구 휘장 — IBA 마크 좌측, VESTIGIA 마스코트 대체 */
.topbar__emblem{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 0 6px var(--amber-glow));
}
.topbar__emblem svg{display:block;overflow:visible}
/* (구) VESTIGIA 마스코트 — 현재 미사용 */
.topbar__mascot{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 0 6px var(--amber-glow));
}
.topbar__mascot svg{display:block;overflow:visible}
.topbar__mascot .mt-body{
  transform-origin:34px 50px;
  animation:mt-bob 0.6s ease-in-out infinite;
}
/* head leans forward (rightward) — the walking direction */
.topbar__mascot .mt-head{
  transform-origin:34px 50px;
  transform:rotate(6deg);
}
/* legs swing forward/back along the walking direction (rightward) */
.topbar__mascot .mt-leg{transform-origin:33px 58px}
.topbar__mascot .mt-leg--back{animation:mt-leg-back 0.6s ease-in-out infinite}
.topbar__mascot .mt-leg--front{animation:mt-leg-front 0.6s ease-in-out infinite}
/* arms — opposite phase to legs */
.topbar__mascot .mt-arm{transform-origin:34px 36px}
.topbar__mascot .mt-arm--back{animation:mt-arm-back 0.6s ease-in-out infinite}
.topbar__mascot .mt-arm--front{animation:mt-arm-front 0.6s ease-in-out infinite}
/* motion lines: pulse to suggest forward travel */
.topbar__mascot .mt-speed{animation:mt-speed 0.6s linear infinite}

@keyframes mt-bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-2px)}
}
/* legs: back leg goes back, front leg goes forward, then swap */
@keyframes mt-leg-back{
  0%,100%{transform:rotate(-22deg)}
  50%   {transform:rotate(22deg)}
}
@keyframes mt-leg-front{
  0%,100%{transform:rotate(22deg)}
  50%   {transform:rotate(-22deg)}
}
@keyframes mt-arm-back{
  0%,100%{transform:rotate(18deg)}
  50%   {transform:rotate(-18deg)}
}
@keyframes mt-arm-front{
  0%,100%{transform:rotate(-18deg)}
  50%   {transform:rotate(18deg)}
}
@keyframes mt-speed{
  0%   {opacity:0.85;transform:translateX(0)}
  60%  {opacity:0.35;transform:translateX(-4px)}
  100% {opacity:0.85;transform:translateX(0)}
}
.topbar__brand-text{display:flex;flex-direction:column;gap:4px;min-width:0}
.topbar__title{
  font-family:var(--font-ui);font-weight:700;
  font-size:12px;letter-spacing:.28em;
  color:var(--amber);text-transform:uppercase;
  text-shadow:var(--shadow-text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar__sub{
  font-family:var(--font-mono);
  font-size:12px;letter-spacing:.1em;
  color:var(--amber-dim);text-transform:uppercase;
  display:flex;flex-wrap:wrap;column-gap:.6em;row-gap:1px;   /* 폭이 모자라면 잘리지 않고 두 덩어리로 줄바꿈 */
}
.topbar__sub > span{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* system tab bar [T] [D] [N] [S] [W] [M] */
.topbar__systabs{
  display:flex;align-items:stretch;
  border-right:1.5px solid var(--amber);
}
.systab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:10px 16px;width:120px;   /* 두 칸 폭 고정 */
  border-right:1px solid var(--line-2);
  color:var(--amber-dim);background:transparent;
  font-family:var(--font-mono);text-transform:uppercase;
  transition:background .12s ease, color .12s ease;
  position:relative;
}
.systab:last-child{border-right:0}
.systab:hover:not(:disabled){background:var(--amber-soft);color:var(--amber)}
.systab__k{font-size:12px;letter-spacing:.18em;color:var(--amber-dim)}
.systab__l{font-size:13px;letter-spacing:.22em;font-weight:700}
.systab--on{
  background:rgba(47,174,94,.14);
  color:var(--amber);
}
.systab--on .systab__k,
.systab--on .systab__l{color:var(--amber);text-shadow:var(--shadow-text)}
.systab--on::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
  background:var(--amber);box-shadow:0 0 10px var(--amber);
}
.systab:disabled{cursor:not-allowed;opacity:.55}
.systab{cursor:pointer}
.systab__ko{font-family:var(--font-ko);font-size:12px;letter-spacing:.06em;text-transform:none;color:var(--amber-dim)}
.systab--on .systab__ko{color:var(--amber)}
/* 대응반 접속 — 켜지면 적색 */
.systab--response:hover:not(.systab--on){background:rgba(255,68,34,.08)}
.systab--response:hover:not(.systab--on) .systab__l,
.systab--response:hover:not(.systab--on) .systab__ko{color:var(--red)}
.systab--response.systab--on{background:rgba(255,68,34,.14)}
.systab--response.systab--on .systab__k,
.systab--response.systab--on .systab__l,
.systab--response.systab--on .systab__ko{color:var(--red);text-shadow:0 0 6px var(--red-glow)}
.systab--response.systab--on::after{background:var(--red);box-shadow:0 0 10px var(--red)}

/* meta strip */
.topbar__meta{
  display:flex;align-items:stretch;
  padding:0;gap:0;
  font-family:var(--font-mono);
  font-size:12px;letter-spacing:.18em;
  color:var(--amber-dim);text-transform:uppercase;
}
.topbar__meta > span{
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding:10px 14px;white-space:nowrap;
  border-left:1px solid var(--line-2);
}
.topbar__meta b{color:var(--amber-dim);font-weight:400;letter-spacing:.18em;font-size:12px}
.topbar__meta > span > :last-child{color:var(--amber);font-weight:500;text-shadow:var(--shadow-text);font-size:12px;letter-spacing:.1em}

.topbar__sync{
  display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;   /* 다른 칸처럼 이름 / 값 2줄 */
  padding:6px 12px !important;
  min-width:132px;justify-content:center;   /* NONE ↔ DETECTED 폭 고정 */
  border:1.5px solid var(--green) !important;
  color:var(--green) !important;
  background:rgba(111,217,154,.08);
}
.topbar__stamp{display:flex;flex-direction:column;line-height:1.3}   /* 날짜 / 시각 두 줄 — 폭을 줄여 기관명 자리를 확보 */
.topbar__sync b{display:inline-flex;align-items:center;gap:7px;color:inherit !important;opacity:.8}
.topbar__sync > span:last-child{color:inherit !important;font-weight:700 !important;letter-spacing:.16em !important}
.topbar__sync .dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 6px var(--green), 0 0 14px var(--green);
  animation:tva-pulse 1.6s ease-in-out infinite;
}
@keyframes tva-pulse{0%,100%{opacity:1}50%{opacity:.4}}
.topbar__back{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;
  border:1.5px solid var(--amber);
  font-family:var(--font-mono);letter-spacing:.20em;font-size:12px;
  text-transform:uppercase;
  color:var(--amber);
  align-self:center;margin:0 18px;
}
.topbar__back:hover{background:var(--amber);color:var(--bg)}

/* ============================================================
   SUB NAV — track tabs + branching trunk animation on left
   ============================================================ */
.subnav.subnav--tracks{
  display:grid;
  grid-template-columns: minmax(540px, auto) 1fr 200px;
  align-items:stretch;
  gap:16px;
  padding:14px 18px;
  background:var(--panel);
  border-bottom:1px dashed var(--amber-line);
  position:relative;
}
/* 오른쪽 컬럼: sidemeta(위) + search(아래) 세로 스택, 우측 정렬 */
.subnav__rightcol{
  grid-column:3;
  display:flex;flex-direction:column;gap:8px;
  align-self:stretch;justify-self:end;
  width:100%;
}

/* ============================================================
   MIDDLE COLUMN: 접속자(연구원) HUD
   — 접속자 얼굴(윤곽선 스캔) + 접속자 데이터 + 기록줄기 단말기/무결성 상황판
   ============================================================ */
.subnav__operator{
  grid-column:2;
  display:flex;align-items:stretch;
  background:var(--panel-2);
  border:1.5px solid var(--amber);
  position:relative;overflow:hidden;
  box-shadow:inset 0 0 14px rgba(47,174,94,.05);
}
.subnav__operator::before{
  content:'';position:absolute;top:-1px;left:-1px;width:10px;height:10px;
  border-top:2px solid var(--amber-2);border-left:2px solid var(--amber-2);z-index:4;
}
.subnav__operator::after{
  content:'';position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;
  border-bottom:2px solid var(--amber-2);border-right:2px solid var(--amber-2);z-index:4;
}
/* 공통 섹션 */
.op-sect{position:relative;display:flex;flex-direction:column;min-width:0;padding:7px 9px}
.op-sect + .op-sect{border-left:1px dashed var(--amber-line)}
.op-sect__cap{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--amber-dim);
  border-bottom:1px dashed var(--amber-line);padding-bottom:4px;margin-bottom:6px;
  flex-wrap:wrap;row-gap:1px;   /* 12px 기준에서 좁으면 상태 표시가 다음 줄로 — 무결성 칸은 행이 하나 적어 높이 여유가 있다 */
}
.op-sect__cap > *{white-space:nowrap}
.op-sect__cap b{color:var(--amber);font-weight:700;text-shadow:var(--shadow-text)}

/* --- 접속자 얼굴 스캔 --- */
.op-face{
  flex:none;width:132px;
  background:
    radial-gradient(70% 60% at 50% 44%, transparent, transparent 72%),
    repeating-linear-gradient(0deg, transparent 0 9px, transparent 9px 10px);
}
.op-face__frame{
  position:relative;flex:1;margin:0 auto;width:100%;
  display:flex;align-items:center;justify-content:center;
}
.op-face__svg{
  width:74px;height:auto;display:block;color:var(--amber);
  filter:drop-shadow(0 0 5px var(--amber-glow));
}
.op-face__scan{
  position:absolute;left:14%;right:14%;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--amber-2),transparent);
  box-shadow:0 0 8px var(--amber-glow);
  animation:op-scan 2.8s ease-in-out infinite;
}
@keyframes op-scan{
  0%{top:16%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:84%;opacity:0}
}
/* face corner reticle brackets */
.op-face__brk{position:absolute;width:11px;height:11px;border:1.5px solid var(--amber);opacity:.8}
.op-face__brk--tl{top:24px;left:14px;border-right:0;border-bottom:0}
.op-face__brk--tr{top:24px;right:14px;border-left:0;border-bottom:0}
.op-face__brk--bl{bottom:8px;left:14px;border-right:0;border-top:0}
.op-face__brk--br{bottom:8px;right:14px;border-left:0;border-top:0}
.op-face__tag{
  display:flex;justify-content:center;align-items:center;gap:5px;
  font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;
  color:var(--green);text-transform:uppercase;margin-top:2px;
}

/* --- 데이터 행 (접속자 데이터 + 상황판 공용) --- */
.op-data{flex:1.15 1 0;min-width:172px}   /* 글자 길이와 무관하게 폭 고정 */
.op-stab{flex:1 1 0;min-width:182px}      /* 글자 길이와 무관하게 폭 고정 */
.op-row{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-family:var(--font-mono);font-size:12px;letter-spacing:.02em;
  line-height:1.65;white-space:nowrap;
}
/* 12px 기준에서 값 칸을 넓히려고 항목 이름 칸은 글자 폭만큼만 쓴다 (값은 오른쪽 정렬이라 흔들리지 않는다) */
.op-row .k{flex:none;white-space:nowrap}
.op-row .v{flex:1;min-width:0;text-align:right}
.op-row .k{color:var(--amber-dim);text-transform:uppercase}
.op-row .v{color:var(--amber);text-shadow:var(--shadow-text);overflow:hidden;text-overflow:ellipsis}
.op-row .v.ok{color:var(--green);text-shadow:0 0 6px rgba(111,217,154,.45)}

/* 신호 막대 */
.op-bars{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.op-bars i{width:3px;background:var(--amber-dim);align-self:flex-end}
.op-bars i.on{background:var(--amber);box-shadow:0 0 4px var(--amber-glow)}
.op-bars i:nth-child(1){height:4px}
.op-bars i:nth-child(2){height:6px}
.op-bars i:nth-child(3){height:8px}
.op-bars i:nth-child(4){height:10px}
.op-bars i:nth-child(5){height:12px}

/* SYNC 진행 막대 */
.op-meter{
  position:relative;flex:1;min-width:24px;height:5px;
  background:rgba(47,174,94,.12);border:1px solid var(--amber-line);overflow:hidden;
}
.op-meter__fill{
  position:absolute;inset:0 auto 0 0;
  background:linear-gradient(90deg,var(--amber),var(--amber-2));
  box-shadow:0 0 6px var(--amber-glow);
}
.op-meter__fill::after{
  content:'';position:absolute;top:0;right:0;width:1px;height:100%;
  background:#fff;box-shadow:0 0 6px #fff;
}

/* 기록줄기 편차(VARIANCE) — 구역별 트랙 + 마커 */
.op-var{
  position:relative;flex:1;min-width:24px;height:6px;border:1px solid var(--amber-line);
  background:linear-gradient(90deg,
     var(--green) 0 52%, var(--amber) 52% 78%, #c0392b 78% 100%);
}
.op-var::after{content:'';position:absolute;inset:0;background:rgba(10,10,18,.45)}
.op-var__mk{
  position:absolute;top:-2px;width:2px;height:10px;background:#fff;
  box-shadow:0 0 6px #fff;z-index:2;
}
/* 미터 라벨 행 */
.op-mrow{display:flex;align-items:center;gap:8px;margin:1px 0}
.op-mrow .k{
  flex:none;min-width:76px;white-space:nowrap;font-family:var(--font-mono);font-size:12px;   /* 글자가 길면 칸이 늘고 막대가 줄어든다 */
  letter-spacing:.10em;text-transform:uppercase;color:var(--amber-dim);
}
.op-mrow .vnum{
  flex:none;font-family:var(--font-mono);font-size:12px;
  color:var(--amber);text-shadow:var(--shadow-text);min-width:30px;text-align:right;
}
/* 접속 상태 점 */
.op-dot{
  width:6px;height:6px;border-radius:50%;flex:none;
  background:var(--green);box-shadow:0 0 6px var(--green),0 0 12px var(--green);
  animation:op-pulse 1.8s ease-in-out infinite;
}
@keyframes op-pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* 세로 자리가 모자랄 때(TimelineCanvas 가 html.tl-tight 를 붙임) — 관내 방송 줄만 남기고 접는다. 강의 모드는 전부 접는다 */
html.tl-tight .subnav.subnav--tracks{grid-template-columns:minmax(0,1fr);padding:6px 18px}
html.tl-tight .subnav .trackbranch,html.tl-tight .subnav__operator,html.tl-tight .subnav__rightcol{display:none}
html.tl-tight .subnav__leftcol{grid-column:1}
html.tl-tight.lecture .subnav.subnav--tracks{display:none}
/* --- LEFT: 지역국 갈래도(위) + 관내 방송 칸(아래) --- */
.subnav__leftcol{grid-column:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.bcbox{
  flex:1;min-height:22px;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--panel-2);border:1px solid var(--amber-line);
  font:500 13px/1 var(--font-ko);color:var(--amber);white-space:nowrap;overflow:hidden;
  transition:border-color .4s,box-shadow .4s;
}
.bcbox__k{flex:none;display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--font-ko);letter-spacing:.1em;color:var(--amber-2)}
.bcbox__dot{width:6px;height:6px;border-radius:50%;background:var(--amber);opacity:.35}
.bcbox__t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;opacity:.6;transition:opacity .6s}
.bcbox.is-idle .bcbox__t{opacity:.35;letter-spacing:.08em}
.bcbox.is-fresh{border-color:var(--amber);box-shadow:inset 0 0 12px rgba(47,174,94,.10)}
.bcbox.is-fresh .bcbox__t{opacity:1;color:var(--amber-2);animation:bc-in .5s ease}
.bcbox.is-fresh .bcbox__dot{opacity:1;background:var(--amber-2);animation:op-pulse 1s infinite}
@keyframes bc-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
/* --- 지역국 갈래도: branching trunk + 4 stacked track boxes --- */
.trackbranch{
  display:flex;align-items:stretch;
  background:var(--panel-2);
  border:1.5px solid var(--amber);
  height:152px;
  position:relative;
  box-shadow:inset 0 0 14px rgba(47,174,94,.05);
}
.trackbranch::before{
  content:'';position:absolute;top:-1px;left:-1px;width:10px;height:10px;
  border-top:2px solid var(--amber-2);border-left:2px solid var(--amber-2);
}
.trackbranch::after{
  content:'';position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;
  border-bottom:2px solid var(--amber-2);border-right:2px solid var(--amber-2);
}

.trackbranch__animwrap{
  position:relative;flex:none;
  width:200px;
  border-right:1px dashed var(--amber-line);
  background:
    radial-gradient(60% 60% at 18% 50%, transparent, transparent 65%),
    repeating-linear-gradient(0deg, transparent 0 11px, transparent 11px 12px);
}
.trackbranch__caption{
  position:absolute;top:6px;left:10px;right:10px;
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;white-space:nowrap;
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.08em;color:var(--amber-dim);
  text-transform:uppercase;z-index:2;pointer-events:none;
}
.trackbranch__caption-k{color:var(--amber);text-shadow:var(--shadow-text);font-weight:600}
.trackbranch__caption-l{color:var(--amber-dim)}
.trackbranch__svg{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;
}

/* --- branching animation: SMIL-driven (more reliable than CSS in this context) --- */
.tb-branchgroup.is-focused .tb-branch{ stroke:#56cf85; filter:url(#snav-glow) drop-shadow(0 0 4px var(--amber)) }
.tb-branchgroup.is-dimmed .tb-branch{ opacity:.25 }
.tb-branchgroup.is-dimmed .tb-pulse{ opacity:.2 }

/* --- 4 VERTICAL TRACK BOXES, branch endpoints land at left edges --- */
.trackseg{
  display:flex;flex-direction:column;
  flex:1;
  min-width:300px;
  background:transparent;
  border:0;
}
.trackseg__cell{
  display:grid;
  grid-template-columns:18px 18px 1fr auto;
  align-items:center;gap:12px;
  padding:0 16px 0 0;
  flex:1;min-height:0;
  background:transparent;
  border:0;
  border-bottom:1px solid var(--line-2);
  color:var(--amber-dim);
  text-align:left;
  position:relative;
  transition:background .15s ease, color .15s ease;
}
.trackseg__cell:last-child{border-bottom:0}
.trackseg__cell:hover{background:var(--amber-soft);color:var(--amber)}
.trackseg__cell.is-hidden{opacity:.35}
.trackseg__cell.is-focused{
  background:linear-gradient(90deg, rgba(47,174,94,.18), transparent);
  color:var(--amber-2);
  box-shadow:inset 3px 0 0 var(--amber-2);
}
.trackseg__cell.is-focused .trackseg__inlet{ color:var(--amber-2);text-shadow:0 0 8px var(--amber-glow) }
.trackseg__cell.is-dimmed{opacity:.45}

.trackseg__inlet{
  font-family:var(--font-mono);font-size:12px;
  color:var(--amber);text-align:center;width:18px;
  text-shadow:var(--shadow-text);
}
.trackseg__check{
  font-family:var(--font-mono);font-size:13px;
  color:var(--amber);width:18px;text-align:center;
}
.trackseg__body{display:flex;align-items:baseline;gap:14px;min-width:0;white-space:nowrap;overflow:hidden}
.trackseg__ko{
  font-family:var(--font-ko);font-weight:600;
  font-size:14px;letter-spacing:.04em;
  color:var(--amber);
  text-shadow:var(--shadow-text);
  white-space:nowrap;
}
.trackseg__cell.is-focused .trackseg__ko{color:var(--amber-2)}
.trackseg__en{
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.22em;color:var(--amber-dim);
  text-transform:uppercase;
  white-space:nowrap;
}
.trackseg__idx{
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.18em;color:var(--amber-dim);
  padding:2px 6px;border:1px dashed var(--amber-line);
  white-space:nowrap;
}
.trackseg__cell.is-focused .trackseg__idx{
  color:var(--amber-2);border-color:var(--amber-2);
}

/* legacy subnav__lead — kept hidden in new layout */
.subnav__lead{display:none}

/* --- MIDDLE: side meta panel --- */
.subnav__sidemeta{
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  padding:6px 10px;
  border:1px dashed var(--amber-line);
  background:var(--panel-2);
}
.subnav__sidemeta-row{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;
  white-space:nowrap;
}
.subnav__sidemeta-row .k{color:var(--amber-dim);white-space:nowrap}
.subnav__sidemeta-row .v{color:var(--amber);text-shadow:var(--shadow-text);white-space:nowrap}
.subnav__sidemeta-row:first-child .k{
  color:var(--amber);font-weight:700;letter-spacing:.18em;
  text-shadow:var(--shadow-text);
  padding-bottom:2px;border-bottom:1px dashed var(--amber-line);
  width:100%;font-size:12px;
}

/* --- legacy meta (compatibility) --- */
.subnav__meta{display:none}

.subnav__search{
  display:flex;align-items:center;gap:8px;
  padding:5px 10px;
  border:1.5px solid var(--amber-line);
  background:var(--panel-2);
  position:relative;
}
.subnav__search:focus-within{
  border-color:var(--amber);
  box-shadow:0 0 8px var(--amber-glow);
}
.subnav__search > svg{color:var(--amber) !important;flex:none}
.subnav__search input{
  background:transparent;border:0;outline:0;
  font-family:var(--font-mono);font-size:12px;
  width:100%;color:var(--amber);
  letter-spacing:.04em;
  min-width:0;
}
.subnav__search input::placeholder{color:var(--amber-dim)}
.subnav__search__count{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.10em;
  color:var(--amber-dim);text-transform:uppercase;
  white-space:nowrap;flex:none;
}
.subnav__search__count.has-match{color:var(--amber);text-shadow:var(--shadow-text)}
.subnav__search__clear{
  background:transparent;border:0;color:var(--amber-dim);cursor:pointer;
  font-family:var(--font-mono);font-size:12px;padding:0 2px;
}
.subnav__search__clear:hover{color:var(--amber)}

/* 연관 기록 대조 결과 창 */
.sempop{position:absolute;top:calc(100% + 6px);right:-1.5px;width:360px;max-width:calc(100vw - 32px);z-index:80;
  background:var(--panel-2);border:1.5px solid var(--amber);box-shadow:0 0 18px var(--amber-glow), 0 10px 30px rgba(0,0,0,.6);
  font-family:var(--font-ko);color:var(--amber);padding:10px 12px 10px}
.sempop__head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;color:var(--amber-dim);
  padding-bottom:7px;border-bottom:1px solid var(--amber-line)}
.sempop__head b{color:var(--amber);font-weight:600;font-family:var(--font-ko);letter-spacing:.06em}
.sempop__x{background:transparent;border:0;color:var(--amber-dim);cursor:pointer;font-size:12px;padding:0 2px}
.sempop__x:hover{color:var(--amber)}
.sempop__q{margin:8px 0 6px;font-size:13px;color:var(--amber-2);overflow-wrap:anywhere}
.sempop__wait{padding:6px 0 4px}
.sempop__wait-t{display:flex;align-items:center;gap:8px;font-size:13px}
.sempop__dots{display:inline-flex;gap:3px}
.sempop__dots i{width:4px;height:4px;background:var(--amber);animation:pt-alog-dot 1s steps(1) infinite}
.sempop__dots i:nth-child(2){animation-delay:.2s}
.sempop__dots i:nth-child(3){animation-delay:.4s}
.sempop__bar{margin-top:8px;height:5px;border:1px solid var(--amber-line);background:rgba(47,174,94,.06)}
.sempop__bar i{display:block;height:100%;background:var(--amber);box-shadow:0 0 6px var(--amber-glow);transition:width .3s ease}
.sempop__note{margin-top:6px;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--amber-dim)}
.sempop__empty{padding:8px 0 4px;font-size:13px;color:var(--amber-dim)}
.sempop__empty.is-bad{color:var(--red)}
.sempop__list{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column}
.sempop__row{width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  padding:7px 6px;background:transparent;border:0;border-bottom:1px dashed var(--amber-line);
  color:var(--amber);cursor:pointer;text-align:left;font-family:var(--font-ko)}
.sempop__list li:last-child .sempop__row{border-bottom:0}
.sempop__row:hover,.sempop__row:focus-visible{background:rgba(47,174,94,.10);outline:none;color:var(--amber-2)}
.sempop__meta{font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;color:var(--amber-dim);white-space:nowrap}
.sempop__label{font-size:14px;min-width:0;overflow-wrap:anywhere}
.sempop__lv{display:inline-flex;gap:2px}
.sempop__lv i{width:5px;height:10px;border:1px solid var(--amber-line)}
.sempop__lv i.on{background:var(--amber);border-color:var(--amber)}
.sempop__foot{margin-top:7px;padding-top:6px;border-top:1px solid var(--amber-line);
  font-size:12px;color:var(--amber-dim);letter-spacing:.02em}

/* ============================================================
   CANVAS  —  timeline panel (left)
   ============================================================ */
.canvas{
  display:flex;flex-direction:column;
  background:var(--panel);
  border:1.5px solid var(--amber);
  position:relative;
  overflow:hidden;
  min-height:0;
}
.canvas::before{
  /* corner bracket TL */
  content:'';position:absolute;top:-1px;left:-1px;width:14px;height:14px;
  border-top:2px solid var(--amber-2);border-left:2px solid var(--amber-2);
  z-index:8;pointer-events:none;
  filter:drop-shadow(0 0 4px var(--amber));
}
.canvas::after{
  content:'';position:absolute;top:-1px;right:-1px;width:14px;height:14px;
  border-top:2px solid var(--amber-2);border-right:2px solid var(--amber-2);
  z-index:8;pointer-events:none;
  filter:drop-shadow(0 0 4px var(--amber));
}
.canvas__header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;
  border-bottom:1.5px solid var(--amber);
  background:linear-gradient(180deg, transparent, transparent);
  position:relative;
}
.canvas__title{
  font-family:var(--font-mono);font-weight:700;
  font-size:12px;letter-spacing:.24em;
  color:var(--amber);text-transform:uppercase;
  text-shadow:var(--shadow-text);
}
.canvas__title::before{content:'▸ '}
.canvas__zoom{display:flex;gap:0;border:1.5px solid var(--amber-line);background:var(--panel-2)}
.canvas__zoom button{
  width:30px;height:26px;
  font-family:var(--font-mono);font-size:13px;
  color:var(--amber);
  border-right:1px solid var(--line-2);
}
.canvas__zoom button:last-child{border-right:0}
.canvas__zoom button:hover{background:var(--amber);color:var(--bg)}

/* ---- viewport ---- */
.tl-viewport{
  position:relative;flex:1;
  overflow:hidden;cursor:grab;
  touch-action:pinch-zoom;   /* 손가락으로 밀면 화면 대신 연표가 넘어가게 (두 손가락 확대는 그대로) */
  min-height:0;   /* 박스 높이를 그대로 따르고, 레인 높이를 거기에 맞춘다 */
  background:
    linear-gradient(180deg, transparent, transparent 30%),
    radial-gradient(80% 60% at 50% 50%, transparent, transparent 70%);
}
.tl-viewport::before{
  /* grid mesh */
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(0deg, var(--amber-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--amber-line) 1px, transparent 1px);
  background-size:80px 40px;
  opacity:.15;
}
.tl-viewport:active{cursor:grabbing}
.tl-inner{position:absolute;top:0;left:0;height:100%;will-change:transform}

/* lane axes */
.tl-laneaxis{position:absolute;left:0;right:0;height:0;pointer-events:none}
/* 노드 묶음 브래킷 — 하·상·주처럼 인접 노드들을 하나의 그룹으로 표시 */
.tl-nodegroup{
  position:absolute;pointer-events:none;
  display:flex;align-items:center;
  height:0;
}
.tl-nodegroup__line{
  position:absolute;left:0;right:0;top:50%;
  height:1px;background:var(--amber-dim);
  box-shadow:0 0 4px rgba(47,174,94,.3);
}
.tl-nodegroup__cap{
  position:absolute;top:50%;width:1px;height:7px;
  background:var(--amber-dim);transform:translateY(-50%);
}
.tl-nodegroup__cap--l{left:0}
.tl-nodegroup__cap--r{right:0}
.tl-nodegroup__label{
  position:absolute;top:50%;
  left:var(--label-left, 50%);
  transform:translate(-50%,-50%);
  padding:2px 10px;
  background:var(--panel);
  border:1px solid var(--amber-dim);
  font-family:var(--font-ko);font-size:12px;
  color:var(--amber);letter-spacing:.06em;
  text-shadow:0 0 6px var(--amber-glow);
  white-space:nowrap;
  pointer-events:auto;cursor:pointer;
  transition:background .12s ease, color .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.tl-nodegroup__label:hover{
  background:var(--amber);color:var(--bg);
  border-color:var(--amber-2);
  box-shadow:0 0 14px var(--amber-glow);
  text-shadow:none;
}
/* 선택된 묶음 라벨 — 클릭 시 점등 (active 상태) */
.tl-nodegroup__label.is-active{
  background:var(--amber-2);color:var(--bg);
  border-color:var(--amber-2);
  box-shadow:0 0 18px var(--amber-2), 0 0 32px var(--amber-glow);
  text-shadow:none;font-weight:700;
}
.tl-nodegroup.is-glitching{opacity:.25}
.tl-nodegroup.is-glitching .tl-nodegroup__line,
.tl-nodegroup.is-glitching .tl-nodegroup__cap{background:var(--darkred-2)}
.tl-nodegroup.is-glitching .tl-nodegroup__label{
  color:var(--darkred-2);border-color:var(--darkred-2);
  text-shadow:0 0 4px var(--darkred-glow);
}
.tl-laneaxis__line{
  position:absolute;left:0;right:0;top:0;height:1.5px;
  transform:translateY(-50%);
  background:repeating-linear-gradient(90deg, var(--amber-line) 0 14px, transparent 14px 20px);
  opacity:.8;
}
.tl-laneaxis.is-focused .tl-laneaxis__line{
  background:linear-gradient(90deg, var(--amber-2) 0%, var(--amber) 50%, var(--amber-2) 100%);
  height:4px;opacity:1;
  box-shadow:0 0 16px var(--amber-glow), 0 0 32px var(--amber-glow);
  border-radius:2px;
}
.tl-laneaxis.is-focused .tl-tick{background:var(--amber);opacity:.9}
.tl-laneaxis.is-focused .tl-tick--major{background:var(--amber-2);box-shadow:0 0 6px var(--amber-glow)}
.tl-laneaxis.is-focused .tl-tick__label{color:var(--amber-2);text-shadow:0 0 8px var(--amber-glow);font-weight:600}
.tl-laneaxis.is-glitching{opacity:.25}

.tl-tick{position:absolute;width:1px;height:8px;background:var(--amber-dim);top:-4px;opacity:.5}
.tl-tick--half{height:14px;top:-7px;opacity:.7}
.tl-tick--major{height:12px;top:-10px;opacity:1;width:1.5px;background:var(--amber)}   /* 선 아래 2px까지만 — 아래 연도 글자를 가르지 않게 */
.tl-tick--major .tl-tick__label{top:14px}
.tl-tick__label{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.18em;
  color:var(--amber-dim);
  white-space:nowrap;text-transform:uppercase;
}
.tl-tick--major .tl-tick__label{color:var(--amber)}

/* nodes — squares / diamonds in the archive terminal
   ※ 기본 상태에서는 점등(glow) 효과 없음 — 클릭(active)되었을 때만 점등 */
.tl-node{
  position:absolute;
  width:12px;height:12px;
  transform:translate(-50%,-50%);
  background:var(--bg);
  border:1.5px solid var(--amber);
  cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  z-index:2;
  box-shadow:none;
}
.tl-node:hover{
  transform:translate(-50%,-50%) scale(1.35);
  box-shadow:0 0 10px var(--amber-glow);
}
.tl-node.tl-node--turn{
  width:14px;height:14px;
  background:var(--amber);
  transform:translate(-50%,-50%) rotate(45deg);
  box-shadow:none;
}
.tl-node.tl-node--turn:hover{transform:translate(-50%,-50%) rotate(45deg) scale(1.3);box-shadow:0 0 12px var(--amber-glow)}
/* 기록 열람 가능 노드 — 클릭 전에도 마커를 앰버로 채워 표시 (펄스/라벨 변화 없음). active가 더 밝게 덮어씀 */
.tl-node.is-sync{
  background:var(--amber);
  border-color:var(--amber);
}
.tl-node.active{
  background:var(--amber-2);
  border-color:var(--amber-2);
  box-shadow:0 0 18px var(--amber-2), 0 0 36px var(--amber-glow);
  z-index:5;
}
.tl-node.tl-node--turn.active{
  box-shadow:0 0 18px var(--amber-2), 0 0 36px var(--amber-glow);
}

/* 서브 노드(기록 열람 없음) 마커 — 네모 대신 약간 굵은 작은 세로선 */
.tl-node.tl-node--sub{
  width:3px;height:14px;
  background:var(--amber);
  border:none;
  border-radius:1.5px;
  box-shadow:none;
}
.tl-node.tl-node--sub:hover{
  transform:translate(-50%,-50%) scaleY(1.25);
  box-shadow:0 0 8px var(--amber-glow);
}
.tl-node.tl-node--sub.active{
  background:var(--amber-2);
  box-shadow:0 0 14px var(--amber-2), 0 0 28px var(--amber-glow);
}

/* node labels — 글씨 자체도 클릭 가능 (노드 클릭과 동일 효과) */
.tl-nodelabel{
  position:absolute;transform:translate(-50%,-100%);
  pointer-events:auto;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  z-index:3;white-space:nowrap;
  /* 트랙 오른쪽 끝 라벨이 남은 폭에 맞춰 줄바꿈되며 키가 커지는 것을 막는다 — 배치 계산의 크기 추정과 일치시킴 */
  width:max-content;
  transition:transform .12s ease, filter .12s ease;
}
.tl-nodelabel:hover{
  transform:translate(-50%,-100%) translateY(-1px);
  filter:brightness(1.15) drop-shadow(0 0 6px var(--amber-glow));
}
.tl-nodelabel:hover .tl-nodelabel__l{
  border-color:var(--amber);
}
.tl-nodelabel__year{
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.18em;color:var(--amber-dim);
  text-transform:uppercase;
  padding:1px 5px;
  border:1px solid var(--amber-line);
  background:var(--bg);
}
.tl-nodelabel__l{
  font-family:var(--font-ko);font-weight:400;
  font-size:16px;color:var(--amber);
  background:var(--panel);
  padding:3px 9px;
  border:1.5px solid var(--amber-line);
  letter-spacing:.04em;
  max-width:240px;
  text-wrap:balance;
  white-space:normal;
  word-break:keep-all;
  text-align:center;
  line-height:1.25;
  text-shadow:var(--shadow-text);
}
.tl-nodelabel.active .tl-nodelabel__year{
  background:var(--amber);color:var(--bg);border-color:var(--amber-2);
  text-shadow:none;
}
.tl-nodelabel.active .tl-nodelabel__l{
  background:var(--amber);color:var(--bg);
  border-color:var(--amber-2);
  box-shadow:0 0 14px var(--amber-glow);
  text-shadow:none;font-weight:700;
}

/* 서브 노드 라벨 — 평소엔 이름만 작게, 연도 숨김 */
.tl-nodelabel--sub .tl-nodelabel__year{display:none}
.tl-nodelabel--sub .tl-nodelabel__l{
  font-size:14px;
  padding:1px 5px;
  opacity:.68;
  background:transparent;
  border-color:transparent;
  text-shadow:0 0 6px var(--bg), 0 0 3px var(--bg);
}
/* 클릭(선택) 시 — 이름·연도를 라인 위쪽에 온전히 표시
   (라벨은 하단 기준 앵커라 연도가 추가되면 위로 자라남 → 항상 라인 위) */
.tl-nodelabel--sub.active .tl-nodelabel__year{display:block}
.tl-nodelabel--sub.active .tl-nodelabel__l{
  font-size:16px;
  opacity:1;
  padding:3px 9px;
  background:var(--amber);
  border-color:var(--amber-2);
}
/* 밀집 구간에서 옆으로 비킨 라벨의 지시선 — 마커 → 선 위 통로 → 라벨 아랫변 */
.tl-leader{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:1}
.tl-leader polyline{fill:none;stroke:var(--amber);stroke-opacity:.6;stroke-width:1.2;stroke-linejoin:miter}
.tl-leader.active polyline{stroke:var(--amber-2);stroke-opacity:1;stroke-width:1.8}
.tl-leader.is-glitching polyline{stroke:var(--darkred-2);stroke-opacity:.35}

.tl-nodelabel.is-glitching{opacity:.2}

/* sticky track labels */
.tl-stickylabel{
  position:absolute;left:14px;
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:7px 12px;min-width:138px;
  background:var(--panel);
  border:1.5px solid var(--amber);
  z-index:4;cursor:pointer;
  transition:transform .12s ease, background .12s ease;
  box-shadow:0 0 10px rgba(0,0,0,.5);
}
.tl-stickylabel::before{
  /* small bracket */
  content:'';position:absolute;top:-1px;left:-1px;width:8px;height:8px;
  border-top:1.5px solid var(--amber-2);border-left:1.5px solid var(--amber-2);
}
.tl-stickylabel::after{
  content:'';position:absolute;bottom:-1px;right:-1px;width:8px;height:8px;
  border-bottom:1.5px solid var(--amber-2);border-right:1.5px solid var(--amber-2);
}
.tl-stickylabel:hover{background:var(--amber-soft)}
.tl-stickylabel.is-focused{
  background:var(--amber);color:var(--bg);
  box-shadow:0 0 18px var(--amber-glow), inset 0 0 14px rgba(0,0,0,.3);
}
.tl-stickylabel.is-glitching{opacity:.45}

/* ============================================================
   GLITCH STATE — when one track is focused, other tracks dim to
   dark-red with a slow 지지직 (static) flicker. Lower frequency,
   deeper dim. Lane axes flicker on the same beat.
   ============================================================ */
@keyframes tl-static-flicker{
  0%, 100%   { opacity: 0.32; filter: brightness(0.55); transform: translate(0,0); }
  6%         { opacity: 0.10; filter: brightness(0.30); transform: translate(-1px, 0); }
  8%         { opacity: 0.32; filter: brightness(0.55); transform: translate(0,0); }
  44%        { opacity: 0.32; filter: brightness(0.55); transform: translate(0,0); }
  47%        { opacity: 0.50; filter: brightness(0.75); transform: translate(2px, 0); }
  49%        { opacity: 0.12; filter: brightness(0.30); transform: translate(-2px, 1px); }
  52%        { opacity: 0.32; filter: brightness(0.55); transform: translate(0,0); }
  78%        { opacity: 0.32; filter: brightness(0.55); transform: translate(0,0); }
  82%        { opacity: 0.18; filter: brightness(0.40); transform: translate(1px, 0); }
  85%        { opacity: 0.32; filter: brightness(0.55); transform: translate(0,0); }
}
@keyframes tl-axis-flicker{
  0%, 100% { opacity: 0.40; }
  6%       { opacity: 0.12; }
  9%       { opacity: 0.40; }
  47%      { opacity: 0.60; }
  49%      { opacity: 0.15; }
  52%      { opacity: 0.40; }
  82%      { opacity: 0.22; }
  85%      { opacity: 0.40; }
}

/* lane axis: dark red dashed line with slow static flicker */
.tl-laneaxis.is-glitching{opacity:1 !important;animation:tl-axis-flicker 4.5s steps(1,end) infinite}
.tl-laneaxis.is-glitching .tl-laneaxis__line{
  background:repeating-linear-gradient(90deg, var(--darkred-2) 0 14px, transparent 14px 20px) !important;
  box-shadow:0 0 6px var(--darkred-glow);
  animation:tl-axis-flicker 4.5s steps(1,end) infinite;
}
.tl-laneaxis.is-glitching .tl-tick{
  background:var(--darkred-2) !important;opacity:.5;
}
.tl-laneaxis.is-glitching .tl-tick--major{
  background:var(--darkred) !important;
  animation:tl-axis-flicker 4.5s steps(1,end) infinite;
}
.tl-laneaxis.is-glitching .tl-tick__label{
  color:var(--darkred-2) !important;text-shadow:0 0 4px var(--darkred-glow);
  filter:brightness(0.65);
}

/* always-lit nodes — always glow amber regardless of selection/focus state */
.tl-node.is-alwayslit{
  background:var(--amber) !important;
  border-color:var(--amber) !important;
  box-shadow:0 0 10px var(--amber-glow), 0 0 22px var(--amber-glow) !important;
  animation:tl-alwayslit-pulse 2.4s ease-in-out infinite !important;
  opacity:1 !important;
}
.tl-nodelabel.is-alwayslit{opacity:1 !important}
.tl-nodelabel.is-alwayslit .tl-nodelabel__year,
.tl-nodelabel.is-alwayslit .tl-nodelabel__l{
  color:var(--amber) !important;
  border-color:var(--amber) !important;
  text-shadow:0 0 6px var(--amber-glow) !important;
}
/* 선택(active) 시에는 amber 배경이 깔리므로, alwaysLit의 amber 글씨를 어두운 글씨로 덮어써 가독성 확보 */
.tl-nodelabel.is-alwayslit.active .tl-nodelabel__year,
.tl-nodelabel.is-alwayslit.active .tl-nodelabel__l{
  color:var(--bg) !important;
  text-shadow:none !important;
}
@keyframes tl-alwayslit-pulse{
  0%, 100% { box-shadow:0 0 10px var(--amber-glow), 0 0 22px var(--amber-glow); }
  50%      { box-shadow:0 0 16px var(--amber-glow), 0 0 36px var(--amber-glow); }
}

/* nodes: dark red, slow flickering — !important on animation overrides
   .tl-viewport--ready .tl-node fadein rule which comes later in CSS */
.tl-node.is-glitching{
  background:var(--bg) !important;
  border-color:var(--darkred-2) !important;
  box-shadow:0 0 6px var(--darkred-glow), 0 0 12px var(--darkred-glow) !important;
  animation:tl-static-flicker 5s steps(1,end) infinite !important;
  transform:translate(-50%,-50%) !important;
  opacity:1 !important;
}
.tl-node.tl-node--turn.is-glitching{
  background:var(--darkred) !important;
  border-color:var(--red) !important;
  box-shadow:0 0 8px var(--darkred-glow), 0 0 18px var(--red-glow) !important;
}
/* glitching nodes still react to hover with a red flash */
.tl-node.is-glitching:hover{
  background:var(--red) !important;
  border-color:var(--red) !important;
  box-shadow:0 0 14px var(--red-glow), 0 0 28px var(--red-glow) !important;
  animation:none !important;
  opacity:1 !important;
}

/* node labels: dark red, slow flickering */
.tl-nodelabel.is-glitching{
  opacity:1 !important;
  animation:tl-static-flicker 5s steps(1,end) infinite !important;
  transform:translate(-50%,-100%) !important;
}
.tl-nodelabel.is-glitching .tl-nodelabel__year{
  color:var(--darkred-2) !important;border-color:var(--darkred) !important;
  background:var(--bg) !important;text-shadow:none !important;
}
.tl-nodelabel.is-glitching .tl-nodelabel__l{
  color:var(--darkred-2) !important;border-color:var(--darkred) !important;
  background:var(--panel) !important;text-shadow:0 0 4px var(--darkred-glow) !important;
}
/* glitch nodes should remain pointer-interactive even during branching phase */
.tl-viewport--branching .tl-node.is-glitching,
.tl-viewport--branching .tl-nodelabel.is-glitching{
  opacity:1 !important;pointer-events:auto !important;
}

/* sticky label of unfocused tracks: dark red with subtle flicker */
.tl-stickylabel.is-glitching{
  opacity:1 !important;
  border-color:var(--darkred-2) !important;
  background:var(--panel) !important;
  box-shadow:0 0 8px var(--darkred-glow) !important;
  animation:tl-static-flicker 6s steps(1,end) infinite;
}
.tl-stickylabel.is-glitching::before,
.tl-stickylabel.is-glitching::after{
  border-color:var(--darkred) !important;
}
.tl-stickylabel.is-glitching .tl-stickylabel__ko,
.tl-stickylabel.is-glitching .tl-stickylabel__en,
.tl-stickylabel.is-glitching .tl-stickylabel__hint{
  color:var(--darkred-2) !important;text-shadow:0 0 4px var(--darkred-glow) !important;
}
.tl-stickylabel__ko{
  font-family:var(--font-ko);font-weight:400;
  font-size:15px;color:var(--amber);
  text-shadow:var(--shadow-text);
}
.tl-stickylabel.is-focused .tl-stickylabel__ko{color:var(--bg);text-shadow:none;font-weight:700}
.tl-stickylabel__en{
  font-family:var(--font-mono);font-weight:700;
  font-size:12px;letter-spacing:.24em;
  color:var(--amber-dim);text-transform:uppercase;
  margin-top:2px;
}
.tl-stickylabel.is-focused .tl-stickylabel__en{color:rgba(10,10,18,.7)}
.tl-stickylabel__hint{
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.20em;color:var(--amber-dim);
  margin-top:3px;text-transform:uppercase;
}
.tl-stickylabel.is-focused .tl-stickylabel__hint{color:rgba(10,10,18,.6)}

.tl-scan{
  position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(0,0,0,.55) 100%);
}

/* minimap */
.tl-minimap{
  position:absolute;right:14px;bottom:10px;
  width:calc(100% - 28px);height:10px;
  background:var(--panel-2);
  border:1.5px solid var(--amber);
  z-index:7;
}
.tl-minimap__bar{
  position:absolute;top:0;bottom:0;
  background:var(--amber);opacity:.75;
  box-shadow:0 0 8px var(--amber-glow);
}
.tl-minimap__label{
  position:absolute;top:-16px;left:0;right:0;
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.18em;color:var(--amber-dim);
  text-transform:uppercase;
  white-space:nowrap;
}


/* ---- Origin label (anchored to trunk start) ---- */
.tl-origin{
  background:var(--panel);
  border:1.5px solid var(--amber);
  padding:8px 12px;
  box-shadow:0 0 14px var(--amber-glow), inset 0 0 8px rgba(47,174,94,.06);
  position:relative;
}
.tl-origin::before{
  content:'';position:absolute;top:-1px;left:-1px;width:8px;height:8px;
  border-top:2px solid var(--amber-2);border-left:2px solid var(--amber-2);
}
.tl-origin::after{
  content:'';position:absolute;bottom:-1px;right:-1px;width:8px;height:8px;
  border-bottom:2px solid var(--amber-2);border-right:2px solid var(--amber-2);
}
.tl-origin__k{
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.22em;color:var(--amber-dim);
  text-transform:uppercase;
}
.tl-origin__l{
  font-family:var(--font-ko);font-size:17px;font-weight:400;
  color:var(--amber-2);
  text-shadow:0 0 8px var(--amber-glow);
  margin-top:2px;letter-spacing:.04em;
}
.tl-origin__en{
  font-family:var(--font-display);font-size:12px;
  letter-spacing:.18em;color:var(--amber);
  text-shadow:var(--shadow-text);text-transform:uppercase;
}
.tl-origin__connector{
  position:absolute;left:50%;bottom:-32px;width:1.5px;height:32px;
  background:linear-gradient(180deg, var(--amber) 0%, var(--amber-soft) 100%);
  box-shadow:0 0 6px var(--amber);
}

/* ============================================================
   VERTICAL Y-RAIL — left-side scrollbar/year-axis
   ============================================================ */
.tl-vrail{
  position:absolute;left:0;top:0;bottom:0;
  width:56px;
  background:linear-gradient(180deg, transparent, transparent 40%, transparent 60%, transparent), var(--panel);
  border-right:1.5px solid var(--amber);
  display:flex;flex-direction:column;
  z-index:9;
  font-family:var(--font-mono);
  box-shadow:2px 0 12px rgba(0,0,0,.5);
}
.tl-vrail::before{
  content:'';position:absolute;top:-1px;left:-1px;width:10px;height:10px;
  border-top:2px solid var(--amber-2);border-left:2px solid var(--amber-2);
  pointer-events:none;
}
.tl-vrail::after{
  content:'';position:absolute;bottom:-1px;left:-1px;width:10px;height:10px;
  border-bottom:2px solid var(--amber-2);border-left:2px solid var(--amber-2);
  pointer-events:none;
}
.tl-vrail__head, .tl-vrail__foot{
  font-size:12px;letter-spacing:.20em;
  color:var(--amber);text-transform:uppercase;
  padding:7px 4px;text-align:center;
  white-space:nowrap;
  text-shadow:var(--shadow-text);
  font-weight:600;
}
.tl-vrail__head{
  border-bottom:1px dashed var(--amber-line);
  background:linear-gradient(180deg, transparent, transparent);
}
.tl-vrail__foot{
  border-top:1px dashed var(--amber-line);
  background:linear-gradient(0deg, transparent, transparent);
  font-size:12px;
}
.tl-vrail__body{
  flex:1;position:relative;cursor:ns-resize;
  overflow:hidden;
  background-image:
    repeating-linear-gradient(0deg, transparent 0 28px, transparent 28px 29px);
}
.tl-vrail__body:active{cursor:grabbing}
.tl-vrail__yr{
  position:absolute;left:0;right:0;
  display:flex;align-items:center;gap:5px;
  padding:0 4px;
  transform:translateY(-50%);
  pointer-events:none;
  color:var(--amber-dim);
}
.tl-vrail__yr-tick{
  width:10px;height:1.5px;background:var(--amber);
  flex:none;opacity:.75;box-shadow:0 0 4px var(--amber-glow);
}
.tl-vrail__yr-l{
  white-space:nowrap;font-size:12px;letter-spacing:.10em;
  color:var(--amber);text-shadow:var(--shadow-text);
}
.tl-vrail__thumb{
  position:absolute;left:3px;right:3px;
  background:linear-gradient(180deg,
    rgba(47,174,94,.45) 0%,
    rgba(86,207,133,.55) 50%,
    rgba(47,174,94,.45) 100%);
  border:1.5px solid var(--amber-2);
  box-shadow:0 0 14px var(--amber-glow), inset 0 0 8px rgba(86,207,133,.30);
  min-height:18px;
  pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
.tl-vrail__thumb-grip{
  width:18px;height:6px;
  background-image:
    linear-gradient(0deg, var(--bg) 0 1px, transparent 1px 2px, var(--bg) 2px 3px, transparent 3px 4px, var(--bg) 4px 5px, transparent 5px 6px);
  opacity:.55;
}

/* Y-axis rail removed — sticky labels and minimap stay at their original positions */
.tl-stickylabel{ left:auto !important; }
.tl-minimap{ left:222px;right:14px;width:auto; }   /* 왼쪽 갈래 이름표(≈205px)와 겹치지 않게 */
.tl-minimap__label{text-align:right}
/* 가로 스크롤 표시 — 이동 중에만 나타난다 */
.tl-minimap{opacity:0;pointer-events:none;transition:opacity .45s ease}
.tl-minimap.is-visible{opacity:1;transition-duration:.12s}

/* ============================================================
   INTRO OVERLAY — load sacred timeline gate
   ============================================================ */
.tl-intro{
  position:absolute;inset:0;z-index:20;
  display:grid;place-items:center;
  background:
    radial-gradient(60% 50% at 50% 50%, transparent, transparent 70%),
    rgba(10,10,18,.92);
  backdrop-filter:blur(2px);
  animation:tl-intro-in .35s ease;
}
@keyframes tl-intro-in{from{opacity:0}to{opacity:1}}
.tl-intro--loading{background:rgba(10,10,18,.88)}

/* idle: big call-to-action button */
.tl-intro__btn{
  position:relative;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:36px 64px 32px;
  background:var(--panel);
  border:2px solid var(--amber);
  color:var(--amber);
  font-family:var(--font-mono);
  text-transform:uppercase;
  box-shadow:0 0 28px var(--amber-glow), inset 0 0 14px rgba(47,174,94,.05);
  cursor:pointer;
  transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
}
.tl-intro__btn::before,.tl-intro__btn::after{
  content:'';position:absolute;width:18px;height:18px;
  border:2px solid var(--amber-2);
  filter:drop-shadow(0 0 4px var(--amber));
}
.tl-intro__btn::before{top:-3px;left:-3px;border-right:0;border-bottom:0}
.tl-intro__btn::after{bottom:-3px;right:-3px;border-left:0;border-top:0}
.tl-intro__btn:hover{
  background:rgba(47,174,94,.10);
  box-shadow:0 0 36px var(--amber-glow), inset 0 0 18px rgba(47,174,94,.10);
  transform:translateY(-1px);
}
.tl-intro__btn:active{transform:translateY(1px)}
.tl-intro__btn-k{
  font-size:12px;letter-spacing:.30em;color:var(--amber-dim);
  white-space:nowrap;
}
.tl-intro__btn-l{
  font-family:var(--font-ko);
  font-size:32px;color:var(--amber-2);
  letter-spacing:.06em;
  text-shadow:0 0 14px var(--amber-glow);
  white-space:nowrap;
}
.tl-intro__btn-hint{
  margin-top:4px;
  font-size:12px;letter-spacing:.24em;color:var(--amber-dim);
  white-space:nowrap;
}

/* loading: status block */
.tl-intro__status{
  display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:32px 48px;
  text-align:center;min-width:520px;
}
.tl-intro__status-icon{
  font-family:var(--font-display);font-size:42px;
  color:var(--amber);
  text-shadow:0 0 18px var(--amber-glow);
  animation:tl-icon-pulse 1.2s ease-in-out infinite;
}
@keyframes tl-icon-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.9)}}
.tl-intro__status-k{
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.28em;color:var(--amber);
  text-transform:uppercase;
  text-shadow:0 0 6px var(--amber-glow);
  white-space:nowrap;
}
.tl-intro__status-l{
  font-family:var(--font-ko);font-size:24px;
  color:var(--amber-2);letter-spacing:.04em;
  text-shadow:0 0 12px var(--amber-glow);
  white-space:nowrap;
}
.tl-intro__bar{
  width:480px;height:6px;background:var(--panel-2);
  border:1px solid var(--amber);position:relative;overflow:hidden;
}
.tl-intro__bar-fill{
  position:absolute;left:0;top:0;height:100%;width:0%;
  background:var(--amber);box-shadow:0 0 12px var(--amber-glow);
  animation:tl-bar-fill 2.5s cubic-bezier(.6,.05,.4,1) forwards;
}
@keyframes tl-bar-fill{0%{width:0%}100%{width:100%}}
.tl-intro__logs{
  display:flex;flex-direction:column;gap:4px;
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.18em;color:var(--amber-dim);
  text-transform:uppercase;text-align:left;
  width:480px;
  min-height:96px;
}
.tl-intro__logs span{opacity:0;transform:translateY(-2px);animation:tl-log-in .25s ease forwards}
.tl-intro__logs span:nth-child(1){animation-delay:.2s}
.tl-intro__logs span:nth-child(2){animation-delay:.8s}
.tl-intro__logs span:nth-child(3){animation-delay:1.4s}
.tl-intro__logs span:nth-child(4){animation-delay:2.0s;color:var(--amber)}
@keyframes tl-log-in{to{opacity:1;transform:none}}

/* ---- Branch drawing animation tied to phase ---- */
.tl-viewport--idle .tl-trunk path,
.tl-viewport--idle .tl-trunk line,
.tl-viewport--loading .tl-trunk path,
.tl-viewport--loading .tl-trunk line{
  stroke-dasharray:1400;stroke-dashoffset:1400;
}
.tl-viewport--branching .tl-trunk path,
.tl-viewport--branching .tl-trunk line{
  stroke-dasharray:1400;stroke-dashoffset:1400;
  animation:tl-branch-draw 2s cubic-bezier(.5,.05,.3,1) forwards;
}
.tl-viewport--branching .tl-trunk line{animation-delay:.1s}
.tl-viewport--branching .tl-trunk path:nth-of-type(1){animation-delay:.4s}
.tl-viewport--branching .tl-trunk path:nth-of-type(2){animation-delay:.7s}
.tl-viewport--branching .tl-trunk path:nth-of-type(3){animation-delay:1.0s}
.tl-viewport--branching .tl-trunk path:nth-of-type(4){animation-delay:1.3s}
.tl-viewport--ready .tl-trunk path,
.tl-viewport--ready .tl-trunk line{stroke-dashoffset:0}
@keyframes tl-branch-draw{to{stroke-dashoffset:0}}

/* origin diamond hidden until branching */
.tl-viewport--idle .tl-trunk g,
.tl-viewport--loading .tl-trunk g{opacity:0}
.tl-viewport--branching .tl-trunk g{opacity:0;animation:tl-origin-fadein .35s ease .15s forwards}
.tl-viewport--ready .tl-trunk g{opacity:1}
@keyframes tl-origin-fadein{to{opacity:1}}

/* nodes and labels — hidden until ready, then stagger in */
.tl-viewport--idle .tl-node,
.tl-viewport--idle .tl-nodelabel,
.tl-viewport--loading .tl-node,
.tl-viewport--loading .tl-nodelabel,
.tl-viewport--branching .tl-node,
.tl-viewport--branching .tl-nodelabel{opacity:0;pointer-events:none}
.tl-viewport--ready .tl-nodelabel{pointer-events:auto}
.tl-viewport--ready .tl-node,
.tl-viewport--ready .tl-nodelabel{
  animation:tl-node-fadein .5s ease forwards;
}
@keyframes tl-node-fadein{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.tl-viewport--ready .tl-nodelabel{animation:tl-label-fadein .5s ease forwards}
@keyframes tl-label-fadein{from{opacity:0;transform:translate(-50%,calc(-100% + 8px))}to{opacity:1;transform:translate(-50%,-100%)}}
/* 지시선 — 라벨과 함께 나타난다 */
.tl-viewport--idle .tl-leader,.tl-viewport--loading .tl-leader,.tl-viewport--branching .tl-leader{opacity:0}
.tl-viewport--ready .tl-leader{animation:tl-fade-in .5s ease forwards}

/* sticky labels and ticks too — visible from branching onward */
.tl-viewport--idle .tl-stickylabel,
.tl-viewport--idle .tl-tick,
.tl-viewport--loading .tl-stickylabel,
.tl-viewport--loading .tl-tick{opacity:0}
.tl-viewport--branching .tl-tick{opacity:0;animation:tl-fade-in .6s ease 1.6s forwards}
.tl-viewport--branching .tl-stickylabel{opacity:0;animation:tl-stickylabel-slidein .5s ease forwards}
.tl-viewport--branching .tl-stickylabel:nth-child(1){animation-delay:1.7s}
.tl-viewport--branching .tl-stickylabel:nth-child(2){animation-delay:1.85s}
.tl-viewport--branching .tl-stickylabel:nth-child(3){animation-delay:2.0s}
.tl-viewport--branching .tl-stickylabel:nth-child(4){animation-delay:2.15s}
.tl-viewport--ready .tl-stickylabel,
.tl-viewport--ready .tl-tick{opacity:1}
@keyframes tl-fade-in{from{opacity:0}to{opacity:1}}
@keyframes tl-stickylabel-slidein{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

/* branching-phase status banner */
.tl-branching-status{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);
  z-index:15;
  display:flex;align-items:center;gap:14px;
  padding:8px 18px;
  background:var(--panel);
  border:1.5px solid var(--amber);
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.24em;color:var(--amber);
  text-transform:uppercase;text-shadow:0 0 6px var(--amber-glow);
  box-shadow:0 0 18px var(--amber-glow);
  animation:tl-branching-in .4s ease;
}
.tl-branching-status > :last-child{font-family:var(--font-ko);color:var(--amber-2);letter-spacing:.04em;text-transform:none}
.tl-branching-status__dot{
  width:8px;height:8px;border-radius:50%;background:var(--amber-2);
  box-shadow:0 0 8px var(--amber);
  animation:pulse 1s ease-in-out infinite;
}
@keyframes tl-branching-in{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}

/* ============================================================
   MAP — floating modal (Google Maps) triggered by 위치 확인
   ============================================================ */
.tl-stickywrap{position:absolute;left:30px;display:flex;flex-direction:column;gap:6px;z-index:4}
.tl-stickywrap .tl-stickylabel{position:static !important;left:auto !important}
.tl-mapbtn{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 10px;
  background:var(--panel);
  border:1.5px solid var(--amber-2);
  color:var(--amber-2);
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.18em;text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 0 12px var(--amber-glow), inset 0 0 6px rgba(86,207,133,.10);
  text-shadow:var(--shadow-text);
  animation:tl-mapbtn-in .25s ease;
}
.tl-mapbtn:hover{background:var(--amber);color:var(--bg);box-shadow:0 0 18px var(--amber-glow)}
.tl-mapbtn svg{flex:none}
@keyframes tl-mapbtn-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.tl-mapmodal{
  position:fixed;inset:0;z-index:1200;
  background:rgba(5,4,8,.85);
  display:flex;align-items:center;justify-content:center;
  padding:36px;
  animation:tva-overlay-in .25s ease;
}
.tl-mapmodal__win{
  position:relative;
  width:min(960px, 90vw);
  height:min(640px, 80vh);
  display:flex;flex-direction:column;
  background:var(--panel);
  border:2px solid var(--amber);
  box-shadow:0 0 0 1px var(--bg), 0 0 0 8px var(--bg), 0 0 60px rgba(47,174,94,.30);
  overflow:hidden;
}
.tl-mapmodal__head{
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;
  background:linear-gradient(180deg, transparent, transparent);
  border-bottom:1px dashed var(--amber-line);
}
.tl-mapmodal__title{
  font-family:var(--font-mono);font-weight:700;
  font-size:12px;letter-spacing:.22em;
  color:var(--amber);text-transform:uppercase;
  text-shadow:var(--shadow-text);
}
.tl-mapmodal__sub{
  font-family:var(--font-ko);font-size:12px;
  color:var(--amber-dim);
}
.tl-mapmodal__close{
  margin-left:auto;
  width:26px;height:26px;
  border:0;background:transparent;
  color:var(--amber);
  font-family:var(--font-mono);font-size:17px;line-height:1;
}
.tl-mapmodal__close:hover{color:var(--amber-2);text-shadow:0 0 8px var(--amber-glow)}
.tl-mapmodal__iframe{
  width:100%;height:100%;border:0;flex:1;
  filter:sepia(1) saturate(2.5) hue-rotate(-18deg) contrast(.95) brightness(.7);
}

/* ============================================================
   IMAGE LIGHTBOX — fullscreen zoom for inserted images
   ============================================================ */
.tmb-lightbox{
  position:fixed;inset:0;z-index:9999;
  background:rgba(5,4,8,.94);
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  cursor:zoom-out;
  animation:tmb-lightbox-in .18s ease;
}
@keyframes tmb-lightbox-in{from{opacity:0}to{opacity:1}}
.tmb-lightbox__img{
  width:98vw;height:94vh;
  max-width:none;max-height:none;
  object-fit:contain;
  image-rendering:-webkit-optimize-contrast;
  border:1.5px solid var(--amber);
  box-shadow:0 0 0 1px var(--bg), 0 0 0 8px var(--bg), 0 0 80px rgba(47,174,94,.45);
  cursor:default;
  background:#040806;
}
.tmb-lightbox__close{
  position:absolute;top:24px;right:24px;
  width:36px;height:36px;
  border:0;background:transparent;color:var(--amber);
  font-family:var(--font-mono);font-size:22px;line-height:1;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s ease, color .12s ease;
}
.tmb-lightbox__close:hover{color:var(--amber-2);text-shadow:0 0 10px var(--amber-glow)}
.tmb-lightbox__hint{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  font-family:var(--font-mono);font-size:12px;letter-spacing:.22em;
  color:var(--amber-dim);text-transform:uppercase;
  text-shadow:0 0 6px var(--amber-glow);
}
/* 클릭 가능한 이미지 — 줌 커서 */
.sync-source__img,
.sync-art__img,
.tmb-zoomable{
  cursor:zoom-in;
  transition:transform .15s ease, filter .15s ease;
}
.sync-source__img:hover,
.sync-art__img:hover,
.tmb-zoomable:hover{
  filter:drop-shadow(0 0 8px rgba(47,174,94,.35));
}

/* ============================================================
   MEMORY DETAIL — classified dossier panel (right side)
   ============================================================ */
.detail{
  /* 연표 위에 겹쳐 뜨는 플로팅 패널 — 이전 2열 레이아웃과 같은 우측 위치·폭을 유지 */
  position:absolute;
  top:72px;right:14px;bottom:14px;   /* 기록줄기 머리줄(위험 표시·확대 단추) 아래에서 시작 */
  width:440px;
  z-index:30;
  background:var(--panel);
  border:1.5px solid var(--amber);
  padding:0;
  overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 0 0 1px rgba(0,0,0,.55), 0 18px 48px rgba(0,0,0,.6);
}
/* 열림·닫힘 전환 — 우측에서 밀려 들어온다 */
.detail--slide{
  opacity:0;transform:translateX(20px);
  transition:opacity .2s ease, transform .2s ease;
}
.detail--slide.is-open{opacity:1;transform:none}
.detail__scroll{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;
}
.detail::before{
  content:'';position:absolute;top:-1px;left:-1px;width:14px;height:14px;
  border-top:2px solid var(--amber-2);border-left:2px solid var(--amber-2);
  z-index:8;pointer-events:none;
  filter:drop-shadow(0 0 4px var(--amber));
}
.detail::after{
  content:'';position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;
  border-bottom:2px solid var(--amber-2);border-right:2px solid var(--amber-2);
  z-index:8;pointer-events:none;
  filter:drop-shadow(0 0 4px var(--amber));
}
.detail--slide{padding:0}
.detail--slide .detail__scroll{padding:24px 22px}
.detail__close{
  position:absolute;top:8px;right:14px;
  width:24px;height:24px;
  font-family:var(--font-mono);font-size:17px;line-height:1;
  color:var(--amber);
  border:0;background:transparent;
  z-index:9;
}
.detail__close:hover{color:var(--amber-2);text-shadow:0 0 8px var(--amber-glow)}
.detail__corner-tl,.detail__corner-tr,.detail__corner-bl,.detail__corner-br{display:none}

/* "CLASSIFIED DOSSIER" header strip */
.detail__id{
  padding-right:30px;   /* 닫기 ✕ 자리 확보 — 기록 번호가 ✕ 밑으로 들어가지 않도록 */
  display:flex;align-items:center;gap:14px;
  padding:8px 12px;margin-bottom:14px;
  background:linear-gradient(180deg, transparent, transparent);
  border:1px solid var(--amber-line);
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.22em;color:var(--amber);
  text-transform:uppercase;
  text-shadow:var(--shadow-text);
}
.detail__id{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:3px;align-items:center}
.detail__id::before{content:'▸ CLASSIFIED RECORD';grid-column:1;grid-row:1;white-space:nowrap}
.detail__id-t{grid-column:1;grid-row:2;color:var(--amber-dim);font-size:12px;letter-spacing:.16em;word-break:keep-all}
.detail__id::after{grid-column:2;grid-row:1 / span 2;white-space:nowrap}
.detail__id::after{
  content:'RISK · HIGH';
  margin-left:auto;
  padding:3px 9px;
  font-family:var(--font-mono);font-weight:700;
  font-size:12px;letter-spacing:.20em;
  color:var(--red);
  border:1.5px solid var(--red);
  background:rgba(255,68,34,.06);
  text-shadow:0 0 6px var(--red-glow);
}
.detail__year{
  font-family:var(--font-display);
  font-size:88px;line-height:.95;
  color:var(--amber);
  letter-spacing:-.02em;
  margin:0;
  text-shadow:0 0 12px var(--amber-glow);
  display:flex;align-items:flex-start;gap:10px;
}
.detail__year--label{font-size:40px;line-height:1.15;letter-spacing:0;font-family:var(--font-ko);font-weight:500;word-break:keep-all}
.detail__year--name{overflow-wrap:anywhere}
.detail__year--name.is-long{font-size:32px}
.detail__year-era{
  font-family:var(--font-mono);
  font-size:22px;line-height:1;
  letter-spacing:.14em;
  color:var(--amber-2);
  text-shadow:0 0 8px var(--amber-glow);
  padding:6px 8px;
  border:1.5px solid var(--amber-line);
  margin-top:14px;
  font-weight:500;
  background:rgba(47,174,94,.06);
}
.detail__year-en{
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.22em;color:var(--amber-dim);
  text-transform:uppercase;
  margin-top:6px;padding-bottom:12px;
  border-bottom:1px dashed var(--amber-line);
}

.detail__label{
  font-family:var(--font-ko);font-weight:400;
  font-size:26px;line-height:1.2;
  color:var(--amber-2);
  margin-top:16px;
  letter-spacing:.02em;
  text-wrap:pretty;
  text-shadow:var(--shadow-text);
}
.detail__en{
  font-family:var(--font-mono);font-size:13px;
  color:var(--amber-dim);
  letter-spacing:.10em;
  margin-top:4px;
  text-transform:uppercase;
}

.badge{
  display:inline-flex;align-items:center;
  padding:3px 9px;
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.20em;text-transform:uppercase;
  border:1.5px solid var(--amber-line);
  color:var(--amber);background:rgba(47,174,94,.06);
}
.badge--turn{background:var(--amber);color:var(--bg);border-color:var(--amber-2);font-weight:700}
.badge--theme{border-color:var(--amber);color:var(--amber)}
.badge--state{border-color:var(--amber-3);color:var(--amber-3)}
.badge--db{background:var(--green);color:var(--bg);border-color:var(--green)}

.detail__divider{
  margin:20px 0 10px;
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.22em;color:var(--amber-dim);
  text-transform:uppercase;
  padding-bottom:6px;
  border-bottom:1px dashed var(--amber-line);
  position:relative;
}
.detail__body{
  font-family:var(--font-ko);font-size:16px;line-height:1.8;
  color:var(--amber);text-wrap:pretty;
  letter-spacing:.02em;
}

.detail__actions{margin-top:20px}
.btn-sync{
  display:inline-flex;align-items:center;gap:10px;width:100%;
  justify-content:center;
  padding:12px 18px;
  background:var(--amber);
  color:var(--bg);
  border:1.5px solid var(--amber-2);
  font-family:var(--font-mono);font-weight:700;
  font-size:12px;letter-spacing:.24em;
  text-transform:uppercase;
  box-shadow:0 0 14px var(--amber-glow);
  position:relative;
  transition:filter .12s ease;
}
.btn-sync:hover{filter:brightness(1.15)}
.btn-sync:active{filter:brightness(.85)}
.btn-sync__pulse{
  width:8px;height:8px;border-radius:50%;
  background:var(--bg);
  animation:tva-pulse 1.4s ease-in-out infinite;
}

/* ▸ RECORD METADATA table */
.detail__meta{
  margin-top:22px;
  display:flex;flex-direction:column;gap:0;
  border:1px solid var(--amber-line);
  background:var(--panel-2);
}
.detail__meta::before{
  content:'▸ RECORD METADATA · 기록 정보';
  display:block;
  padding:8px 12px;
  background:rgba(47,174,94,.08);
  border-bottom:1px dashed var(--amber-line);
  font-family:var(--font-mono);font-weight:700;
  font-size:12px;letter-spacing:.22em;
  color:var(--amber);text-transform:uppercase;
  text-shadow:var(--shadow-text);
}
.detail__meta-row{
  display:grid;grid-template-columns: 130px 1fr;
  padding:9px 12px;
  border-bottom:1px dashed var(--line-2);
}
.detail__meta-row:last-child{border-bottom:0}
.detail__meta-row .k{
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.20em;color:var(--amber-dim);
  text-transform:uppercase;
}
.detail__meta-row .v{
  font-family:var(--font-ko);font-weight:400;
  font-size:13.5px;color:var(--amber);
  text-shadow:var(--shadow-text);
}

/* ---- empty state ---- */
.detail--empty{
  display:flex;flex-direction:column;
  padding:42px 32px 28px;
  position:relative;
  background:var(--panel);
}
.detail__empty-stamp{
  align-self:flex-start;
  font-family:var(--font-display);font-weight:400;
  font-size:18px;line-height:1.15;
  letter-spacing:.04em;
  color:var(--red);
  border:2px solid var(--red);
  padding:8px 12px;
  background:rgba(255,68,34,.08);
  text-align:center;
  margin-bottom:28px;
  text-transform:uppercase;
  text-shadow:0 0 6px var(--red-glow);
}
.detail__empty-mark{
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.22em;color:var(--amber-dim);
  text-transform:uppercase;margin-bottom:6px;
}
.detail__empty-title{
  font-family:var(--font-display);
  font-size:30px;line-height:1.05;color:var(--amber);
  letter-spacing:.04em;margin-bottom:18px;
  text-shadow:0 0 10px var(--amber-glow);
}
.detail__empty-body{
  font-family:var(--font-ko);font-size:14px;line-height:1.8;
  color:var(--amber);text-wrap:pretty;
  letter-spacing:.02em;
}
.detail__empty-body b{color:var(--amber-2);font-weight:700}
.detail__empty-foot{
  margin-top:auto;padding-top:24px;
  border-top:1px dashed var(--amber-line);
  display:flex;justify-content:space-between;gap:14px;
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.18em;color:var(--amber-dim);
  text-transform:uppercase;
}
.detail__empty-foot > :first-child{color:var(--amber);text-shadow:var(--shadow-text)}

/* ============================================================
   FOOTER — system status bar
   ============================================================ */
.footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px;
  background:var(--panel);
  color:var(--amber-dim);
  font-family:var(--font-mono);font-size:12px;
  letter-spacing:.18em;
  border-top:1.5px solid var(--amber);
  min-height:32px;text-transform:uppercase;
}
.footer .l,.footer .r{display:flex;align-items:center;gap:14px}
.footer .l > :nth-child(2){color:var(--green) !important}
.footer .r > :last-child{color:var(--amber-2) !important;text-shadow:var(--shadow-text)}

/* ============================================================
   SYNC DIALOG — operator terminal fullscreen overlay
   ============================================================ */
.sync-overlay{
  position:fixed;inset:0;z-index:1100;
  background:rgba(5,4,8,.92);
  display:flex;align-items:center;justify-content:center;
  padding:36px;
  animation:tva-overlay-in .25s ease;
}
@keyframes tva-overlay-in{from{opacity:0}to{opacity:1}}
.sync-dialog{
  position:relative;
  width:min(1320px, 96vw);
  height:min(880px, 92vh);
  display:flex;flex-direction:column;
  background:var(--panel);
  color:var(--amber);
  border:2px solid var(--amber);
  box-shadow:
    0 0 0 1px var(--bg),
    0 0 0 8px var(--bg),
    0 0 60px rgba(47,174,94,.30);
  overflow:hidden;
  font-family:var(--font-ui);
}
.sync-dialog::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.20) 2px 3px);
  z-index:6;mix-blend-mode:multiply;
}
.sync-dialog::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(140% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
  z-index:5;
}

.sync-corner{position:absolute;width:18px;height:18px;border:2px solid var(--amber-2);z-index:7;filter:drop-shadow(0 0 4px var(--amber))}
.sync-corner--tl{top:8px;left:8px;border-right:0;border-bottom:0}
.sync-corner--tr{top:8px;right:8px;border-left:0;border-bottom:0}
.sync-corner--bl{bottom:8px;left:8px;border-right:0;border-top:0}
.sync-corner--br{bottom:8px;right:8px;border-left:0;border-top:0}
.sync-scanlines{display:none}

.sync-head{
  display:grid;grid-template-columns:1fr auto;
  gap:24px;
  padding:20px 28px 16px;
  border-bottom:1px dashed var(--amber-line);
  position:relative;z-index:4;
}
.sync-head__left{display:flex;flex-direction:column;gap:6px}
.sync-head__crumb{
  display:flex;gap:14px;
  font-family:var(--font-mono);
  font-size:12px;letter-spacing:.22em;
  color:var(--amber);text-transform:uppercase;
  text-shadow:var(--shadow-text);
}
.sync-head__crumb-id{color:var(--amber-dim);text-shadow:none}
.sync-head__title{
  margin-top:4px;
  font-family:var(--font-ko);font-weight:400;
  font-size:34px;line-height:1.1;
  color:var(--amber-2);letter-spacing:.02em;
  text-shadow:0 0 10px var(--amber-glow);
}
.sync-glitch,.sync-glitch--on{
  animation:none !important;
  text-shadow:0 0 10px var(--amber-glow) !important;
  filter:none !important;
}
.sync-glitch::before,.sync-glitch::after{display:none !important}

.sync-head__sub{
  display:flex;gap:10px;flex-wrap:wrap;
  font-family:var(--font-mono);
  font-size:12px;letter-spacing:.16em;
  color:var(--amber-dim);text-transform:uppercase;
}
.sync-head__dot{color:var(--amber-dim)}
.sync-head__right{display:flex;align-items:flex-start;gap:14px}
/* 부속 자료 열람 버튼 — 기록 두께 상자와 같은 높이·결로 나란히 */
.sync-annexbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:150px;padding:8px 14px;cursor:pointer;
  border:1.5px dashed var(--amber-line);background:transparent;color:var(--amber);text-align:left;transition:all .15s ease}
.sync-annexbtn:hover,.sync-annexbtn:focus-visible{border-style:solid;border-color:var(--amber);background:rgba(47,174,94,.10);box-shadow:0 0 14px var(--amber-glow);outline:none}
.sync-annexbtn__k{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;color:var(--amber-dim);white-space:nowrap}
.sync-annexbtn__v{display:flex;align-items:center;gap:8px;font-family:var(--font-ko);font-size:22px;line-height:1.2;color:var(--amber-2);text-shadow:0 0 8px var(--amber-glow)}
.sync-annexbtn__v svg{width:18px;height:18px}
.sync-annexbtn__n{font-family:var(--font-ko);font-size:12px;color:var(--amber-dim);white-space:nowrap}
/* 부속 자료 열람 창 — 기록 열람 창 위에 떠 있는 가운데 창 */
.annexmodal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(2,6,4,.62);backdrop-filter:blur(2px);animation:annexmodal-in .25s ease both}
.annexmodal__box{position:relative;width:min(760px,92%);max-height:min(640px,82%);display:flex;flex-direction:column;
  background:var(--panel);border:2px solid var(--amber);box-shadow:0 0 0 6px var(--bg),0 0 50px rgba(47,174,94,.28)}
.annexmodal__head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 22px 14px;border-bottom:1px dashed var(--amber-line)}
.annexmodal__k{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;color:var(--amber)}
