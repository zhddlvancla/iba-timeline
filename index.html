// 삼국 갈래는 신라 노드(BCE 57)에서 뻗는다 (2026-10-09 사용자 요청). 그 이전 sub 필드는 무시.
const BRANCH_YEAR = -57;
const MERGE_YEAR = 676; // 통일신라 시점에서 다시 합류
// 동아시아·서아시아·인도 — 단일 갈래(sub 1)
//   eastasia: 일본 (조몬 시대부터) / westasia: 인도 (인도 문명부터)
const TRACK_BRANCH = {
  eastasia: { branchYear: -2750, subOffset: 70, subLabel: '일본 JAPAN' },
  westasia: { branchYear: -2500, subOffset: 70, subLabel: '인도 INDIA' }
};

/* 연표 위치 — 시대 구간이 바뀌면 V-RD-003, 한국 기록줄기 19세기 서가(도착층 개작 구역)에 들어서면 V-ZN-007.
   패닝 중에는 멈춘 뒤 한 번만 */
function VPosWatch({ era, kaejak }) {
  const prev = useRefTC({ era, kaejak, first: true });
  useEffectTC(() => {
    const p = prev.current;
    if (p.first) { prev.current = { era, kaejak, first: false }; return; }
    const t = setTimeout(() => {
      const q = prev.current;
      if (kaejak && !q.kaejak) window.VESTIGIA.say('V-ZN-007');
      else if (era && era !== q.era) {
        window.VESTIGIA.say('V-RD-003', { soft: true });
        if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('transition');   // 시대 챕터 이동
      }
      prev.current = { era, kaejak, first: false };
    }, 900);
    return () => clearTimeout(t);
  }, [era, kaejak]);
  return null;
}

function TimelineCanvas({ tracks, query, selectedId, onSelect, focusedTrack, onFocusTrack, accessMode = 'researcher' }) {
  const [scale, setScale] = useStateTC(1);
  const [phase, setPhase] = useStateTC('idle'); // idle → loading → ready
  const [mapModal, setMapModal] = useStateTC(null); // track id of floating map, or null

  const initialPan = useMemoTC(() => {
    const ev = TIMELINE_DATA.events.find(e => e.id === selectedId);
    if (!ev) return 0;
    const x = yearToX(ev.year, 1);
    return Math.max(0, x - 400);
  }, []);
  const [panX, setPanX] = useStateTC(initialPan);
  // 가로 스크롤 표시 — 이동하는 동안만 보이고 멈추면 사라진다 (평소엔 기록줄기를 가리지 않도록)
  const [panActive, setPanActive] = useStateTC(false);
  const panHideRef = useRefTC(null);
  const panFirstRef = useRefTC(true);
  useEffectTC(() => {
    if (panFirstRef.current) { panFirstRef.current = false; return; }
    setPanActive(true);
    clearTimeout(panHideRef.current);
    panHideRef.current = setTimeout(() => setPanActive(false), 1200);
  }, [panX]);
  useEffectTC(() => () => clearTimeout(panHideRef.current), []);
  const viewportRef = useRefTC(null);
  const draggingRef = useRefTC(null);
  // 연표 박스 높이 — 기록줄기를 박스 안에 맞추는 기준 (창 크기가 바뀌면 다시 계산)
  const [vpH, setVpH] = useStateTC(0);
  applySubScale(vpH);   // 갈래 레인 간격을 박스 높이에 맞춘다 — 아래 배치 계산들이 모두 이 값을 쓴다
  useEffectTC(() => {
    const el = viewportRef.current; if (!el) return;
    const update = () => setVpH(el.clientHeight);
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // Vertical rail (left-side scroll) refs + drag state
  const vrailBodyRef = useRefTC(null);
  const vrailDragRef = useRefTC(null);

  const ticks = useMemoTC(generateTicks, []);

  const events = useMemoTC(() => {
    const q = query.trim().toLowerCase();
    return TIMELINE_DATA.events.filter(e => {
      if (e.hidden) return false;
      if (!tracks[e.track]) return false;
      if (focusedTrack && e.track !== focusedTrack) return false;   // 포커스 — 다른 줄기는 숨김
      if (e.focusOnly && focusedTrack !== e.track) return false;   // 삼국 시대 왕·사건 — 그 줄기를 눌렀을 때만
      if (!q) return true;
      return [e.label, e.en, e.state, e.theme, String(e.year), e.body].some(v => v && v.toLowerCase().includes(q));
    });
  }, [tracks, query, focusedTrack]);

  // Place events per track, staggered vertically when they crowd
  // sub-lane 별로 별도 스태거를 적용해야 sub-lane(예: 일본) 노드의 라벨이
  // 원줄기 lane 위로 밀려 올라가는 현상이 방지됨.
  // 같은 연도에 스택되는 경우 — 아래(첫 stagger) 노드의 연도는 숨김
  const positioned = useMemoTC(() => {
    /* 서브레인 오프셋 — 해당 트랙이 포커스됐을 때만 위아래로 갈라진다(eventY 와 같은 기준).
       포커스가 없으면 0이 되어 본선과 같은 높이에 모인다.
       레인이 갈라져도 간격이 36px뿐이라 52px짜리 라벨은 옆 레인을 침범한다.
       그래서 레인별로 따로 쌓지 않고, 이 오프셋을 좌표에 넣어 트랙 전체를 한 번에 계산한다. */
    const subDy = (e) => {
      if (focusedTrack === 'korea' && e.track === 'korea' && e.sub != null
          && e.year >= BRANCH_YEAR && e.year < MERGE_YEAR) return SUB_OFFSET[e.sub] ?? 0;
      const cfg = TRACK_BRANCH[e.track];
      if (cfg && focusedTrack === e.track && e.sub === 1
          && e.year >= cfg.branchYear && !e.branch) return cfg.subOffset;
      return 0;
    };
    const buckets = {};
    events.forEach(e => {
      (buckets[e.track] = buckets[e.track] || []).push(e);
    });

    /* ── 라벨 겹침 방지 ─────────────────────────────────────────
       예전 방식은 "직전 노드와 64px 이내면 3단 지그재그"였는데, 세 가지가 어긋났다.
         · 직전 노드만 봐서 두세 칸 건너 라벨과의 충돌을 놓쳤다
         · 3단이 순환하므로 밀집 구간에 4개가 몰리면 반드시 같은 칸이 겹쳤다
         · 64px 고정 임계값이라 실제 폭(최대 193px)과 높이(최대 72px)를 무시했다
       그래서 라벨의 실제 사각형을 추정해 이미 놓인 라벨과 닿지 않는 자리에 얹는다.
       모든 이름은 항상 보여야 한다(수업 투사용) — 감추거나 호버로만 보이는 방식은 쓰지 않는다.
       트랙 간격(140px)에 이름+연도 라벨(약 51px)은 2단까지만 들어가므로,
       세로로 더 못 쌓으면 옆으로 비켜 놓고 꺾은 지시선으로 마커와 잇는다.
         · 지시선 = 마커 윗변 → 가로 통로(선 위 13.5px 또는 10px, 마커와 라벨 사이 빈 띠) → 라벨 아랫변
         · 가로 통로와 세로 통로도 사각형으로 등록해 다른 라벨·지시선이 가로지르지 못하게 한다
         · 비용 = 옆 이동 거리 + 올린 높이 + 지시선 사용 가산 → 가장 가까운 빈자리를 고른다 ── */
    const textW = (str, fs) => {
      let w = 0;
      for (const ch of String(str || '')) {
        if (/\s/.test(ch))                                            w += fs * 0.34;
        else if (/[가-힣㄰-㆏一-鿿]/.test(ch)) w += fs;   // 한글·한자
        else                                                          w += fs * 0.56;
      }
      return w;
    };
    const MAXW = 240;                                 // .tl-nodelabel__l 의 max-width
    // 연도 뱃지(12px 모노 + 자간) — 교과서 범위 표기(yearLabel)는 한글이 섞여 폭을 따로 잰다
    const yearW = (e) => [...window.eventYearText(e)].reduce((w, ch) => w + (/[가-힣]/.test(ch) ? 14.5 : /\s/.test(ch) ? 6 : 9.4), 0) + 12;
    const estWidth = (e) => {
      const fs = e.noSync ? 14 : 16;
      const nameBox = Math.min(MAXW, textW(e.label, fs) + 22);
      // 라벨 폭은 "이름 줄"과 "연도 뱃지" 중 넓은 쪽이 결정한다 — 짧은 이름일수록 연도가 더 넓다
      return e.noSync ? nameBox : Math.max(nameBox, yearW(e));
    };
    const estHeight = (e) => {
      const fs = e.noSync ? 14 : 16;
      const lines = Math.max(1, Math.ceil(textW(e.label, fs) / (MAXW - 22)));
      let h = lines * Math.round(fs * 1.3) + 10;      // 이름 줄 + 안쪽 여백·테두리
      if (!e.noSync) h += 20;                          // 연도 뱃지(서브 노드는 평소 숨김)
      return h;
    };

    const GAP_X = 8, GAP_Y = 4;
    const BASE_DY = 16;                                // 트랙선에서 라벨 아래변까지
    const DX_STEP = 12, MAX_DX = 480;                  // 옆으로 비켜 볼 간격·최대 거리
    const hit = (rects, l, r, t, b) => rects.some(q => l < q.r && q.l < r && t < q.b && q.t < b);
    /* 라벨이 올라갈 수 있는 한계(트랙선 기준) — 고정값(112) 대신 실제 레인 배치로 계산한다.
         · 맨 위 트랙: 화면 윗변(잘려 보이지 않도록 4px 여유)
         · 나머지: 위 트랙의 연도 눈금 글자(선 아래 17px) 또는 포커스 갈래 레인 마커 아래까지
       간격 140px이면 −121 → 이름+연도 라벨(51px) 2단(122px)이 들어간다. */
    const { activeTracks: laneOrder, trackY: lineY } = layoutLanes(tracks, focusedTrack, vpH);
    const TICK_LABEL_BOTTOM = 23;
    const belowExtent = (t) => {
      if (focusedTrack !== t) return TICK_LABEL_BOTTOM;
      const sub = t === 'korea' ? Math.max(0, ...Object.values(SUB_OFFSET)) : (TRACK_BRANCH[t] ? TRACK_BRANCH[t].subOffset : 0);
      // 한국 포커스 — 가야 갈래 아래로 내린 삼국 시대 브래킷 라벨(+94±13)까지가 이 트랙 몫
      const grp = t === 'korea' && (NODE_GROUPS.korea || []).some(g => groupYOf('korea', g, focusedTrack) !== GROUP_Y) ? GROUP_Y + SUB_OFFSET[3] + 14 : 0;
      return Math.max(TICK_LABEL_BOTTOM, sub + 8, grp);
    };
    const ceilOf = (t) => {
      const i = laneOrder.indexOf(t);
      if (i <= 0) return ERA_STRIP_H + 4 - lineY[t];   // 맨 위 트랙: 박스 윗변까지
      const p = laneOrder[i - 1];
      return lineY[p] + belowExtent(p) + 2 - lineY[t];
    };
    // 위 트랙의 묶음 브래킷 라벨(선 아래 22~46px)은 이 트랙 라벨 영역에 걸치므로 장애물로 미리 넣는다
    const groupRects = (p, t) => (NODE_GROUPS[p] || []).map(g => {
      const lx = yearToX(g.startYear, scale) - GROUP_PAD_X, rx = yearToX(g.endYear, scale) + GROUP_PAD_X;
      const cx = g.labelAtYear != null ? yearToX(g.labelAtYear, scale) : (lx + rx) / 2;
      const gw = textW(g.label, 12) + g.label.length * 0.72 + 22;
      const cy = lineY[p] + groupYOf(p, g, focusedTrack) - lineY[t];
      return { l: cx - gw / 2, r: cx + gw / 2, t: cy - 13, b: cy + 13 };
    });
    /* 장애물 — 라벨·지시선이 덮으면 안 되는 것들(트랙선 기준 좌표)
         · 위 트랙의 묶음 브래킷 라벨(선 아래 22~46px) — 이 트랙 라벨 영역에 걸친다
         · 이 트랙의 묶음 브래킷 라벨 — 포커스 시 아래 갈래 레인(+60/+70) 라벨이 올라와 닿는다
         · 이 트랙의 모든 마커 — 갈래 레인 라벨이 다른 레인 마커를 가리지 않도록
           (같은 레인 마커는 라벨 아랫변(−16)보다 아래라 원래 닿지 않는다) */
    // 위 트랙의 연도 눈금 글자(선 아래 4~22px, 12px 모노 + 자간) — 한계를 넘어 쌓일 때 덮지 않도록
    const tickRects = (p, t) => generateTicks().filter(tk => tk.major).map(tk => {
      const txt = tk.label || formatYear(tk.year);
      const tx = yearToX(tk.year, scale), tw = [...txt].reduce((w, ch) => w + (/[가-힣]/.test(ch) ? 14.2 : 9.4), 0) + 4;
      const ty = lineY[p] - lineY[t];
      return { l: tx - tw / 2, r: tx + tw / 2, t: ty + 3, b: ty + 23 };
    });
    /* 트랙 사이 충돌 — 레인이 낮아지면 한계를 넘은 라벨이 위 트랙 영역으로 올라가므로
       모든 트랙의 눈금·브래킷·마커와, 먼저 배치한 트랙의 라벨·지시선을 절대 좌표로 모아 둔다. */
    const placedAbs = [];                              // 먼저 배치된 트랙의 라벨·지시선(절대 y)
    const obstaclesOf = (t, list) => {
      const rs = [];
      laneOrder.forEach(p => {
        groupRects(p, t).forEach(q => rs.push(q));
        tickRects(p, t).forEach(q => rs.push(q));
        (buckets[p] || []).forEach(e => {
          if (e.noMarker) return;
          const mx = yearToX(e.year, scale), my = lineY[p] + subDy(e) - lineY[t];
          rs.push({ l: mx - 8, r: mx + 8, t: my - 8, b: my + 8 });
        });
      });
      placedAbs.forEach(q => rs.push({ l: q.l, r: q.r, t: q.t - lineY[t], b: q.b - lineY[t] }));
      return rs;
    };
    const placed = [];
    /* 같은 해·같은 레인에 노드가 3개 이상 몰리면(1920년 5개 등) 마커가 한 점에 겹친다.
       이때는 마커 바로 위에 라벨을 올리지 않고, 마커에서 세로 줄기를 세워 라벨을 줄기 양옆에 가지로 단다.
       같은 해 노드끼리는 줄기를 함께 쓴다(마커가 같은 자리이므로). */
    const TRUNK_GAP = 8;                               // 줄기와 라벨 사이 최소 간격
    const clusterKey = (e) => `${e.track}|${subDy(e)}|${e.year}`;
    const clusterN = {};
    events.forEach(e => { if (!e.hidden) clusterN[clusterKey(e)] = (clusterN[clusterKey(e)] || 0) + 1; });
    const placeBucket = (order) => {
      const rects = order.length ? obstaclesOf(order[0].track, order) : [];   // 놓인 라벨·지시선·장애물 사각형(트랙선 기준)
      const out = [], abs = [];
      const seenCluster = new Set();
      let fallbacks = 0, leaders = 0, total = 0;
      order.forEach(e => {
        const x = yearToX(e.year, scale);
        let w = estWidth(e), h = estHeight(e);
        const noDirect = (clusterN[clusterKey(e)] || 0) >= 3;   // 마커 바로 위 자리는 비워 줄기를 세운다
        // 같은 해 묶음은 연도를 처음 놓이는 라벨 하나에만 단다 — 나머지는 이름 칸만 남겨 키를 줄인다
        const dropYear = noDirect && !e.noSync && seenCluster.has(clusterKey(e));
        if (noDirect) seenCluster.add(clusterKey(e));
        if (dropYear) { h -= 20; w = Math.min(MAXW, textW(e.label, 16) + 22); }
        const nameW = Math.min(MAXW, textW(e.label, e.noSync ? 14 : 16) + 22);
        const lane = subDy(e);                          // 이 노드가 놓이는 레인의 세로 위치
        const ceilTop = ceilOf(e.track);               // 라벨 윗변 한계(트랙선 기준)
        const REACH = MAX_DX * 3 + w + 260;          // 옆으로 멀리 찾는 경우(최대 3배)까지 장애물을 본다
        const near = rects.filter(q => q.r > x - REACH && q.l < x + REACH);
        // 한 자리를 따질 때는 라벨·지시선이 지나갈 가로 범위 안의 장애물만 본다(밀집 구간 계산량을 줄인다)
        const around = (lo, hi) => near.filter(q => q.r > lo && q.l < hi);

        // 가로로 dx 비킨 자리에서 라벨이 앉을 수 있는 가장 낮은 높이와 지시선을 구한다
        const fit = (dx, ceil) => {
          const cx = x + dx, l = cx - w / 2, r = cx + w / 2;
          if (l < 2) return null;
          const loc = around(Math.min(x, l) - 20, Math.max(x, r) + 20);
          let dy = BASE_DY;
          for (let guard = 0; guard < 60; guard++) {
            const top = lane - dy - h, bottom = lane - dy;
            const blocker = loc.find(q =>
              l < q.r + GAP_X && q.l < r + GAP_X && top < q.b && q.t < bottom);
            if (!blocker) break;
            dy = lane - blocker.t + GAP_Y;              // 막은 사각형 바로 위로 올린다
            if (lane - dy - h < ceil) return null;
          }
          if (lane - dy - h < ceil) return null;
          // 라벨이 마커 바로 위(기본 높이·폭 안쪽)에 붙어 있을 때만 지시선이 필요 없다.
          // 위로 쌓였거나 옆으로 비켰으면 항상 지시선으로 마커와 잇는다 — 세로 통로가 다른 라벨을 지나지 않는 자리만 고른다
          const needLeader = Math.abs(dx) > w / 2 - 24 || dy > BASE_DY + 1;   // 마커가 라벨 가장자리 근처면 선을 긋는다(폭 어림 오차 여유)
          if (!needLeader && noDirect) return null;
          let segs = null, band = null;
          if (needLeader) {
            for (const bd of LEADER_BANDS) {
              const ch = { l: Math.min(x, cx) - 1, r: Math.max(x, cx) + 1, t: lane - bd - 1.5, b: lane - bd + 1.5 };
              const co = { l: cx - 2, r: cx + 2, t: lane - dy, b: lane - bd };
              if (hit(loc, ch.l, ch.r, ch.t, ch.b) || hit(loc, co.l, co.r, co.t, co.b)) continue;
              // 마커 위 짧은 기둥도 등록 — 뒤에 놓일 지시선의 가로 통로가 이것을 가로지르지 못하게
              const mk = { l: x - 1.5, r: x + 1.5, t: lane - bd, b: lane - 7 };
              segs = [ch, co, mk]; band = bd; break;
            }
            if (!segs) return null;
          }
          const cost = Math.abs(dx) + (dy - BASE_DY) * 1.2 + (needLeader ? 60 : 0);
          return { dx, dy, l, r, segs, band, cost, mode: 'band' };
        };
        /* 줄기 방식 — 마커에서 세로 줄기를 올리고, 라벨 이름 칸 가운데 높이에서 가로 가지로 잇는다.
           라벨은 줄기의 한쪽 옆에 통째로 놓인다. 줄기는 같은 해(같은 x) 노드끼리만 함께 쓸 수 있다. */
        const fitTrunk = (dx, ceil) => {
          const cx = x + dx, l = cx - w / 2, r = cx + w / 2;
          if (l < 2) return null;
          if (!(l >= x + TRUNK_GAP || r <= x - TRUNK_GAP)) return null;
          const edge = dx > 0 ? cx - nameW / 2 : cx + nameW / 2;
          const loc = around(Math.min(x, l) - 20, Math.max(x, r) + 20);
          const others = loc.filter(q => q.trunkX !== x);
          let dy = BASE_DY;
          for (let guard = 0; guard < 80; guard++) {
            const top = lane - dy - h, bottom = lane - dy;
            if (top < ceil) return null;
            const blocker = loc.find(q => l < q.r + GAP_X && q.l < r + GAP_X && top < q.b && q.t < bottom);
            if (blocker) { dy = lane - blocker.t + GAP_Y; continue; }
            const bDy = dy + Math.min(14, h / 2);       // 마커 기준 가지 높이(이름 칸 가운데)
            const yb = lane - bDy;
            const tr = { l: x - 1.5, r: x + 1.5, t: yb - 1.5, b: lane - 9, trunkX: x };   // 마커 충돌 영역(±8) 위부터
            const br = { l: Math.min(x, edge), r: Math.max(x, edge), t: yb - 1.5, b: yb + 1.5, trunkX: x };
            if (others.some(q => tr.l < q.r && q.l < tr.r && tr.t < q.b && q.t < tr.b)) return null;   // 줄기 길이 막힘 — 올려도 소용없다
            const bb = others.find(q => br.l < q.r && q.l < br.r && br.t < q.b && q.t < br.b);
            if (bb) { dy += 4; continue; }              // 가지가 막히면 조금씩 올려 본다
            const cost = Math.abs(edge - x) + (dy - BASE_DY) * 1.2 + 30;
            return { dx, dy, l, r, segs: [tr, br], cost, mode: 'trunk', branchDy: bDy, edgeDx: edge - x };
          }
          return null;
        };
        /* 꺾은선 방식 — 마커 바로 위가 다른 라벨로 막혀 줄기를 세울 수 없을 때.
           마커 → 가로 통로(선 위 10/13.5px) → 라벨 옆 빈 틈의 세로 기둥 → 라벨 이름 칸 가운데로 잇는다 */
        const fitElbow = (dx, ceil) => {
          const cx = x + dx, l = cx - w / 2, r = cx + w / 2;
          if (l < 2) return null;
          const loc = around(Math.min(x, l) - 80, Math.max(x, r) + 80);
          let dy = BASE_DY;
          for (let guard = 0; guard < 60; guard++) {
            const top = lane - dy - h, bottom = lane - dy;
            if (top < ceil) return null;
            const blocker = loc.find(q => l < q.r + GAP_X && q.l < r + GAP_X && top < q.b && q.t < bottom);
            if (blocker) { dy = lane - blocker.t + GAP_Y; continue; }
            break;
          }
          if (lane - dy - h < ceil) return null;
          const bDy = dy + Math.min(14, h / 2), yb = lane - bDy;
          // 기둥은 라벨 양옆 빈 틈(가장자리에서 최대 60px)에서 찾는다 — 아래 단 라벨 사이 좁은 틈도 쓸 수 있게 4px 간격
          const cols = [];
          for (let k = 0; k <= 15; k++) {
            cols.push({ xc: l - TRUNK_GAP / 2 - k * 4, edge: cx - nameW / 2 });
            cols.push({ xc: r + TRUNK_GAP / 2 + k * 4, edge: cx + nameW / 2 });
          }
          cols.sort((p, q) => Math.abs(p.xc - x) - Math.abs(q.xc - x));
          for (const { xc, edge } of cols) {
            for (const bd of LEADER_BANDS) {
              const ch = { l: Math.min(x, xc) - 1, r: Math.max(x, xc) + 1, t: lane - bd - 1.5, b: lane - bd + 1.5 };
              const co = { l: xc - 1.5, r: xc + 1.5, t: yb - 1.5, b: lane - bd };
              const br = { l: Math.min(xc, edge), r: Math.max(xc, edge), t: yb - 1.5, b: yb + 1.5 };
              if (hit(loc, ch.l, ch.r, ch.t, ch.b) || hit(loc, co.l, co.r, co.t, co.b) || hit(loc, br.l, br.r, br.t, br.b)) continue;
              const mk = { l: x - 1.5, r: x + 1.5, t: lane - bd, b: lane - 7 };
              const cost = Math.abs(dx) + (dy - BASE_DY) * 1.2 + 90;   // 같은 자리라면 일반 지시선·줄기보다 늘 비싸게 — 막혔을 때만 쓴다
              return { dx, dy, l, r, segs: [ch, co, br, mk], band: bd, cost, mode: 'elbow', branchDy: bDy, edgeDx: edge - x, colDx: xc - x };
            }
          }
          return null;
        };

        const search = (ceil, maxDx = MAX_DX) => {
          let found = null;
          for (let k = 0; k * DX_STEP <= maxDx; k++) {
            if (found && k * DX_STEP - MAXW / 2 > found.cost) break;  // 더 멀리 가면 비용이 줄 수 없다
            const dxs = k === 0 ? [0] : [k * DX_STEP, -k * DX_STEP];
            for (const dx of dxs) {
              const cands = [fit(dx, ceil), fitTrunk(dx, ceil)];
              if (!cands[0] && !cands[1]) cands.push(fitElbow(dx, ceil));   // 꺾은선은 둘 다 막혔을 때만 계산한다
              for (const c of cands) {
                if (c && (!found || c.cost < found.cost)) found = c;
              }
            }
          }
          return found;
        };
        let best = search(ceilTop);
        // 한계 안에 빈자리가 없으면(포커스 시 좁아진 레인 등) — 감추지 않고 한계를 풀어 가장 가까운 빈자리에 둔다.
        // 장애물(위 트랙 눈금·브래킷·마커)은 그대로 피한다.
        // 맨 위 트랙은 한계를 풀어도 박스 윗변을 넘지 않는다 (잘려 보이지 않도록)
        // 그 전에 옆으로 더 멀리(최대 3배) 찾아본다 — 지시선으로 이어지므로 위로 넘겨 가리는 것보다 낫다
        if (!best) best = search(ceilTop, MAX_DX * 3);
        const hardCeil = laneOrder.indexOf(e.track) <= 0 ? ceilTop : -Infinity;
        if (!best) best = { ...(search(hardCeil) || fit(0, hardCeil) || search(-Infinity) || fit(0, -Infinity) || { dx: 0, dy: BASE_DY, l: x - w / 2, r: x + w / 2, segs: null }), fallback: true };

        const own = [{ l: best.l, r: best.r, t: lane - best.dy - h, b: lane - best.dy }, ...(best.segs || [])];
        own.forEach(q => { rects.push(q); abs.push({ l: q.l, r: q.r, t: q.t + lineY[e.track], b: q.b + lineY[e.track] }); });
        out.push({ ...e, x, labelDx: best.dx, labelDy: best.dy,
                   leader: !!best.segs, leaderMode: best.mode, leaderBand: best.band,
                   branchDy: best.branchDy, edgeDx: best.edgeDx, colDx: best.colDx, _l: best.l, _r: best.r,
                   ...(dropYear ? { hideYear: true } : {}) });
        if (best.fallback) { fallbacks++; out[out.length - 1]._fallback = true; }
        if (best.segs) leaders++;
        total += best.cost || 0;
      });
      return { out, abs, fallbacks, leaders, total };
    };
    laneOrder.forEach(tk => {
      const list = buckets[tk];
      if (!list) return;
      const asc = [...list].sort((a, b) => a.year - b.year);
      /* 밀집 구간은 먼저 놓인 라벨이 빈자리를 차지하므로 처리 순서에 따라 결과가 달라진다.
         왼쪽→오른쪽, 오른쪽→왼쪽 두 번 배치해 보고
         한계 초과(fallback) → 지시선 수 → 이동량 순으로 적은 쪽을 쓴다. */
      const tries = [placeBucket(asc), placeBucket([...asc].reverse())];
      const rank = (a, b) => a.fallbacks - b.fallbacks || a.leaders - b.leaders || a.total - b.total;
      tries.sort(rank);
      /* 보완 — 자리를 못 찾은 노드가 남으면 그 노드들을 맨 먼저 놓고 다시 배치해 본다(최대 3회).
         먼저 놓인 라벨이 옆 마커 위 자리를 차지해 밀려난 경우를 풀어 준다 */
      for (let pass = 0; pass < 3 && tries[0].fallbacks > 0; pass++) {
        const failed = new Set(tries[0].out.filter(o => o._fallback).map(o => o.id));
        const first = asc.filter(e => failed.has(e.id)), rest = asc.filter(e => !failed.has(e.id));
        tries.push(placeBucket([...first, ...rest]), placeBucket([...first, ...[...rest].reverse()]));
        tries.sort(rank);
      }
      placed.push(...tries[0].out);
      tries[0].abs.forEach(q => placedAbs.push(q));   // 아래 트랙은 이 라벨·지시선을 피한다
    });
    // 같은 연도 라벨이 세로로 겹쳐 쌓였을 때 — 아래(트랙에 가까운) 라벨만 연도를 남긴다
    return placed.map(e => {
      const stackedAbove = placed.some(o => o !== e && o.track === e.track
        && (o.sub ?? 'main') === (e.sub ?? 'main') && o.year === e.year
        && o.labelDy < e.labelDy && o._l < e._r && e._l < o._r);
      return stackedAbove ? { ...e, hideYear: true } : e;
    });
  }, [events, scale, focusedTrack, tracks, vpH]);

  // Center pan on selected
  useEffectTC(() => {
    if (!selectedId || !viewportRef.current) return;
    const ev = TIMELINE_DATA.events.find(e => e.id === selectedId);
    if (!ev) return;
    const x = yearToX(ev.year, scale);
    const w = viewportRef.current.clientWidth || 800;
    const totalW = trackWidth(scale);
    const newPan = Math.max(0, Math.min(totalW - w, x - w/2 + 30));
    setPanX(newPan);
  }, [selectedId, scale]);

  // 검색 시 첫 매칭 노드로 점등(선택) + 자동 스크롤
  //   events는 이미 query로 필터되어 있으므로 events[0]가 첫 매칭 노드.
  //   선택하면 위 'Center pan on selected' 효과가 해당 노드로 화면을 옮기고,
  //   tl-node.active / tl-nodelabel.active 스타일로 점등된다.
  useEffectTC(() => {
    const q = query.trim().toLowerCase();
    if (!q) return;
    const match = events[0];
    if (match && match.id !== selectedId) onSelect(match.id);
  }, [query]);

  // ESC 닫기 — 플로팅 지도 모달(위치 확인)
  window.useEscLayer(!!mapModal, () => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('close'); setMapModal(null); });

  // Wheel + drag panning
  // React onWheel 은 passive 라 preventDefault 가 막힌다 — 가로 휠(뒤로 가기 스와이프 방지)만 네이티브로 막는다
  useEffectTC(() => {
    const el = viewportRef.current; if (!el) return;
    const block = (e) => { if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) e.preventDefault(); };
    el.addEventListener('wheel', block, { passive: false });
    return () => el.removeEventListener('wheel', block);
  }, []);
  const onWheel = useCallbackTC((e) => {
    const delta = e.deltaX !== 0 ? e.deltaX : e.deltaY;
    const w = viewportRef.current?.clientWidth || 800;
    const totalW = trackWidth(scale);
    setPanX(p => Math.max(0, Math.min(totalW - w, p + delta)));
  }, [scale]);

  /* 끌어서 넘기기 — 포인터 이벤트라 마우스와 손가락(아이패드·휴대폰) 모두 된다. 마우스는 왼쪽 버튼만 */
  const onMouseDown = (e) => { if (e.pointerType === 'mouse' && e.button !== 0) return; draggingRef.current = { x: e.clientX, panX, id: e.pointerId }; };
  const onMouseMove = (e) => {
    if (!draggingRef.current || (draggingRef.current.id != null && e.pointerId !== draggingRef.current.id)) return;
    const w = viewportRef.current?.clientWidth || 800;
    const totalW = trackWidth(scale);
    // 강의 모드(zoom 1.4)에서는 마우스 이동량이 화면 px라 배율로 나눠 CSS px로 맞춘다
    const vp = viewportRef.current, z = vp && vp.offsetWidth ? vp.getBoundingClientRect().width / vp.offsetWidth : 1;
    const newPan = Math.max(0, Math.min(totalW - w, draggingRef.current.panX - (e.clientX - draggingRef.current.x) / (z || 1)));
    setPanX(newPan);
  };
  const onMouseUp = () => { draggingRef.current = null; };

  // Vertical rail: click/drag to pan (rail's top = year start, bottom = year end)
  const onVrailMouseDown = useCallbackTC((e) => {
    e.preventDefault();
    const rect = vrailBodyRef.current?.getBoundingClientRect();
    if (!rect) return;
    vrailDragRef.current = { rect };
    const ratio = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
    const w = viewportRef.current?.clientWidth || 800;
    const tW = trackWidth(scale);
    setPanX(Math.max(0, Math.min(tW - w, ratio * tW - w/2)));
  }, [scale]);

  useEffectTC(() => {
    const onMove = (e) => {
      if (!vrailDragRef.current) return;
      const { rect } = vrailDragRef.current;
      const ratio = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
      const w = viewportRef.current?.clientWidth || 800;
      const tW = trackWidth(scale);
      setPanX(Math.max(0, Math.min(tW - w, ratio * tW - w/2)));
    };
    const onUp = () => { vrailDragRef.current = null; };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
  }, [scale]);

  const totalW = trackWidth(scale);
  // 레인 배치 — layoutLanes (라벨 배치와 같은 계산)
  const { activeTracks, trackY, lanesEnd: acc } = layoutLanes(tracks, focusedTrack, vpH);
  const totalLanesH = Math.max(vpH || 0, acc + LANE_BOTTOM_PAD); // 박스 높이에 맞춤
  /* 세로 자리가 모자라면(1280×800 또는 강의 모드에서 트랙 포커스 등) 위쪽 지역국·접속자 패널을 접어 연표에 준다.
     needMin = 레인 간격을 최소(LANE_GAP_MIN)로 두었을 때 네 기록줄기와 라벨이 박스 안에 드는 높이.
     접은 동안에는 접어서 얻은 높이를 빼고 판단해야 펼침↔접힘이 번갈아 일어나지 않는다.
     일반 모드는 관내 방송 줄만 남기고, 강의 모드(방송 멈춤)는 패널 전체를 접는다 — CSS html.tl-tight */
  const needMin = layoutLanes(tracks, focusedTrack, 1).lanesEnd + LANE_BOTTOM_PAD;
  const tightRef = useRefTC({ h0: 0 });
  useEffectTC(() => {
    if (!vpH) return;
    const root = document.documentElement;
    const sub = document.querySelector('.subnav');
    const on = root.classList.contains('tl-tight');
    const subH = sub ? sub.offsetHeight : 0;
    const base = on ? vpH - (tightRef.current.h0 - subH) : vpH;
    const want = base + 24 < needMin;   // 맨 아래 여백(브래킷 자리) 24px까지는 모자라도 접지 않는다 — 전체 보기 1280×800은 원래대로
    if (want && !on) { tightRef.current.h0 = subH; root.classList.add('tl-tight'); }
    else if (!want && on) root.classList.remove('tl-tight');
  }, [vpH, needMin]);
  useEffectTC(() => () => document.documentElement.classList.remove('tl-tight'), []);

  // Korea 포커스 시 sub-lane 오프셋 — 3개 sub-lane
  //   sub 0 → 고구려 (위)
  //   sub 1 → 백제   (위 살짝)
  //   (신라는 메인 lane = offset 0, 갈래 없음)
  //   sub 3 → 가야   (아래)
  const isKoreaSplit = focusedTrack === 'korea';
  const isEastasiaSplit = focusedTrack === 'eastasia';
  const isWestasiaSplit = focusedTrack === 'westasia';

  const eventY = (e) => {
    const baseY = trackY[e.track];
    if (baseY == null) return null;
    if (isKoreaSplit && e.track === 'korea' && e.sub != null
        && e.year >= BRANCH_YEAR && e.year < MERGE_YEAR) {
      return baseY + SUB_OFFSET[e.sub];
    }
    const cfg = TRACK_BRANCH[e.track];
    // 갈래점 노드(branch:true, 예: 인도 문명)는 서브레인으로 내리지 않고 원줄기에 둠 — 갈래가 시작되는 지점
    if (cfg && focusedTrack === e.track && e.sub === 1 && e.year >= cfg.branchYear && !e.branch) {
      return baseY + cfg.subOffset;
    }
    return baseY;
  };

  const trackMeta = {
    korea:    { ko: '한국',           en: 'KOREA',         map: 'https://www.google.com/maps?q=Korea&t=k&z=5&output=embed' },
    eastasia: { ko: '동아시아',        en: 'EAST ASIA',     map: 'https://www.google.com/maps?q=East+Asia&t=k&z=4&output=embed' },
    west:     { ko: '유럽·미주',       en: 'EUROPE & AMERICAS', map: 'https://www.google.com/maps?q=Rome+Italy&t=k&z=4&output=embed' },
    westasia: { ko: '서아시아·인도',   en: 'WEST ASIA · INDIA', map: 'https://www.google.com/maps?q=Mesopotamia+Iran&t=k&z=4&output=embed' }
  };


  return (
    <section className="canvas">
      <div className="canvas__header">
        <div className="canvas__title">▸ RECORD STREAM<span className="canvas__title-x"> · QUAD-REGION TRACE · 선사 → 현대</span></div>
        {(() => {
          // 화면 가운데 연도가 속한 시대
          const w = viewportRef.current?.clientWidth || 1200;
          const cx = panX + w / 2;
          let lo = PRE_START_YEAR, hi = YEAR_END;
          for (let k = 0; k < 28; k++) { const mid = (lo + hi) / 2; if (yearToX(mid, scale) < cx) lo = mid; else hi = mid; }
          const era = window.eraOfYear ? window.eraOfYear(lo) : null;
          // 현재 위치 — 지역국 코드 / 화면 가운데 연도의 세기 서가 / 선택 노드의 왕조·시대 구획 (DENDRO P3-5)
          const RO = { west: 'RO-1', eastasia: 'RO-2', westasia: 'RO-3', korea: 'RO-4' };
          const y = Math.round(lo);
          const shelf = y < -8000 ? '선사 서가'
            : y < 0 ? `BCE ${Math.floor((-y - 1) / 100) + 1}세기 서가`
            : `${Math.floor((Math.max(1, y) - 1) / 100) + 1}세기 서가`;
          const sel = selectedId ? events.find(ev => ev.id === selectedId) : null;
          const pos = [focusedTrack ? RO[focusedTrack] : '전 지역국', shelf].concat(sel && sel.state ? [`${sel.state} 구획`] : []).join(' / ');
          return <>
            <VPosWatch era={era ? era.key : ''} kaejak={focusedTrack === 'korea' && shelf === '19세기 서가'}/>
            {era && <div className="canvas__era" aria-live="polite"><b>{era.ko}</b></div>}
            <div className="canvas__pos" aria-live="polite"><span>현재 위치</span>{pos}</div>
          </>;
        })()}
        {accessMode === 'response' && (
          <div className="canvas__risk" role="status">
            <span className="canvas__risk-dot" aria-hidden="true"/>
            <b>대응반 접속</b>
            <span>LUMINA 기록 왜곡 탐지 · 위험 노드 {events.filter(ev => ev.risk).length}</span>
          </div>
        )}
        <div className="canvas__zoom">
          <button onClick={() => setScale(s => Math.max(0.6, s - 0.2))}>−</button>
          <button onClick={() => setScale(1)} style={{width:'auto',padding:'0 10px',fontSize:12}}>{Math.round(scale * 100)}%</button>
          <button onClick={() => setScale(s => Math.min(2.4, s + 0.2))}>+</button>
        </div>
      </div>

      <div
        className={`tl-viewport tl-viewport--quad ${focusedTrack ? 'has-focus' : ''} tl-viewport--${phase} ${accessMode === 'response' ? 'tl-viewport--response' : ''}`}
        data-focus={focusedTrack || ''}
        ref={viewportRef}
        onWheel={onWheel}
        onPointerDown={onMouseDown}
        onPointerMove={onMouseMove}
        onPointerUp={onMouseUp}
        onPointerCancel={onMouseUp}
        onPointerLeave={(e) => { if (e.pointerType === 'mouse') onMouseUp(); }}
      >
        <div className="tl-inner" style={{width: totalW, left: -panX}}>
          {/* Branching trunk — 고대 ORIGIN → 4 tracks */}
          <svg className="tl-trunk"
            style={{position:'absolute',left:0,top:0,width:LEAD_PAD*scale,height:totalLanesH,pointerEvents:'none',zIndex:1,overflow:'visible'}}>
            <defs>
              <filter id="tva-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2.6" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <linearGradient id="trunk-grad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stopColor="#2fae5e" stopOpacity="0.2"/>
                <stop offset="0.4" stopColor="#2fae5e" stopOpacity="0.9"/>
                <stop offset="1" stopColor="#56cf85" stopOpacity="1"/>
              </linearGradient>
            </defs>
            {/* Trunk horizontal line */}
            <line
              x1={(TRUNK_ORIGIN_X)*scale} y1={totalLanesH/2}
              x2={TRUNK_END_X*scale} y2={totalLanesH/2}
              stroke="url(#trunk-grad)" strokeWidth="2.5"
              filter="url(#tva-glow)"
            />
            {/* Branches */}
            {activeTracks.map(t => {
              const y = trackY[t]; if (y == null) return null;
              const sx = TRUNK_END_X * scale;
              const ex = BRANCH_END_X * scale;
              const mx1 = sx + (ex - sx) * 0.6;
              const mx2 = sx + (ex - sx) * 0.4;
              const isFocusedT = focusedTrack === t;
              const isDimT = focusedTrack && focusedTrack !== t;
              return (
                <path key={'br-'+t}
                  d={`M ${sx} ${totalLanesH/2} C ${mx1} ${totalLanesH/2}, ${mx2} ${y}, ${ex} ${y}`}
                  stroke={isFocusedT ? '#7fdea3' : '#2fae5e'}
                  strokeWidth={isFocusedT ? 4.5 : 2}
                  fill="none"
                  opacity={isDimT ? 0.22 : 1}
                  filter="url(#tva-glow)"
                  strokeLinecap="round"
                />
              );
            })}
            {/* Origin hourglass */}
            <g transform={`translate(${TRUNK_ORIGIN_X*scale} ${totalLanesH/2})`}>
              <circle r="14" fill="#040806" stroke="#2fae5e" strokeWidth="1" opacity="0.6"/>
              {/* 제2국 인장의 각면형 모래시계 (색은 기존 그대로) */}
              <g transform="scale(0.29)" filter="url(#tva-glow)">
                <rect x="-26" y="-34" width="52" height="9" fill="#2fae5e"/>
                <rect x="-26" y="25" width="52" height="9" fill="#2fae5e"/>
                <path d="M -21 -22 H 21 L 8 -3 H -8 Z" fill="#56cf85"/>
                <path d="M -8 3 H 8 L 21 22 H -21 Z" fill="#56cf85"/>
                <rect x="-4" y="-25" width="8" height="50" fill="#2fae5e"/>
              </g>
            </g>
          </svg>
          {/* ORIGIN label removed — branches connect directly from diamond */}
          {/* Year axes — one per visible track lane */}
          {activeTracks.map(t => (
            <div key={'axis-'+t} className={`tl-laneaxis ${focusedTrack && focusedTrack !== t ? 'is-glitching' : ''} ${focusedTrack === t ? 'is-focused' : ''}`}
                 style={{top: trackY[t]}}>
              <div className="tl-laneaxis__line" style={{left: BRANCH_END_X * scale}}/>
              {ticks.map(tk => (
                <div key={tk.year}
                     className={`tl-tick ${tk.major ? 'tl-tick--major' : tk.half ? 'tl-tick--half' : ''}`}
                     style={{left: yearToX(tk.year, scale)}}>
                  {tk.major && (
                    <span className="tl-tick__label">{tk.label || formatYear(tk.year)}</span>
                  )}
                </div>
              ))}
            </div>
          ))}

          {/* 노드 묶음 브래킷 — 트랙별
              - 기본: 기록줄기 아래쪽(+34)
              - 해당 트랙 포커스 시: 기록줄기 위쪽(-34)
              - labelAtYear / onClick 으로 라벨 위치·클릭 동작 커스터마이즈 */}
          {(() => {
            const PAD_X = GROUP_PAD_X;
            // 묶음 데이터는 모듈 상단 NODE_GROUPS — 라벨 배치에서도 장애물로 쓰기 때문에 밖으로 옮김
            const GROUPS_BY_TRACK = Object.fromEntries(Object.entries(NODE_GROUPS).map(([t, gs]) => [t,
              gs.map(g => g.targetId ? { ...g, onClick: () => window.__tmbJumpTo && window.__tmbJumpTo(g.targetId) } : g)]));
            return Object.entries(GROUPS_BY_TRACK).flatMap(([track, groups]) => {
              if (!activeTracks.includes(track) || trackY[track] == null) return [];
              const isGlitching = focusedTrack && focusedTrack !== track;
              // 주제 노드 묶음 브래킷은 기록줄기 아래(+34). 한국 포커스의 삼국 갈래 구간만 가야 갈래 아래로
              return groups.map(g => {
                const yOffset = groupYOf(track, g, focusedTrack);
                const lx = yearToX(g.startYear, scale) - PAD_X;
                const rx = yearToX(g.endYear,   scale) + PAD_X;
                const width = rx - lx;
                // 라벨 위치 계산 — 기본은 50% 중앙, labelAtYear 지정 시 그 위치로
                const labelLeftPct = g.labelAtYear != null
                  ? ((yearToX(g.labelAtYear, scale) - lx) / width) * 100 + '%'
                  : '50%';
                return (
                  <div
                    key={`nodegroup-${g.key}`}
                    className={`tl-nodegroup ${isGlitching ? 'is-glitching' : ''}`}
                    style={{left: lx, top: trackY[track] + yOffset, width: width}}
                  >
                    <span className="tl-nodegroup__cap tl-nodegroup__cap--l"/>
                    <div className="tl-nodegroup__line"/>
                    <span className="tl-nodegroup__cap tl-nodegroup__cap--r"/>
                    <span
                      className={`tl-nodegroup__label ${g.targetId && g.targetId === selectedId ? 'is-active' : ''}`}
                      style={{'--label-left': labelLeftPct}}
                      onClick={g.onClick}
                      title={g.onClick ? '클릭하여 상세 보기' : undefined}
                    >{g.label}</span>
                  </div>
                );
              });
            });
          })()}

          {/* Korea 삼국시대 갈래 SVG — 한국 트랙 포커스 + branch 모드일 때만 */}
          {isKoreaSplit && (() => {
            const koreaY = trackY['korea'];
            if (koreaY == null) return null;
            const branchX = yearToX(BRANCH_YEAR, scale);
            const mergeX = yearToX(MERGE_YEAR, scale);
            const baekjeEndX = yearToX(660, scale);     // 백제 멸망
            const goguryeoEndX = yearToX(668, scale);   // 고구려 멸망
            const gayaEndX = yearToX(562, scale);       // 가야 멸망
            const sx = branchX;
            const curveLen = 28;
            // 가지 path 헬퍼 — 갈래점에서 sub-lane으로 곡선 후 종결점까지 수평선
            const branchPath = (offY, endX) =>
              `M ${sx} ${koreaY} C ${sx+curveLen} ${koreaY}, ${sx+curveLen} ${koreaY+offY}, ${sx+curveLen*2} ${koreaY+offY} L ${endX} ${koreaY+offY}`;
            return (
              <svg
                style={{position:'absolute', left:0, top:0, width:trackWidth(scale), height:totalLanesH, pointerEvents:'none', zIndex:1, overflow:'visible'}}
                aria-hidden="true"
              >
                <defs>
                  {/* 원줄기와 동일한 그라데이션 (amber-2 → amber → amber-2) */}
                  <linearGradient id="korea-sub-grad" x1="0" x2="1">
                    <stop offset="0"   stopColor="#7fdea3" stopOpacity="1"/>
                    <stop offset="0.5" stopColor="#2fae5e" stopOpacity="1"/>
                    <stop offset="1"   stopColor="#7fdea3" stopOpacity="1"/>
                  </linearGradient>
                </defs>
                {/* 갈래점 = 신라 노드 자리. 노드 마커가 그 위에 그려지므로 따로 표시하지 않는다 */}
                {/* 고구려 가지 (sub 0 = 최상) → 고구려 멸망(668) */}
                <path d={branchPath(SUB_OFFSET[0], goguryeoEndX)}
                  stroke="url(#korea-sub-grad)" strokeWidth="2.5" fill="none" strokeLinecap="round"
                  filter="url(#tva-glow)" />
                {/* 백제 가지 (sub 1) → 백제 멸망(660) */}
                <path d={branchPath(SUB_OFFSET[1], baekjeEndX)}
                  stroke="url(#korea-sub-grad)" strokeWidth="2.5" fill="none" strokeLinecap="round"
                  filter="url(#tva-glow)" />
                {/* 가야 가지 (sub 3 = 최하) → 가야 멸망(562) */}
                <path d={branchPath(SUB_OFFSET[3], gayaEndX)}
                  stroke="url(#korea-sub-grad)" strokeWidth="2.5" fill="none" strokeLinecap="round"
                  filter="url(#tva-glow)" />
                {/* 신라는 갈래 없이 원줄기로 계속 이어짐 (별도 가지 없음) */}
                {/* 갈래 이름표는 두지 않는다 — 각 갈래가 고구려·백제·가야 노드로 시작하고, 이름표가 그 노드 라벨과 겹친다 */}
                {/* 종결점 작은 X 표시 (고구려/백제/가야 멸망) */}
                <g stroke="#24804e" strokeWidth="1.5" strokeLinecap="round" opacity="0.85">
                  <line x1={goguryeoEndX-3} y1={koreaY+SUB_OFFSET[0]-3} x2={goguryeoEndX+3} y2={koreaY+SUB_OFFSET[0]+3}/>
                  <line x1={goguryeoEndX-3} y1={koreaY+SUB_OFFSET[0]+3} x2={goguryeoEndX+3} y2={koreaY+SUB_OFFSET[0]-3}/>
                  <line x1={baekjeEndX-3} y1={koreaY+SUB_OFFSET[1]-3} x2={baekjeEndX+3} y2={koreaY+SUB_OFFSET[1]+3}/>
                  <line x1={baekjeEndX-3} y1={koreaY+SUB_OFFSET[1]+3} x2={baekjeEndX+3} y2={koreaY+SUB_OFFSET[1]-3}/>
                  <line x1={gayaEndX-3} y1={koreaY+SUB_OFFSET[3]-3} x2={gayaEndX+3} y2={koreaY+SUB_OFFSET[3]+3}/>
                  <line x1={gayaEndX-3} y1={koreaY+SUB_OFFSET[3]+3} x2={gayaEndX+3} y2={koreaY+SUB_OFFSET[3]-3}/>
                </g>
              </svg>
            );
          })()}

          {/* 동아시아·서아시아 단일 갈래 SVG — 일본/인도 sub-lane */}
          {(isEastasiaSplit || isWestasiaSplit) && (() => {
            const trackId = isEastasiaSplit ? 'eastasia' : 'westasia';
            const cfg = TRACK_BRANCH[trackId];
            const baseY = trackY[trackId];
            if (baseY == null || !cfg) return null;
            const sx = yearToX(cfg.branchYear, scale);
            const endX = trackWidth(scale);
            const offY = cfg.subOffset;
            const curveLen = 28;
            const gradId = `${trackId}-sub-grad`;
            return (
              <svg
                style={{position:'absolute', left:0, top:0, width:trackWidth(scale), height:totalLanesH, pointerEvents:'none', zIndex:1, overflow:'visible'}}
                aria-hidden="true"
              >
                <defs>
                  {/* 원줄기와 동일한 그라데이션 */}
                  <linearGradient id={gradId} x1="0" x2="1">
                    <stop offset="0"   stopColor="#7fdea3" stopOpacity="1"/>
                    <stop offset="0.5" stopColor="#2fae5e" stopOpacity="1"/>
                    <stop offset="1"   stopColor="#7fdea3" stopOpacity="1"/>
                  </linearGradient>
                </defs>
                {/* 갈래점 다이아몬드 */}
                <g transform={`translate(${sx} ${baseY})`}>
                  <circle r="9" fill="#040806" stroke="#2fae5e" strokeWidth="1" opacity="0.7"/>
                  {/* hourglass body */}
                  <path d="M -5.5 -6 L 5.5 -6 L 0 0 L 5.5 6 L -5.5 6 L 0 0 Z"
                        fill="#56cf85" stroke="#2fae5e" strokeWidth="1.2"/>
                  <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#2fae5e" strokeWidth="1.4" strokeLinecap="square"/>
                  <line x1="-6" y1="6"  x2="6" y2="6"  stroke="#2fae5e" strokeWidth="1.4" strokeLinecap="square"/>
                  <line x1="0" y1="-1.5" x2="0" y2="1.5" stroke="#040806" strokeWidth="1.1"/>
                </g>
                {/* 갈래 라인 — 원줄기 lane에서 sub-lane으로 부드럽게 갈라짐 */}
                <path
                  d={`M ${sx} ${baseY} C ${sx+curveLen} ${baseY}, ${sx+curveLen} ${baseY+offY}, ${sx+curveLen*2} ${baseY+offY} L ${endX-20} ${baseY+offY}`}
                  stroke={`url(#${gradId})`} strokeWidth="2.5" fill="none" strokeLinecap="round"
                  filter="url(#tva-glow)"
                />
                {/* sub-lane 라벨 (갈래점 옆) */}
                <g fontFamily="IBM Plex Mono, monospace" fontSize="12" letterSpacing="2" fill="#2fae5e" opacity="0.9">
                  <text x={sx+curveLen*2+6} y={baseY+offY+16}>▸ {cfg.subLabel}</text>
                </g>
              </svg>
            );
          })()}

          {/* Nodes + labels per track */}
          {positioned.map(e => {
            const y = eventY(e); if (y == null) return null;
            const isSelected = e.id === selectedId;
            const isGlitching = focusedTrack && focusedTrack !== e.track;
            const isFocused = focusedTrack === e.track;
            /* 라벨 세로 위치 — positioned 단계에서 실제 사각형으로 계산해 둔 값을 그대로 쓴다 */
            const labelOffset = -(e.labelDy ?? 16);
            const labelX = e.x + (e.labelDx || 0);     // 밀집 구간에서 옆으로 비킨 라벨 위치
            const isSub = !!e.noSync;               // 서브 노드 = 기록 열람 없음(noSync)
            const isRisk = accessMode === 'response' && !!e.risk;   // 위험 노드 — 대응반 접속 시에만 적색 노출
            return (
              <React.Fragment key={e.id}>
                {!e.noMarker && (
                  <div
                    className={`tl-node ${e.kind === 'turning' ? 'tl-node--turn' : ''} ${isSub ? 'tl-node--sub' : ''} ${(!e.linkTo && !e.noSync) ? 'is-sync' : ''} ${isSelected ? 'active' : ''} ${isGlitching ? 'is-glitching' : ''} ${isFocused ? 'is-focused' : ''} ${e.alwaysLit ? 'is-alwayslit' : ''} ${isRisk ? 'is-risk' : ''}`}
                    style={{left: e.x, top: y}}
                    onClick={(ev) => { ev.stopPropagation(); onSelect(isSelected ? null : e.id); }}
                    title={`${e.label} · ${e.year}`}
                  />
                )}
                {e.leader && (
                  <svg className={`tl-leader ${isSelected ? 'active' : ''} ${isGlitching ? 'is-glitching' : ''} ${isRisk ? 'is-risk' : ''}`} aria-hidden="true">
                    <polyline points={e.leaderMode === 'trunk'
                      ? `${e.x},${y - 7} ${e.x},${y - e.branchDy} ${e.x + e.edgeDx},${y - e.branchDy}`
                      : e.leaderMode === 'elbow'
                      ? `${e.x},${y - 7} ${e.x},${y - e.leaderBand} ${e.x + e.colDx},${y - e.leaderBand} ${e.x + e.colDx},${y - e.branchDy} ${e.x + e.edgeDx},${y - e.branchDy}`
                      : `${e.x},${y - 7} ${e.x},${y - e.leaderBand} ${labelX},${y - e.leaderBand} ${labelX},${y + labelOffset}`}/>
                  </svg>
                )}
                <div
                  className={`tl-nodelabel ${isSub ? 'tl-nodelabel--sub' : ''} ${isSelected ? 'active' : ''} ${isGlitching ? 'is-glitching' : ''} ${isFocused ? 'is-focused' : ''} ${e.alwaysLit ? 'is-alwayslit' : ''} ${isRisk ? 'is-risk' : ''}`}
                  style={{left: labelX, top: y + labelOffset}}
                  data-text={e.label}
                  onClick={(ev) => { ev.stopPropagation(); onSelect(isSelected ? null : e.id); }}
                  role="button"
                  tabIndex={0}
                  title={`${e.label} · ${e.year}`}
                >
                  {!e.hideYear && (
                    <span className="tl-nodelabel__year">{window.eventYearText(e)}</span>
                  )}
                  <span className="tl-nodelabel__l">{e.label}</span>
                </div>
              </React.Fragment>
            );
          })}
        </div>

        {/* Sticky track labels — anchored to viewport, NOT panned */}
        {activeTracks.map(t => (
          <div key={'stk-wrap-'+t} className="tl-stickywrap" style={{top: trackY[t] - 38}}>
            <button
              className={`tl-stickylabel ${focusedTrack === t ? 'is-focused' : ''} ${focusedTrack && focusedTrack !== t ? 'is-glitching' : ''}`}
              onClick={() => onFocusTrack(focusedTrack === t ? null : t)}
              data-text={trackMeta[t].ko}
            >
              <span className="tl-stickylabel__ko">{trackMeta[t].ko}</span>
              <span className="tl-stickylabel__en">{trackMeta[t].en}</span>
              <span className="tl-stickylabel__hint">{focusedTrack === t ? '◆ FOCUSED' : '◇ FOCUS'}</span>
            </button>
            {focusedTrack === t && (
              <button
                className="tl-mapbtn"
                onClick={(e) => { e.stopPropagation(); if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('open'); setMapModal(t); }}
                title="구글 지도로 위치 확인"
              >
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                  <path d="M12 22s-7-7.5-7-12a7 7 0 1 1 14 0c0 4.5-7 12-7 12Z"/>
                  <circle cx="12" cy="10" r="2.5"/>
                </svg>
                <span>위치 확인 · CHECK LOCATION</span>
              </button>
            )}
          </div>
        ))}

        {/* Scanline overlay — pulses on focus change */}
        <div className="tl-scan" aria-hidden="true"/>

        {/* Minimap */}
        <div className={`tl-minimap ${panActive ? 'is-visible' : ''}`}>
          <div className="tl-minimap__bar" style={{left: `${(panX / totalW) * 100}%`, width: `${(viewportRef.current?.clientWidth || 800) / totalW * 100}%`}}/>
          <div className="tl-minimap__label">
            PAN · {(panX / totalW * 100).toFixed(1)}%
            {focusedTrack && <span style={{marginLeft:12,color:'var(--amber-300)'}}>FOCUS · {trackMeta[focusedTrack].ko}</span>}
          </div>
        </div>
      </div>

      {/* Floating Google Map modal — opens when 위치 확인 is clicked */}
      {mapModal && (
        <div className="tl-mapmodal" role="dialog" aria-modal="true" onClick={() => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('close'); setMapModal(null); }}>
          <div className="tl-mapmodal__win" onClick={(e) => e.stopPropagation()}>
            <div className="tl-mapmodal__head">
              <span className="tl-mapmodal__title">▸ REGION MAP · {trackMeta[mapModal].en}</span>
              <span className="tl-mapmodal__sub">{trackMeta[mapModal].ko} · 위치 확인</span>
              <button className="tl-mapmodal__close" onClick={() => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('close'); setMapModal(null); }} aria-label="닫기">✕</button>
            </div>
            <iframe
              className="tl-mapmodal__iframe"
              src={trackMeta[mapModal].map}
              title={`${trackMeta[mapModal].ko} map`}
              loading="eager"
              referrerPolicy="no-referrer-when-downgrade"
            />
          </div>
        </div>
      )}

      {/* Intro overlay — idle: button to load; loading: progress; branching: gone */}
      {(phase === 'idle' || phase === 'loading') && (
        <div className={`tl-intro tl-intro--${phase}`} aria-live="polite">
          {phase === 'idle' && (
            <button className="tl-intro__btn" onClick={() => {
              setPhase('loading');
              // 묵직한 효과음 — 불러오기(서고 기계음) → 줄기가 퍼질 때(깊은 울림)
              const A = window.DENDRO_AUDIO;
              if (A) A.sfx('archiveLoad');
              setTimeout(() => { setPhase('branching'); if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('archiveSpread'); }, 2600);
              setTimeout(() => setPhase('ready'), 2600 + 2400);
            }}>
              <span className="tl-intro__btn-k">▸ LOAD RECORD ARCHIVE</span>
              <span className="tl-intro__btn-l">기록줄기 불러오기</span>
              <span className="tl-intro__btn-hint">[ENTER] · 4 REGIONAL OFFICES · {TIMELINE_DATA.events.filter(ev => !ev.hidden).length} NODES</span>
            </button>
          )}
          {phase === 'loading' && (
            <div className="tl-intro__status">
              <div className="tl-intro__status-icon">◆</div>
              <div className="tl-intro__status-k">▶ INITIALIZING RECORD ARCHIVE</div>
              <div className="tl-intro__status-l">고대부터 현대까지 기록줄기를 불러옵니다…</div>
              <div className="tl-intro__bar"><div className="tl-intro__bar-fill"/></div>
              <div className="tl-intro__logs">
                <span>[T+0.0] handshake established</span>
                <span>[T+0.6] origin diamond synced · SAC-TL</span>
                <span>[T+1.2] preparing 4 branches · 한국 · 동아시아 · 서양 · 서아시아·인도</span>
                <span>[T+2.0] indexing 106 memory variants…</span>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Branching status (after overlay closes) */}
      {phase === 'branching' && (
        <div className="tl-branching-status" aria-live="polite">
          <span>▶ CONNECTING REGIONAL OFFICES</span>
          <span className="tl-branching-status__dot"/>
          <span>4개 기록줄기 동기화 중…</span>
        </div>
      )}
    </section>
  );
}

window.TimelineCanvas = TimelineCanvas;
</script>
<script type="text/babel">
/* global React, TIMELINE_DATA, TIMELINE_DB */
const { useEffect: useEffectSync, useState: useStateSync, useMemo: useMemoSync, useRef: useRefSync } = React;

// ===== SVG icons local to this file =====
const SyncIcon = {
  Sync: (p) => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="square" {...p}><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg>,
  Close: (p) => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="square" {...p}><path d="M18 6 6 18M6 6l12 12"/></svg>,
  Doc: (p) => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6"/></svg>,
  Map: (p) => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="m9 4-6 2v15l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v15M15 6v15"/></svg>,
  Image: (p) => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><rect x="3" y="4" width="18" height="16"/><path d="m4 16 4-4 4 4 4-5 4 5"/><circle cx="9" cy="9" r="1.4"/></svg>,
  Link: (p) => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 1 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 1 0 5.7 5.7l1-1"/></svg>,
  Info: (p) => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7v.1"/></svg>,
};

// =================================================
// SYNC DIALOG — main floating window
// =================================================
function SyncDialog({ event, onClose, onJumpTo, accessMode = 'researcher' }) {
  const [tab, setTab] = useStateSync('notes');
  const [restored, setRestored] = useStateSync(() => new Set());   // 복원된 말소 구간 id
  const [phase, setPhase] = useStateSync('boot'); // boot → ready
  const scanRef = useRefSync(null);

  // Reset to overview + restart boot animation every time event changes
  useEffectSync(() => {
    if (!event) return;
    const dbx = window.TIMELINE_DB && window.TIMELINE_DB[event.id];
    // 대응반 접속으로 위험 노드를 열면 LUMINA 보고서부터 보여 준다
    setTab(dbx && dbx.docMode && event.risk && accessMode === 'response' ? 'lumina' : (dbx && dbx.docMode ? 'notes' : (window.hasNotes(dbx) ? 'notes' : 'overview')));   // 정리가 비었으면 개요부터
    setRestored(new Set());
    setPhase('boot');
    const t = setTimeout(() => setPhase('ready'), 900);
    return () => clearTimeout(t);
  }, [event && event.id]);

  // 부속 자료 열람 창 — 머리의 「부속 자료 열람」 버튼으로 연다. 열면 V-RD-010 / 등재 없음 V-RD-011
  const [annexOpen, setAnnexOpen] = useStateSync(false);
  useEffectSync(() => { setAnnexOpen(false); }, [event && event.id]);
  const openAnnex = () => {
    const d = window.TIMELINE_DB && window.TIMELINE_DB[event.id];
    if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('open');
    window.VESTIGIA.say(d && Array.isArray(d.annex) && d.annex.length ? 'V-RD-010' : 'V-RD-011');
    setAnnexOpen(true);
  };
  const closeAnnex = () => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('close'); setAnnexOpen(false); };
  window.useEscLayer(!!event && annexOpen, closeAnnex);

  // ESC + backdrop close
  window.useEscLayer(!!event, onClose);   /* 소리는 onClose(closeSync)가 담당 */

  // 봉인 해제(원본 복원) 순간 효과음 — 훅이므로 early return 앞에 둔다
  const unlockedRef = useRefSync(false);
  useEffectSync(() => {
    if (!event) return;
    const d = window.TIMELINE_DB && window.TIMELINE_DB[event.id];
    if (!d || !d.docMode || accessMode !== 'response' || !event.risk) return;
    const open = restored.size > 0 && restored.size >= docCountRedactions(d);
    if (open && !unlockedRef.current && window.DENDRO_AUDIO) { window.DENDRO_AUDIO.sfx('transition'); }
    unlockedRef.current = open;
  }, [restored.size, event && event.id]);

  if (!event) return null;
  const db = (window.TIMELINE_DB && window.TIMELINE_DB[event.id]) || null;

  const docMode = !!(db && db.docMode);   // 문서 연출 노드 — 지도·요약·상세·자료·탐구
  const DOC_TABS = [
    { id: 'map',       label: 'MAP',        ko: '지도',   icon: <SyncIcon.Map/> },
    { id: 'notes',     label: 'SUMMARY',    ko: '요약',   icon: <SyncIcon.Info/> },
    { id: 'overview',  label: 'DETAIL',     ko: '상세',   icon: <SyncIcon.Info/> },
    { id: 'artifacts', label: 'ARTIFACTS',  ko: '자료',   icon: <SyncIcon.Image/> },
    { id: 'sources',   label: 'INQUIRY',    ko: '탐구',   icon: <SyncIcon.Doc/> },
  ];
  const redactOn = accessMode === 'response' && !!event.risk;   // 위험 노드 왜곡 — 대응반 접속 시에만
  // 대응반 · 위험 노드 — 모두 정정해야(원본 복원) 봉인된 자료·탐구 탭이 열린다
  const unsealed = !(docMode && redactOn) || restored.size >= docCountRedactions(db);
  if (docMode && redactOn) {
    // 지도 왼쪽(맨 앞)에 LUMINA 접근·왜곡 보고서 탭 — 붉은색
    DOC_TABS.unshift({ id: 'lumina', label: 'LUMINA', ko: '왜곡 보고', icon: <SyncIcon.Doc/>, risk: true });
    if (!unsealed) DOC_TABS.splice(-2, 2);
    else DOC_TABS.slice(-2).forEach(t => { t.unlock = true; });   // 막 열린 탭 — 글리치와 함께 나타난다
  }
  const restore = (id) => setRestored(prev => {
    if (prev.has(id)) return prev;
    if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('key');   /* 타자기 타건 — 원본 기록으로 정정 */
    const n = new Set(prev); n.add(id); return n;
  });

  const TABS = docMode ? DOC_TABS : [
    // 정리 — 모든 기록에 둔다. 내용이 비어 있으면 빈 정리 화면 (2026-10-04)
    ...(db && db.notes ? [{ id: 'notes', label: 'NOTES', ko: '정리', icon: <SyncIcon.Info/> }] : []),
    { id: 'map',       label: 'MAP',        ko: '지도',   icon: <SyncIcon.Map/> },
    { id: 'overview',  label: 'OVERVIEW',   ko: '개요',   icon: <SyncIcon.Info/> },
    { id: 'artifacts', label: 'ARTIFACTS',  ko: '자료',   icon: <SyncIcon.Image/> },
    { id: 'sources',   label: 'INQUIRY',    ko: '탐구',   icon: <SyncIcon.Doc/> },
    { id: 'linked',    label: 'LINKED',     ko: '연결',   icon: <SyncIcon.Link/> },
    // 연구원 기록 — 부속 자료(주해·증언·분기·복원) 보기. 2026-10-09 이름을 바꾸고 연결 옆으로 옮김
    { id: 'research',  label: 'RESEARCH',   ko: '연구원 기록', icon: <SyncIcon.Doc/> },
  ];

  const yearStr = window.eventYearText(event);
  const memId = window.eventCallNo(event);
  const thick = window.recordThickness(db);

  return (
    <div className="sync-overlay" onClick={onClose}>
      <div
        className={`sync-dialog ${phase === 'boot' ? 'sync-dialog--boot' : ''}`}
        role="dialog"
        aria-modal="true"
        aria-label={`Memory sync — ${event.label}`}
        onClick={(e) => e.stopPropagation()}
      >
        {/* HUD corner brackets */}
        <span className="sync-corner sync-corner--tl"/>
        <span className="sync-corner sync-corner--tr"/>
        <span className="sync-corner sync-corner--bl"/>
        <span className="sync-corner sync-corner--br"/>

        {/* Scanlines */}
        <span className="sync-scanlines" aria-hidden="true"/>

        {/* HEADER */}
        <header className="sync-head">
          <div className="sync-head__left">
            <div className="sync-head__crumb">
              <span className="sync-head__crumb-sync">▸ 기록 열람 · RECORD ACCESS</span>
              <span className="sync-head__crumb-id">// {memId} · {event.track.toUpperCase()}</span>
            </div>
            <div className="sync-head__title">
              <span className={`sync-glitch ${phase === 'boot' ? 'sync-glitch--on' : ''}`} data-text={event.label}>
                {event.label}
              </span>
            </div>
            <div className="sync-head__sub">
              <span>{event.en}</span>
              <span className="sync-head__dot">·</span>
              <span>{yearStr}</span>
              <span className="sync-head__dot">·</span>
              <span>{event.state} / {event.theme}</span>
            </div>
          </div>
          <div className="sync-head__right">
            {/* 부속 자료 열람 — 확정 기록 옆에 등재된 주해·증언·분기 기록·복원. 누르면 가운데에 따로 창이 뜬다 */}
            {db && !docMode && (
              <button className="sync-annexbtn" onClick={openAnnex} title="부속 자료 열람 — 주해·증언·분기 기록·복원">
                <span className="sync-annexbtn__k">ANNEX · 부속 자료</span>
                <span className="sync-annexbtn__v"><SyncIcon.Doc/><span>열람</span></span>
                <span className="sync-annexbtn__n">등재 {thick.annexN}건</span>
              </button>
            )}
            {/* 기록 두께 — 부속 자료·출처가 쌓일수록 찬다 (얇음 · 보통 · 두꺼움) */}
            <div className="sync-head__ratio" title={`기록 두께 · 부속 자료 ${thick.annexN}건 · 출처 ${thick.srcN}건`}>
              <div className="sync-head__ratio-k">기록 두께</div>
              <div className="sync-head__ratio-v">{db ? thick.level : '——'}</div>
              <div className="sync-head__ratio-bar">
                <div className="sync-head__ratio-fill" style={{ width: `${Math.round(thick.fill * 100)}%` }}/>
              </div>
              <div className="sync-head__ratio-n">부속 자료 {thick.annexN}건</div>
            </div>
            <button className="sync-close" onClick={onClose} aria-label="Close">
              <SyncIcon.Close/>
            </button>
          </div>
        </header>

        {/* TAB STRIP */}
        <nav className="sync-tabs" role="tablist">
          {TABS.map(t => (
            <button
              key={t.id}
              role="tab"
              aria-selected={tab === t.id}
              className={`sync-tab ${tab === t.id ? 'sync-tab--on' : ''} ${t.risk ? 'sync-tab--risk' : ''} ${t.unlock ? 'sync-tab--unlock' : ''}`}
              onClick={() => setTab(t.id)}
            >
              <span className="sync-tab__icon">{t.icon}</span>
              <span className="sync-tab__label">{t.label}</span>
              <span className="sync-tab__ko">{t.ko}</span>
            </button>
          ))}
          <div className="sync-tabs__filler"/>
          <div className="sync-tabs__file">
            <span>FILE_REF</span>
            <span className="sync-tabs__file-v">{db ? (window.cleanCite(db.fileRef) || window.eventCallNo(event)) : '— not indexed —'}</span>
          </div>
        </nav>

        {/* BODY */}
        <div className={`sync-body ${docMode ? 'sync-body--doc' : ''}`}>
          {!db && <NoDataView event={event}/>}
          {docMode && <DocView tab={tab} db={db} event={event} redactOn={redactOn} restored={restored} onRestore={restore}/>}
          {db && !docMode && tab === 'research'  && <ResearchTab  db={db}/>}
          {db && !docMode && tab === 'notes'     && <NotesTab     db={db} event={event}/>}
          {db && !docMode && tab === 'overview'  && <OverviewTab  db={db} event={event}/>}
          {db && !docMode && tab === 'sources'   && <SourcesTab   db={db}/>}
          {db && !docMode && tab === 'map'       && <MapTab       db={db} event={event}/>}
          {db && !docMode && tab === 'artifacts' && <ArtifactsTab db={db}/>}
          {db && !docMode && tab === 'linked'    && <LinkedTab    db={db} event={event} onJumpTo={onJumpTo}/>}
        </div>

        {/* FOOTER */}
        <footer className="sync-foot">
          <span className="sync-foot__l">// 기록 DB · 왜곡 감시 가동</span>
          <window.VLine className="sync-foot__v" fallback={<span className="sync-foot__mid">SOURCE · IBA 제2국 기록 서고</span>}/>
          <span className="sync-foot__r">{phase === 'boot' ? 'BOOTING…' : 'READY'} · ESC TO RELEASE</span>
        </footer>
      </div>
      {annexOpen && db && <AnnexModal event={event} db={db} onClose={closeAnnex}/>}
    </div>
  );
}

// =================================================
// NO DATA — graceful empty state
// =================================================
function NoDataView({ event }) {
  return (
    <div className="sync-empty">
      <div className="sync-empty__icon">◇</div>
      <div className="sync-empty__title">// AWAITING ARCHIVAL SOURCE</div>
      <div className="sync-empty__body">
        이 기록({window.eventCallNo(event)})의 원본 발췌는 아직 서고에 편입되지 않았다.<br/>
        편입이 끝나면 이 창에서 바로 열람할 수 있다.
      </div>
      <div className="sync-empty__hint">// 편입 대기 기록</div>
    </div>
  );
}

// =================================================
// 등재 목록 — 부속 자료(annex)와 연구원 기록(research)이 같은 모양을 쓴다 (DENDRO P3-4)
//   [{ id?, type: '주해'|'증언'|'분기'|'복원'|'결손 신고', author_code, year, reply_to?, body }]
//   화면 입력 없음 — 데이터(JSON)에 추가한다. 반박(reply_to)은 대상 항목 오른쪽 아래로 한 단 들여 벽 주해처럼 계단식으로.
//   reply_to 는 대상 항목의 id 또는 배열 순번.
// =================================================
function EntryList({ list, hint, empty, emptyHint, cls }) {
  list = Array.isArray(list) ? list : [];
  if (!list.length) {
    return (
      <div className={`sync-pane ${cls || ''}`}>
        <div className="sync-pane__hint">{hint}</div>
        <div className="sync-empty" style={{padding:'40px 24px'}}>
          <div className="sync-empty__icon">◇</div>
          <div className="sync-empty__body">{empty}</div>
          {emptyHint && <div className="sync-empty__hint">{emptyHint}</div>}
        </div>
      </div>
    );
  }
  // 반박 트리 — 루트부터 깊이 우선으로 늘어놓고 깊이만큼 들여 쓴다
  const keyOf = (a, i) => (a.id != null ? String(a.id) : String(i));
  const kids = {};
  list.forEach((a, i) => {
    const to = a.reply_to == null ? '' : String(a.reply_to);
    (kids[to] = kids[to] || []).push({ a, k: keyOf(a, i) });
  });
  const rows = [];
  const walk = (parent, depth) => (kids[parent] || []).forEach(n => { rows.push({ ...n, depth }); walk(n.k, depth + 1); });
  walk('', 0);
  // 대상이 없는 반박도 빠뜨리지 않는다
  list.forEach((a, i) => { const k = keyOf(a, i); if (!rows.some(r => r.k === k)) rows.push({ a, k, depth: 1 }); });
  return (
    <div className={`sync-pane ${cls || ''}`}>
      <div className="sync-pane__hint">{hint} · {list.length}건</div>
      <ol className="annex-list">
        {rows.map(({ a, k, depth }) => (
          <li key={k} className={`annex-item annex-item--${depth ? 'reply' : 'root'}`} style={{ marginLeft: `${Math.min(depth, 6) * 34}px` }}>
            <div className="annex-item__meta">
              <span className="annex-item__type">{a.type || '주해'}</span>
              <span className="annex-item__who">{a.author_code || '—'}</span>
              <span className="annex-item__yr">{a.year || '연도 없음'}</span>
              {depth > 0 && <span className="annex-item__re">↳ 반박</span>}
            </div>
            <p className="annex-item__body">{a.body}</p>
          </li>
        ))}
      </ol>
    </div>
  );
}

/* 연구원 기록 탭 — db.research (부속 자료와 별개). 비어 있으면 빈 화면 */
function ResearchTab({ db }) {
  return <EntryList list={db.research} cls="sync-pane--annex" hint="// RESEARCH · 연구원 기록" empty="등재된 연구원 기록이 없습니다."/>;
}

/* 부속 자료 열람 창 — 기록 열람 창 위 가운데에 떠 있는 창. db.annex */
function AnnexModal({ event, db, onClose }) {
  const n = Array.isArray(db.annex) ? db.annex.length : 0;
  return (
    <div className="annexmodal" onClick={(e) => { e.stopPropagation(); onClose(); }}>
      <div className="annexmodal__box" role="dialog" aria-modal="true" aria-label="부속 자료 열람" onClick={(e) => e.stopPropagation()}>
        <span className="sync-corner sync-corner--tl"/><span className="sync-corner sync-corner--tr"/>
        <span className="sync-corner sync-corner--bl"/><span className="sync-corner sync-corner--br"/>
        <header className="annexmodal__head">
          <div>
            <div className="annexmodal__k">▸ 부속 자료 열람 · ANNEX // {window.eventCallNo(event)}</div>
            <div className="annexmodal__t">{event.label}</div>
            <div className="annexmodal__sub">주해 · 증언 · 분기 기록 · 복원 · 등재 {n}건</div>
          </div>
          <button className="sync-close" onClick={onClose} aria-label="닫기"><SyncIcon.Close/></button>
        </header>
        <div className="annexmodal__body">
          <EntryList list={db.annex} cls="sync-pane--annex" hint="// ANNEX · 부속 자료" empty="등재된 부속 자료가 없습니다." emptyHint="// VESTIGIA V-RD-011"/>
        </div>
        <footer className="annexmodal__foot">
          <span>// 확정 기록 옆에 등재된 사본 · 본문은 고치지 않는다</span>
          <span>ESC · 닫기</span>
        </footer>
      </div>
    </div>
  );
}

// =================================================
// TAB: NOTES — 연구원 정리 (교과서 외 별도 정리 메모)
//   db.notes = string | { sections: [{ head, body, list? }] }
//   사용자 명령에 따라 누적되는 영역. 비어있으면 placeholder 표시.
// =================================================
function NotesTab({ db, event }) {
  const notes = db.notes;
  if (!window.hasNotes(db)) {
    return (
      <div className="sync-pane sync-pane--notes">
        <div className="sync-empty" style={{padding:'40px 24px'}}>
          <div className="sync-empty__icon">◇</div>
          <div className="sync-empty__title">// 정리 — NOTES NOT YET ENTERED</div>
          <div className="sync-empty__body">
            <b>{event.label}</b> 항목에 대한 연구원 정리가 아직 등록되지 않았습니다.<br/>
            정리본이 작성되면 이 영역에 누적된다.
          </div>
          <div className="sync-empty__hint">// AWAITING RESEARCHER INPUT · ENTRY POINT FOR CUSTOM NOTES</div>
        </div>
      </div>
    );
  }
  // 문자열 단일 입력 — 단순 문단으로 표시
  if (typeof notes === 'string') {
    return (
      <div className="sync-pane sync-pane--notes">
        <div className="sync-pane__hint">// RESEARCHER NOTES · 연구원 정리</div>
        <section className="sync-section">
          <h3 className="sync-section__head">▸ 정리</h3>
          <p className="sync-prose">{notes}</p>
        </section>
      </div>
    );
  }
  // 구조화된 입력 — { summary?, sections: [{ head, body?, list? }] }
  return (
    <div className="sync-pane sync-pane--notes">
      <div className="sync-pane__hint">// RESEARCHER NOTES · 연구원 정리</div>
      {notes.summary && (
        <section className="sync-section">
          <h3 className="sync-section__head">▸ 정리 · SUMMARY</h3>
          <p className="sync-prose">{notes.summary}</p>
        </section>
      )}
      {Array.isArray(notes.sections) && notes.sections.map((s, i) => (
        <section className="sync-section" key={i}>
          {s.head && <h3 className="sync-section__head">▸ {s.head}</h3>}
          {s.body && <p className="sync-prose">{s.body}</p>}
          {Array.isArray(s.list) && s.list.length > 0 && (
            <ul className="sync-notes-list">
              {s.list.map((item, j) => <li key={j}>{item}</li>)}
            </ul>
          )}
        </section>
      ))}
    </div>
  );
}

// =================================================
// TAB: SOURCES — primary-source quotations from textbooks
// =================================================
function SourcesTab({ db }) {
  // 모든 사료가 이미지+제목만 있고 본문/해설이 없으면 좌우 2열 그리드로 표시
  const sources = Array.isArray(db.sources) ? db.sources : [];
  // 이미지 카드(진 노드식): 실제 이미지(src) 또는 빈 자리표시자(ph) — 본문/해설/갤러리가 없는 항목
  const allImgOnly = sources.length > 0 && sources.every(s => (s.src || s.ph) && !s.body && !s.gloss && !s.images);
  if (sources.length === 0) {
    return (
      <div className="sync-pane sync-pane--sources">
        <div className="sync-pane__hint">// 등록된 탐구 자료가 없습니다.</div>
      </div>
    );
  }
  return (
    <div className="sync-pane sync-pane--sources">
      <div className="sync-pane__hint">// 모든 서술은 원본 출처에서 인용된다</div>
      <ul className={`sync-sources ${allImgOnly ? 'sync-sources--grid' : ''}`}>
        {sources.map((s, i) => {
          const isImgOnly = (s.src || s.ph) && !s.body && !s.gloss && !s.images;
          const hasMulti = Array.isArray(s.images) && s.images.length > 0;
          return (
            <li className={`sync-source ${s.src && !isImgOnly ? 'sync-source--has-img' : ''} ${isImgOnly ? 'sync-source--img-only' : ''} ${hasMulti ? 'sync-source--multi' : ''}`} key={i}>
              <header className="sync-source__head">
                <span className="sync-source__kind">{String(s.kind || '').replace(/^(?:교과서|세계사) 본문$/, '원본 본문').replace(/^(?:교과서|판서)\s+/, '')}</span>
                <span className="sync-source__title">{s.title}</span>
              </header>
              {s.src ? (
                <div className="sync-source__img-wrap">
                  <img className="sync-source__img" src={s.src} alt={s.title} loading="eager"
                    onClick={() => window.__tmbLightbox && window.__tmbLightbox(s.src, s.title)}
                    title="클릭하여 크게 보기"/>
                </div>
              ) : s.ph ? (
                <div className="sync-source__img-wrap">
                  <div className="sync-art__placeholder">
                    <span>// IMAGE PLACEHOLDER</span>
                    <span className="sync-art__slot">탐구 자료</span>
                  </div>
                </div>
              ) : null}
              {s.body && <blockquote className="sync-source__body">{window.redactText(s.body, db, 'sources')}</blockquote>}
              {s.gloss && <div className="sync-source__gloss">{s.gloss}</div>}
              {hasMulti && (
                <div className="sync-source__gallery">
                  {s.images.map((im, j) => (
                    <figure className="sync-source__gallery-item" key={j}>
                      <img className="sync-source__img" src={im.src} alt={im.caption || s.title} loading="eager"
                        onClick={() => window.__tmbLightbox && window.__tmbLightbox(im.src, im.caption || s.title)}
                        title="클릭하여 크게 보기"/>
                      {im.caption && <figcaption className="sync-source__gallery-cap">{im.caption}</figcaption>}
                    </figure>
                  ))}
                </div>
              )}
              {window.cleanCite(s.citation) && <footer className="sync-source__cite">{window.cleanCite(s.citation)}</footer>}
            </li>
          );
        })}
      </ul>
    </div>
  );
}

// =================================================
// TAB: MAP — schematic HUD-style map
// =================================================
function MapTab({ db, event }) {
  // db.map이 없을 때도 event.label/en으로 Google Maps fallback 자동 생성
  const m = db.map || {
    title: event ? (event.label || event.en || event.id) : '',
    pins: [],
    googleQuery: event ? (event.en || event.label) : '',
    googleZoom: 5
  };
  const W = m.bounds?.w || 360, H = m.bounds?.h || 240;
  // Google Maps 쿼리 결정 — googleQuery 우선, 없으면 amber 핀 라벨, 그것도 없으면 title
  const amberPin = m.pins && m.pins.find(p => p.amber);
  const gQuery = m.googleQuery || (amberPin && amberPin.label) || m.title || '';
  const gZoom = m.googleZoom || 5;
  const gMapUrl = `https://www.google.com/maps?q=${encodeURIComponent(gQuery)}&t=k&z=${gZoom}&output=embed`;
  return (
    <div className="sync-pane sync-pane--map">
      <header className="sync-mapheader">
        <span className="sync-mapheader__title">▸ {m.title}</span>
        <span className="sync-mapheader__coords">// GOOGLE MAPS · Q: {gQuery}</span>
      </header>
      <div className="sync-mapwrap sync-mapwrap--google">
        <iframe
          src={gMapUrl}
          title={`Google Maps · ${m.title}`}
          loading="eager"
          referrerPolicy="no-referrer-when-downgrade"
          allowFullScreen
        />
      </div>
      <div className="sync-mappins">
        <span className="sync-mappins__head">▸ NODE INDEX</span>
        {m.pins && m.pins.map((p, i) => (
          <span key={'idx'+i} className={`sync-mappins__chip ${p.amber ? 'is-amber' : p.red ? 'is-red' : ''}`}>
            ◆ {p.label}{p.sub ? ` · ${p.sub}` : ''}
          </span>
        ))}
      </div>
      {/* SVG 도식은 후방 호환 옵션 — 기본은 숨김. db.map.useSchematic=true면 표시 */}
      {m.useSchematic && (
      <div className="sync-mapwrap" style={{marginTop:14}}>
        <svg viewBox={`0 0 ${W} ${H}`} className="sync-map" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="mapgrid" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(232, 176, 43,0.10)" strokeWidth="0.5"/>
            </pattern>
            <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#5dd5f5"/>
            </marker>
          </defs>

          {/* Grid */}
          <rect x="0" y="0" width={W} height={H} fill="url(#mapgrid)"/>

          {/* Frame ticks */}
          {[0, W/4, W/2, 3*W/4, W].map((x, i) => (
            <line key={'tx'+i} x1={x} x2={x} y1="0" y2="6" stroke="rgba(168,188,204,0.4)" strokeWidth="0.5"/>
          ))}
          {[0, H/4, H/2, 3*H/4, H].map((y, i) => (
            <line key={'ty'+i} x1="0" x2="6" y1={y} y2={y} stroke="rgba(168,188,204,0.4)" strokeWidth="0.5"/>
          ))}

          {/* Region outlines (schematic land mass) */}
          {m.regions && m.regions.map((r, i) => (
            <g key={'rg'+i}>
              <path d={r.d}
                fill="rgba(232, 176, 43,0.06)"
                stroke="var(--cyan-400)"
                strokeWidth="1"
                strokeDasharray="2 3"/>
              {r.label && (
                <text x="14" y={H - 10} fill="var(--cyan-300)"
                  fontFamily="var(--font-mono)" fontSize="9"
                  letterSpacing="0.18em" textTransform="uppercase">
                  ▸ {r.label}
                </text>
              )}
            </g>
          ))}

          {/* Optional grid line (boundary) */}
          {m.gridLine && (
            <g>
              <line x1="0" x2={W} y1={m.gridLine.y} y2={m.gridLine.y}
                stroke="var(--amber-500)" strokeWidth="1" strokeDasharray="6 4" opacity="0.85"/>
              <text x={W - 14} y={m.gridLine.y - 5} fill="var(--amber-300)" textAnchor="end"
                fontFamily="var(--font-mono)" fontSize="9" letterSpacing="0.14em">
                {m.gridLine.label}
              </text>
            </g>
          )}

          {/* Arrows */}
          {m.arrows && m.arrows.map((a, i) => {
            const dx = a.to[0] - a.from[0], dy = a.to[1] - a.from[1];
            const len = Math.hypot(dx, dy);
            const mx = (a.from[0] + a.to[0]) / 2, my = (a.from[1] + a.to[1]) / 2;
            return (
              <g key={'ar'+i}>
                <line x1={a.from[0]} y1={a.from[1]} x2={a.to[0]} y2={a.to[1]}
                  stroke="var(--cyan-300)" strokeWidth="1"
                  strokeDasharray="3 3"
                  markerEnd="url(#arr)" opacity="0.9"/>
                <text x={mx} y={my - 4} fill="var(--cyan-200)"
                  fontFamily="var(--font-mono)" fontSize="8.5" letterSpacing="0.12em" textAnchor="middle">
                  {a.label}
                </text>
              </g>
            );
          })}

          {/* Pins */}
          {m.pins && m.pins.map((p, i) => {
            const color = p.amber ? 'var(--amber-500)' : (p.red ? 'var(--red-500)' : 'var(--cyan-300)');
            const labelColor = p.amber ? 'var(--amber-300)' : (p.red ? 'var(--red-300)' : 'var(--fg-1)');
            return (
              <g key={'pn'+i}>
                <g transform={`translate(${p.x},${p.y}) rotate(45)`}>
                  <rect x="-3.5" y="-3.5" width="7" height="7" fill="var(--bg-base)" stroke={color} strokeWidth="1.4"/>
                </g>
                {p.amber && <circle cx={p.x} cy={p.y} r="10" fill="none" stroke={color} strokeWidth="0.8" opacity="0.4"/>}
                <text x={p.x + 8} y={p.y + 2} fill={labelColor}
                  fontFamily="var(--font-ko-ui), var(--font-display)"
                  fontSize="11" fontWeight="500">{p.label}</text>
                {p.sub && (
                  <text x={p.x + 8} y={p.y + 14} fill="var(--fg-3)"
                    fontFamily="var(--font-mono)" fontSize="8.5" letterSpacing="0.1em">
                    {p.sub}
                  </text>
                )}
              </g>
            );
          })}
        </svg>
      </div>
      )}
    </div>
  );
}
