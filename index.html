    { id: 'w-911', track: 'west', year: 2001, label: '9·11 테러', en: 'September 11 Attacks',

    { id: 's-bronze', track: 'westasia', year: -3500, yearLabel: '3500 BCE 무렵 ~', label: '청동기 시대', en: 'Bronze Age',

    // ---------- 문명 형성 ----------
    { id: 's-mesopotamia', track: 'westasia', year: -3500, label: '메소포타미아 문명', en: 'Mesopotamian Civilization',

    { id: 's-indus', track: 'westasia', year: -2500, label: '인도 문명', en: 'Indus Valley Civilization',
      state: '인도 문명', theme: '문화', kind: 'turning', sub: 1, branch: true,
      body: '인더스강 유역의 하라파·모헨조다로 등 계획 도시 문명. 정연한 격자형 도로와 배수 시설, 공중 목욕탕, 미해독 인장 문자. 기원전 2500년경 발생. — 이 지점에서 인도 기록줄기가 서아시아 원줄기에서 갈래를 냄.' },
    { id: 's-hittite', track: 'westasia', year: -1650, yearLabel: '17세기 BCE경', label: '히타이트', en: 'Hittite',
      state: '히타이트', theme: '군사', kind: 'turning',
      body: '아나톨리아 반도에 자리 잡은 인도-유럽계 제국. 철제 무기와 전차로 바빌로니아를 정복하고 이집트와 카데시 전투(BCE 1274) 후 평화 조약(BCE 1259) 체결. 철기 문화를 서아시아에 전파.' },
    { id: 's-aryan', track: 'westasia', year: -1500, label: '아리아인 인도 진입', en: 'Aryan Migration',
      state: '인도', theme: '사회', kind: 'theme', sub: 1, noSync: true,
      body: '중앙아시아의 아리아인이 인더스 강 유역으로 이주. 베다 문화와 카스트(바르나) 제도의 기원.' },
    { id: 's-phoenicia', track: 'westasia', year: -1200, yearLabel: '12세기 BCE경', label: '페니키아', en: 'Phoenicia',
      state: '페니키아', theme: '외교', kind: 'turning',
      body: '지중해 동안의 해상 무역 민족. 카르타고 등 여러 식민 도시 건설. 표음 문자(알파벳의 기원) 사용. 해상 활동으로 서아시아 문명을 유럽에 전파.' },
    { id: 's-hebrew', track: 'westasia', year: -1050, yearLabel: '11세기 BCE경', label: '헤브라이', en: 'Hebrew',
      state: '헤브라이', theme: '종교', kind: 'turning',
      body: 'BCE 11세기경 이스라엘 왕국 건설, 다윗·솔로몬 왕 때 전성. 예루살렘에 야훼의 성전 건설. 유일신 신앙(유대교) 창시. 솔로몬 사후 이스라엘·유대로 분열, 후일 바빌론 유수.' },
    { id: 's-assyria', track: 'westasia', year: -700, yearLabel: '7세기 BCE경', label: '아시리아', en: 'Assyrian Empire',
      state: '아시리아', theme: '군사', kind: 'turning',

      state: '불교', theme: '종교', kind: 'turning', sub: 1,

<script type="text/babel">
/* global React, TIMELINE_DATA */
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* VESTIGIA 관내 방송 띠 — 가장 최근 한 줄. 새 줄은 6초 동안 밝게, 그 뒤로는 흐리게 남는다 (DENDRO P4-1) */
function useVestigia() {
  const [line, setLine] = useState(() => window.VESTIGIA ? window.VESTIGIA.current() : null);
  useEffect(() => {
    const on = (e) => setLine(e.detail);
    window.addEventListener('vestigia', on);
    return () => window.removeEventListener('vestigia', on);
  }, []);
  return line;
}
function VLine({ className = '', fallback = null, showId = false }) {
  const line = useVestigia();
  const [fresh, setFresh] = useState(false);
  useEffect(() => {
    if (!line) return;
    setFresh(true);
    const t = setTimeout(() => setFresh(false), 6000);
    return () => clearTimeout(t);
  }, [line && line.seq]);
  if (!line) return fallback;
  return (
    <span className={`vline ${fresh ? 'is-fresh' : ''} ${className}`} role="status" aria-live="polite" title={`${line.id} · ${line.situation}`}>
      <b className="vline__who">▸ VESTIGIA</b>
      {showId && <span className="vline__id">{line.id}</span>}
      <span className="vline__t" key={line.seq}>{line.text}</span>
    </span>
  );
}
/* 관내 방송 칸 — 지역국 패널 아래. V-BC 방송만 받는다(하단 띠에는 뜨지 않는다).
   새 방송은 8초 동안 밝게, 그 뒤로는 다음 방송까지 흐리게 남는다 */
function BroadcastBox() {
  const [line, setLine] = useState(() => window.VESTIGIA && window.VESTIGIA.currentBroadcast ? window.VESTIGIA.currentBroadcast() : null);
  const [fresh, setFresh] = useState(false);
  useEffect(() => {
    const on = (e) => setLine(e.detail);
    window.addEventListener('vestigia-bc', on);
    return () => window.removeEventListener('vestigia-bc', on);
  }, []);
  useEffect(() => {
    if (!line) return;
    setFresh(true);
    const t = setTimeout(() => setFresh(false), 8000);
    return () => clearTimeout(t);
  }, [line && line.seq]);
  return (
    <div className={`bcbox ${line ? '' : 'is-idle'} ${fresh ? 'is-fresh' : ''}`} role="status" aria-live="polite" aria-label="관내 방송"
         title={line ? `${line.id} · 관내 방송` : '관내 방송'}>
      <span className="bcbox__k"><i className="bcbox__dot" aria-hidden="true"></i>관내 방송</span>
      <span className="bcbox__t" key={line ? line.seq : 0}>{line ? line.text : '— 수신 대기 —'}</span>
    </div>
  );
}
Object.assign(window, { useVestigia, VLine, BroadcastBox });

/* 제2국 열람 문서 — 인장을 누르면 뜨는 창. 원문은 #d2-doc, 탭 구성은 원문 표제를 따른다 */
/* 문서 안 절(節)이 화면에 들어오면 VESTIGIA가 알린다 — 제목 문구 → 문형 */
const D2_V_SECTIONS = { '지부 벽의 주해': 'V-RD-012', '외관 — 두 측량': 'V-RD-017' };
/* ── 제한 열람(제10장) 해제 조건 — 이 한 곳만 고치면 된다. 날짜 조건 등으로 바꿔도 된다.
      s = { seenTabs: Set<탭 번호>, readLayers: Set<층 번호>, now: Date }
      n층은 이 조건을 만족하고, 그 아래 층이 모두 해제되어 있어야 열린다. ── */
window.D2_RESTRICT_RULES = window.D2_RESTRICT_RULES || {
  1: (s) => ['00', '01', '02', '03', '04', '05', '06', '07', '08', '09', '11', '12'].every(n => s.seenTabs.has(n)),
  2: (s) => s.readLayers.has(1),
  3: (s) => s.readLayers.has(2),
  4: (s) => s.readLayers.has(3),
  5: (s) => s.readLayers.has(4)
};
const D2_RESTRICT_TAB = '10';
const D2_REDACT_TIP = '[말소] — 복원 대기 · 부속 자료 미등재';
/* 열람 여부는 이 브라우저에 남긴다 (DENDRO P3-2) */
const d2Load = (k) => { try { return new Set(JSON.parse(localStorage.getItem(k) || '[]')); } catch (e) { return new Set(); } };
const d2Save = (k, set) => { try { localStorage.setItem(k, JSON.stringify([...set])); } catch (e) {} };
const D2K = { seen: 'iba.d2.seen.v15', read: 'iba.d2.layers.read', told: 'iba.d2.layers.told' };

function D2Doc({ onClose }) {
  const tabs = window.D2_DOC || [];
  // 00 표제부는 배속 후 1회만. 이후에는 01에서 시작한다
  const firstTime = (() => { try { return !sessionStorage.getItem('iba.d2.title'); } catch (e) { return true; } })();
  const [tab, setTab] = useState(firstTime ? '00' : '01');
  const [seen, setSeen] = useState(() => d2Load(D2K.seen));
  const [readLayers, setReadLayers] = useState(() => d2Load(D2K.read));
  const paneRef = useRef(null);

  useEffect(() => { try { sessionStorage.setItem('iba.d2.title', '1'); } catch (e) {} }, []);
  useEffect(() => {
    setSeen(prev => {
      if (prev.has(tab)) return prev;
      const next = new Set(prev); next.add(tab); d2Save(D2K.seen, next);
      return next;
    });
    if (paneRef.current) paneRef.current.scrollTop = 0;
  }, [tab]);

  // 층별 해제 — 아래 층부터 차례로. 조건은 D2_RESTRICT_RULES 한 곳에서 정한다
  const rules = window.D2_RESTRICT_RULES;
  const openLayers = useMemo(() => {
    const st = { seenTabs: seen, readLayers, now: new Date() }, out = new Set();
    for (let n = 1; n <= 5; n++) { if (rules[n] && rules[n](st)) out.add(n); else break; }
    return out;
  }, [seen, readLayers]);

  // 새로 열린 층은 한 번만 알린다
  useEffect(() => {
    const told = d2Load(D2K.told);
    const fresh = [...openLayers].filter(n => !told.has(n));
    if (!fresh.length) return;
    fresh.forEach(n => told.add(n)); d2Save(D2K.told, told);
    const top = Math.max(...fresh);
    if (openLayers.size >= 5) window.VESTIGIA.say('V-ZN-014');
    else window.VESTIGIA.say('V-ZN-013', { n: top });
    if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('transition');
  }, [openLayers]);

  // 제한 열람이 잠긴 채로 10을 열면 — V-ZN-012
  useEffect(() => { if (tab === D2_RESTRICT_TAB && openLayers.size === 0) window.VESTIGIA.say('V-ZN-012'); }, [tab]);

  // 벽 주해 · 서고 도면 절이 보이면 한 번 알린다 (탭을 다시 열면 다시)
  useEffect(() => {
    if (!paneRef.current || typeof IntersectionObserver === 'undefined') return;
    const hs = [...paneRef.current.querySelectorAll('h2, h3')].filter(h => D2_V_SECTIONS[h.textContent.trim()]);
    if (!hs.length) return;
    const io = new IntersectionObserver((ents) => ents.forEach(en => {
      if (!en.isIntersecting) return;
      io.unobserve(en.target);
      window.VESTIGIA.say(D2_V_SECTIONS[en.target.textContent.trim()]);
    }), { root: paneRef.current, threshold: 0 });
    hs.forEach(h => io.observe(h));
    return () => io.disconnect();
  }, [tab]);

  // 열린 층을 끝까지 읽으면(층 끝 표지가 보이면) 열람한 것으로 친다
  useEffect(() => {
    if (tab !== D2_RESTRICT_TAB || !paneRef.current) return;
    const marks = paneRef.current.querySelectorAll('[data-layer-end]');
    if (!marks.length || typeof IntersectionObserver === 'undefined') return;
    const io = new IntersectionObserver((ents) => {
      ents.forEach(en => {
        if (!en.isIntersecting) return;
        const n = +en.target.getAttribute('data-layer-end');
        setReadLayers(prev => {
          if (prev.has(n)) return prev;
          const next = new Set(prev); next.add(n); d2Save(D2K.read, next);
          return next;
        });
      });
    }, { root: paneRef.current, threshold: 0 });   // 층 끝 표지가 조금이라도 보이면 끝까지 읽은 것
    marks.forEach(m => io.observe(m));
    return () => io.disconnect();
  }, [tab, openLayers]);

  const cur = tabs.find(t => t.num === tab) || tabs[0];
  const isRestrict = tab === D2_RESTRICT_TAB;
  const layerBars = [92, 78, 88, 64, 83, 47];

  return (
    <div className="iba-about" role="dialog" aria-modal="true" aria-label="제2국 열람 문서" onClick={onClose}>
      <div className="d2doc" onClick={(e) => e.stopPropagation()}>
        <div className="d2doc__head">
          <span className="d2doc__title">▸ 국제기록보존기구 제2국 · 기구 총람</span>
          <span className="d2doc__id">D2-0000-0000 · 제15판 · 취급주의</span>
          <button className="iba-about__close" onClick={onClose} aria-label="닫기">✕</button>
        </div>

        <div className="d2doc__body">
          <nav className="d2doc__tabs" aria-label="문서 탭">
            {tabs.map(t => {
              const restrict = t.num === D2_RESTRICT_TAB;
              const lock = restrict && openLayers.size === 0;
              return (
                <button key={t.num}
                  className={`d2doc__tab ${tab === t.num ? 'is-on' : ''} ${lock ? 'is-locked' : ''} ${seen.has(t.num) ? 'is-seen' : ''}`}
                  onClick={() => setTab(t.num)}
                  title={restrict ? `제한 열람 · ${openLayers.size} / 5층 해제` : undefined}>
                  <span className="n">{t.num}</span>
                  <span className="l">{t.label}</span>
                  {restrict && <span className="lk">{lock ? '⊘' : `${openLayers.size}/5`}</span>}
                </button>
              );
            })}
          </nav>

          {/* 본문 — 발해 기록 문서와 같은 스캔 문서 연출 */}
          <div className="d2doc__pane" ref={paneRef}>
            <article className="docx-page d2-paper" key={tab}>
              <span className="docx-scan" aria-hidden="true"/>
              <header className="docx-meta">
                <span>국제기록보존기구 제2국 · 기구 총람</span>
                <span>문서 D2-0000-0000-{cur ? cur.num : '00'} · 제15판</span>
              </header>
              <div className="docx-head">
                <div className="docx-head__kind">
                  <span className="docx-head__no">{cur ? cur.num : '00'}</span>
                  <span className="docx-head__txt"><b>기구 총람</b><small>DIRECTORATE II</small></span>
                </div>
                <div className="docx-head__node">
                  <h2>{cur ? cur.label : ''}</h2>
                  <div>D2-0000-0000 · DENDRO 수록 문서</div>
                </div>
                <div className="docx-head__mark">
                  <IbaSeal kind="internal" color="#2b5e40" bg="#e8e5dc" className="docx-seal"/>
                  <div className="docx-stamp">{isRestrict ? '제한 열람' : '취급 주의'}<small>{isRestrict ? 'RESTRICTED' : 'CONFIDENTIAL'}</small></div>
                </div>
              </div>
              <div className="d2doc__art" dangerouslySetInnerHTML={{ __html: cur ? cur.html : '' }}/>
              {isRestrict && (cur.layers || []).map(L => {
                const open = openLayers.has(L.n);
                return (
                  <section key={L.n} className={`d2-layer ${open ? 'is-open' : 'is-sealed'}`}>
                    <h3 className="d2-h">제한 열람 제{L.n}층 · {L.title}
                      <span className="d2-layer__st">{open ? (readLayers.has(L.n) ? '열람함' : '열람 가능') : '봉인'}</span>
                    </h3>
                    {open ? <>
                      <div className="d2doc__art" dangerouslySetInnerHTML={{ __html: L.html }}/>
                      <span className="d2-layer__end" data-layer-end={L.n} aria-hidden="true"/>
                    </> : (
                      <div className="d2-layer__sealed" title={D2_REDACT_TIP} aria-label={D2_REDACT_TIP} onClick={() => { window.VESTIGIA.say('V-ZN-012'); if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('denied'); }}>
                        {layerBars.map((w, i) => <span key={i} className="d2-redact d2-layer__bar" style={{ width: w + '%' }}/>)}
                      </div>
                    )}
                  </section>
                );
              })}
              <footer className="docx-foot">— {tabs.findIndex(t => t.num === tab) + 1} / {tabs.length} —</footer>
            </article>
          </div>
        </div>

        <div className="d2doc__foot">
          <VLine className="d2doc__v"/>
          <span>DENDRO v2.4 · 최종 갱신 1987</span>
        </div>
      </div>
    </div>
  );
}

function TopBar({ accessMode = 'researcher', onAccessMode } = {}) {
  const [time, setTime] = useState(new Date());
  // 기관 안내 — 인장을 누르면 뜨는 플로팅 창
  const [about, setAbout] = useState(false);
  const openAbout = () => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('open'); setAbout(true); };
  const closeAbout = () => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('close'); setAbout(false); };
  window.useEscLayer(about, closeAbout);
  useEffect(() => { const id = setInterval(() => setTime(new Date()), 1000); return () => clearInterval(id); }, []);

  /* ── 지속 채널 상태 — 배경음악·앰비언트 모두 기록줄기 화면이 뜰 때 함께 자동 재생.
        사용자가 끈 채널(musOn/ambOn=false 저장)은 그 세션에서 다시 자동 재생하지 않는다.
        설정은 sessionStorage에 저장해 화면 전환(REBOOT 등)에도 유지된다. ── */
  const load = (k, d) => {
    try { const v = sessionStorage.getItem('iba.aud.' + k); return v === null ? d : JSON.parse(v); }
    catch (e) { return d; }
  };
  const save = (k, v) => { try { sessionStorage.setItem('iba.aud.' + k, JSON.stringify(v)); } catch (e) {} };

  const [open, setOpen]   = useState(false);
  const [ambOn, setAmbOn] = useState(() => !!(window.DENDRO_AUDIO && window.DENDRO_AUDIO.state().ambient));
  const [musOn, setMusOn] = useState(() => !!(window.DENDRO_AUDIO && window.DENDRO_AUDIO.state().music));
  const [vMaster, setVMaster] = useState(() => load('master', 0.70));
  const [vAmb, setVAmb]       = useState(() => load('ambient', 0.55));
  const [vMus, setVMus]       = useState(() => load('music', 0.62));
  const [density, setDensity] = useState(() => load('density', 0.5));

  /* 저장된 음량을 엔진에 반영. 엔진이 아직 기동 전이면 값만 보관되고
     첫 사용자 조작 때 적용된다. */
  const pushVolumes = useCallback(() => {
    const A = window.DENDRO_AUDIO; if (!A) return;
    A.volume('master', vMaster); A.volume('ambient', vAmb);
    A.volume('music', vMus);     A.density(density);
  }, [vMaster, vAmb, vMus, density]);
  useEffect(() => { pushVolumes(); }, [pushVolumes]);
  useEffect(() => {
    const A = window.DENDRO_AUDIO;
    if (!A) return;
    pushVolumes();
    if (window.IBA_LECTURE && window.IBA_LECTURE.on()) return;   // 강의 모드에서는 자동 재생하지 않는다
    if (load('musOn', true) && !A.state().music) setMusOn(!!A.music(true));
    if (load('ambOn', true) && !A.state().ambient) setAmbOn(!!A.ambient(true));
  }, []);

  /* 강의 모드 — 배경음악·앰비언트를 stopAll()로 멈춘다(효과음은 유지).
     해제해도 자동으로 다시 켜지 않는다 — 사용자가 음향 패널에서 다시 켠다 (AUDIO_INTEGRATION 4항).
     사용자가 저장한 재생 설정(sessionStorage)은 바꾸지 않는다. 인장(기관 안내)도 열리지 않는다. */
  const [lecture, setLecture] = useState(() => !!(window.IBA_LECTURE && window.IBA_LECTURE.on()));
  useEffect(() => {
    const onLecture = (e) => {
      const on = !!(e.detail && e.detail.on);
      setLecture(on);
      const A = window.DENDRO_AUDIO; if (!A) return;
      if (on) { A.stopAll(); setMusOn(false); setAmbOn(false); }
    };
    window.addEventListener('iba:lecture', onLecture);
    return () => window.removeEventListener('iba:lecture', onLecture);
  }, [pushVolumes]);

  /* 재생 중인 채널이 있을 때만 패널 밖 클릭으로 닫는다 */
  useEffect(() => {
    if (!open) return;
    const onDown = (e) => { if (!e.target.closest('.topbar__volume')) setOpen(false); };
    window.addEventListener('pointerdown', onDown);
    return () => { window.removeEventListener('pointerdown', onDown); };
  }, [open]);
  window.useEscLayer(open, () => setOpen(false));

  const toggleAmb = () => {
    const A = window.DENDRO_AUDIO; if (!A) return;
    pushVolumes();
    const on = A.ambient(!A.state().ambient);
    setAmbOn(!!on); save('ambOn', !!on);
    window.VESTIGIA.say(on ? 'V-SYS-013' : 'V-SYS-014');
  };
  const toggleMus = () => {
    const A = window.DENDRO_AUDIO; if (!A) return;
    pushVolumes();
    const on = A.music(!A.state().music);
    setMusOn(!!on); save('musOn', !!on);
    window.VESTIGIA.say(on ? 'V-SYS-013' : 'V-SYS-014');
  };
  const setVol = (ch, v, setter, key) => {
    setter(v); save(key, v);
    if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.volume(ch, v);
  };
  const onDensity = (v) => {
    setDensity(v); save('density', v);
    if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.density(v);
  };

  const stamp = time.toISOString().slice(0,19).replace('T',' ');
  const anyOn  = ambOn || musOn;
  const volPct = `${Math.round(vMaster * 100)}%`;
  return (
    <>
    <header className="topbar">
      <div className="topbar__brand">
        {/* IBA 제2국 내부판 인장 — IBA 마크 좌측 (원본: assets/w1/iba_emblem_final2.html) */}
        <button className="topbar__emblem" onClick={() => { if (!lecture) openAbout(); else window.VESTIGIA.say('V-ER-002'); }}
                aria-disabled={lecture}
                title={lecture ? '강의 모드 — 기관 안내 잠김' : 'IBA 국제기록보존기구 제2국 — 기관 안내 열기'} aria-label="기관 안내 열기">
          <IbaSeal kind="internal" bg="var(--panel)" style={{ width: 54, height: 54, display: 'block' }}/>
        </button>
        <div className="topbar__mark" aria-hidden="true">IB<span>A</span></div>
        <div className="topbar__brand-text">
          <div className="topbar__title">INTERNATIONAL BUREAU OF ARCHIVES</div>
          <div className="topbar__sub" onPointerEnter={() => window.VESTIGIA.say('V-SYS-016')}><span>// 국제기록보존기구 · DENDRO v2.4</span><span>· 최종 갱신 1987 · 반입승인 대기 중</span></div>
        </div>
      </div>
      {/* 접속 구분 — 왼쪽 연구원 접속(기존 화면 그대로) · 오른쪽 대응반 접속(위험 노드 노출) */}
      <nav className="topbar__systabs" role="tablist" aria-label="접속 구분">
        <button
          role="tab"
          aria-selected={accessMode === 'researcher'}
          className={`systab ${accessMode === 'researcher' ? 'systab--on' : ''}`}
          onClick={() => onAccessMode && onAccessMode('researcher')}
          title="연구원 접속 — 기록 열람"
        >
          <span className="systab__k">[RS]</span>
          <span className="systab__l">RESEARCH</span>
          <span className="systab__ko">연구원 접속</span>
        </button>
        <button
          role="tab"
          aria-selected={accessMode === 'response'}
          className={`systab systab--response ${accessMode === 'response' ? 'systab--on' : ''}`}
          onClick={() => onAccessMode && onAccessMode('response')}
          title="대응반 접속 — LUMINA 왜곡 위험 노드 노출"
        >
          <span className="systab__k">[DA-R]</span>
          <span className="systab__l">RESPONSE</span>
          <span className="systab__ko">대응반 접속</span>
        </button>
      </nav>
      <div className="topbar__meta">
        <span><b>BUREAU</b><span>IBA·RO-4/KR-04</span></span>
        <span><b>CASE NO.</b><span>0xANC·0476</span></span>
        <span><b>STAMP</b><span className="topbar__stamp" style={{fontFeatureSettings:'"tnum"'}}><span>{stamp.slice(0, 10)}</span><span>{stamp.slice(11)}</span></span></span>
        <span className={`topbar__sync ${accessMode === 'response' ? 'is-alert' : ''}`}><b><span className="dot"></span>DISTORTION</b><span>{accessMode === 'response' ? 'DETECTED' : 'NONE'}</span></span>
        <div className="topbar__ctl">
          <a className="topbar__back" href="#" onClick={(e) => { e.preventDefault(); if (window.__tmbReboot) window.__tmbReboot(); }} title="대문으로 돌아가기">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="square"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            <span>REBOOT</span>
          </a>
          {/* 지속 채널(앰비언트·배경음악) 컨트롤 — REBOOT 아래 */}
          <div
            className={`topbar__volume ${anyOn ? '' : 'topbar__volume--muted'}`}
            title={anyOn ? `재생 중 · 전체 음량 ${volPct}` : '지속 채널 꺼짐 — 클릭하여 설정'}
          >
            <button
              className="topbar__volume__btn"
              onClick={() => setOpen(o => !o)}
              aria-label="음향 설정"
              aria-expanded={open}
              title="앰비언트 · 배경음악 설정"
            >
              {!anyOn ? (
                // 정지 — 스피커 + X
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M11 5 6 9H2v6h4l5 4Z"/>
                  <line x1="22" y1="9" x2="16" y2="15"/>
                  <line x1="16" y1="9" x2="22" y2="15"/>
                </svg>
              ) : vMaster < 0.35 ? (
                // 저음량 — 스피커 + 작은 웨이브
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M11 5 6 9H2v6h4l5 4Z"/>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
              ) : (
                // 고음량 — 스피커 + 큰 웨이브
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M11 5 6 9H2v6h4l5 4Z"/>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                </svg>
              )}
            </button>
            <input
              type="range" min="0" max="1" step="0.05"
              value={vMaster}
              onChange={(e) => setVol('master', parseFloat(e.target.value), setVMaster, 'master')}
              className="topbar__volume__slider"
              style={{'--vol-pct': volPct}}
              aria-label="전체 음량"
            />

            {open && (
              <div className="iba-aud" onPointerDown={(e) => e.stopPropagation()}>
                <div className="iba-aud__hd">▸ 관내 음향 · AUDIO</div>

                <div className="iba-aud__ch">
                  <button className={`iba-aud__tg ${ambOn ? 'is-on' : ''}`} onClick={toggleAmb}
                          aria-pressed={ambOn}>앰비언트</button>
                  <input type="range" min="0" max="1" step="0.05" value={vAmb}
                    onChange={(e) => setVol('ambient', parseFloat(e.target.value), setVAmb, 'ambient')}
                    className="topbar__volume__slider"
                    style={{'--vol-pct': `${Math.round(vAmb*100)}%`, width:'68px'}}
                    aria-label="앰비언트 음량"/>
                  <span className="iba-aud__vl">{Math.round(vAmb*100)}</span>
                </div>

                <div className="iba-aud__ch">
                  <button className={`iba-aud__tg ${musOn ? 'is-on' : ''}`} onClick={toggleMus}
                          aria-pressed={musOn}>배경음악</button>
                  <input type="range" min="0" max="1" step="0.05" value={vMus}
                    onChange={(e) => setVol('music', parseFloat(e.target.value), setVMus, 'music')}
                    className="topbar__volume__slider"
                    style={{'--vol-pct': `${Math.round(vMus*100)}%`, width:'68px'}}
                    aria-label="배경음악 음량"/>
                  <span className="iba-aud__vl">{Math.round(vMus*100)}</span>
                </div>

                <div className="iba-aud__row">
                  <span className="iba-aud__lb">밀도</span>
                  <input type="range" min="0" max="1" step="0.05" value={density}
                    onChange={(e) => onDensity(parseFloat(e.target.value))}
                    className="topbar__volume__slider"
                    style={{'--vol-pct': `${Math.round(density*100)}%`, width:'68px'}}
                    aria-label="앰비언트 사건 밀도"/>
                  <span className="iba-aud__vl">{Math.round(density*100)}</span>
                </div>

                <div className="iba-aud__ft">
                  지속 채널은 접속과 함께 가동됩니다.<br/>본 설정은 갱신되지 않았습니다.
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </header>

    {about && <D2Doc onClose={closeAbout}/>}
    </>
  );
}

const TRACK_TABS = [
  { id: 'korea',    ko: '한국',           en: 'KOREA' },
  { id: 'eastasia', ko: '동아시아',        en: 'EAST ASIA' },
  { id: 'west',     ko: '유럽·미주',       en: 'EUROPE & AMERICAS' },
  { id: 'westasia', ko: '서아시아·인도',   en: 'W·ASIA · INDIA' }
];
const TRACK_KO = { korea:'한국', eastasia:'동아시아', west:'유럽·미주', westasia:'서아시아·인도' };

/* 연관 기록 대조 결과 창 — 검색창 바로 아래. 행을 누르면 그 기록줄기로 가서 노드를 고른다 */
const TRACK_RO = { korea: 'RO-4', eastasia: 'RO-2', west: 'RO-1', westasia: 'RO-3' };
function SemanticPop({ sem, st, onPick, onClose }) {
  const evs = TIMELINE_DATA.events;
  const busy = sem.status === 'run';
  const dl = busy && st.state !== 'ready' && st.progress < 0.999;
  return (
    <div className="sempop" role="dialog" aria-label="연관 기록 대조">

        <span><b>▸ 연관 기록 대조</b> · SEMANTIC</span>

      </div>
      <div className="sempop__q">「{sem.q}」</div>
      {busy && (
        <div className="sempop__wait">
          <div className="sempop__wait-t">
            {dl ? <>색인 모듈 반입 중 · {Math.round(st.progress * 100)}%</> : '연관 기록 대조 중'}
            <span className="sempop__dots" aria-hidden="true"><i/><i/><i/></span>
          </div>
          {dl && <div className="sempop__bar"><i style={{ width: `${Math.round(st.progress * 100)}%` }}/></div>}
          {dl && <div className="sempop__note">최초 1회 · 약 118MB · 이후 단말에 보관</div>}
        </div>
      )}
      {sem.status === 'error' && <div className="sempop__empty is-bad">외부 통신망에 연결할 수 없습니다. 색인 모듈을 받지 못했습니다.</div>}
      {sem.status === 'done' && !sem.rows.length && <div className="sempop__empty">연관 기록 없음</div>}
      {sem.status === 'done' && sem.rows.length > 0 && (
        <ul className="sempop__list">
          {sem.rows.map(r => {
            const e = evs.find(x => x.id === r.id); if (!e) return null;
            return (
              <li key={r.id}>
                <button className="sempop__row" onClick={() => onPick(r.id)}>
                  <span className="sempop__meta">{TRACK_RO[e.track] || ''} · {window.eventYearText(e)}</span>
                  <span className="sempop__label">{e.label}</span>
                  <span className="sempop__lv" aria-label={`연관도 ${r.level}/5`}>
                    {[1, 2, 3, 4, 5].map(i => <i key={i} className={i <= r.level ? 'on' : ''}/>)}
                  </span>
                </button>
              </li>
            );
          })}
        </ul>
      )}
      {sem.status === 'done' && <div className="sempop__foot">기록에 있는 것만 찾는다 · 없는 내용은 만들지 않는다</div>}
    </div>
  );
}

function SubNav({ tracks, setTracks, query, setQuery, focusedTrack, onFocusTrack, accessMode = 'researcher' }) {
  const toggle = (k) => setTracks({ ...tracks, [k]: !tracks[k] });

  const visibleCount = TIMELINE_DATA.events.filter(e => tracks[e.track] && (!focusedTrack || e.track === focusedTrack) && (!e.focusOnly || focusedTrack === e.track)).length;
  const totalCount = TIMELINE_DATA.events.length;
  const activeCount = Object.values(tracks).filter(Boolean).length;
  // 대응반 접속 — 상황판을 왜곡 대응 모드로 바꾼다
  const resp = accessMode === 'response';
  const riskCount = TIMELINE_DATA.events.filter(e => e.risk).length;

  // 검색어 매칭 카운트 — 활성 트랙·포커스 조건도 함께 적용
  const matchCount = React.useMemo(() => {
    const q = (query || '').trim().toLowerCase();
    if (!q) return 0;
    return TIMELINE_DATA.events.filter(e => {
      if (!tracks[e.track]) return false;
      if (focusedTrack && e.track !== focusedTrack) return false;
      if (e.focusOnly && focusedTrack !== e.track) return false;
      return [e.label, e.en, e.state, e.theme, String(e.year), e.body]
        .some(v => v && String(v).toLowerCase().includes(q));
    }).length;
  }, [query, tracks, focusedTrack]);

  /* 연관 기록 대조 — 검색창에서 Enter. 브라우저 안 문장 모델로 뜻이 가까운 기록을 고른다(semantic-search.js).
     글을 지어내지 않고 이미 있는 기록만 보여 준다. 처음 한 번은 색인 모듈(약 118MB)을 받는다 */
  const [sem, setSem] = useState(null);   // { q, status: 'run' | 'done' | 'error', rows }
  const [semSt, setSemSt] = useState(() => ({ state: window.IBA_SEMANTIC ? window.IBA_SEMANTIC.state : 'error', progress: 0 }));
  const searchRef = useRef(null);
  useEffect(() => {
    const h = (e) => setSemSt(e.detail);
    window.addEventListener('iba:semantic', h);
    return () => window.removeEventListener('iba:semantic', h);
  }, []);
  const runSem = () => {
    const q = (query || '').trim();
    if (!q || !window.IBA_SEMANTIC) return;
    if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('key');
    setSem({ q, status: 'run', rows: [] });
    window.IBA_SEMANTIC.search(q, 6).then(
      (rows) => setSem(s => (s && s.q === q ? { q, status: 'done', rows } : s)),
      () => { setSem(s => (s && s.q === q ? { q, status: 'error', rows: [] } : s)); window.VESTIGIA.say('V-ER-009'); }
    );
  };
  const pickSem = (id) => {
    const ev = TIMELINE_DATA.events.find(e => e.id === id);
    setSem(null);
    setQuery('');
    if (ev && !tracks[ev.track]) setTracks({ ...tracks, [ev.track]: true });
    setTimeout(() => window.__tmbJumpToNode && window.__tmbJumpToNode(id), 30);
  };
  window.useEscLayer(!!sem, () => setSem(null));
  useEffect(() => {
    if (!sem) return;
    const off = (e) => { if (searchRef.current && !searchRef.current.contains(e.target)) setSem(null); };
    document.addEventListener('pointerdown', off);
    return () => document.removeEventListener('pointerdown', off);
  }, [!!sem]);

  // 검색 결과 알림 — 입력이 멈추면 한 번 (V-RD-006 [n]건 / V-RD-007)
  useEffect(() => {
    if (!(query || '').trim()) return;
    const t = setTimeout(() => { if (matchCount > 0) window.VESTIGIA.say('V-RD-006', { n: matchCount }); else window.VESTIGIA.say('V-RD-007'); }, 700);
    return () => clearTimeout(t);
  }, [query, matchCount]);

  // Branch endpoints align with 4 cell centers (cells fill 144px tall column → centers at 18,54,90,126)
  const BRANCH_YS = [18, 54, 90, 126];

  return (
    <div className="subnav subnav--tracks">
      <div className="subnav__leftcol">
      <div className="trackbranch" role="tablist" aria-label="지역국 선택">
        <div className="trackbranch__animwrap">
          <div className="trackbranch__caption">
            <span className="trackbranch__caption-k">▸ ORIGIN · 지역국</span>
            <span className="trackbranch__caption-l">REGIONAL OFFICES</span>
          </div>
          <svg className="trackbranch__svg" viewBox="0 0 160 144" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <filter id="snav-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="1.6" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <linearGradient id="snav-trunk" x1="0" x2="1">
                <stop offset="0" stopColor="#2fae5e" stopOpacity="0.2"/>
                <stop offset=".5" stopColor="#2fae5e" stopOpacity="1"/>
                <stop offset="1" stopColor="#56cf85" stopOpacity="1"/>
              </linearGradient>
            </defs>
            {/* origin hourglass */}
            <g className="tb-origin" transform="translate(28 72)" filter="url(#snav-glow)">
              <circle r="13" fill="#040806" stroke="#2fae5e" strokeWidth="1" opacity="0.55"/>
              {/* 제2국 인장의 각면형 모래시계 (색은 기존 그대로) */}
              <g transform="scale(0.26)">
                <rect x="-26" y="-34" width="52" height="9" fill="#2fae5e"/>
                <rect x="-26" y="25" width="52" height="9" fill="#2fae5e"/>
                <path d="M -21 -22 H 21 L 8 -3 H -8 Z" fill="#56cf85"/>
                <path d="M -8 3 H 8 L 21 22 H -21 Z" fill="#56cf85"/>
                <rect x="-4" y="-25" width="8" height="50" fill="#2fae5e"/>
              </g>
            </g>
            {/* trunk */}
            <line className="tb-trunk" x1="28" y1="72" x2="64" y2="72"
                  stroke="url(#snav-trunk)" strokeWidth="2.5" strokeLinecap="round"
                  filter="url(#snav-glow)"/>
            {/* 4 branches fanning out to each cell */}
            {BRANCH_YS.map((y, i) => {
              const t = TRACK_TABS[i];
              const focused = focusedTrack === t.id;
              const dimmed = focusedTrack && focusedTrack !== t.id;
              const pathD = `M 64 72 C 100 72, 108 ${y}, 162 ${y}`;
              return (
                <g key={i} className={`tb-branchgroup tb-branchgroup--${i} ${focused ? 'is-focused' : ''} ${dimmed ? 'is-dimmed' : ''}`}>
                  <path className={`tb-branch tb-branch--${i}`}
                        d={pathD}
                        fill="none" stroke="#2fae5e"
                        strokeWidth={focused ? 2.4 : 1.7}
                        strokeLinecap="round" filter="url(#snav-glow)"/>
                  {/* pulse dot that travels along the branch — repeats forever */}
                  <circle className={`tb-pulse tb-pulse--${i}`} r="2.4" fill="#56cf85">
                    <animateMotion dur="3.6s" repeatCount="indefinite"
                                   begin={`${i * 0.45}s`}
                                   path={pathD}/>
                    <animate attributeName="opacity"
                             values="0;1;1;1;0"
                             keyTimes="0;0.1;0.5;0.9;1"
                             dur="3.6s" repeatCount="indefinite"
                             begin={`${i * 0.45}s`}/>
                  </circle>
                </g>
              );
            })}
          </svg>
        </div>

        <div className="trackseg">
          {TRACK_TABS.map((t, i) => {
            const visible = tracks[t.id];
            const focused = focusedTrack === t.id;
            const dimmed = focusedTrack && focusedTrack !== t.id;
            return (
              <button
                key={t.id}
                className={`trackseg__cell ${visible ? 'is-visible' : 'is-hidden'} ${focused ? 'is-focused' : ''} ${dimmed ? 'is-dimmed' : ''}`}
                style={{'--cell-i': i}}
                onClick={(e) => {
                  if (e.shiftKey || e.altKey) toggle(t.id);
                  else onFocusTrack(focused ? null : t.id);
                }}
                onDoubleClick={() => toggle(t.id)}
                title="클릭: 포커스 토글 · Shift+클릭: 표시/숨김"
                aria-pressed={focused}
              >
                <span className="trackseg__inlet" aria-hidden="true">▸</span>
                <span className="trackseg__check">{focused ? '◆' : visible ? '◇' : '·'}</span>
                <span className="trackseg__body">
                  <span className="trackseg__ko">{t.ko}</span>
                  <span className="trackseg__en">{t.en}</span>
                </span>
                <span className="trackseg__idx" title="지역국 코드">{({ west: 'RO-1', eastasia: 'RO-2', westasia: 'RO-3', korea: 'RO-4' })[t.id] || String(i+1).padStart(2,'0')}</span>
              </button>
            );
          })}
        </div>
      </div>
      <window.BroadcastBox/>
      </div>

      {/* ===== 가운데 컬럼: 접속자(연구원) HUD — 얼굴 스캔 · 데이터 · 기록줄기 무결성 ===== */}
      <div className="subnav__operator" aria-label="접속자 단말기 상황판">
        {/* (1) 접속자 얼굴 — 윤곽선 바이오 스캔 */}
        <div className="op-sect op-face">
          <div className="op-sect__cap"><span>{resp ? '대응 요원' : '접속자'}</span><b>{resp ? 'RESPONSE' : 'OPERATOR'}</b></div>
          <div className="op-face__frame">
            <span className="op-face__brk op-face__brk--tl"/>
            <span className="op-face__brk op-face__brk--tr"/>
            <span className="op-face__brk op-face__brk--bl"/>
            <span className="op-face__brk op-face__brk--br"/>
            <span className="op-face__scan"/>
            <svg className="op-face__svg" viewBox="0 0 100 122" fill="none"
                 stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              {/* 상반신 겉 윤곽 (머리·목·어깨) — 이목구비 없이 외곽선 한 줄 */}
              <path d="M50 10
                       C 61 10, 70 20, 70 33
                       C 70 44, 65 52, 58 56
                       C 57 60, 57 62, 60 64
                       C 74 68, 88 82, 90 122
                       L 10 122
                       C 12 82, 26 68, 40 64
                       C 43 62, 43 60, 42 56
                       C 35 52, 30 44, 30 33
                       C 30 20, 39 10, 50 10 Z"/>
            </svg>
          </div>
          <div className="op-face__tag"><span className="op-dot"/>명부 대조 확인</div>
        </div>

        {/* (2) 접속자 데이터 */}
        <div className="op-sect op-data">
          <div className="op-sect__cap"><span>{resp ? '대응반 데이터 · ' : '접속자 데이터 · '}<b>{resp ? 'RESPONSE' : 'ENTITY'}</b></span><span>{window.agentDept(resp)}</span></div>
          <div className="op-row"><span className="k">등록 코드</span><span className="v">{window.agentCode(resp)}</span></div>
          <div className="op-row"><span className="k">소속</span><span className="v">{resp ? '제4지역국 · 왜곡 대응반' : '제4지역국 · 한국 지부'}</span></div>
          <div className="op-row"><span className="k">직급</span><span className="v ok">{window.agentRank(resp)}</span></div>
          <div className="op-row"><span className="k">열람 등급</span><span className="v">{resp ? '폐가 출입' : '상시'}</span></div>
          <div className="op-row"><span className="k">명부 등재</span><span className="v ok">{window.isGuestAgent() ? (resp ? '미등재 · LUMINA 감시' : '미등재') : (resp ? '확인 · LUMINA 감시' : '확인')}</span></div>
        </div>

        {/* (3) 기록줄기 단말기 접속 & 무결성 */}
        <div className="op-sect op-stab">
          <div className="op-sect__cap"><span>{resp ? '기록 왜곡 감시 · ' : '기록줄기 무결성 · '}<b>{resp ? 'DISTORTION' : 'INTEGRITY'}</b></span><span className="v ok" style={{display:'inline-flex',alignItems:'center',gap:5}}><span className="op-dot"/>{resp ? 'ALERT' : 'NOMINAL'}</span></div>
          <div className="op-row"><span className="k">출입 관측소</span><span className="v ok">{window.IBA_AGENT.site + (resp ? ' · 대응 개방' : ' · 개방')}</span></div>
          {resp ? <>
          <div className="op-mrow">
            <span className="k">탐지 DETECT</span>
            <span className="op-bars" aria-label={`왜곡 탐지 ${riskCount}건`}>
              <i className="on"/><i className="on"/><i className="on"/><i className="on"/><i className="on"/>
            </span>
            <span className="vnum">{`${riskCount}건`}</span>
          </div>
          <div className="op-mrow">
            <span className="k">노출 EXPOSED</span>
            <span className="op-meter"><span className="op-meter__fill" style={{width: `${Math.max(6, (riskCount / Math.max(1, totalCount)) * 100).toFixed(1)}%`}}/></span>
            <span className="vnum">{`${riskCount}/${totalCount}`}</span>
          </div>
          <div className="op-mrow">
            <span className="k">경보 ALERT</span>
            <span className="op-var"><span className="op-var__mk" style={{left: '88%'}}/></span>
            <span className="vnum ok" style={{color: 'var(--red)'}}>경보</span>
          </div>
          </> : <>
          {/* 연구원 접속 — 제2국 체계 용어로 (정본: 기송관 · 도착층 · 구조 변형) */}
          <div className="op-row"><span className="k">기송관</span><span className="v ok">정상</span></div>
          <div className="op-row"><span className="k">도착층</span><span className="v">지하 3층 · 19세기</span></div>
          <div className="op-row"><span className="k">구조 변형</span><span className="v ok">관측 없음</span></div>
          </>}
        </div>
      </div>

      <div className="subnav__rightcol">
        <div className="subnav__sidemeta">
          <div className="subnav__sidemeta-row">
            <span className="k">{resp ? '▸ IBA · 대응반 상황실' : '▸ IBA · 기록보관소'}</span>
          </div>
          <div className="subnav__sidemeta-row">
            <span className="k">ACTIVE</span>
            <span className="v">{activeCount} / 4 TRACKS</span>
          </div>
          <div className="subnav__sidemeta-row">
            <span className="k">NODES</span>
            <span className="v">{visibleCount} / {totalCount}</span>
          </div>
          {/* 대응반 전용 줄 — 연구원 접속에서도 자리는 비워 두어 모드를 바꿔도 패널 높이가 같다 */}
          <div className="subnav__sidemeta-row" style={resp ? null : { visibility: 'hidden' }} aria-hidden={!resp}>
            <span className="k">RISK</span>
            <span className="v" style={{color:'var(--red)'}}>{riskCount} 건 · LUMINA</span>
          </div>
          <div className="subnav__sidemeta-row">
            <span className="k">RANGE</span>
            <span className="v">고대 → 현대</span>
          </div>
          <div className="subnav__sidemeta-row">
            <span className="k">FOCUS</span>
            <span className="v">{focusedTrack ? (TRACK_KO[focusedTrack] || focusedTrack) : '— ALL —'}</span>
          </div>
        </div>

        <div className="subnav__search" ref={searchRef}>
          <Icon.Search style={{color:'var(--amber)'}}/>
          <input
            placeholder="검색 · ⏎ 연관 대조"
            title="글자로 찾기 · Enter를 누르면 뜻이 가까운 기록을 찾는다(연관 기록 대조)"
            value={query}
            onChange={(e) => { setQuery(e.target.value); if (sem) setSem(null); }}
            onKeyDown={(e) => { if (e.key === 'Enter' && !e.nativeEvent.isComposing) { e.preventDefault(); runSem(); } }}
          />
          {query && (
            <>
              <span className={`subnav__search__count ${matchCount > 0 ? 'has-match' : ''}`}>
                {matchCount} 건
              </span>
              <button className="subnav__search__clear" onClick={() => { setQuery(''); setSem(null); }} aria-label="검색어 지우기" title="지우기">✕</button>
            </>
          )}
          {sem && <SemanticPop sem={sem} st={semSt} onPick={pickSem} onClose={() => setSem(null)}/>}
        </div>
      </div>
    </div>
  );
}

// ===== MEMORY DETAIL PANEL =====

function MemoryDetail({ event, onSync, onJumpTo, onClose, accessMode = 'researcher' }) {
  const isOpen = !!event;
  // Keep last-shown event during slide-out
  const [shown, setShown] = useState(event);
  useEffect(() => {
    if (event) setShown(event);
    else {
      const t = setTimeout(() => setShown(null), 400);
      return () => clearTimeout(t);
    }
  }, [event]);

  const e = shown;
  // 선택된 기록이 없으면 아무것도 그리지 않는다 — 연표가 오른쪽 끝까지 보이도록.
  // (패널은 연표 위에 겹쳐 뜨므로, 빈 상태를 띄워 두면 연표를 계속 가린다)
  if (!e) return null;

  const yearStr = window.eventYearText(e);
  const hasDb = !!(window.TIMELINE_DB && window.TIMELINE_DB[e.id]);
  const isRisk = accessMode === 'response' && !!e.risk;   // 위험 노드 — 대응반 접속 시에만 경고 노출
  return (
    <aside className={`detail detail--slide ${isOpen ? 'is-open' : ''} ${isRisk ? 'detail--risk' : ''}`}>
      <button className="detail__close" onClick={onClose} aria-label="닫기">✕</button>
      <div className="detail__corner-tl"/><div className="detail__corner-tr"/>
      <div className="detail__corner-bl"/><div className="detail__corner-br"/>

      <div className="detail__scroll">
      <div className="detail__id"><span className="detail__id-t">RECORD · {e.id.toUpperCase()} · {e.track.toUpperCase()}</span></div>
      {/* 큰 자리에 노드 이름, 아래 자리에 연도 (2026-10-09 사용자 요청 — 자리만 바꾸고 각 자리의 모양은 그대로) */}
      <div className={`detail__year detail__year--label detail__year--name ${String(e.label).length > 9 ? 'is-long' : ''}`}><span>{e.label}</span></div>
      <div className="detail__year-en">{e.en}</div>

      <div className="detail__label">{yearStr}</div>
      <div className="detail__en">{e.year < 0 ? 'BEFORE COMMON ERA' : 'COMMON ERA'}{window.eraOfYear ? ` · ${window.eraOfYear(e.year).en} · ${window.eraOfYear(e.year).ko}` : ''}</div>

      <div style={{display:'flex',gap:8,marginTop:14,flexWrap:'wrap'}}>
        {e.kind === 'turning' && <span className="badge badge--turn">◆ TURNING POINT</span>}
        {isRisk && <span className="badge badge--risk">▲ 위험 노드 · {e.risk.by}{e.risk.kind ? ` · ${e.risk.kind}` : ''}</span>}
        <span className="badge badge--theme">▸ {e.theme}</span>
        <span className="badge badge--state">{e.state}</span>
        {hasDb && (
          <span className="badge badge--db">DB · INDEXED</span>
        )}
      </div>

      <div className="detail__divider">▸ RECORD</div>
      <div className="detail__body">{window.redactText(e.body, window.TIMELINE_DB && window.TIMELINE_DB[e.id], 'body')}</div>

      {isRisk && (
        <div className="detail__risk" role="alert">
          <div className="detail__risk-head">▲ LUMINA 기록 왜곡 탐지{e.risk.kind ? ` · ${e.risk.kind}` : ''} · 위험도 {e.risk.level}</div>
          <div className="detail__risk-body">{e.risk.note}</div>
          <div className="detail__risk-foot"><b>원본 기록 근거</b> {e.risk.evidence}</div>
        </div>
      )}

      <div className="detail__actions">
        {e.linkTo ? (
          <button
            className="btn-sync btn-sync--link"
            onClick={() => onJumpTo && onJumpTo(e.linkTo)}
            aria-label="원줄기 연결"
            title={`${e.linkTo} 노드로 이동`}
          >
            <span className="btn-sync__pulse"></span>
            <span>↪ 원줄기 연결 · LINK TO ORIGIN</span>
          </button>
        ) : e.noSync ? null : (
          <button className="btn-sync" onClick={() => onSync && onSync(e.id)} aria-label="기록 열람">
            <span className="btn-sync__pulse"></span>
            <span>▸ 기록 열람 · VIEW RECORD</span>
          </button>
        )}
      </div>

      <div className="detail__meta">
        <div className="detail__meta-row">
          <div className="k">TRACK</div>
          <div className="v">{TRACK_KO[e.track] || e.track}</div>
        </div>
        <div className="detail__meta-row">
          <div className="k">STATE / 왕조</div>
          <div className="v">{e.state}</div>
        </div>
        <div className="detail__meta-row">
          <div className="k">THEME / 주제</div>
          <div className="v">{e.theme}</div>
        </div>
        <div className="detail__meta-row">
          <div className="k">CALL NO. / 청구 기호</div>
          <div className="v" style={{fontFamily:'var(--font-mono)',fontSize:12}}>{window.eventCallNo(e)}</div>
        </div>

<script type="text/babel">
/* global React, TIMELINE_DATA */
const { useState: useStateTC, useMemo: useMemoTC, useRef: useRefTC, useEffect: useEffectTC, useCallback: useCallbackTC } = React;

// ============================================================
// Timeline canvas (~4000 BCE – 현대, 4 tracks)
// Density-aware year → X mapping:
// Crowded periods are stretched; empty periods compressed.
// ============================================================
const YEAR_START = -4000;
const YEAR_END   = 2030;           // 현대까지
/* 선사 구간 — 기원전 4000년 이전. 수백만 년을 한 화면 안에 담기 위해 두 조각으로 나눈다
     · 약 450만 년 전 ~ 약 1만 년 전 : 로그 눈금 (「N만 년 전」)
     · 약 1만 년 전 ~ 기원전 4000년  : 선형 눈금 (BCE)
   연도는 음수 year 그대로 쓴다. 「N년 전」은 1950년 기준(BP)으로 환산한다: year = 1950 − N */
const BP_REF = 1950;
const PRE_BP_MAX = 4500000;                 // 약 450만 년 전 — 최초 인류(약 390만 년 전)보다 앞
const HOLO_START = BP_REF - 10000;          // 약 1만 년 전 = 기원전 8050년
const PRE_LOG_W = 1150, PRE_LIN_W = 560;    // 두 조각의 폭(px)
const PRE_W = PRE_LOG_W + PRE_LIN_W;
const PRE_START_YEAR = BP_REF - PRE_BP_MAX;
const YEAR_SPLIT = 900;            // 이 해까지는 기존 고대 배치를 그대로 쓴다
const PX_PER_YEAR_BASE = 1.6;      // 고대 구간 평균 폭(px/년)
// 900년 이후: 시대별 기본 폭(px/년) × 사건 밀도(±12년)
//   근현대처럼 짧은 기간에 사건이 몰린 구간은 넓게, 사건이 드문 구간은 좁게 편다
const ERA_PX_PER_YEAR = { ancient: 4.5, medieval: 4.5, earlymodern: 5, protomodern: 5, modern: 14, contemporary: 11 };  // 60% 축소에서도 밀집 구간 라벨이 들어가도록
// 밀도 반영 상한(±12년 안 사건 수) — 근대(개항~광복)는 한 해에 메인 노드가 여럿 몰려(1920년 5개 등) 더 넓게 편다.
// 떨어진 라벨은 모두 지시선으로 잇기 때문에 선이 지나갈 틈까지 필요해 근세·근대 태동기·현대도 조금 더 편다
const ERA_DENSITY_CAP = { earlymodern: 12, protomodern: 12, modern: 24, contemporary: 12 };

const TRACK_ORDER = ['korea', 'eastasia', 'west', 'westasia'];

function formatYear(y) {
  if (y < 0) return `${Math.abs(y)} BCE`;
  if (y === 0) return '1 CE';   // 0년은 없다 — 기원 원년 눈금
  return `${y} CE`;
}

// Build a cumulative lookup once at module load.
// For each sample year we compute local event-density and turn that
// into a per-year stretch factor; cumulative sum becomes our X axis.
const _yearLookup = (() => {
  // focusOnly(한국 줄기 포커스 전용) 노드도 밀도에 넣는다 — 포커스했을 때 삼국 시대 왕·사건 라벨이 들어갈 폭을 미리 둔다
  const all = (window.TIMELINE_DATA?.events || []).map(e => e.year);

  // ── 고대 (YEAR_START ~ YEAR_SPLIT): 기존 밀도 배치 그대로 ──
  // For each sample year we compute local event-density and turn that
  // into a per-year stretch factor; cumulative sum becomes our X axis.
  const ancientEv = all.filter(y => y < YEAR_SPLIT);
  const STEP = 5;                                       // resolution (years)
  const WINDOW = 75;                                    // ±years for density
  const TOTAL = YEAR_SPLIT - YEAR_START;
  const N = Math.ceil(TOTAL / STEP) + 1;
  const density = new Array(N);
  for (let i = 0; i < N; i++) {
    const y = YEAR_START + i * STEP;
    let c = 0;
    for (const ey of ancientEv) if (ey >= y - WINDOW && ey <= y + WINDOW) c++;
    density[i] = c;
  }
  // Map density to stretch factor.  Empty periods squeeze to 0.2×,
  // medium (~3) ≈ 1×, very dense (8+) ≈ 3×.
  const stretch = density.map(d => 0.2 + Math.min(d, 10) * 0.32);
  const cum = new Array(N);
  cum[0] = 0;
  for (let i = 1; i < N; i++) cum[i] = cum[i-1] + stretch[i-1] * STEP;
  // Normalize so the ancient width matches PX_PER_YEAR_BASE * TOTAL.
  const k = (TOTAL * PX_PER_YEAR_BASE) / (cum[N-1] || 1);
  for (let i = 0; i < N; i++) cum[i] *= k;

  // ── 중세 ~ 현대 (YEAR_SPLIT ~ YEAR_END): 1년 단위, 시대별 기본 폭 × 밀도 ──
  const lateEv = all.filter(y => y >= YEAR_SPLIT - 12);
  const M = YEAR_END - YEAR_SPLIT + 1;
  const inc = new Array(M).fill(0);                    // inc[i] = (YEAR_SPLIT+i-1) → (YEAR_SPLIT+i) 한 해의 폭
  for (let i = 1; i < M; i++) {
    const y = YEAR_SPLIT + i - 1;
    let c = 0;
    for (const ey of lateEv) if (Math.abs(ey - y) <= 12) c++;
    const era = window.eraOfYear ? window.eraOfYear(y).key : 'medieval';
    inc[i] = (ERA_PX_PER_YEAR[era] || 3.2) * (0.5 + Math.min(c, ERA_DENSITY_CAP[era] || 8) * 0.35);
  }
  /* 최소 간격 — 같은 줄기에서 이웃한 두 노드(같은 해는 한 덩어리) 사이는 두 라벨 폭 평균의 SPACING_K 배 이상.
     다른 트랙을 포커스하면 라벨 자리가 한 단만 남기도 하므로, 한 단으로 늘어서도 겹치지 않고
     떨어진 라벨을 잇는 지시선이 지나갈 틈까지 남도록 평균보다 조금 넓게 둔다.
     라벨 폭은 배치 단계(estWidth)와 같은 방식으로 어림한다 — 한글·한자 16px, 그 밖 0.56배, 안쪽 여백 22px, 연도 뱃지 */
  const SPACING_K = 1.1;
  const estW = (e) => {
    let t = 0;
    for (const ch of String(e.label || '')) t += /\s/.test(ch) ? 16 * 0.34 : /[가-힣㄰-㆏一-鿿]/.test(ch) ? 16 : 16 * 0.56;
    const name = Math.min(240, t + 22);
    const yt = e.yearLabel || (e.year < 0 ? `${-e.year} BCE` : `${e.year} CE`);
    const yw = [...yt].reduce((w, ch) => w + (/[가-힣]/.test(ch) ? 14.5 : /\s/.test(ch) ? 6 : 9.4), 0) + 12;
    return e.noSync ? Math.min(240, name * 14 / 16) : Math.max(name, yw);
  };
  const byTrack = {};
  (window.TIMELINE_DATA?.events || []).forEach(e => {
    if (e.hidden || e.year < YEAR_SPLIT || e.year > YEAR_END) return;
    (byTrack[e.track] = byTrack[e.track] || []).push(e);
  });
  Object.values(byTrack).forEach(list => {
    // 같은 해 노드는 마커가 한 점에 겹치므로 라벨 폭을 합쳐 한 덩어리로 본다
    const blocks = [];
    list.sort((a, b) => a.year - b.year).forEach(e => {
      const last = blocks[blocks.length - 1];
      if (last && last.year === e.year) last.w += estW(e) + 8;
      else blocks.push({ year: e.year, w: estW(e) });
    });
    for (let k = 1; k < blocks.length; k++) {
      const a = blocks[k - 1], b = blocks[k];
      const i0 = a.year - YEAR_SPLIT + 1, i1 = b.year - YEAR_SPLIT;
      const need = SPACING_K * (a.w + b.w) / 2;
      let have = 0;
      for (let i = i0; i <= i1; i++) have += inc[i];
      if (have < need) { const add = (need - have) / (i1 - i0 + 1); for (let i = i0; i <= i1; i++) inc[i] += add; }
    }
  });
  const cum2 = new Array(M);
  cum2[0] = cum[N-1];
  for (let i = 1; i < M; i++) cum2[i] = cum2[i-1] + inc[i];

  return { cum, STEP, cum2, target: cum2[M-1] };
})();

const LEAD_PAD = 420;  // left padding for trunk + branch fan-out
const TRUNK_ORIGIN_X = 250;
const TRUNK_END_X = 290;
// 갈래 곡선 끝과 기록줄기·첫 연도 틱(-4000)이 정확히 같은 x에서 만나도록 LEAD_PAD에 맞춤
const BRANCH_END_X = LEAD_PAD;

function yearToX(year, scale) {
  const { cum, STEP, cum2 } = _yearLookup;
  let x;
  if (year < YEAR_START) {
    // 선사 구간
    if (year < HOLO_START) {
      const bp = Math.min(PRE_BP_MAX, Math.max(10000, BP_REF - year));
      const hi = Math.log10(PRE_BP_MAX), lo = 4;   // log10(1만)
      x = PRE_LOG_W * (hi - Math.log10(bp)) / (hi - lo);
    } else {
      x = PRE_LOG_W + PRE_LIN_W * (year - HOLO_START) / (YEAR_START - HOLO_START);
    }
    return (LEAD_PAD + x) * scale;
  }
  if (year <= YEAR_SPLIT) {
    const idxF = (year - YEAR_START) / STEP;
    const i = Math.max(0, Math.min(cum.length - 2, Math.floor(idxF)));
    x = cum[i] + (cum[i+1] - cum[i]) * (idxF - i);
  } else {
    const idxF = Math.min(year, YEAR_END) - YEAR_SPLIT;
    const i = Math.max(0, Math.min(cum2.length - 2, Math.floor(idxF)));
    x = cum2[i] + (cum2[i+1] - cum2[i]) * (idxF - i);
  }
  return (LEAD_PAD + PRE_W + x) * scale;
}
function trackWidth(scale) { return (_yearLookup.target + LEAD_PAD + PRE_W + 60) * scale; }

function generateTicks() {
  const ticks = [];
  // 선사 — 「N만 년 전」 눈금 (1950년 기준)
  const PRE_TICKS = [
    [4000000, true], [3000000, false], [2000000, false], [1000000, true], [500000, false],
    [200000, false], [100000, true], [50000, false], [20000, false], [10000, true],
  ];
  for (const [bp, major] of PRE_TICKS) ticks.push({ year: BP_REF - bp, major, half: !major, label: `${bp / 10000}만 년 전` });
  // 약 1만 년 전 ~ 기원전 4000년 — 1000년 간격
  for (const y of [-7000, -6000, -5000]) ticks.push({ year: y, major: y === -6000, half: y !== -6000 });
  // BCE 4000~0: every 100 years (major every 500)
  for (let y = -4000; y <= 0; y += 100) {
    ticks.push({ year: y, major: y % 500 === 0, half: y % 250 === 0 });
  }
  // CE 100~1800: every 50 years (major every 200)
  for (let y = 100; y <= 1800; y += 50) {
    ticks.push({ year: y, major: y % 200 === 0, half: y % 100 === 0 });
  }
  // 1810~2020: every 10 years (major every 50) — 근현대는 사건이 촘촘하다
  for (let y = 1810; y <= 2020; y += 10) {
    ticks.push({ year: y, major: y % 50 === 0, half: false });
  }
  return ticks;
}

/* 트랙 갈래(sub-lane) 상수 — 라벨 배치(positioned)와 세로 위치(eventY) 양쪽에서 쓰므로
   컴포넌트 밖에 둔다. 두 곳이 같은 기준으로 레인을 판정해야 겹침 계산이 맞는다. */
const SUB_OFFSET = { 0: -64, 1: -28, 3: 60 };   // applySubScale(vpH)가 박스 높이에 맞춰 고쳐 쓴다
// 라벨 지시선의 가로 통로 높이 — 마커 윗변(선 위 7px)과 라벨 아랫변(16px) 사이의 두 줄.
// 위 줄을 먼저 쓰고, 그 지시선을 가로질러야 하는 바깥쪽 지시선은 아래 줄로 지나간다.
const LEADER_BANDS = [13.5, 10];
const LANE_BOTTOM_PAD = 50;          // 마지막 줄 아래 연도 눈금·묶음 브래킷(선 아래 최대 46px)
const ERA_STRIP_H = 0;                // 시대 띠 없음 — 시대는 연표 머리·상세 패널에 표시
const LANE_LABEL_HEAD = 128;          // 맨 위 줄기 위 라벨 2단(16 + 51 + 4 + 51 + 여유)
const LANE_GAP_MIN = 80, LANE_GAP_MAX = 220;   // 한국 포커스(갈래 레인 3개)도 박스 안에 들어가도록 최소 80
/* 트랙 레인 배치 — 렌더와 라벨 배치(positioned)가 같은 좌표를 쓰도록 한 곳에서 계산한다.
   네 기록줄기를 박스 높이 전체에 고르게 펼친다.
     맨 위 줄기 = 시대 띠 + 라벨 2단 아래,  맨 아래 줄기 = 박스 아래 − 눈금·브래킷 여백
     그 사이를 같은 간격으로 나누고, 간격이 최대치에 걸리면 묶음 전체를 세로 가운데에 둔다.
   포커스 시에는 갈래 레인(한국 −64/−28/+60, 일본·인도 +70)이 뻗는 만큼 위·아래 자리를 더 둔다. */
function layoutLanes(tracks, focusedTrack, vpH) {
  const all = TRACK_ORDER.filter(t => tracks[t]);
  const isFocus = !!focusedTrack && all.includes(focusedTrack);
  // 포커스 — 그 줄기 하나만 그린다(다른 줄기는 숨김, 2026-10-09 사용자 요청). 갈래 레인까지 넣어 세로 가운데
  const activeTracks = isFocus ? [focusedTrack] : all;
  const n = activeTracks.length;
  const H = vpH || 700;
  const trackY = {};
  if (isFocus) {
    const offs = focusedTrack === 'korea' ? Object.values(SUB_OFFSET)
      : [TRACK_BRANCH[focusedTrack] ? TRACK_BRANCH[focusedTrack].subOffset : 0];
    const subUp = Math.max(0, -Math.min(0, ...offs));
    // 아래로 뻗는 몫 — 갈래 레인, 한국은 가야 갈래 아래로 내린 삼국 시대 브래킷(+94±13)까지
    const subDown = Math.max(0, ...offs) + (focusedTrack === 'korea' ? GROUP_Y + 14 : 0);
    const top = ERA_STRIP_H + LANE_LABEL_HEAD + subUp;
    const bottom = H - LANE_BOTTOM_PAD;
    trackY[focusedTrack] = top + Math.max(0, (bottom - top - subDown) / 2);
    return { activeTracks, trackY, lanesEnd: trackY[focusedTrack] + subDown };
  }
  if (n <= 1) {
    const top = ERA_STRIP_H + LANE_LABEL_HEAD;
    if (n === 1) trackY[activeTracks[0]] = Math.max(top, (top + H - LANE_BOTTOM_PAD) / 2);
    return { activeTracks, trackY, lanesEnd: n ? trackY[activeTracks[0]] : top };
  }
  /* 여러 줄기 — 맨 위 줄기 위 라벨 자리를 다른 줄기 사이 간격과 같은 몫으로 본다(간격 − 눈금 자리).
     전에는 위에 라벨 2단(128) 자리를 늘 비우고 맨 아래 줄기를 바닥(−50)에 붙여 전체가 아래로 쏠려 보였다.
     아래 여백도 조금 더 두어 위·아래 균형을 맞춘다. */
  //   HEAD_MIN — 한국 1920년대처럼 라벨이 두 단으로 쌓이는 곳이 박스 위로 넘지 않는 최소 자리(실측 103)
  const TICK_ROOM = 24, HEAD_MIN = 108, BOTTOM = LANE_BOTTOM_PAD + 16;
  let gap = (H - BOTTOM + TICK_ROOM) / n;
  let head = Math.min(LANE_LABEL_HEAD, gap - TICK_ROOM);
  if (head < HEAD_MIN) { head = HEAD_MIN; gap = (H - BOTTOM - head) / (n - 1); }   // 낮은 화면 — 위 자리를 먼저 지키고 나머지를 고르게
  gap = Math.max(LANE_GAP_MIN, Math.min(LANE_GAP_MAX, gap));
  head += ERA_STRIP_H;
  const block = gap * (n - 1);
  let y = head + Math.max(0, (H - BOTTOM - head - block) / 2);
  activeTracks.forEach((t) => { trackY[t] = y; y += gap; });
  return { activeTracks, trackY, lanesEnd: trackY[activeTracks[n - 1]] };
}
/* 갈래 레인 간격 — 포커스하면 그 줄기 하나만 그리므로 박스 높이에 맞춰 갈래 사이를 넓힌다(2026-10-09 사용자 요청).
   한국: 고구려 −2u · 백제 −u · 신라 0 · 가야 +u. 위로 라벨 2단(128), 아래로 삼국 시대 브래킷(+u+34±13)과 바닥 여백이 들어가는 만큼.
   일본·인도: 원줄기 아래 한 갈래 s. 렌더·라벨 배치·레인 배치가 모두 SUB_OFFSET / TRACK_BRANCH 를 읽으므로
   TimelineCanvas가 vpH를 알게 되는 즉시 한 번 부른다(같은 vpH면 결과가 같다). */
function applySubScale(vpH) {
  const H = vpH || 700;
  const u = Math.round(Math.max(40, Math.min(110, (H - LANE_LABEL_HEAD - (GROUP_Y + 14) - LANE_BOTTOM_PAD) / 3)));
  SUB_OFFSET[0] = -2 * u; SUB_OFFSET[1] = -u; SUB_OFFSET[3] = u;
  const sb = Math.round(Math.max(70, Math.min(150, (H - LANE_LABEL_HEAD - LANE_BOTTOM_PAD) / 2)));
  Object.values(TRACK_BRANCH).forEach(c => { c.subOffset = sb; });
}
// 노드 묶음 브래킷(주제 노드) — 트랙선 아래 GROUP_Y 에 놓인다
const GROUP_PAD_X = 14;
const GROUP_Y = 34;
/* 묶음 브래킷의 세로 위치 — 한국 줄기 포커스에서 삼국 갈래 구간에 걸친 묶음(삼국 시대)은
   가야 갈래(+60) 아래로 내려 갈래 라벨 뒤로 선이 지나가지 않게 한다. 렌더와 라벨 배치가 같은 값을 쓴다 */
const groupYOf = (track, g, focusedTrack) =>
  (track === 'korea' && focusedTrack === 'korea' && g.startYear < MERGE_YEAR && g.endYear >= BRANCH_YEAR)
    ? GROUP_Y + SUB_OFFSET[3] : GROUP_Y;
const NODE_GROUPS = {
  korea: [
    // 삼국 시대 — 신라 건국부터 통일 직전까지. 묶음 이름을 누르면 기록이 열린다
    { key: 'kr-samguk', label: '삼국 시대', startYear: -57, endYear: 675, targetId: 'k-era-samguk' },
    // 일제 강점기 통치 방식 — 묶음 이름을 누르면 해당 통치의 기록이 열린다
    { key: 'kr-mudan',  label: '무단 통치',      startYear: 1910, endYear: 1919, targetId: 'k-era-mudan' },
