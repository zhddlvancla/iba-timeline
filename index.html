// =================================================
// TAB: LINKED — jump to other events
// =================================================
function LinkedTab({ db, event, onJumpTo }) {
  const all = window.TIMELINE_DATA.events;
  const links = (db.linked || [])
    .map(id => all.find(e => e.id === id))
    .filter(Boolean);

  // Compute "concurrent" events (within ±25y) on the OTHER track
  const otherTrack = event.track === 'korea' ? 'world' : 'korea';
  const concurrent = all
    .filter(e => e.track === otherTrack)
    .filter(e => Math.abs(e.year - event.year) <= 35 && e.id !== event.id)
    .sort((a, b) => Math.abs(a.year - event.year) - Math.abs(b.year - event.year))
    .slice(0, 3);

  const renderItem = (e, note) => {
    const yearStr = window.eventYearText(e);
    return (
      <button key={e.id} className={`sync-linkrow sync-linkrow--${e.track}`} onClick={() => onJumpTo(e.id)}>
        <span className="sync-linkrow__y">{yearStr}</span>
        <span className="sync-linkrow__diamond">◆</span>
        <span className="sync-linkrow__body">
          <span className="sync-linkrow__label">{e.label}</span>
          <span className="sync-linkrow__en">{e.en}</span>
        </span>
        <span className="sync-linkrow__meta">
          <span className="sync-linkrow__track">{({korea:'한국',eastasia:'동아시아',west:'유럽·미주',westasia:'서아·인도'})[e.track] || e.track}</span>
          {note && <span className="sync-linkrow__note">{note}</span>}
        </span>
        <span className="sync-linkrow__chev">연결 · 대조</span>
      </button>
    );
  };

  return (
    <div className="sync-pane sync-pane--linked">
      <section className="sync-section">
        <h3 className="sync-section__head">▸ EDITORIALLY LINKED · 연결 기록</h3>
        <div className="sync-linklist">
          {links.length === 0 && <div className="sync-pane__hint">// 색인된 연결 없음</div>}
          {links.map(e => renderItem(e))}
        </div>
      </section>
      <section className="sync-section">
        <h3 className="sync-section__head">▸ CONCURRENT · 동시대 — {otherTrack === 'korea' ? '한국사' : '세계사'}</h3>
        <div className="sync-linklist">
          {concurrent.length === 0 && <div className="sync-pane__hint">// ±35년 내 동시대 기록 없음</div>}
          {concurrent.map(e => {
            const delta = e.year - event.year;
            const note = delta === 0 ? '동년' : (delta > 0 ? `+${delta}년` : `${delta}년`);
            return renderItem(e, note);
          })}
        </div>
      </section>
    </div>
  );
}

// =================================================
// DOC MODE — 스캔 문서 연출 (db.docMode). 탭: 지도·요약·상세·자료·탐구 (+ 대응반: LUMINA 보고)
//   문자열 속 {{원본|왜곡}} = LUMINA가 바꿔 쓴 문장.
//     연구원 접속 — 원본만 보인다.
//     대응반 접속 — 왜곡된 문장이 평범하게 섞여 보인다. 찾아 누르면 왜곡에 줄을 긋고 원본을 옆에 적는다(정정).
//   검은 막대 — LUMINA의 접근 흔적. 문서를 열 때 훑고 지나가며, 사료 이미지에는 먹칠로 남는다.
// =================================================
const DOC_META = {
  map:       { no: '01', head: '지리 조사 기록', en: 'GEOGRAPHIC SURVEY' },
  lumina:    { no: 'L',  head: 'LUMINA 접근·왜곡 보고', en: 'INCIDENT REPORT' },
  notes:     { no: '02', head: '기록 요약',     en: 'SUMMARY' },
  overview:  { no: '03', head: '기록 상세 조사', en: 'DETAILED RECORD' },
  artifacts: { no: '04', head: '부속 자료철',   en: 'ANNEXED PLATES' },
  sources:   { no: '05', head: '사료 탐구 보고', en: 'SOURCE INQUIRY' },
};
const DIST_RE = /(\{\{[^}]*\}\})/g;
const docStrip = (str) => String(str || '').replace(/\{\{([^|}]*)\|[^}]*\}\}/g, '$1');
const docDistCount = (x) => (JSON.stringify(x || '').match(/\{\{/g) || []).length;
// 탭별 왜곡 수 — 정정 id 접두어와 짝을 이룬다
// 왜곡은 지도·요약·상세에만 들어간다. 자료·탐구는 봉인 문서 — 모두 정정하면 열린다
const DOC_SEALED = ['artifacts', 'sources'];
function docSections(db) {
  return [
    { tab: 'map',       no: '01', name: '지리 조사 기록', pre: ['map.'], n: docDistCount(db.map && db.map.notes) },
    { tab: 'notes',     no: '02', name: '기록 요약',     pre: ['n.'],   n: docDistCount(db.notes) },
    { tab: 'overview',  no: '03', name: '기록 상세 조사', pre: ['o.'],   n: docDistCount(db.overview) },
  ];
}
function docCountRedactions(db) { return docSections(db).reduce((t, s) => t + s.n, 0); }
function DocText({ text, id, ctx }) {
  const str = String(text || '');
  if (!ctx.redactOn) return <>{docStrip(str)}</>;
  const parts = str.split(DIST_RE);
  let k = 0;
  return <>{parts.map((part, i) => {
    const m = part.match(/^\{\{([^|}]*)\|([^}]*)\}\}$/);
    if (!m) return <React.Fragment key={i}>{part}</React.Fragment>;
    const rid = `${id}.${k++}`;
    if (ctx.restored.has(rid)) {
      return <span key={i} className="docx-fixed" title="LUMINA 왜곡 — 원본 기록으로 정정"><s>{m[2]}</s><ins>{m[1]}</ins></span>;
    }
    // 왜곡 문장 — 빨간 글씨. 누르면 원본으로 정정
    return <span key={i} className="docx-dist" title="LUMINA 왜곡 — 눌러서 원본으로 정정" onClick={(e) => { e.stopPropagation(); ctx.onRestore(rid); }}>{m[2]}</span>;
  })}</>;
}
// ████ → 접근 흔적 막대 (판독 불가)
function DocBars({ text }) {
  return <>{String(text || '').split(/(█+)/g).map((p, i) => /^█+$/.test(p)
    ? <span key={i} className="docx-bar" title="[LUMINA 접근 흔적] 판독 불가">{p}</span>
    : <React.Fragment key={i}>{p}</React.Fragment>)}</>;
}
function DocFigure({ src, alt, className = '', redact, ctx, idPrefix, style, onShape }) {
  // onShape('land' | 'port') — 이미지 원본 비율을 알려 배치(아래/옆)를 정하게 한다
  const imgRef = useRefSync(null);
  const report = () => {
    const im = imgRef.current;
    if (onShape && im && im.naturalWidth) onShape(im.naturalWidth / im.naturalHeight >= 1.2 ? 'land' : 'port');
  };
  useEffectSync(() => { if (imgRef.current && imgRef.current.complete) report(); }, [src]);
  return (
    <span className={`docx-img ${className}`} style={style}>
      <img ref={imgRef} src={src} alt={alt} loading="eager" title="클릭하여 크게 보기" onLoad={report}
        onError={() => onShape && onShape('land')}
        onClick={() => window.__tmbLightbox && window.__tmbLightbox(src, alt)}/>
      {/* 먹칠 — LUMINA 접근 흔적. 제2종 말소라 걷히지 않는다. 누르면 원문을 주해로 단다 */}
      {ctx.redactOn && Array.isArray(redact) && redact.map((r, i) => {
        const rid = `${idPrefix}.${i}`;
        const done = ctx.restored.has(rid);
        return (
          <span key={i} role="button" tabIndex={0} data-n={i + 1}
            className={`docx-imgbar ${done ? 'is-noted' : ''}`}
            style={{ left: r.x + '%', top: r.y + '%', width: r.w + '%', height: r.h + '%' }}
            title={done ? `주해 ${i + 1} — 원문은 아래 주해 참조` : '[LUMINA 먹칠] 걷히지 않는다 — 눌러서 원문을 주해로 단다'}
            onClick={(e) => { e.stopPropagation(); ctx.onRestore(rid); }}
            onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ctx.onRestore(rid); } }}/>
        );
      })}
    </span>
  );
}
function DocPlate({ src, alt, redact, idPrefix, ctx, cap, children, className = '' }) {
  const [shape, setShape] = useStateSync(null);
  const notes = ctx.redactOn && Array.isArray(redact)
    ? redact.map((r, i) => ({ ...r, i })).filter(r => ctx.restored.has(`${idPrefix}.${r.i}`)) : [];
  return (
    <div className={`docx-plate docx-plate--${shape || 'land'} ${shape ? '' : 'is-measuring'} ${className}`}>
      <div className="docx-plate__fig">
        <DocFigure src={src} alt={alt} ctx={ctx} redact={redact} idPrefix={idPrefix} onShape={setShape}/>
        {cap && <div className="docx-cap">{cap}</div>}
        {notes.length > 0 && (
          <ol className="docx-annot">
            {notes.map(r => (
              <li key={r.i} data-n={r.i + 1}><b>{r.who}</b> 「{r.orig}」 <em>— {window.cleanCite(r.cite) ? window.cleanCite(r.cite) + ' · ' : ''}원본 사본 대조</em></li>
            ))}
          </ol>
        )}
      </div>
      <div className="docx-plate__body">{children}</div>
    </div>
  );
}
function DocView({ tab, db, event, redactOn, restored, onRestore }) {
  // 정정 — 맞게 찾으면 알림 줄에 잠깐 결과를 띄운다
  const [probe, setProbe] = useStateSync(null);
  const probeT = useRefSync(0);
  const flash = (kind) => { clearTimeout(probeT.current); setProbe(kind); probeT.current = setTimeout(() => setProbe(null), 1800); };
  useEffectSync(() => () => clearTimeout(probeT.current), []);
  const fix = (rid) => { if (!restored.has(rid)) flash(rid.startsWith('img.') ? 'noted' : 'fixed'); onRestore(rid); };
  const ctx = { redactOn, restored, onRestore: fix };
  // 틀린 곳을 누르면 — 원본과 일치
  const onProbe = (e) => {
    if (!redactOn || tab === 'lumina') return;
    const t = e.target;
    if (t.closest('.docx-dist, .docx-fixed, .docx-imgbar, img, button, iframe, a')) return;
    if (t.closest('.docx-p, .docx-list li, .docx-olist li, .docx-terms dd, .docx-find td, .docx-vtl li, .docx-pins li')) {
      if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('click');
      flash('clean');
    }
  };
  const pageRef = useRefSync(null);
  const [bigMap, setBigMap] = useStateSync(null);   // 위성 지도 크게 보기
  const openMap = (m) => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('open'); setBigMap(m); };
  const closeMap = () => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('close'); setBigMap(null); };
  window.useEscLayer(!!bigMap, closeMap);   // ESC는 지도 창만 닫고 기록 열람 창은 유지
  const meta = DOC_META[tab] || DOC_META.notes;
  const docNo = `${db.docNo || event.id.toUpperCase()}-${meta.no}`;
  const total = redactOn ? docCountRedactions(db) : 0;
  const done = redactOn ? restored.size : 0;
  const secs = docSections(db).map(sec => ({ ...sec, done: [...restored].filter(id => sec.pre.some(p => id.startsWith(p))).length }));
  const allDone = redactOn && total > 0 && done >= total;
  const yearStr = window.eventYearText(event);

  let body = null, tail = null;
  if (tab === 'lumina') {
    const L = db.lumina || {};
    const risk = event.risk || {};
    body = <>
      <h4 className="docx-h">탐지 개요:</h4>
      <table className="docx-kv"><tbody>
        <tr><th>표적 기록</th><td>{event.label} · 문서 {db.docNo || event.id.toUpperCase()}-01 ~ 05</td></tr>
        <tr><th>탐지 시각</th><td><DocBars text={L.detected}/></td></tr>
        <tr><th>접근 경로</th><td><DocBars text={L.route}/></td></tr>
        <tr><th>접근자</th><td><DocBars text={L.accessor || '████████'}/> · LUMINA 계열 추정</td></tr>
        <tr><th>개입 방식</th><td>{L.method}</td></tr>
        <tr><th>왜곡 유형</th><td>{risk.kind} · 위험도 {risk.level}</td></tr>
      </tbody></table>
      {risk.note && <><h4 className="docx-h">상황:</h4><p className="docx-p docx-lead">{risk.note}</p></>}
      <div className="docx-cols docx-cols--detail">
        {Array.isArray(L.claims) && <section>
          <h4 className="docx-h">LUMINA가 끼워 넣은 주장:</h4>
          <ol className="docx-olist docx-claims">
            {L.claims.map((c, i) => <li key={i}>「{c}」</li>)}
          </ol>
          <p className="docx-p docx-p--sm">위 주장은 원본 기록이 아니다. 지도·요약·상세 문서 곳곳에 이 주장에 맞춘 문장이 빨간 글씨로 섞여 들어가 있다.</p>
        </section>}
        {Array.isArray(L.evidence) && <section>
          <h4 className="docx-h">대조 근거 — 원본 기록:</h4>
          <ul className="docx-list">
            {L.evidence.map((c, i) => <li key={i}>{c}</li>)}
          </ul>
        </section>}
      </div>
      <h4 className="docx-h">영향 범위 · 정정 현황:</h4>
      <table className="docx-find docx-prog"><tbody>
        <tr><th>문서</th><th>왜곡</th><th>정정</th><th>상태</th></tr>
        {secs.map(sec => (
          <tr key={sec.tab} className={sec.n > 0 && sec.done >= sec.n ? 'is-done' : ''}>
            <td>{db.docNo || event.id.toUpperCase()}-{sec.no} · {sec.name}</td>
            <td>{sec.n}건</td>
            <td>{sec.done}건</td>
            <td>{sec.n === 0 ? '이상 없음' : sec.done >= sec.n ? '정정 완료' : '대조 필요'}</td>
          </tr>
        ))}
        {[['04', '부속 자료철'], ['05', '사료 탐구 보고']].map(([no, name]) => (
          <tr key={no} className={allDone ? 'is-done' : 'is-sealed'}>
            <td>{db.docNo || event.id.toUpperCase()}-{no} · {name}</td>
            <td>—</td>
            <td>—</td>
            <td>{allDone ? '봉인 해제' : '열람 봉인'}</td>
          </tr>
        ))}
      </tbody></table>
      <h4 className="docx-h">대응 지침:</h4>
      <ol className="docx-olist">
        <li>각 문서의 빨간 글씨는 LUMINA가 바꿔 쓴 문장이다. 이 보고서의 「대조 근거」와 맞대어 읽는다.</li>
        <li>빨간 글씨를 누르면 줄을 긋고 원본 기록을 옆에 적는다. 왜곡은 지우지 않는다 — 정정한 흔적을 남긴다.</li>
        <li>지도·요약·상세의 왜곡을 모두 정정하면 봉인된 부속 자료철과 사료 탐구 보고가 열린다.</li>
      </ol>
    </>;
    tail = window.cleanCite(L.cite) ? `대조 근거는 ${window.cleanCite(L.cite)} 참고.` : null;
  } else if (tab === 'map') {
    const m = db.map || {};
    const title = m.title || event.label;
    const q = m.googleQuery || m.title || event.label;
    const url = `https://www.google.com/maps?q=${encodeURIComponent(q)}&t=k&z=${m.googleZoom || 5}&output=embed`;
    const pins = Array.isArray(m.pins) ? m.pins : [];
    const notes = Array.isArray(m.notes) ? m.notes : [];
    body = <>
      <h4 className="docx-h">첨부 1. 위성 지도 — {title}</h4>
      <div className="docx-mapframe">
        <iframe src={url} title={`지도 · ${title}`} loading="eager" referrerPolicy="no-referrer-when-downgrade" allowFullScreen tabIndex={-1}/>
        <button type="button" className="docx-mapframe__hit" onClick={() => openMap({ url, title, q })}
          aria-label="위성 지도 크게 보기">
          <span className="docx-mapframe__hint">⤢ 클릭하여 지도 크게 보기</span>
        </button>
      </div>
      <div className="docx-cap">▲ 위성 지도 — 조회 좌표: {q}</div>
      <div className="docx-cols docx-cols--map">
        {pins.length > 0 && <section>
          <h4 className="docx-h">표시 지점:</h4>
          <ul className="docx-pins">
            {pins.map((p, i) => (
              <li key={i} className={p.amber ? 'is-key' : p.red ? 'is-red' : ''}>
                <span className="docx-pins__mk">{p.amber ? '◆' : p.red ? '✕' : '◇'}</span>
                <span>{p.label}{p.sub ? <em>{p.sub}</em> : null}</span>
              </li>
            ))}
          </ul>
        </section>}
        {notes.length > 0 && <section>
          <h4 className="docx-h">조사 소견:</h4>
          <ol className="docx-olist">
            {notes.map((t, i) => <li key={i}><DocText text={t} id={`map.${i}`} ctx={ctx}/></li>)}
          </ol>
        </section>}
      </div>
    </>;
    tail = window.cleanCite(m.cite) ? `지도 원본은 ${window.cleanCite(m.cite)} 참고.` : null;
  } else if (tab === 'notes') {
    const notes = db.notes;
    const secs = notes && Array.isArray(notes.sections) ? notes.sections : [];
    body = <>
      <h4 className="docx-h">요약:</h4>
      {typeof notes === 'string' && <p className="docx-p"><DocText text={notes} id="n" ctx={ctx}/></p>}
      {notes && notes.summary && <p className="docx-p docx-lead"><DocText text={notes.summary} id="n.s" ctx={ctx}/></p>}
      <div className="docx-secgrid">
        {secs.map((sec, i) => (
          <div className="docx-sec" key={i}>
            {sec.head && <div className="docx-sec__h">{sec.head}</div>}
            {sec.body && <p className="docx-p"><DocText text={sec.body} id={`n.${i}.b`} ctx={ctx}/></p>}
            {Array.isArray(sec.list) && (
              <ul className="docx-list">
                {sec.list.map((it, j) => <li key={j}><DocText text={it} id={`n.${i}.${j}`} ctx={ctx}/></li>)}
              </ul>
            )}
          </div>
        ))}
      </div>
    </>;
    tail = `상세 내용은 문서 ${db.docNo || event.id.toUpperCase()}-03 참고.`;
  } else if (tab === 'overview') {
    const ov = db.overview || {};
    const terms = Array.isArray(ov.terms) ? ov.terms : [];
    const tl = Array.isArray(ov.timeline) ? ov.timeline : [];
    body = <>
      {ov.summary && <>
        <h4 className="docx-h">개요:</h4>
        <p className="docx-p docx-lead"><DocText text={ov.summary} id="o.s" ctx={ctx}/></p>
      </>}
      <div className="docx-cols docx-cols--detail">
        {terms.length > 0 && <section>
          <h4 className="docx-h">핵심 개념:</h4>
          <dl className="docx-terms">
            {terms.map((t, i) => (
              <div key={i}><dt>{t.label}</dt><dd><DocText text={t.def} id={`o.t.${i}`} ctx={ctx}/></dd></div>
            ))}
          </dl>
        </section>}
        {tl.length > 0 && <section>
          <h4 className="docx-h">연표:</h4>
          <ol className="docx-vtl">
            {tl.map((t, i) => (
              <li key={i} className={!event.yearLabel && t.y === event.year ? 'is-this' : ''}>
                <span className="docx-vtl__y">{window.tlYearText(t)}</span>
                <span className="docx-vtl__l"><DocText text={t.label} id={`o.l.${i}`} ctx={ctx}/></span>
              </li>
            ))}
          </ol>
        </section>}
      </div>
    </>;
    tail = `요약본은 문서 ${db.docNo || event.id.toUpperCase()}-02 참고.`;
  } else if (tab === 'artifacts') {
    const items = (db.artifacts || []).filter(a => a.src);
    body = <>
      <h4 className="docx-h">수록 도판:</h4>
      {items.length === 0 && <p className="docx-p">수록된 도판이 없음.</p>}
      {items.map((a, i) => (
        <DocPlate key={i} src={a.src} alt={a.caption} ctx={ctx}>
          <div className="docx-plate__no">도판 {i + 1}.</div>
          <div className="docx-plate__t">{a.caption}</div>
          {a.note && <p className="docx-p docx-p--sm"><DocText text={a.note} id={`a.${i}`} ctx={ctx}/></p>}
          {window.cleanCite(a.ref) && <div className="docx-plate__ref">출처: {window.cleanCite(a.ref)}</div>}
        </DocPlate>
      ))}
    </>;
    tail = '도판 원본은 부속 자료 보관함에 별도 보관.';
  } else if (tab === 'sources') {
    const q = db.inquiry;
    if (q) {
      body = <>
        <h4 className="docx-h">탐구 자료 — {q.title}</h4>
        <DocPlate src={q.src} alt={q.title} ctx={ctx} redact={q.redact} idPrefix="img" className="docx-plate--inq"
          cap={`▲ ${q.title}${window.cleanCite(q.cite) ? ` (${window.cleanCite(q.cite)})` : ''}`}>
          <h4 className="docx-h docx-h--first">탐구 질문:</h4>
          <p className="docx-p docx-q">{q.question}</p>
          <h4 className="docx-h">자료 분석:</h4>
          <table className="docx-find"><tbody>
            {q.findings.map((f, i) => (
              <tr key={i}>
                <th>{f.who}<span>{f.src}</span></th>
                <td><DocText text={f.text} id={`q.${i}`} ctx={ctx}/></td>
              </tr>
            ))}
          </tbody></table>
        </DocPlate>
        <h4 className="docx-h">결론:</h4>
        <p className="docx-p docx-lead"><DocText text={q.conclusion} id="q.c" ctx={ctx}/></p>
      </>;
      tail = window.cleanCite(q.cite) ? `탐구 자료 원본은 ${window.cleanCite(q.cite)} 참고.` : null;
    } else {
      body = <p className="docx-p">등록된 탐구 기록이 없음.</p>;
    }
  }

  return (
    <div className="docx-desk">
      {redactOn && total > 0 && (
        <div className={`docx-alert ${allDone ? 'is-done' : ''} ${probe === 'clean' ? 'is-clean' : ''} ${probe === 'fixed' || probe === 'noted' ? 'is-hit' : ''}`}>
          {probe === 'clean' ? <>▸ 대조 결과 — 원본과 일치합니다. 이 문장에는 왜곡이 없습니다. <b>정정 {done} / {total}</b></>
            : probe === 'fixed' ? <>▸ 왜곡 발견 — 줄을 긋고 원본 기록으로 정정했습니다. <b>정정 {done} / {total}</b></>
            : probe === 'noted' ? <>▸ 먹칠 확인 — 걷을 수 없어 원문을 주해로 달았습니다. <b>정정 {done} / {total}</b></>
            : allDone ? <>▸ 원본 복원 완료 — 왜곡 {total}건을 모두 바로잡았습니다. 봉인되어 있던 자료·탐구 문서가 열렸습니다.</>
            : <>▲ LUMINA 왜곡 탐지 — 빨간 글씨가 왜곡된 기록입니다. 눌러서 원본으로 정정하십시오. <b>정정 {done} / {total}</b></>}
        </div>
      )}
      <article className="docx-page" key={tab} ref={pageRef} onClick={onProbe}>
        <span className="docx-scan" aria-hidden="true"/>
        <header className="docx-meta">
          <span>국제기록보존기구 제2국 · 기록 보관소</span>
          <span>문서 {docNo} · {yearStr}</span>
        </header>
        {/* 표제 — 왼쪽: 문서 종류 / 가운데: 노드 이름 / 오른쪽: 인장·도장 */}
        <div className="docx-head">
          <div className="docx-head__kind">
            <span className="docx-head__no">{meta.no}</span>
            <span className="docx-head__txt"><b>{meta.head}</b><small>{meta.en}</small></span>
          </div>
          <div className="docx-head__node">
            <h2>{event.label}</h2>
            <div>{event.en} · {yearStr} · {event.state}{event.theme ? ` / ${event.theme}` : ''}</div>
          </div>
          <div className="docx-head__mark">
            <IbaSeal kind="internal" color="#2b5e40" bg="#e8e5dc" className="docx-seal"/>
            {redactOn && total > 0 && (
              <div className={`docx-stamp ${allDone ? 'is-done' : ''}`}>{allDone ? '원본 복원' : '왜곡 탐지'}<small>{allDone ? 'RESTORED' : 'LUMINA'}</small></div>
            )}
          </div>
        </div>
        {body}
        {tail && <p className="docx-tail">{tail}</p>}
        <footer className="docx-foot">{tab === 'lumina' ? '— 부속 보고 · 대응반 전용 —' : `— ${Number(meta.no)} / 5 —`}</footer>
      </article>
      {bigMap && ReactDOM.createPortal(
        <div className="tl-mapmodal" role="dialog" aria-modal="true" onClick={closeMap}>
          <div className="tl-mapmodal__win tl-mapmodal__win--doc" onClick={(e) => e.stopPropagation()}>
            <div className="tl-mapmodal__head">
              <span className="tl-mapmodal__title">▸ SATELLITE MAP · {event.en}</span>
              <span className="tl-mapmodal__sub">{bigMap.title} · 조회 좌표 {bigMap.q}</span>
              <button className="tl-mapmodal__close" onClick={closeMap} aria-label="닫기">✕</button>
            </div>
            <iframe className="tl-mapmodal__iframe tl-mapmodal__iframe--plain" src={bigMap.url} title={`위성 지도 · ${bigMap.title}`}
              loading="eager" referrerPolicy="no-referrer-when-downgrade" allowFullScreen/>
          </div>
        </div>,
        document.body
      )}
    </div>
  );
}

Object.assign(window, { SyncDialog });
</script>
<script type="text/babel">
/* global React, ReactDOM, TIMELINE_DATA, TopBar, SubNav, TimelineCanvas, MemoryDetail, Footer, SyncDialog */
const { useState: useStateApp, useCallback: useCallbackApp, useEffect: useEffectApp, useRef: useRefApp } = React;

// ====================================================================
// PORTAL VIEW — 대외 포털 (대외판 인장) → 포털 우회 로그인 → 글리치 → 대문
// ====================================================================
const IbaSealBF = window.IbaSeal;
/* ====================================================================
   첫 안내문 — 세계관 밖의 안내. 사이트를 처음 열면 대외판 화면보다 먼저 한 번 보인다(같은 탭에서는 다시 안 뜸).
   확인 클릭이 브라우저의 첫 사용자 조작이 되어 이후 효과음이 바로 난다.
   ==================================================================== */
function Notice({ onOk }) {
  /* 바탕 가운데 글씨가 서서히 나타났다 잠시 머문 뒤 사라지고 대외판 화면으로 넘어간다. 누르거나 키를 치면 바로 사라지기 시작 */
  const [phase, setPhase] = useStateApp('in');   // in → hold → out
  const doneRef = useRefApp(false);
  const finish = useCallbackApp(() => {
    if (doneRef.current) return;
    doneRef.current = true;
    try { sessionStorage.setItem('iba.notice', '1'); } catch (e) {}
    onOk();
  }, [onOk]);
  const leave = useCallbackApp(() => { setPhase(p => (p === 'out' ? p : 'out')); }, []);
  useEffectApp(() => {
    const t1 = setTimeout(() => setPhase(p => (p === 'in' ? 'hold' : p)), 1200);
    const t2 = setTimeout(leave, 6200);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [leave]);
  useEffectApp(() => {
    if (phase !== 'out') return;
    const t = setTimeout(finish, 1100);
    return () => clearTimeout(t);
  }, [phase, finish]);
  useEffectApp(() => {
    const onKey = () => leave();
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [leave]);
  return (
    <div className={`notice-view is-${phase}`} onClick={leave} aria-live="polite">
      <div className="notice-text">
        <p className="notice-text__t">이 웹사이트는 가상의 설정으로 만든 교육용 사이트입니다</p>
        <p>국제기록보존기구(IBA)를 비롯해 화면에 나오는 기구·인물·코드·문서는 모두 지어낸 것이며, 실제 기관과 관계가 없습니다.</p>
        <p>연표에 실린 사건·연도·설명은 실제 역사를 바탕으로 합니다.</p>
      </div>
    </div>
  );
}

function Portal({ onBypass, rebooted = false }) {
  const [glitch, setGlitch] = useStateApp(false);
  const [fired, setFired] = useStateApp(false);
  const firedRef = useRefApp(false);
  const vline = window.useVestigia();

  /* 대외판 화면 — 단말 기동(V-SYS-001) → 기동 직후(002) → 대외판(003). REBOOT로 돌아왔으면 열람 종료(017)부터 */
  useEffectApp(() => {
    const V = window.VESTIGIA;
    V.clear();
    V.chain((rebooted ? ['V-SYS-017'] : []).concat(['V-SYS-001', 'V-SYS-002', 'V-SYS-003']));
  }, []);

  /* 배속 승인 번호 입력 — 버튼을 누르면 V-SYS-004(요청)와 함께 입력 칸 네 개가 열린다.
     [부서]-[배속 연도]-[등록 일련번호]-[출입 관측소]. 형식이 맞으면 005(인증 확인 중) → 006(인증 성공) 뒤
     글리치로 대문 진입, 틀리면 007(인증 실패)과 함께 틀린 칸을 붉게 표시한다. 입력값은 window.setAgent로 접속자 데이터가 된다. */
  const [asking, setAsking] = useStateApp(false);
  const [vals, setVals] = useStateApp(() => {
    const a = window.IBA_AGENT || {};
    let saved = false; try { saved = !!sessionStorage.getItem('iba.agent'); } catch (e) {}
    return saved && !a.guest ? { dept: a.dept, year: a.year, serial: a.serial, site: a.site } : { dept: '', year: '', serial: '', site: '' };
  });
  const [bad, setBad] = useStateApp([]);
  const [shake, setShake] = useStateApp(0);
  /* 인증 경과 줄 — 대외판 뒤에 숨은 제2국 회선으로 넘어가는 과정. VESTIGIA 문형과 별개의 화면 표시(단말 기록) */
  const [alog, setAlog] = useStateApp(null);   // { n, t, st: 'run' | 'ok' | 'bad' }
  const inputs = useRefApp({});
  const FIELDS = [
    { k: 'dept',   cap: '부서',          ph: 'RS',    len: 2, re: /[^A-Z]/g, mode: 'text' },
    { k: 'year',   cap: '배속 연도',     ph: '26',    len: 2, re: /[^0-9]/g, mode: 'numeric' },
    { k: 'serial', cap: '등록 일련번호', ph: '00000', len: 5, re: /[^0-9]/g, mode: 'numeric' },
    { k: 'site',   cap: '출입 관측소',   ph: 'SIT',   len: 3, re: /[^A-Z]/g, mode: 'text' }
  ];

  const ask = useCallbackApp(() => {
    if (firedRef.current) return;
    setAsking(true);
    const A = window.DENDRO_AUDIO, V = window.VESTIGIA;
    V.clear(); V.say('V-SYS-004');
    if (A) A.sfx('key');
    setTimeout(() => { const f = FIELDS.find(f => !vals[f.k]) || FIELDS[0]; inputs.current[f.k]?.focus(); }, 40);
  }, [vals]);

  const submit = useCallbackApp(() => {
    if (firedRef.current) return;
    const A = window.DENDRO_AUDIO, V = window.VESTIGIA;
    const wrong = window.checkAgent(vals);
    if (wrong.length) {
      setBad(wrong); setShake(n => n + 1);
      setAlog({ n: 0, t: '비공개 명부 대조 실패 · 등재되지 않은 번호', st: 'bad' });
      V.clear(); V.say('V-SYS-007');
      if (A) A.sfx('denied');
      setTimeout(() => inputs.current[wrong[0]]?.focus(), 0);
      return;
    }
    firedRef.current = true;
    setFired(true); setBad([]);
    window.setAgent(vals);
    if (document.activeElement) document.activeElement.blur();
    V.clear();
    V.say('V-SYS-005');
    if (A) A.sfx('key');
    setAlog({ n: 1, t: '대외 회선 차단 · 제2국 비공개 회선으로 전환', st: 'run' });
    setTimeout(() => {
      setAlog({ n: 2, t: '비공개 명부 대조 · ' + window.agentCode(false), st: 'run' });
      if (A) A.sfx('key');
    }, 800);
    setTimeout(() => {
      setAlog({ n: 3, t: '등재 확인 · 대외판 접속 기록 말소', st: 'ok' });
      V.clear(); V.say('V-SYS-006');
      if (A) A.sfx('connect');
    }, 1700);
    setTimeout(() => {
      setGlitch(true);
      if (A) { A.sfx('redacted'); setTimeout(() => A.sfx('transition'), 360); }
      setTimeout(() => onBypass(), 950);
    }, 2900);
  }, [vals, onBypass]);

  /* 단순 열람 — 승인 번호 없이 들어간다. 명부 대조를 건너뛰고 열람 전용으로 접속 */
  const guest = useCallbackApp(() => {
    if (firedRef.current) return;
    firedRef.current = true;
    setFired(true); setBad([]);
    window.setGuestAgent();
    if (document.activeElement) document.activeElement.blur();
    const A = window.DENDRO_AUDIO;
    if (A) A.sfx('key');
    setAlog({ n: 1, t: '단순 열람 · 명부 대조 생략', st: 'run', of: 2 });
    setTimeout(() => {
      setAlog({ n: 2, t: '열람 전용 접속 · 기록 수정 권한 없음', st: 'ok', of: 2 });
      if (A) A.sfx('connect');
    }, 800);
    setTimeout(() => {
      setGlitch(true);
      if (A) { A.sfx('redacted'); setTimeout(() => A.sfx('transition'), 360); }
      setTimeout(() => onBypass(), 950);
    }, 1900);
  }, [onBypass]);

  /* 한 칸을 고친다. 첫 칸에 RS-26-20301-SIT 처럼 통째로 붙여 넣으면 네 칸에 나눠 넣는다 */
  const change = (i, raw) => {
    const up = String(raw).toUpperCase();
    if (i === 0 && /-/.test(up)) {
      const parts = up.split(/\s*-\s*/);
      if (parts.length >= 4) {
        const next = {}; FIELDS.forEach((f, j) => { next[f.k] = (parts[j] || '').replace(f.re, '').slice(0, f.len); });
        setVals(next); setBad([]);
        inputs.current.site?.focus();
        return;
      }
    }
    const f = FIELDS[i];
    const v = up.replace(f.re, '').slice(0, f.len);
    setVals(o => ({ ...o, [f.k]: v }));
    if (bad.includes(f.k)) setBad(b => b.filter(x => x !== f.k));
    if (alog && alog.st === 'bad') setAlog(null);
    if (v.length === f.len && i < FIELDS.length - 1) inputs.current[FIELDS[i + 1].k]?.focus();
  };
  const keyDown = (i, e) => {
    const el = e.currentTarget;
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
    else if (e.key === 'Backspace' && !el.value && i > 0) { e.preventDefault(); inputs.current[FIELDS[i - 1].k]?.focus(); }
    else if (e.key === 'ArrowLeft' && el.selectionStart === 0 && el.selectionEnd === 0 && i > 0) { e.preventDefault(); inputs.current[FIELDS[i - 1].k]?.focus(); }
    else if (e.key === 'ArrowRight' && el.selectionStart === el.value.length && i < FIELDS.length - 1) { e.preventDefault(); inputs.current[FIELDS[i + 1].k]?.focus(); }
    else if (e.key === '-' && el.value && i < FIELDS.length - 1) { e.preventDefault(); inputs.current[FIELDS[i + 1].k]?.focus(); }
  };

  /* 입력 칸이 열리기 전에는 Enter·Space가 버튼과 같다 */
  useEffectApp(() => {
    if (asking) return;
    const onKey = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ask(); } };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [asking, ask]);

  return (
    <div className={`portal-view ${glitch ? 'is-glitching' : ''}`}>
      <span className="pt-frame tl"/><span className="pt-frame tr"/>
      <span className="pt-frame bl"/><span className="pt-frame br"/>
      <div className="pt-stage">
        <div className="pt-seal">
          <IbaSealBF kind="lockupV" bg="var(--bg)" className="pt-seal__main" title="IBA 국제기록보존기구 대외판 세로 락업"/>
          <IbaSealBF kind="lockupV" bg="var(--bg)" color="#ff4422" className="pt-seal__ghost pt-seal__ghost--r"/>
          <IbaSealBF kind="lockupV" bg="var(--bg)" color="#4ad6e0" className="pt-seal__ghost pt-seal__ghost--c"/>
        </div>
        <div className="pt-auth">
          {!asking ? (
            <button className="pt-bypass" onClick={ask}>
              <span aria-hidden="true">◇</span><span>배속 승인 번호 입력</span>
            </button>
          ) : (
            <form className={`pt-code ${fired ? 'is-ok' : ''} ${shake ? 'sh-' + (shake % 2 + 1) : ''}`}
                  onSubmit={(e) => { e.preventDefault(); submit(); }} autoComplete="off">
              {FIELDS.map((f, i) => (
                <React.Fragment key={f.k}>
                  {i > 0 && <span className="pt-code__dash" aria-hidden="true">-</span>}
                  <label className={`pt-code__cell pt-code__cell--${f.k} ${bad.includes(f.k) ? 'is-bad' : ''}`}>
                    <input ref={el => { inputs.current[f.k] = el; }} value={vals[f.k]} placeholder={f.ph}
                           maxLength={i === 0 ? 24 : f.len} inputMode={f.mode} spellCheck={false} autoCapitalize="characters"
                           disabled={fired} aria-label={f.cap} aria-invalid={bad.includes(f.k) || undefined}
                           style={{ width: `calc(${f.len * 1.1}ch + 26px)` }}
                           onChange={e => change(i, e.target.value)} onKeyDown={e => keyDown(i, e)}
                           onFocus={e => e.target.select()}/>
                    <span className="pt-code__cap">{f.cap}</span>
                  </label>
                </React.Fragment>
              ))}
              <div className="pt-code__gocol">
                <button type="submit" className="pt-code__go" disabled={fired}>
                  <span aria-hidden="true">▸</span><span>인증</span>
                </button>
                <button type="button" className="pt-code__guest" onClick={guest} disabled={fired}
                        title="승인 번호 없이 열람 전용으로 들어간다">단순 열람 ▸</button>
              </div>
            </form>
          )}
          {alog && (
            <div className={`pt-alog is-${alog.st}`} key={alog.n + alog.st} aria-live="polite">
              {alog.n > 0 && <span className="pt-alog__n">{alog.n}/{alog.of || 3}</span>}
              <span className="pt-alog__t">{alog.t}</span>
              {alog.st === 'run' && <span className="pt-alog__dots" aria-hidden="true"><i/><i/><i/></span>}
            </div>
          )}
        </div>
        <div className={`pt-vline ${vline && vline.id === 'V-SYS-006' ? 'is-ok' : ''} ${vline && vline.id === 'V-SYS-007' ? 'is-bad' : ''}`} aria-live="polite">
          {vline && <><span className="pt-vline__id">{vline.id}</span><span className="pt-vline__t">{vline.text}</span></>}
        </div>
      </div>
      <div className="pt-noise" aria-hidden="true"/>
      <div className="pt-flash" aria-hidden="true"/>
    </div>
  );
}

// ====================================================================
// LANDING VIEW — 대문 (Record Archive)
// ====================================================================
function Landing({ onConnect }) {
  const [warping, setWarping] = useStateApp(false);
  const stageRef = useRefApp(null);

  // Typewriter loop for route lines
  useEffectApp(() => {
    const routes = stageRef.current?.querySelectorAll('.lv-route') || [];
    if (!routes.length) return;
    let ri = 0, timer = null, nextTimer = null;
    let cancelled = false;
    const typeNext = () => {
      if (cancelled) return;
      if (ri >= routes.length) {
        // 모든 줄 타이핑 완료 — 더 이상 반복하지 않고, 마지막 상태(전부 표시)로 고정
        routes.forEach(r => {
          r.textContent = r.dataset.text;
          r.classList.add('lv-route--done');
        });
        return;
      }
      const el = routes[ri];
      const text = el.dataset.text;
      let i = 0;
      el.textContent = '';
      el.classList.remove('lv-route--done');
      timer = setInterval(() => {
        el.textContent = text.slice(0, ++i);
        if (i >= text.length) {
          clearInterval(timer);
          el.classList.add('lv-route--done');
          ri++;
          nextTimer = setTimeout(typeNext, 360);
        }
      }, 28);
    };
    typeNext();
    return () => { cancelled = true; if (timer) clearInterval(timer); if (nextTimer) clearTimeout(nextTimer); };
  }, []);

  const go = useCallbackApp(() => {
    setWarping(true);
    setTimeout(() => onConnect(), 900);
  }, [onConnect]);

  // Enter / Space / C activates CONNECT
  useEffectApp(() => {
    const onKey = (e) => {
      if (warping) return;
      if (e.key === 'Enter' || e.key === ' ' || e.key.toLowerCase() === 'c') {
        e.preventDefault(); go();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [warping, go]);

  return (
    <div className="landing-view">
      {/* 배경 — 제2국 내부판 인장을 흐리게 */}
      <div className={`lv-bgseal ${warping ? 'is-warping' : ''}`} aria-hidden="true">
        <IbaSealBF kind="internal" bg="var(--bg)"/>
      </div>
      <span className="lv-frame tl"/><span className="lv-frame tr"/>
      <span className="lv-frame bl"/><span className="lv-frame br"/>

      <div ref={stageRef} className={`lv-stage ${warping ? 'is-warping' : ''}`}>
        <main className="lv-center">
          <div className="lv-kicker">
            <span>▸ INTERNATIONAL BUREAU OF ARCHIVES</span>
            <span className="sep">·</span>
            <b>IBA</b>
            <span className="sep">·</span>
            <span>국제기록보존기구</span>
          </div>
          <div className="lv-alertrow">
            <div className="lv-tri" aria-hidden="true">
              <svg viewBox="0 0 80 80" fill="none">
                <path d="M40 6 L74 70 L6 70 Z" stroke="#2fae5e" strokeWidth="3" strokeLinejoin="round"/>
                <path d="M40 28 L40 52" stroke="#2fae5e" strokeWidth="3.5" strokeLinecap="square"/>
                <circle cx="40" cy="60" r="2.5" fill="#2fae5e"/>
              </svg>
            </div>
            <h1 className="lv-title" data-text="기록보관소 접근 주의">기록보관소 접근 주의</h1>
          </div>
          <div className="lv-sub">CLEARANCE GRANTED &nbsp; · &nbsp; ARCHIVE ACCESS · RO-4</div>

          <div className="lv-checks">
            <span className="lv-check">SESSION TOKEN VERIFIED</span>
            <span className="lv-check">ORIGIN SIGNATURE CONFIRMED</span>
            <span className="lv-check">ARCHIVE INTEGRITY VERIFIED</span>
          </div>

          <div className="lv-routes lv-routes--ko">
            <span className="lv-route" data-text="현재 고대부터 현대까지 전 구간 기록에 접근 중입니다.">현재 고대부터 현대까지 전 구간 기록에 접근 중입니다.</span>
            <span className="lv-route" data-text="열람만 가능합니다. 기록 본문은 수정할 수 없습니다.">열람만 가능합니다. 기록 본문은 수정할 수 없습니다.</span>
          </div>

          <div className="lv-observed">
            <span>ACCESSING AGENT</span>
            <b>{window.agentCode(false)}</b>
            <span style={{color:'var(--amber-dim)'}}>·</span>
            <span>IBA · D-II · RO-4 / KR-04 / {window.agentDept(false)}</span>
          </div>

          <div className="lv-actions lv-actions--single">
            <button className="lv-btn lv-btn--primary" autoFocus onClick={go}>
              <span>◆</span><span>CONNECT</span>
            </button>
          </div>

          <div className="lv-trunk-deco" aria-hidden="true">
            <svg viewBox="0 0 820 120" preserveAspectRatio="none">
              <defs>
                <linearGradient id="lv-grad" x1="0" x2="1">
                  <stop offset="0" stopColor="#2fae5e" stopOpacity="0"/>
                  <stop offset=".3" stopColor="#2fae5e" stopOpacity=".9"/>
                  <stop offset="1" stopColor="#56cf85"/>
                </linearGradient>
              </defs>
              <line x1="40" y1="60" x2="240" y2="60" stroke="url(#lv-grad)" strokeWidth="2"/>
              <path d="M 240 60 C 320 60, 320 12, 460 12" fill="none" stroke="#2fae5e" strokeWidth="2" strokeLinecap="round"/>
              <path d="M 240 60 C 320 60, 320 36, 460 36" fill="none" stroke="#2fae5e" strokeWidth="2" strokeLinecap="round"/>
              <path d="M 240 60 C 320 60, 320 84, 460 84" fill="none" stroke="#2fae5e" strokeWidth="2" strokeLinecap="round"/>
              <path d="M 240 60 C 320 60, 320 108, 460 108" fill="none" stroke="#2fae5e" strokeWidth="2" strokeLinecap="round"/>
              <line x1="460" y1="12" x2="780" y2="12" stroke="#2fae5e" strokeWidth="1" strokeDasharray="3 5"/>
              <line x1="460" y1="36" x2="780" y2="36" stroke="#2fae5e" strokeWidth="1" strokeDasharray="3 5"/>
              <line x1="460" y1="84" x2="780" y2="84" stroke="#2fae5e" strokeWidth="1" strokeDasharray="3 5"/>
              <line x1="460" y1="108" x2="780" y2="108" stroke="#2fae5e" strokeWidth="1" strokeDasharray="3 5"/>
              <rect x="32" y="52" width="16" height="16" transform="rotate(45 40 60)" fill="#56cf85" stroke="#2fae5e" strokeWidth="1.5"/>
            </svg>
          </div>
        </main>
      </div>
    </div>
  );
}

// ====================================================================
// LOADER VIEW — Globe / Temporal Loop
// ====================================================================
function Loader({ onDone }) {
  const vline = window.useVestigia();
  // 연표 로드 시작 V-RD-001 → 완료 V-RD-002
  useEffectApp(() => {
    const V = window.VESTIGIA;
    V.clear(); V.say('V-RD-001');
    const t = setTimeout(() => V.say('V-RD-002'), 2400);
    return () => clearTimeout(t);
  }, []);
  useEffectApp(() => {
    const t = setTimeout(onDone, 3600);
    const onKey = (e) => {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { e.preventDefault(); onDone(); }
    };
    window.addEventListener('keydown', onKey);
    return () => { clearTimeout(t); window.removeEventListener('keydown', onKey); };
  }, [onDone]);

  return (
    <div className="loader-view" onClick={onDone}>
      <div className="lo-shell">
        {/* 좌상/우상 모서리는 ::before/::after로 그려지므로 좌하/우하만 명시 */}

// ====================================================================
// TIMELINE TERMINAL — the existing IBA app
// ====================================================================
function Terminal({ onReboot }) {
  const [tracks, setTracks] = useStateApp({ korea: true, eastasia: true, west: true, westasia: true });
  const [query, setQuery] = useStateApp('');
  const [selectedId, setSelectedId] = useStateApp(null);
  const [syncOpenId, setSyncOpenId] = useStateApp(null);
  const [focusedTrack, setFocusedTrack] = useStateApp(null);
  // 접속 구분 — 'researcher' 연구원 접속(기본) / 'response' 대응반 접속(위험 노드 노출)
  const [accessMode, setAccessMode] = useStateApp('researcher');
  const modeRef = useRefApp('researcher');
  const changeAccessMode = useCallbackApp((m) => {
    const prev = modeRef.current; modeRef.current = m;
    setAccessMode(m);
    // 배경음악 구역도 함께 전환 (재생 중일 때만 들린다)
    if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.zone(m === 'response' ? 1 : 0);
    // LUMINA 구역 진입·이탈 — V-ZN-001 → 002 (경보음 뒤) / V-ZN-003
    if (m === prev) return;
    if (m === 'response') { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('alert'); window.VESTIGIA.chain(['V-ZN-001', 'V-ZN-002']); }
    else window.VESTIGIA.say('V-ZN-003');
  }, []);
  useEffectApp(() => () => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.zone(0); }, []);

  /* VESTIGIA — 접속 완료(V-SYS-009 → 010), 관내 방송 순환, 장시간 무입력(V-SYS-015 · 3분) */
  useEffectApp(() => {
    const V = window.VESTIGIA;
    V.chain(['V-SYS-009', 'V-SYS-010']);
    V.broadcast(true);
    let idle = null;
    const arm = () => { clearTimeout(idle); idle = setTimeout(() => V.say('V-SYS-015'), 180000); };
    const evs = ['pointerdown', 'keydown', 'wheel'];
    evs.forEach(ev => window.addEventListener(ev, arm, { passive: true }));
    arm();
    return () => { V.broadcast(false); clearTimeout(idle); evs.forEach(ev => window.removeEventListener(ev, arm)); };
  }, []);

  useEffectApp(() => {
    const onKey = (e) => {
      if (e.key === 'Escape' && !syncOpenId) setFocusedTrack(null);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [syncOpenId]);

  const selected = TIMELINE_DATA.events.find(e => e.id === selectedId);
  // 노드 열기 V-RD-004 (대응반 접속에서 위험 노드면 V-ZN-009) · 닫기 V-RD-005
  const prevSel = useRefApp(null);
  useEffectApp(() => {
    const was = prevSel.current; prevSel.current = selectedId;
    if (selectedId === was) return;
    if (!selectedId) { window.VESTIGIA.say('V-RD-005'); return; }
    const ev = TIMELINE_DATA.events.find(e => e.id === selectedId);
    window.VESTIGIA.say(ev && ev.risk && accessMode === 'response' ? 'V-ZN-009' : 'V-RD-004');
  }, [selectedId]);
  // 기록줄기 포커스·표시 — V-RD-008 선택한 줄기만 / V-RD-009 모두
  const firstTrackRun = useRefApp(true);
  useEffectApp(() => {
    if (firstTrackRun.current) { firstTrackRun.current = false; return; }
    const all = !focusedTrack && Object.values(tracks).every(Boolean);
    window.VESTIGIA.say(all ? 'V-RD-009' : 'V-RD-008');
  }, [focusedTrack, tracks]);
  const syncedEvent = syncOpenId ? TIMELINE_DATA.events.find(e => e.id === syncOpenId) : null;
  // 같은 기록을 세 번째 여는 때부터 — V-RD-016 [n]회 (이 접속 동안 센다)
  const viewCount = useRefApp({});
  const openSync = useCallbackApp((id) => {
    if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('open');
    const n = viewCount.current[id] = (viewCount.current[id] || 0) + 1;
    if (n >= 3) window.VESTIGIA.say('V-RD-016', { n, hold: true });   // 뒤따르는 부속 자료 알림이 덮지 않게
    setSyncOpenId(id);
  }, []);
  const closeSync = useCallbackApp(() => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('close'); setSyncOpenId(null); }, []);
  const jumpTo = useCallbackApp((id) => { setSelectedId(id); setSyncOpenId(id); }, []);
  const onFocusTrack = useCallbackApp((trackId) => setFocusedTrack(trackId), []);
  // 원줄기 연결 — 멸망/연계 노드에서 본체 노드로 이동 (포커스 + 선택, sync dialog는 열지 않음)
  const jumpToNode = useCallbackApp((id) => {
    const ev = window.TIMELINE_DATA.events.find(e => e.id === id);
    if (!ev) return;
    setFocusedTrack(ev.track);
    setSelectedId(id);
  }, []);

  // Expose a global reboot hook so TopBar (rendered without props) can use it
  useEffectApp(() => { window.__tmbReboot = onReboot; return () => { delete window.__tmbReboot; }; }, [onReboot]);

  // 이미지 라이트박스 — 기록 열람 내 모든 이미지 클릭 시 확대 표시
  const [lightbox, setLightbox] = useStateApp(null);
  useEffectApp(() => {
    window.__tmbLightbox = (src, alt) => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('open'); setLightbox({ src, alt: alt || '' }); };
    return () => { delete window.__tmbLightbox; };
  }, []);
  // 묶음 라벨 클릭 시 MemoryDetail만 열기용 전역 함수 (사용자가 기록 열람 버튼으로 SyncDialog 열도록)
  useEffectApp(() => {
    window.__tmbJumpTo = (id) => { setSelectedId(id); };
    window.__tmbJumpToNode = jumpToNode;   // 연관 기록 대조 결과 — 그 기록줄기로 포커스 + 선택
    return () => { delete window.__tmbJumpTo; delete window.__tmbJumpToNode; };
  }, []);
  window.useEscLayer(!!lightbox, () => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('close'); setLightbox(null); });

  return (
    <div className={`app timeline-root ${accessMode === 'response' ? 'is-response' : ''}`}>
      <TopBar accessMode={accessMode} onAccessMode={changeAccessMode}/>
      <SubNav
        tracks={tracks} setTracks={setTracks}
        query={query} setQuery={setQuery}
        focusedTrack={focusedTrack} onFocusTrack={onFocusTrack}
        accessMode={accessMode}
      />
      <div className="main">
        <TimelineCanvas
          tracks={tracks} query={query}
          selectedId={selectedId} onSelect={setSelectedId}
          focusedTrack={focusedTrack} onFocusTrack={onFocusTrack}
          accessMode={accessMode}
        />
        <MemoryDetail event={selected} accessMode={accessMode} onSync={openSync} onJumpTo={jumpToNode} onClose={() => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('close'); setSelectedId(null); }}/>
      </div>
      <Footer event={selected} focusedTrack={focusedTrack} accessMode={accessMode}/>
      <SyncDialog event={syncedEvent} onClose={closeSync} onJumpTo={jumpTo} accessMode={accessMode}/>
      {lightbox && (
        <div className="tmb-lightbox" onClick={() => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('close'); setLightbox(null); }} role="dialog" aria-modal="true">
          <button className="tmb-lightbox__close" onClick={() => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('close'); setLightbox(null); }} aria-label="닫기">✕</button>
          <img className="tmb-lightbox__img" src={lightbox.src} alt={lightbox.alt} onClick={(e) => e.stopPropagation()}/>
          <div className="tmb-lightbox__hint">▸ CLICK · ESC TO CLOSE</div>
        </div>
      )}
    </div>
  );
}

// ====================================================================
// BRIEFING VIEW — VESTIGIA 기본 규정 안내 다이얼로그
// ====================================================================
/* VESTIGIA 말풍선 — 문형 목록의 문구만 쓴다: 브리핑 시작 V-SYS-008 → 규정 V-RL-001~008 → 기동 직후 V-SYS-002 */
const IBA_DOCTRINE = [
  window.VESTIGIA.text('V-SYS-008'),
  '',
  '【 기본 규정 】',
  '',
  '제1조 (보존)   기록은 보존한다.',
  '제2조 (불가침) 기록 본문은 수정하지 아니한다.',
  '제3조 (주석)   해석은 주석으로만 존재한다.',
  '제4조 (불개입) 과거에 개입하지 아니한다.',
  '제5조 (보안)   제2국의 존재 및 활동은 공표하지 아니한다.',
  '제6조 (실격)   제2조 및 제4조를 위반한 자는 구성원이 아니다.',
  '',
  '본 규정은 기구 설립 이래 개정된 바 없다.',
  '본 문서의 사본 제작을 금한다.',
  '',
  '— ' + window.VESTIGIA.text('V-SYS-002').replace(/\.$/, '') + ' —',
];

function Briefing({ onEnter }) {
  const [typed, setTyped] = useStateApp('');
  const [done, setDone]   = useStateApp(false);
  const fullText = IBA_DOCTRINE.join('\n');

  useEffectApp(() => {
    let i = 0;
    let cancelled = false;
    // 타자기 타건음 — 출력 속도가 초당 250자라 글자마다 울리면 소음이 된다.
    // 최소 간격을 두어 실제 타자기에 가까운 속도로 솎아낸다.
    let lastKey = 0;
    const KEY_MIN_GAP = 55; // ms
    // mascot이 도착하기 직전에 타이핑 시작 → 사용자가 빈 말풍선을 오래 보지 않음
    const startTimer = setTimeout(() => {
      const tick = () => {
        if (cancelled) return;
        // 한 번에 여러 글자씩 출력하여 체감 속도 향상
        i = Math.min(i + 1, fullText.length);
        setTyped(fullText.slice(0, i));
        if (i >= fullText.length) { setDone(true); return; }
        // pause longer on newlines and periods (모든 지연을 절반 이하로 단축)
        const ch = fullText[i - 1];
        const A = window.DENDRO_AUDIO;
        if (A) {
          const now = Date.now();
          if (ch === '\n') { A.sfx('carriageReturn'); lastKey = now; }
          else if (ch !== ' ' && now - lastKey >= KEY_MIN_GAP) { A.sfx('key'); lastKey = now; }
        }
        const delay = (ch === '\n') ? 120 : (ch === '.' || ch === '】' || ch === ',') ? 60 : 16;
        setTimeout(tick, delay);
      };
      tick();
    }, 500);
    return () => { cancelled = true; clearTimeout(startTimer); };
  }, [fullText]);

  // ENTER / SPACE: skip typing or, if done, proceed
  useEffectApp(() => {
    const onKey = (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (done) onEnter();
        else { setTyped(fullText); setDone(true); }
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [done, fullText, onEnter]);

  return (
    <div className="briefing-view">
      <div className="bf-win">
        <span className="bf-c-bl"/><span className="bf-c-br"/>
        <div className="bf-head">
          <span className="bf-head__title">▸ IBA DIRECTIVE · BRIEFING</span>
          <span className="bf-head__sub">국제기록보존기구 기본 규정</span>
          <span className="bf-head__id">FILE DR-0001-K</span>
        </div>
        <div className="bf-body">
          {/* IBA 제2국 내부판 인장 — 규정 좌측 */}
          <div className="bf-seal" role="img" aria-label="IBA 국제기록보존기구 제2국 인장">
            <IbaSealBF kind="internal" bg="var(--panel)"/>
          </div>

          {/* 말풍선 — 규정 타이핑 */}
          <div className="bf-bubble" role="article" aria-label="IBA 기본 규정">
            <div className="bf-bubble-head">
              <span className="who">▸ VESTIGIA</span>
              <span style={{color:'var(--amber-dim)'}}>·</span>
              <span>IBA · 기록 검색 보조 시스템</span>
            </div>
            <pre className="bf-doctrine">{typed}{!done && <span className="caret" aria-hidden="true"/>}</pre>
          </div>
        </div>
        <div className="bf-foot">
          <span className="bf-skip">{done ? '규정 확인 완료' : '[ENTER] · [SPACE] TO SKIP TYPING'}</span>
          <button
            className={`bf-enter ${done ? 'is-ready' : ''}`}
            onClick={done ? onEnter : undefined}
            disabled={!done}
          >
            <span>◆</span><span>기록보관소 접속</span>
          </button>
        </div>
      </div>
    </div>
  );
}

// ====================================================================
// ROOT APP — view router: portal → landing → loader → briefing → terminal → (REBOOT → portal)
// ====================================================================
function App() {
  // 'notice' | 'portal' | 'landing' | 'loader' | 'briefing' | 'terminal' — 첫 안내문은 탭마다 한 번
  const [view, setView] = useStateApp(() => { try { return sessionStorage.getItem('iba.notice') ? 'portal' : 'notice'; } catch (e) { return 'notice'; } });
  const rebootRef = useRefApp(false);   // REBOOT로 돌아온 대문 — 열람 종료(V-SYS-017)부터 알린다

  // 접속 시 오디오 장치 기동 — 브라우저 자동재생 정책상 최초 1회는
  // 반드시 사용자 조작(클릭) 안에서 호출되어야 한다.
  // 지속 채널(앰비언트·배경음악)은 기본 OFF이며 상단바에서 직접 켠다.
  const bootAudio = useCallbackApp(() => {
    if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('connect');
  }, []);

  if (view === 'notice')   return <Notice onOk={() => setView('portal')}/>;
  if (view === 'portal')   return <Portal   rebooted={rebootRef.current} onBypass={() => { rebootRef.current = false; setView('landing'); }}/>;
  if (view === 'landing')  return <Landing  onConnect={() => { bootAudio(); setView('loader'); }}/>;
  if (view === 'loader')   return <Loader   onDone={() => setView('briefing')}/>;
  if (view === 'briefing') return <Briefing onEnter={() => { if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('connect'); setView('terminal'); }}/>;
  // REBOOT으로 대문에 돌아가도 켜 둔 배경음악·앰비언트는 끊지 않고 이어 간다 (사용자 요청 2026-10-08)
  return <Terminal onReboot={() => { rebootRef.current = true; setView('portal'); }}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
/* ============================================================
   상호작용 효과음 위임 — DENDRO 오디오 엔진(audio-engine.js, DENDRO_AUDIO) 사용
   기존의 자체 Web Audio 비프음은 제거되었다. AudioContext가 둘로
   늘어나면 모바일에서 리소스 문제가 생기므로 엔진 하나만 쓴다.
   ============================================================ */
(function () {
  /* 열림·닫힘 소리는 상태 핸들러(openSync/closeSync 등)가 직접 낸다.
     여기서 또 울리면 같은 소리가 두 번 겹치므로 아래 요소는 위임에서 제외한다. */
  var SKIP = '.btn-sync, .sync-close, .detail__close, .tl-mapmodal__close,' +
             '.tmb-lightbox__close, .tl-mapbtn, .tmb-zoomable,' +
             '.sync-source__img, .sync-art__img';
  /* 요소 종류별 효과음 배정 — 지시서 3항 표에 따름 */
  var MAP = [
    ['.tl-node, .tl-nodelabel, .tl-nodegroup__label', 'select'],   // 연표 노드 선택
    ['button, [role="button"], a[href], label, select,' +
     'input[type="range"], input[type="checkbox"], input[type="radio"],' +
     '.sync-tab, .sync-linkrow, .trackseg__cell, .systab', 'click']
  ];
  document.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;                 // 좌클릭만
    if (!e.target || !e.target.closest) return;
    if (!window.DENDRO_AUDIO) return;
    if (e.target.closest(SKIP)) return;          // 상태 핸들러가 담당
    // 비활성 메뉴(잠긴 버튼) — 권한 없음
    if (e.target.closest('button:disabled, [aria-disabled="true"]')) { window.DENDRO_AUDIO.sfx('denied'); return; }
    for (var i = 0; i < MAP.length; i++) {
      if (e.target.closest(MAP[i][0])) { window.DENDRO_AUDIO.sfx(MAP[i][1]); return; }
    }
  }, true);                                      // capture — stopPropagation에도 동작
})();
</script>
