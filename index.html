.portal-view .pt-code__go:hover,.portal-view .pt-code__go:focus-visible{border-color:var(--amber);color:var(--amber);background:rgba(47,174,94,.12);text-shadow:0 0 6px var(--amber-glow);box-shadow:0 0 14px var(--amber-glow);outline:none}
.portal-view .pt-code__go[disabled]{cursor:default}
.portal-view .pt-code__gocol{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-left:10px}
.portal-view .pt-code__gocol .pt-code__go{margin-left:0;justify-content:center}
.portal-view .pt-code__guest{padding:0;background:transparent;border:0;cursor:pointer;
  font-family:var(--font-ko);font-size:12px;letter-spacing:.08em;color:var(--amber-dim);text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--amber-line);white-space:nowrap;line-height:1.3}
.portal-view .pt-code__guest:hover,.portal-view .pt-code__guest:focus-visible{color:var(--amber);text-decoration-color:var(--amber);outline:none}
.portal-view .pt-code__guest[disabled]{cursor:default;opacity:.5}
.portal-view .pt-code.is-ok .pt-code__cell input{border-color:var(--amber-2);box-shadow:0 0 12px var(--amber-glow)}
.portal-view .pt-code.sh-1{animation:pt-shake1 .36s ease}
.portal-view .pt-code.sh-2{animation:pt-shake2 .36s ease}
@keyframes pt-shake1{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes pt-shake2{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.portal-view .pt-vline.is-bad .pt-vline__t{color:var(--red)}

/* 배속 승인 — VESTIGIA 문형 표시 줄 (버튼 아래, 자리 고정으로 레이아웃이 흔들리지 않게) */
.portal-view .pt-vline{min-height:22px;display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--font-ko);font-size:14px;letter-spacing:.04em;color:var(--amber-dim)}
.portal-view .pt-vline__id{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;color:var(--amber-dim)}
.portal-view .pt-vline__t{color:var(--amber)}
.portal-view .pt-vline.is-ok .pt-vline__t{color:var(--amber-2)}


/* 코드 블록 안의 두 칸 기호를 한 칸 폭으로 (정본 기준) — 모양은 가로로만 줄인다 */
.d2-pre i.hw{font-style:normal;display:inline-block;width:2ch;margin-right:-1ch;transform:scaleX(.5);transform-origin:0 50%;vertical-align:top}
.d2-pre i.hw-c{width:1ch;margin-right:0;transform:scaleX(.83);transform-origin:0 50%}
/* 제2국 기구 총람(제15판) — 번호 목록 · 제한 열람 층 */
.d2-list--ol{list-style:decimal;padding-left:26px}
.d2-layer{margin:26px 0 0;padding-top:4px;border-top:1px dashed #8f8d84}
.d2-layer .d2-h{display:flex;align-items:baseline;gap:12px}
.d2-layer__st{margin-left:auto;font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;color:#55574f;font-weight:400}
.d2-layer.is-sealed .d2-layer__st{color:#8a1c14}
.d2-layer__sealed{display:flex;flex-direction:column;gap:10px;padding:6px 0 10px;cursor:not-allowed}
.d2-layer__bar{display:block;height:17px}
.d2-layer__end{display:block;height:1px}

/* 기록 두께 게이지 옆 건수 */
.sync-head__ratio-n{font-family:var(--font-ko);font-size:12px;color:var(--amber-dim);margin-top:3px;white-space:nowrap}
/* 부속 자료 — 벽 주해처럼 계단식 */
.annex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.annex-item{border-left:2px solid var(--amber-line);padding:6px 0 6px 14px}
.annex-item--reply{border-left-style:dashed}
.annex-item__meta{display:flex;gap:10px;align-items:baseline;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;color:var(--amber-dim)}
.annex-item__type{color:var(--amber-2);border:1px solid var(--amber-line);padding:0 6px;font-family:var(--font-ko);letter-spacing:.02em}
.annex-item__re{color:var(--amber)}
.annex-item__body{margin:6px 0 0;font-family:var(--font-ko);font-size:16px;line-height:1.75;color:var(--amber)}
/* 데이터로 지정한 말소 구간 — 제1종(부속 자료 등재 시 복원) · 제2종(복원 불가) */
.rec-redact{background:#050505;color:transparent;border-radius:1px;padding:0 2px;cursor:help;user-select:none;box-decoration-break:clone;-webkit-box-decoration-break:clone;word-break:break-all}
.rec-redact--2{outline:1px solid rgba(255,68,34,.35)}

/* 현재 위치 표시 (연표 머리줄) */
.canvas__pos{flex:1 1 0;margin:0 14px;display:flex;align-items:center;gap:8px;font-family:var(--font-ko);font-size:13px;color:var(--amber);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.canvas__pos span{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;color:var(--amber-dim)}
.canvas__pos span::after{content:' ·'}

/* 머리줄 폭이 모자라면 제목 꼬리를 빼서 현재 위치 표시에 자리를 준다 */
.canvas__title{white-space:nowrap;flex:none}
@media (max-width:1700px){ .canvas__title-x{display:none} }
html.lecture .canvas__title{display:none}
/* ============================================================

<!-- DENDRO 오디오 엔진 — 효과음·앰비언트·배경음악 실시간 합성 (음원 파일 없음) -->
<script>
/* ESC 층 관리 — 열린 창을 쌓아 두고 ESC 한 번에 맨 위 창 하나만 닫는다.
   window 캡처 단계에서 가장 먼저 등록되므로, 창이 하나라도 열려 있으면 다른 ESC 처리(초점 해제 등)는 실행되지 않는다. */
(function () {
  var stack = [];
  window.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !stack.length) return;
    e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation();
    stack[stack.length - 1].fn();

  window.IBA_ESC = {
    push: function (fn) {
      var h = { fn: fn }; stack.push(h);
      return function () { var i = stack.indexOf(h); if (i >= 0) stack.splice(i, 1); };
    },
    size: function () { return stack.length; }
  };
  /* 연도 표기 — 기원전은 BCE, 기원후는 CE.
     노드에 yearLabel(교과서에 적힌 범위, 예: '약 70만 년 전 ~')이 있으면 배치용 year 대신 그것을 보인다 */
  window.fmtYear = function (y) { return y < 0 ? (-y) + ' BCE' : y + ' CE'; };
  window.eventYearText = function (e) { return (e && e.yearLabel) || window.fmtYear(e.year); };
  window.tlYearText = function (t) { return t.yl || window.fmtYear(t.y); };   // 기록 안 미니 연표 항목
  /* 청구 기호용 연도 코드 — MEM--3100 처럼 하이픈이 겹치지 않게 */
  window.eventYearCode = function (e) {
    var L = e.yearLabel;
    if (L) {
      if (/만 년 전/.test(L)) return 'PH';
      var bce = /BCE/.test(L);
      var c = L.match(/(\d+)(?:~\d+)?세기/); if (c) return (bce ? 'B' : 'C') + c[1] + 'C';
      var n = L.match(/(\d+)/); if (n) return bce ? 'B' + n[1] : n[1].padStart(4, '0');
      return 'PH';
    }
    return e.year < 0 ? 'B' + (-e.year) : String(e.year).padStart(4, '0');
  };
  /* 화면용 출처 정리 — 교과서 출처(교재 코드·출판사·교재명·쪽수·단원명)만 지우고 사료명·소장처·설명은 남긴다.
     남는 것이 없으면 '' — 그 줄은 화면에 내지 않는다. (데이터 원문은 검증용으로 그대로 둔다) */
  window.cleanCite = function (s) {
    if (!s) return '';
    var TB = /^(?:K[1-4]|W[1-6]|WN|BS|DH1|DA)(?:\b|$)|미래엔|비상교육|비상 |동아출판|천재|교과서|역사 기행|세계사 연표|정리 탭|고등 한국사|^한국사\s?[12Ⅰ-Ⅳ]|단원|판서|사료 톡톡|대조 정리|주제 마무리|^주제 (?:탐구|토론)$|선사시대 보충|^보충$|PDF\s?\d|^p{1,2}\.\s?\d|^[\d\s,~–-]+$/;
    var keep = [];
    s = String(s).replace(/^\s*[—-]\s*/, '')
      .replace(/\(([^()]*『[^()]*)\)/g, function (_, inner) { keep.push(inner.trim()); return ''; })   // 쪽수 괄호 속 사료명은 살린다
      .replace(/\(\s*PDF\s*\d+\s*\)/g, '');
    var piece = function (x) {
      x = x.trim().replace(/^교과서(?: 탐구)? 자료(?: 미배치)?\s*/, '').replace(/^\((.*)\)$/, '$1').trim();
      return x && !TB.test(x) ? x : '';
    };
    var seg = function (t) { return t.split(/,\s+/).map(piece).filter(Boolean).join(', '); };
    var dot = function (t) { return t.split(/\s+·\s+/).map(seg).filter(Boolean).join(' · '); };
    var dash = function (t) { return t.split(/\s+—\s+/).map(dot).filter(Boolean).join(' — '); };
    return s.split(/\s+\/\s+/).map(dash).filter(Boolean).concat(keep).join(' / ').replace(/\s{2,}/g, ' ').trim();
  };
  /* 기록 두께 (DENDRO P3-3) — 부속 자료(annex) 수와 출처(사료·탐구 자료) 수로 잰다. 기준은 이 한 곳에서 바꾼다.
     부속 자료가 한 건도 없으면 출처가 많아도 「얇음」이다 (정본 제09장 · 기록의 두께) */
  window.RECORD_THICKNESS = window.RECORD_THICKNESS || { annexWeight: 3, sourceWeight: 1, thick: 12, full: 24, thinCap: 0.3 };
  window.recordThickness = function (db) {
    var C = window.RECORD_THICKNESS;
    var annexN = (db && Array.isArray(db.annex)) ? db.annex.length : 0;
    var srcN = (db && Array.isArray(db.sources)) ? db.sources.filter(function (s) { return !s.ph; }).length : 0;
    var score = annexN * C.annexWeight + srcN * C.sourceWeight;
    var level = annexN === 0 ? '얇음' : (score >= C.thick ? '두꺼움' : '보통');
    var fill = Math.min(1, score / C.full);
    if (annexN === 0) fill = Math.min(fill, C.thinCap);
    return { annexN: annexN, srcN: srcN, score: score, level: level, fill: fill };
  };
  /* 말소 (DENDRO P3-6) — 노드 데이터 redacted: [{ field: 'body'|'summary'|'sources', text: '가릴 구간', kind: 1|2 }]
     위치와 종류는 데이터에서만 정한다(자동 생성 금지). 제1종은 부속 자료가 등재되면 걷히고, 제2종은 걷히지 않는다 */
  window.redactText = function (text, db, field) {
    var list = (db && Array.isArray(db.redacted)) ? db.redacted.filter(function (r) { return r && r.field === field && r.text; }) : [];
    if (!text || !list.length) return text;
    var annexed = !!(db.annex && db.annex.length);
    var out = [String(text)];
    list.forEach(function (r, ri) {
      if (r.kind === 1 && annexed) return;   // 제1종 — 부속 자료 등재로 걷힘
      var next = [];
      out.forEach(function (piece) {
        if (typeof piece !== 'string') { next.push(piece); return; }
        var parts = piece.split(r.text);
        parts.forEach(function (p, pi) {
          if (pi > 0) next.push(React.createElement('span', {
            key: 'rd' + ri + '-' + pi + '-' + next.length, className: 'rec-redact rec-redact--' + (r.kind === 2 ? 2 : 1),
            title: r.kind === 2 ? '[말소 · 제2종] — 복원 불가' : '[말소 · 제1종] — 복원 대기 · 부속 자료 미등재'
          }, r.text));
          if (p) next.push(p);
        });
      });
      out = next;
    });
    return out;
  };
  /* 요원 등록 코드 — [부서]-[배속 연도 두 자리]-[등록 일련번호]-[출입 관측소] (정본 제05장).
     첫 화면의 배속 승인 번호 입력이 IBA_AGENT를 채운다(window.setAgent). 같은 탭에서는 sessionStorage로 유지.
     대응반 접속 중에는 부서 자리만 DA-R로 바뀐다(정본: 부서 이동 시 앞자리만 바뀐다) */
  var AGENT_KEY = 'iba.agent';
  window.IBA_DEPTS = { AR: { name: '기록관리과', rank: '기록관' }, RS: { name: '연구과', rank: '연구원' },
                       FS: { name: '현장조사과', rank: '조사관' }, DA: { name: '분기평가과', rank: '평가관' } };
  window.IBA_AGENT = window.IBA_AGENT || { dept: 'RS', year: '26', serial: '20301', site: 'SIT' };
  try { var _ag = JSON.parse(sessionStorage.getItem(AGENT_KEY) || 'null'); if (_ag && (_ag.guest || window.IBA_DEPTS[_ag.dept])) window.IBA_AGENT = _ag; } catch (e) {}
  /* 형식 검사 — 맞지 않는 자리 이름 목록을 돌려준다(빈 배열이면 통과) */
  window.checkAgent = function (a) {
    var bad = [];
    if (!window.IBA_DEPTS[a.dept]) bad.push('dept');
    if (!/^\d{2}$/.test(a.year)) bad.push('year');
    if (!/^\d{5}$/.test(a.serial)) bad.push('serial');
    if (!/^[A-Z]{3}$/.test(a.site)) bad.push('site');
    return bad;
  };
  window.setAgent = function (a) {
    window.IBA_AGENT = { dept: a.dept, year: a.year, serial: a.serial, site: a.site };
    try { sessionStorage.setItem(AGENT_KEY, JSON.stringify(window.IBA_AGENT)); } catch (e) {}
  };
  /* 단순 열람 — 승인 번호 없이 들어온 접속. 명부에 없으므로 코드 대신 「미등재」로 표시한다 */
  window.setGuestAgent = function () {
    window.IBA_AGENT = { guest: true, dept: '', year: '', serial: '', site: 'SIT' };
    try { sessionStorage.setItem(AGENT_KEY, JSON.stringify(window.IBA_AGENT)); } catch (e) {}
  };
  window.isGuestAgent = function () { return !!(window.IBA_AGENT && window.IBA_AGENT.guest); };
  window.agentDept = function (resp) { return resp ? 'DA-R' : (window.isGuestAgent() ? '—' : (window.IBA_AGENT.dept || 'RS')); };
  window.agentRank = function (resp) { return resp ? '대응요원' : (window.isGuestAgent() ? '열람자' : window.IBA_DEPTS[window.agentDept(false)].rank); };
  /* 정리 내용이 실제로 있는지 — 빈 정리({ sections: [] })는 탭만 두고 내용은 없는 것으로 친다 */
  window.hasNotes = function (db) { var n = db && db.notes; if (!n) return false; if (typeof n === 'string') return !!n.trim(); return !!(n.summary || (Array.isArray(n.sections) && n.sections.length)); };
  window.agentCode = function (resp) {
    var a = window.IBA_AGENT;
    if (a.guest) return resp ? 'DA-R · 미등재' : '미등재 · 단순 열람';
    return window.agentDept(resp) + '-' + a.year + '-' + a.serial + '-' + a.site;
  };
  /* 청구 기호 — 화면에는 내부 ID 대신 이것을 쓴다 (예: REC-0698-K) */
  window.eventCallNo = function (e) { return 'REC-' + window.eventYearCode(e) + '-' + String(e.id || e.track || '?')[0].toUpperCase(); };   // K 한국 · E 동아시아 · W 서양 · S 서아시아·인도
  /* React 훅 — active 동안 창을 한 층으로 올린다. 닫기 함수는 항상 최신 것을 쓴다 */
  window.useEscLayer = function (active, fn) {
    var ref = React.useRef(fn); ref.current = fn;
    React.useEffect(function () {
      if (!active) return;
      return window.IBA_ESC.push(function () { ref.current(); });
    }, [!!active]);
  };
})();
/* 강의 모드 — L 키 토글. 프로젝터 투사용으로 CRT 효과를 끄고 전체를 1.4배로 키운다.
   <html class="lecture"> 로 표시하고 'iba:lecture' 이벤트로 알린다(오디오·인장은 TopBar가 처리).
   글자 입력 중이거나 조합 키를 누른 경우는 무시한다. 세션 동안 유지된다. */
(function () {
  var KEY = 'iba.lecture';
  var root = document.documentElement;
  function set(on) {
    root.classList.toggle('lecture', on);
    try { sessionStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {}
    window.dispatchEvent(new CustomEvent('iba:lecture', { detail: { on: on } }));
  }
  window.IBA_LECTURE = {
    on: function () { return root.classList.contains('lecture'); },
    set: set,
    toggle: function () { set(!root.classList.contains('lecture')); }
  };
  try { if (sessionStorage.getItem(KEY) === '1') root.classList.add('lecture'); } catch (e) {}
  window.addEventListener('keydown', function (e) {
    if (e.code !== 'KeyL' || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    var t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    e.preventDefault();
    window.IBA_LECTURE.toggle();
  });
})();
/* VESTIGIA 문형 (DENDRO P4-1) — vestigia_lines.csv 126행의 화면 문구. 문안은 고치지 않는다.

  function make(id, o) {
    o = o || {};
    if (!LINES[id]) id = 'V-ER-001';
    return { id: id, situation: LINES[id][0], text: text(id, o.n), n: o.n, hold: o.hold != null ? !!o.hold : holds(id), at: Date.now(), seq: ++seq };
  }
  /* 관내 방송(V-BC)은 차임을 먼저 울린다. 음성 안내가 붙으면 VESTIGIA.voice(line)을 차임 뒤에 부른다
     (AUDIO_INTEGRATION 8항 — 차임 → 음성 → 끊김음. 지금은 voice가 비어 있어 차임만) */
  var CHIME_MS = 2400;   // 딩동댕동 네 음이 끝난 뒤
  function emit(line) {
    line.at = Date.now(); cur = line;
    window.dispatchEvent(new CustomEvent('vestigia', { detail: line }));
  }
  function emitBC(line) {
    line.at = Date.now(); bcCur = line;
    window.dispatchEvent(new CustomEvent('vestigia-bc', { detail: line }));
    var A = window.DENDRO_AUDIO;
    if (A) A.sfx('chime');
    if (typeof window.VESTIGIA.voice === 'function') setTimeout(function () { window.VESTIGIA.voice(line); }, CHIME_MS);
  }
  function pump() {
    timer = null;
    if (!q.length) return;
    var wait = cur ? DWELL - (Date.now() - cur.at) : 0;
    if (wait > 0) { timer = setTimeout(pump, wait); return; }
    emit(q.shift());
    if (q.length) timer = setTimeout(pump, DWELL);
  }
  function say(id, o) {
    if (String(id).indexOf('V-BC-') === 0) { var b = make(id, o); emitBC(b); return b; }   // 방송은 방송 칸으로
    // soft — 방송·구간 전환처럼 곁들이는 줄은 방금 뜬 줄을 덮지 않고 건너뛴다
    if (o && o.soft && cur && (Date.now() - cur.at < DWELL * 1.5 || q.length)) return null;
    var line = make(id, o);
    // 같은 줄을 연달아 누르면 한 번만
    if (cur && cur.text === line.text && Date.now() - cur.at < 1500 && !q.length) return line;
    var busy = cur && cur.hold && Date.now() - cur.at < DWELL;
    if ((o && o.queue) || busy || q.length) {
      if (!(o && o.queue)) q = q.filter(function (x) { return x.hold; });   // 대기 중인 가벼운 줄은 새 줄로 바꾼다
      q.push(line);
      if (!timer) pump();
    } else emit(line);
    return line;
  }
  function chain(ids) {
    ids.forEach(function (x, i) {
      var id = typeof x === 'string' ? x : x.id, o = typeof x === 'string' ? {} : x;
      o.queue = i > 0;
      say(id, o);
    });
  }
  /* 관내 방송 · 순환 — V-BC 계열 */
  var BC = Object.keys(LINES).filter(function (k) { return k.indexOf('V-BC-') === 0; });
  var bcTimer = null, bcLast = null, bcOn = false;
  function lectureOn() { return document.documentElement.classList.contains('lecture'); }
  function bcNext() {
    if (lectureOn()) return;   // 강의 모드 — 관내 방송 순환 정지 (DENDRO P1-1)
    bcTimer = setTimeout(function () {
      var pick;
      do { pick = BC[Math.floor(Math.random() * BC.length)]; } while (pick === bcLast && BC.length > 1);
      say(pick); bcLast = pick;
      bcNext();
    }, (90 + Math.random() * 90) * 1000);
  }
  function broadcast(on) {
    bcOn = !!on;
    clearTimeout(bcTimer); bcTimer = null;
    if (on) bcNext();
  }
  window.VESTIGIA = {
    lines: LINES, text: text, say: say, chain: chain, broadcast: broadcast, voice: null,
    current: function () { return cur; },
    currentBroadcast: function () { return bcCur; },
    clear: function () { q = []; clearTimeout(timer); timer = null; cur = null; window.dispatchEvent(new CustomEvent('vestigia', { detail: null })); }
  };

  /* 강의 모드 전환 — V-SYS-011 / 012 */
  window.addEventListener('iba:lecture', function (e) {
    var on = !!(e.detail && e.detail.on);
    say(on ? 'V-SYS-011' : 'V-SYS-012');
    // 관내 방송 순환도 강의 중에는 멈췄다가 해제하면 다시 돈다
    if (bcOn) { clearTimeout(bcTimer); bcTimer = null; if (!on) bcNext(); }
  });

  /* 말소 — 호버 V-RD-013 · 제1종 누름 V-RD-014 · 제2종 누름 V-RD-015 (LUMINA 먹칠도 제2종) */
  var hoverAt = 0;
  document.addEventListener('pointerover', function (e) {
    var t = e.target && e.target.closest && e.target.closest('.rec-redact');
    if (!t || Date.now() - hoverAt < 8000) return;
    hoverAt = Date.now(); say('V-RD-013');
    if (window.DENDRO_AUDIO) window.DENDRO_AUDIO.sfx('redacted');
  });
  document.addEventListener('click', function (e) {
    if (!e.target || !e.target.closest) return;
    var A = window.DENDRO_AUDIO;
    if (e.target.closest('.rec-redact--1')) { say('V-RD-014'); if (A) A.sfx('redacted'); }
    else if (e.target.closest('.rec-redact--2')) { say('V-RD-015'); if (A) A.sfx('redacted'); }
    else if (e.target.closest('.docx-imgbar:not(.is-noted)')) say('V-RD-015');   // LUMINA 먹칠 — 소리는 정정 타건음
  }, true);
})();

# 제01장 · 기본 규정

```
제1조 (보존)   기록은 보존한다.
제2조 (불가침) 기록 본문은 수정하지 아니한다.
제3조 (주석)   해석은 주석으로만 존재한다.
제4조 (불개입) 과거에 개입하지 아니한다.
제5조 (보안)   제2국의 존재 및 활동은 공표하지 아니한다.
제6조 (실격)   제2조 및 제4조를 위반한 자는 구성원이 아니다.

본 규정은 기구 설립 이래 개정된 바 없다.
본 문서의 사본 제작을 금한다.
```

## 강령

**보존 · 주해 · 불개입.**

세 낱말이 전부다. 나머지 조항은 이 셋을 지키기 위한 조건이거나, 지키지 못했을 때의 처분이다.

## 조항 해설

### 제1조 (보존)

기록은 보존한다. 틀린 기록도 기록이다. 적의 흔적도 기록이다.
보존은 소유가 아니다. 우리는 기록을 가지고 있는 것이 아니라 훼손되지 않도록 지키고 있을 뿐이다.

### 제2조 (불가침)

본문은 고치지 않는다. 틀렸다고 판단되더라도 고치지 않는다. 고치는 순간 우리가 개작하는 쪽이 된다.
본문을 고치는 것은 저들이 하는 일이다.

### 제3조 (주석)

해석은 본문 옆에 붙는다. 본문이 되지 않는다.
주해는 쌓이고, 서로 반박하고, 후대에 다시 읽힌다. 그러나 본문은 그대로다.

### 제4조 (불개입)

과거에 가더라도 관찰하고, 적고, 돌아온다.
과거의 무엇도 바꾸지 않는다. 우리의 존재가 과거에 남는 것도 바꾸는 것이다.

### 제5조 (보안)

```
해설.
알려진 증인은 증인이 아니다. 판관이다.
원본을 지키는 자가 있다는 것이 알려지면, 세계는 그자에게 판정을 구하고,
그자의 침묵까지 판정으로 읽는다.
우리가 판정하지 않으려면, 우리가 있다는 것부터 알려져서는 안 된다.

이 조항은 기밀을 위한 것이 아니다.
우리가 다음 시대의 가장 큰 목소리가 되지 않기 위한 것이다.
```

제2국이 알려지면 일어나는 일은 넷이다.

| | 내용 |
|---|---|
| **판관이 된다** | 각국이 "기구가 보증한 역사"를 주장한다. 기구는 한마디도 하지 않았는데 판정자로 소환되고, 침묵까지 해석된다 |
| **존재가 곧 개입이 된다** | 원본을 지키는 자가 있다는 것을 아는 세계는 다르게 움직인다. 어떤 나라는 기록을 먼저 태우고, 어떤 나라는 더 정교하게 조작하고, 어떤 이는 원본이 남으리라 믿고 기록을 소홀히 한다 |
| **문이 무기가 된다** | 서고에는 소재국이 없으나 문은 각국의 땅 안에 있다. 알려지면 각국은 자기 땅의 문을 장악하려 하고, 문을 가진 나라는 과거로 가는 통로를 가진 나라가 된다 |
| **함께 고쳐진다** | 세계의 기록에 오르면 기구도 역사의 일부가 된다. 역사의 일부는 개작될 수 있다. 원본을 지키는 자가 원본의 한 줄이 되면 함께 고쳐진다 |

숨음은 저들을 막지 못한다. 저들은 이미 안다. 숨음이 막는 것은 저들보다 큰 것들이다.

> 우리가 알려지는 순간, 우리는 증인이 아니라 판관이 된다.

### 제6조 (실격)

징계 조항이 아니다. 자격 조항이다.
위반한 자를 내보낸다는 뜻이 아니라, 위반한 순간 이미 구성원이 아니라는 뜻이다.

## 제1원리

> **기록되지 않은 것은 인지되지 않는다.**

규정 여섯 조는 이 원리 위에 서 있다.

어떤 대상이 인지되려면 먼저 기록되어야 한다. 지도에, 등기부에, 명부에, 누군가의 일기에.
기록되지 않은 것은 눈에 보이더라도 인지에 걸리지 않는다. 보았으나 보았다고 여기지 않는다.

## 인지의 상대성

> **인지는 기록을 공유하는 자들 사이에서 성립한다.**

| 대상 | 누구에게 | 인지 |
|---|---|---|
| 제2국 | 세계 | 되지 않는다 — 세계의 기록에 없다 |
| 제2국 | 구성원 | 된다 — 명부에 함께 올라 있다 |
| 과거에 간 조사관 | 당대 사람들 | 되지 않는다 — 그 시대의 기록에 없다 |
| 과거에 간 조사관 | 구성원 | 된다 — 파견 기록에 있다 |
| 선대 요원 | 후배 요원 | 된다 — 이름은 없으나 그들이 쓴 주해와 보고서가 있다 |

제2국은 투명한 것이 아니다. 누구와 기록을 공유할지 스스로 고른 것이다.
숨는다기보다 증인석에서 내려오지 않는 것이다.

> 우리는 그들의 이름을 모른다. 그들이 쓴 것을 안다.
> 그것으로 충분히 그들을 안다.
> — 지하 1층 계단참, 1979

## 적는 것과 적히는 것

| | 주체 | 판정 |
|---|---|---|
| **적는다** | 요원이 관찰한 것을 기구의 문서에 쓴다 | **임무** |
| **적힌다** | 당대 사람이 요원을 그 시대의 문서에 쓴다 | **개입** |

요원이 당대 문서에 적히면, 그 시대의 기록에 원래 없던 인물이 하나 생긴다.
기록이 바뀌었다. 의도와 무관하게 개작이다.

> **적되, 적히지 마라.**

# 제02장 · 기구

## 명칭

```
정식      국제기록보존기구
영문      International Bureau of Archives
약칭      IBA
통칭      기구
설립      1949년
표어      없음
```

## 대외 신분

```
역법 및 연대 표기 표준화
기록물 보존 규격 제정
가맹국 기록기관 기술 협력
```

연차 보고서를 발간하고 학술 회의를 연다. 표준 규격 문서를 배포한다.
이 업무는 위장이 아니라 실제로 수행된다. 위장이 성립하려면 실제여야 한다.
대외 업무는 제1국이 제1보존서고 지상 4층 표준실에서 수행한다.

## 실제 임무

**우리 시간선의 역사적 사실을 보존한다.**

무엇이 있었는지 정하는 것은 우리 일이 아니다.
있었던 것이 계속 있었던 것으로 남게 하는 것이 우리 일이다.

## 우리가 하지 않는 일

| | |
|---|---|
| 기록을 고치지 않는다 | 고치는 쪽이 저들이다 |
| 기록을 지우지 않는다 | 틀린 기록도 기록이다 |
| 과거에 개입하지 않는다 | 관찰하고, 적고, 돌아온다 |
| 해석을 확정하지 않는다 | 해석은 주석으로 쌓일 뿐 본문이 되지 않는다 |
| 진실을 판정하지 않는다 | 판정하는 기관은 결국 선포하는 기관이 된다 |

## 기구는 왜 있는가

### 과거는 기록으로만 남는다

과거는 이미 지나갔다. 남은 것은 기록뿐이고, 과거에 닿는 길도 기록뿐이다.
기록이 바뀌면 그 뒤에 사는 자에게는 과거가 바뀐 것과 구별되지 않는다.
**기록을 고칠 수 있는 자는 과거를 고칠 수 있는 자다.**

### 개작은 안에서 보이지 않는다

개작은 완료되는 순간 원래 그랬던 것이 된다. 바뀐 세계에 사는 자는 바뀌었다는 것을 알 방법이 없다. 비교할 원본이 사라졌기 때문이다.
그러므로 누군가는 바깥에 서서 바뀌기 전을 기억해야 한다.
국가는 이해당사자이고, 개인은 수명이 짧다. 둘 다 바깥에 설 수 없다.

| 기구의 성질 | 이유 |
|---|---|
| 소재국이 없다 | 어느 나라도 기록을 고치라고 명령할 수 없다 |
| 이름을 남기지 않는다 | 기구가 기록 안으로 들어가면 함께 고쳐질 수 있다 |
| 존재를 공표하지 않는다 | 알려지면 증인이 아니라 판관이 된다 |
| 기술이 멈춰 있다 | 기록을 대신 쓰는 기계가 들어오지 않는다 |

### 우리가 지키는 것은 진실이 아니다

우리는 무엇이 참인지 판정하지 않는다.
두 측량을 둘 다 남기고, 해석은 주석으로만 두고, 네 도시의 사진 가운데 원본을 고르지 않는다.

우리가 지키는 것은 **대조할 수 있는 가능성**이다.

도량형의 원기(原器)를 보관하는 곳은 저울이 맞는지 판정하지 않는다. 누구의 짐도 대신 달아주지 않는다.
기준을 보관할 뿐이다. 그래서 누구든 자기 저울을 원기와 대조해볼 수 있다.

두 나라의 기록이 한 사건을 다르게 쓴다. 우리는 어느 쪽이 옳다고 말하지 않는다.
대신 그 사건의 원본 — 당대의 조약문, 실록, 증언 — 이 사라지지 않게 지킨다.
원본이 남아 있으면 누구든 언젠가 대조할 수 있다. 원본이 사라지면 대조가 불가능해지고, 그때부터는 목소리가 큰 쪽이 이긴다.

> 우리가 지키는 것은 무엇이 참인가라는 답이 아니다.
> 무엇이 참인지 확인해볼 수 있는 상태, 그 자체다.

# 제03장 · 조직

## 지휘 체계

```
총재 ─────────────── 기구 전체
 │
 ├ 제1국장 ────────── 대외 업무 · 표준 · 규격 · 학술
 │
 ├ 제2국 ──────────── 비공개 · 총재 직할
 │  ├ 제1지역국장 · 유럽 · 미주            RO-1
 │  ├ 제2지역국장 · 동아시아               RO-2
 │  ├ 제3지역국장 · 서아시아 · 인도         RO-3
 │  └ 제4지역국장 · 한국                   RO-4
 │       └ 지부장 · 국가별 지부
 │
 └ 대조관실 ────────── 총재 직속
```

## 직위

| 직위 | 내용 |
|---|---|
| **총재** | 기구의 장. 대외적으로 국제기록보존기구 총재로 공식 석상에 나온다. 제2국은 총재 직할이며 제2국장은 따로 두지 않는다. 공표되지 않는 부서의 장을 두면 그 직위가 기록되기 때문이다. 총재의 결재는 기송관으로 내려온다 |
| **제1국장** | 대외 업무 책임자. 제1국 직원 대다수는 제2국의 존재를 알지 못한다. 알 필요가 없고, 모르는 편이 그들에게 안전하다 |
| **지역국장** | 지역국의 장. 집무실은 서고 지상 2층 |
| **지부장** | 국가별 지부의 장. 출입 관측소에 상주한다. 이름은 어느 문서에도 기재하지 않는다 |

총재의 집무실은 지상 층 어디에도 없다. **도면 AR-1949-001-B에만 표기되어 있다.**
측량 B의 탑 상부, 정점이 확인되지 않는 구간 어딘가다. 그곳에 가 본 요원은 기록에 없다.

## 지역국

지역국은 지리가 아니라 **기록 계통**에 따라 나뉜다. 번호는 설치 순서다.

| 지역국 | 코드 | 설치 | 도착층 | 지부 |
|---|---|---|---|---|
| 제1지역국 · 유럽 · 미주 | RO-1 | 1949. 04 | 지하 5층 · 17세기 | 영국 · 프랑스 · 미국 · 멕시코 외 |
| 제2지역국 · 동아시아 | RO-2 | 1949. 06 | 지하 7층 · 14 ~ 10세기 | 중국 · 일본 · 몽골 · 베트남 외 |
| 제3지역국 · 서아시아 · 인도 | RO-3 | 1949. 07 | 지하 8층 · 9 ~ 7세기 | 이란 · 튀르키예 · 인도 외 |

지부 코드는 `[국가 코드]-[지역국 번호]` 형식이다. 한국 지부는 `KR-04`.

## 대조관실

총재 직속. 서고 지상 3층 접수실 안쪽. 문에 표기가 없다.

# 제04장 · 제4지역국

```
정식      국제기록보존기구 제2국 제4지역국
약칭      RO-4
지부      한국 지부 · KR-04
설치      1949년 9월
관할      한국 기록 계통 전 구간
도착층    지하 3층 · 19세기 서가
```

## 독립 지역국의 근거

한국은 동아시아와 한문 사료 체계를 공유하나, 편찬 주체와 서술 체계가 별개로 성립했다.
같은 사건이 두 계통에 각각 다른 서술로 남아 있으며, 두 서술은 서로를 인용하지 않는다.

이 조건은 대조 작업에 유리하고 보존 작업에 불리하다.
**한쪽이 훼손되면 다른 쪽으로 검증할 수 있으나, 두 계통이 어긋날 때 판정할 상위 기록이 없다.**

## 출입 관측소

문은 기록을 보관하던 자리에 열린다. 제4지역국은 관할 구역 안의 문마다 관측소를 두며, 관측소 하나가 문 하나를 관리한다.

```
관측소 코드   소재            도착층      상태
SIT           서울 · 비공개    지하 3층    상시 개방
████          ████            ████        ████
████          ████            ████        ████
```

관측소는 기구가 설치한 시설이 아니다. 문이 있던 자리에 기구가 사무를 둔 것이다.
관측소가 놓인 건물은 대개 문보다 나중에 지어졌다.

> 문이 먼저 있었고, 뒤에 건물이 지어졌다.
> 우리는 문을 만들지 않았다. 문이 있는 자리에 기관을 세웠을 뿐이다.
> — 제4지역국 연혁, 1부 3장

## 편제

```
지부장           1  · 이름 미기재
기록관   (AR)    ████
연구원   (RS)    ████
조사관   (FS)    ████
평가관   (DA)    ████
대응요원 (DA-R)  ████

총원  ████
```

KR-04는 **전체 인원 대비 대응반 비중이 기구 내에서 가장 높은 지부다.**
관할 구역에 폐가가 둘 있고, 그중 하나가 도착층과 같은 층이기 때문이다.
본부는 이 편제가 과중하다고 여러 차례 지적했으나 조정하지 않았다. 조정할 근거를 찾지 못했다.

## 도착층

지하 3층 남편은 19세기 후반 개작 구역이다.
**KR-04 요원은 서고에 들어서는 순간 개작 구역에 도착한다.** 다른 지역국에는 없는 조건이다.

> 우리는 매번 개작된 자리를 밟고 일을 시작한다.
> 그것이 익숙해지는 것이 가장 위험하다.
> — 지부 교육 자료 표지

## 관할 폐가

한 지역국이 폐가 둘을 맡는 경우는 기구 내에서 이곳뿐이다.

| 위치 | 연대 | 유형 | 비고 |
|---|---|---|---|
| 지하 2층 동편 | 20세기 전반 | 결손 · 소실 · 개작 혼재 | 작전명 LUMINA |
| 지하 3층 남편 | 19세기 후반 | 개작 | 도착층과 같은 층 |

## LUMINA

지하 2층 동편 제2폐가 복원 상설 작전. 제4지역국 전담.

복원은 채워 넣기가 아니다. 없는 것을 지어내면 그것이 곧 개작이며, 우리가 맞서는 바로 그 행위가 된다.

```
제1층   확인된 사실과 출처        본문에 준함
제2층   사실에 대한 해석          주해로 표시 · 근거와 한계 병기
제3층   허구로 재구성한 부분      허구임을 반드시 명시
```

층이 섞이면 무효다. 제3층이 제1층처럼 보이는 순간 그 복원본은 폐기된다. 예외 없다.

```
복원 절차
판독 → 대조 → 등재 → 주해 → 재구성 → 검토
```

「대조」는 1991년 4차 복원 중단 이후 신설되었다.

> 우리는 빈 자리를 메우지 않는다. 빈 자리에 표를 세운다.
> 여기에 무엇이 있었는지 모른다고, 모른다는 사실을 기록한다.
> — LUMINA 작전 강령 1조

## 연혁

```
1949. 09   제4지역국 설치
1949. 11   SIT 관측소 확인 · 지하 3층 도착 확인
1951       제2폐가 1차 복원 착수 — 중단 (인력 부족)
1953       지상 연락 사무소 ████ · 기록 일부 소실
1963       폐가 출입 수칙 제정 · 제2폐가 남단 통로 봉쇄
1965       2차 복원 중단 (구역 구조 변형)
1971       측량에 관한 제4가설 제기 — 기각되지 않음
1982       3차 복원 중단 (사유 미기재)
1987       반입 심사 동결
1991       4차 복원 중단 — 복원본과 개작본의 구별 실패
1991       복원 절차에 「대조」 단계 신설
           이후 개정 없음
```

1991년이 지부 역사에서 가장 무겁게 다뤄진다.
복원하려던 것이 이미 개작된 것이었는지, 복원 과정에서 개작이 발생했는지 판정하지 못했다.

## 지부 벽의 주해

```
지하 3층 · 도착 지점 정면 벽

  여기가 개작 구역이라는 것을 잊지 마라.       — 1958
    잊지 않는다.                              — 1963
      잊었다.                                 — 1991
```

```
지하 3층 남편 · 개작 구획 입구

  이 서가는 깨끗하다.
  그래서 여기가 제일 심하다.                   — 1964
```

```
지하 3층 · 문 안쪽

  누가 먼저 여기 있었는가.                     — 1950
    묻지 말라고 되어 있다.                     — 1952
      누가 그렇게 정했는가.                    — 연도 없음
```

세 번째 줄은 필적 대조가 이루어지지 않았다. 보존 대상으로 지정되어 있다.

# 제05장 · 직무

## 부서

| 약칭 | 부서 | 직책 | 근무 | 임무 |
|---|---|---|---|---|
| **AR** | 기록관리과 | 기록관 | 내근 | 확정 기록을 입력하고 배열한다 |
| **RS** | 연구과 | 연구원 | 내근 | 기록과 역사를 연구하고, 주해를 달아 의견을 나눈다 |
| **FS** | 현장조사과 | 조사관 | 외근 · 관찰 한정 | 제0열람실로 과거에 가서 관찰한다. 기록을 더 정확하게, 얇은 기록을 두껍게 한다 |
| **DA** | 분기평가과 | 평가관 | 내근 | 일어나지 않은 가능성을 계산해 공격당하기 쉬운 지점을 찾는다 |
| **DA-R** | 분기평가과 대응반 | 대응요원 | 외근 | 개축 현장 대응 · 이탈 세력 추적 |

## 세 부서가 과거를 다루는 이유

기록은 이미 끝났다. 그런데도 세 부서가 과거를 다룬다. 이유가 각각 다르다.

**연구과** — 기록은 혼자서 의미를 갖지 못한다.
무슨 일이 있었는지 아는 것과 그것이 무엇이었는지 아는 것은 다르다. 후자는 주해로만 존재한다.

**현장조사과** — 얇은 기록은 왜곡에 버티지 못한다.
"1894년에 갑오개혁이 있었다"는 한 줄은 정확하지만 얇다. 얇은 것은 쉽게 뒤집힌다.

**분기평가과** — 기록은 공격받는다.
어느 지점이 공격당하기 쉬운지 알려면 일어나지 않은 일을 계산해야 한다.
위험한 일이며, 그래서 이 부서에서 이탈자가 가장 많이 나왔다.

## 대응반의 권한

대응반도 과거에 개입하지 않는다. 권한은 다음에 한정된다.

- 서고 내 개축 현장 출입
- 폐가 출입
- 제0열람실을 통한 이탈 세력 추적
- 이상 기록의 채집. **필사로만.** 물건을 가져오지 않는다

## 부서 거점

| 부서 | 거점 | 이유 |
|---|---|---|
| 기록관리과 | 전 층 · 정본실 간 통로 | 모든 연대에 입력한다 |
| 연구과 | 지하 1층 | 현재와 가장 가까운 과거. 현재와 대조하기 좋다 |
| 현장조사과 | 지하 5층 기송관 단말 | 제0열람실 발견지 |
| 분기평가과 | 지하 4층 정본실 앞 | 가장 오래 변하지 않는 자리에서 변하는 것을 계산한다 |
| 대응반 | 없음 | 개축이 일어나는 곳으로 간다 |

## 직급

```
수습 연구원 → 연구원 → 선임 연구원 → 주임 연구원
```

승급은 처리 건수로 정해지지 않는다. **어떤 종류의 일을 했는가로 정해진다.**
주해 백 건보다 제대로 된 분기 기록 세 건이 위다.

## 등재 규정

```
1. 근거를 밝힌다. 근거 없는 등재는 보류된다.
2. 자기 주장의 한계를 함께 적는다.
3. 확인하지 못한 것은 확인하지 못했다고 적는다.
4. 본문을 고치지 않는다. 옆에 쓴다.
```

한계를 인정하지 않는 주장은 주해가 아니라 개작이다.

## 등재 유형

| 유형 | 부서 | 내용 |
|---|---|---|
| **주해** | RS | 확정 기록에 해석을 붙인다. 의미 규정 · 이견 · 현재 대조 |
| **증언 기록** | FS | 과거 파견 관찰 보고. 관찰한 것만 본문으로, 판단은 주해로 |
| **분기 기록** | DA | 일어나지 않은 가능성의 계산 |
| **복원** | DA-R · LUMINA | 폐가의 복원. 세 층 분리 |
| **결손 신고** | 전 부서 | 기록이 남지 않은 자리를 신고한다 |

### 현재 대조의 네 갈래

| 갈래 | 내용 |
|---|---|
| 계승 | 그 사건에서 시작된 것이 지금도 이어진다 |
| 반복 | 형태는 다르나 같은 구조가 지금도 작동한다 |
| 반작용 | 그 사건 때문에 지금이 그것을 피하려 한다 |
| 단절 | 그 사건 이후 다른 길로 갔다 |

### 분기 기록의 안전 수칙

```
1. 당시 실제로 존재했던 선택지만 쓴다. 그 시대에 없던 기술과 개념은 금한다.
2. 최소 두 단계 이후까지 파급을 서술한다.
3. 바뀌지 않았을 것을 반드시 적는다.
```

세 번째가 요원과 이탈자를 가르는 선이다.
이탈자는 바꾸면 다 바뀐다고 믿는다. 요원은 지리와 인구와 기술과 국제 정세가 쉽게 바뀌지 않는다는 것을 안다.

## 요원 등록 코드

이름 대신 코드로 등재한다.

```
[부서] - [배속 연도] - [등록 일련번호] - [출입 관측소]

예   RS-26-20301-SIT
     연구과 · 2026년 배속 · 등록 20301 · SIT 관측소 소속
```

| 자리 | 내용 |
|---|---|
| 부서 | AR · RS · FS · DA · DA-R |
| 배속 연도 | 서기 연도 뒤 두 자리 |
| 등록 일련번호 | 지부 등록 순서. 승급해도 바뀌지 않는다 |
| 출입 관측소 | 해당 요원이 사용하는 문의 관측소 코드 |

코드는 배속 시 부여되며 부서 이동 시 앞자리만 바뀐다.

## 등재 서식

```
IBA · DIRECTORATE II
─────────────────────────────
RO-4 / KR-04 / RS
문서번호  RS-2026-0417
분류      주해 등재 · 의미 규정
등재자    RS-26-20301-SIT
검토      지부장

취급주의 · 대외비
```

등재자란에는 등록 코드만 적는다. 이름은 어느 문서에도 기재하지 않는다.

# 제06장 · 복무

## 명부

제2국은 세계의 기록에 자신을 올리지 않는다. 그러나 **자기 안의 기록은 남긴다.** 그것이 명부다.

| 기록 | 공유하는 자 | 제2국 |
|---|---|---|
| 세계의 기록 — 등기부 · 공문서 · 신문 · 역사서 | 모든 사람 | 올라가지 않는다. 세계는 제2국을 보지 못한다 |
| 제2국의 명부 — DENDRO | 구성원 | 올라간다. 구성원은 제2국을 본다 |

구성원이 기구를 인지하는 것은 명부에 등재되어 있기 때문이다. **등재가 곧 연결선이다.**
명부에는 이름을 적지 않는다. 등록 코드와 부서와 직급만 적는다.

명부는 기구가 관리하는 유일한 자기 기록이다. 구성원 개인이 기구에 관해 따로 적는 것은 금한다. 일지에도, 메모에도, 벽에도.

## 문 밖에서

구성원은 문 밖에서도 기구를 기억한다. 명부는 어디에 있든 그를 기록하고 있다.

대외적으로 구성원은 국제기록보존기구 제1국 소속이다. 급여 명세서에도 그렇게 적힌다.
가족과 이웃은 그가 역법 표준이나 기록 보존 규격을 다루는 국제기구에 다닌다고 안다. 그것은 거짓이 아니다. 제1국은 실재한다.

## 말과 글

**말은 새지 않는다.** 구성원이 누군가에게 기구에 관해 말하더라도, 듣는 자는 명부에 없고 그 말을 받쳐 줄 기록을 공유하지 않는다.
말은 들리지만 붙잡히지 않는다. 서고 앞을 지나는 자가 건물을 보고도 보았다고 여기지 않는 것과 같다. 꿈 이야기처럼 흘러간다.

**글은 샌다.** 적어서 건네면 다르다. 종이 한 장이 공유되는 기록이 되고, 그것을 읽은 자와 기구 사이에 연결선이 생긴다.

> 말은 흩어지고, 글은 남는다.
> 그래서 우리는 말을 금하지 않고 글을 금한다.

말하는 것도 제5조에 어긋난다. 다만 말은 규율의 문제이고, 글은 존속의 문제다.
기구의 모든 문서에 "사본 제작 금지"가 찍혀 있는 까닭이 여기에 있다.

역사 기록의 필사는 허용된다. 금지되는 것은 기구 자신에 관한 사본뿐이다.

## 배속

명부에 오르기 전의 자는 제2국을 인지하지 못한다. 그러므로 문 밖에서 사람을 뽑을 수 없다. 공고를 낼 수도, 면접을 약속할 수도 없다.

**배속은 문 안에서만 이루어진다.**

| 경로 | 내용 |
|---|---|
| 문을 연 자 | 기록원·도서관·등기소에서 일하다 문을 연다. 접수실의 세 질문을 거친다. 기구에 관해 아무것도 적어 두지 않았고 적성이 확인되면 배속 심사로 넘긴다 |
| 제1국에서 전보 | 제1국 직원 가운데 선발된 자를 지부장이 문 안으로 데려온다. 서고 안에서 등재한다 |

등재 전에 서고를 나서면 방금 본 것을 잊는다. 그러므로 **배속 심사는 서고 안에서 끝내야 한다.**
심사에서 떨어진 자는 문을 나서는 순간 심사를 받은 사실도 잊는다.

> 문 안에서 본 것은 문 밖에서 증명할 수 없다.
> 그래서 우리는 문 안에서 뽑고, 문 안에서 맹세받는다.
> — 배속 심사 규정 서문

# 제07장 · 본부 — 제1보존서고

```
정식      제1보존서고 (第一保存書庫)
영문      The First Stack
통칭      서고 · 요원 은어 "깊은 곳"
발견      1949년
관할      제2국 직할
소재국    없음
```

기구는 이 건물을 짓지 않았다. 설립 조사 중에 발견했고, 조사가 끝나기 전에 이미 그 안에서 일하고 있었다.

## 소재국이 없다

통상의 국제기구 본부는 소재국이 있고, 다만 그 나라의 법이 미치지 않는다. 그러나 소재국이 있는 한 언젠가 압류되거나 폐쇄될 수 있다.
서고에는 소재국이 없다. **접수할 주체가 없다.**

> 본부는 어느 체약국의 영토에도 속하지 아니한다.
> 모든 체약국은 본부에 접근할 권리를 가진다.
> — 1949년 설립 조약 제3조

## 건물은 하나, 문은 여럿

**접근은 보편적이고, 건물은 단일하다.**

| | 수 |
|---|---|
| 문 · 출입 관측소 | 여럿. 각 지역의 기록원 · 도서관 · 등기소 등에 있다 |
| 제1보존서고 | 하나. 모든 문이 이곳으로 통한다 |

문은 예외 없이 이미 기록을 보관하던 자리에 열린다. 규칙으로 정한 것이 아니라 관측한 것이다.
어느 문으로 들어가든 같은 서고에 도착한다. 다만 문마다 닿는 깊이가 다르다.

문은 기록을 다루는 자라면 누구에게나 열린다. 저들도 드나든다.
문을 잠그려면 기록을 없애야 하고, 그것은 제1조 위반이다.

> **서고는 방어되지 않는다. 감시될 뿐이다.**

## 외관 — 두 측량

같은 날 같은 측량반이 두 벌의 도면을 작성했다. 기구는 어느 쪽도 폐기하지 않았다.

| 도면 | 기재 |
|---|---|
| AR-1949-001 · 측량 A | 지상 4층 · 층고 5.1 m · 높이 20.4 m · 한 변 42 m |
| AR-1949-001-B · 측량 B | 층수 미확정 · 한 변 19 m · 정점은 안개에 가려 확인 불가 |

측량 B의 평면은 측량 A의 중앙부와 정확히 일치한다. 그 부분만 위로 이어진다.
지하 2층 이하의 평면은 측량 B와 같다. 지상에서 넓어지는 것은 1층뿐이다.

노출 콘크리트, 무도장, 수직 줄눈. 창은 1층에 한 줄뿐이다. 상부는 가로 띠의 환기 루버. 간판도 표기도 없다.

### 목격 진술

1949년부터 1987년까지 412건.

| 진술 | 건수 |
|---|---|
| 4층 이하 | 214 |
| 5 ~ 10층 | 31 |
| 11 ~ 30층 | 44 |
| 30층 초과 | 96 |
| 높이 언급 없음 | 27 |

봉우리가 둘이고 그 사이가 비어 있다. "15층쯤 되어 보였다"는 진술은 거의 접수되지 않는다.
기구는 이 공백을 설명하지 못하며, 설명하지 못한다는 사실을 함께 기재한다.

### 내부 가설 — 모두 미확인

- 제1가설 · 서고는 두 높이를 동시에 가진다
- 제2가설 · 서고는 하나의 높이를 가지며 관측자에 따라 다르게 인지된다
- 제3가설 · 높이라는 속성이 서고에 적용되지 않는다
- 제4가설 · 두 측량반 중 한쪽이 서고를 보지 않았다 — 1971년 제기, 기각되지 않음

### 네 도시의 사진

각 지역국이 자기 관할 도시에서 서고를 촬영했다. 배경은 전부 다르고 건물은 전부 같다.
한국 지부 촬영본 두 장의 배경에는 남산이 보인다. 기구는 어느 것이 원본인지 판정하지 않는다.

> 두 측량이 어긋났을 때 우리가 하는 일은 하나를 고르는 것이 아니다.
> 어긋났다는 사실을 기록하는 것이다.

## 층위

서고는 층으로 나뉘지 않는다. **지층으로** 나뉜다.
아래로 내려갈수록 기록은 오래된 것이 된다. 은유가 아니라 배치 규칙이다.

```

지하 13층 아래로 내려간 기록은 있다. 돌아온 기록은 없다.

## 구조 변형

서고의 내부는 변한다. 그러나 무작위로 변하지 않는다. **기록을 따라간다.**
변형은 사고가 아니라 관측 자료다. 건물 자체가 계기(計器)다.

| 현상 | 판독 |
|---|---|
| 서가가 좁아짐 | 해당 시대 기록의 밀도 감소 |
| 복도가 길어짐 | 기록 사이의 공백 확대 |
| 문이 사라짐 | 두 시대를 잇던 인과가 끊어짐 |
| 없던 방이 생김 | 등재되지 않은 기록의 유입. **최우선 조사 대상** |
| 벽이 젖음 | 미확인 |

## 정본실

구조가 변하지 않으며 주변 구역의 변형도 억제한다. 정본실이 훼손되면 일대의 기록이 통째로 유동한다.

**정본실끼리는 문 하나로 이어져 있다.** 지하 1층 정본실의 안쪽 문을 열면 지하 12층 정본실이다.
연대를 건너뛰는 유일한 길이며, 기록관만 쓸 수 있다. 다른 요원이 열면 벽이다.

## 벽의 주해

제2조에 따라 본문 — 건물의 구조 그 자체 — 은 수정할 수 없다. 제3조는 주해를 허용한다.
그래서 요원들은 벽에 쓴다. 1949년부터 지금까지. 어떤 벽은 주해가 여섯 겹이다.

```
기재 요령
1. 연도를 적는다. 이름은 적지 않는다.
2. 반박은 대상 주해의 오른쪽에 적는다.
3. 지우지 않는다. 덧쓰지 않는다. 옆에 쓴다.
4. 자신에 관한 것은 적지 않는다.
5. 확인하지 못한 것은 확인하지 못했다고 적는다.
```

```
지하 6층 서편 복도
  이 서가의 배치는 잘못되었다.                  — 1961
    잘못되지 않았다. 당신이 잘못 읽었다.        — 1974
      둘 다 옳다. 그 사이에 개정이 있었다.      — 1988
        개정은 없었다. 기록을 확인하라.         — 연도 없음

지하 4층 정본실 앞
  정본실은 안전하지 않다. 다만 변하지 않을 뿐이다.
  둘은 다르다.                                 — 1969
    동의한다.                                  — 1969
      동의한다.                                — 1970
        동의한다.                              — 1977

지하 2층 · 제2폐가 입구
  들어가지 마라.                               — 1963
    들어가야 한다. 그것이 우리 일이다.         — 1963
      둘 다 옳다.                              — 1991

지하 12층 막다른 벽
  여기서부터는 기록이 없다.
  없다는 것을 기록해 둔다.                     — 1955

지상 1층 로비 · 출입구 안쪽
  나가는 문이 들어온 문과 같은지 확인할 것.    — 1981
```

지하 4층의 "동의한다"는 열한 번 이어지다 끊긴다. 마지막 줄 아래는 빈 벽이다.

## 폐가

기록이 훼손된 시대는 서고 안에서 무너진 구역으로 나타난다.

| 유형 | 원인 | 양상 |
|---|---|---|
| 결손 | 기록이 애초에 남지 않음 | 서가가 비고 층고가 낮다 |
| 소실 | 기록이 있었으나 없어짐 | 서가의 칸이 뜯겨 있다 |
| **개작** | 기록이 다른 것으로 바뀜 | **서가가 멀쩡하다** |

앞의 둘은 보면 안다. 개작은 보아서 알 수 없다. 대조해야만 안다.

| 위치 | 연대 | 유형 | 관할 |
|---|---|---|---|
| 지하 2층 동편 | 20세기 전반 | 혼재 | RO-4 · LUMINA |
| 지하 3층 남편 | 19세기 후반 | 개작 | RO-4 |
| 지하 6층 서편 | 15세기 | 소실 | RO-2 |
| 지하 8층 전역 | 7세기 | 결손 | RO-3 |
| 지하 10층 북편 | 1세기 | 소실 | RO-1 |
| 지하 12층 | BC 7세기 이전 | 결손 | 공동 |

## 말소

폐가의 문서를 주우면 문장 중간이 검다.

```
1919년 3월 이후 총독부는 ████████ 을 시행하였으며,
이에 따라 ████████████████ 이 허가되었다.
그 결과 ████ 은 ████████ 되었다.
```

| 종 | 내용 | 처리 |
|---|---|---|
| **제1종** | 기록이 남지 않아 생긴 공백. 서고가 스스로 표시한 것이다 | 채울 수 있다. 부속 자료가 등재되면 말소가 걷힌다 |
| **제2종** | 누군가 칠한 것. 아래에 원문이 있다 | 걷히지 않는다. 옆에 주해를 달 수 있을 뿐이다 |

> 지우려 하지 말 것. 우리는 지우는 쪽이 아니다.
> 옆에 쓸 것. 그것이 우리가 하는 유일한 저항이다.
> — 대응반 현장 수칙 4조

## 봉인 서가

개축임이 확인된 방은 철거하지 않는다. 개축의 흔적도 기록이며, 제1조가 그것을 보존하라고 한다.
대응반은 문에 봉인지를 붙이고 목록에 "개축 확인"으로 등재한다. 봉인된 방은 열지 않는다. 지우지도 않는다.

> 우리는 적의 흔적조차 지우지 않는다.
> 그것이 우리와 저들의 차이이고, 그 차이 때문에 우리가 불리하다.
> — 봉인지 뒷면 인쇄문

## 총목록 카드함

지상 3층 접수실의 참나무 카드 목록함. 서고 전체의 색인으로 여겨졌다.
그러나 카드의 수가 서가의 수와 맞지 않는다. **아무도 보지 않는 사이 카드가 늘어난다.**
늘어난 카드에 적힌 청구 기호는 아직 존재하지 않는 서가를 가리킨다.

가설은 둘이다. 개축이 예정된 자리라는 설, 그리고 아직 일어나지 않은 일의 서가라는 설.
기구는 두 번째 가설을 공식적으로 다루지 않는다. 미래는 기구의 관할이 아니다.

## 기송관 중앙국

지상 3층 접수실 뒤편. 서고 전역의 기송관이 모이는 곳이다.
총재의 결재, 지역국장의 지시, 제0열람실의 회신이 전부 이곳을 거친다.

**제0열람실로 가는 표기 없는 레버의 관은 이곳을 지나지 않는다.** 1953년에 확인되었다. 어디를 지나는지는 모른다.

## 접수실

서고에 들어온 외부인은 두 경로로 구분한다.

**지상 1층 로비로 들어온 자** — 대외 업무 민원인으로 응대한다. 표준 규격 문서 한 부를 건네고 돌려보낸다.
그는 기록되지 않았으므로 방문을 곧 잊는다.

**문을 통해 지하에 나타난 자** — 등록 코드를 확인한다. 코드가 없으면 접수실로 인도해 세 가지를 묻는다.

```
1. 무엇을 찾으러 왔는가.
2. 무엇을 가지고 왔는가.
3. 무엇을 적어 두었는가.
```

세 번째 질문이 핵심이다. 기구에 관해 무언가를 적어 둔 자는 대조관실로 넘긴다.
아무것도 적지 않은 자는 돌려보낸다. 대개는 우연히 문을 연 도서관이나 기록원의 직원이다.

# 제08장 · 제0열람실

```
정식      제0열람실 (第零閱覽室)
요원 은어 영실(零室)
발견      1952년 · 지하 5층 기송관 단말
층        없음
관리      없음
이용      현장조사과 · 대응반
정체      미확인
```

서고의 어느 층에도 속하지 않는 열람실이다. 계단으로도 승강기로도 닿지 않는다.
**청구서를 보내면 열린다.** 청구한 기록은 책상 위로 오지 않는다. 대신 열람자가 그 기록이 쓰인 **당시로** 간다.

기구는 이 열람실을 만들지 않았고, 관리하지 않으며, 작동 원리를 알지 못한다. 알고 있는 것은 청구 절차와 반납 절차뿐이다.

> 우리는 이곳의 주인이 아니다. 대출증을 가진 열람자일 뿐이다.
> 대출증이 언제 회수될지는 알 수 없다.
> — 현장조사과 교육 자료 서문

## 발견

1952년, 지하 5층 기송관 단말. 행선 레버는 모두 층과 연대가 표기되어 있었고, 하나만 표기가 없었다.
**그 레버는 이미 닳아 있었다.**

어느 조사관이 존재하지 않는 청구 기호를 적어 그 레버로 보냈다. 사십 초 뒤 회신이 돌아왔다.

```
열람 가능.
제3석.
```

그가 제3석에 앉았는지는 기록되어 있지 않다. 돌아왔다는 기록만 있다. 그가 제출한 보고서가 현장조사과 제1호 파견 보고서다.

## 모습

긴 열람대가 끝없이 이어진다. 초록 갓 스탠드가 좌석마다 놓여 있다. 천장에는 형광등이 켜져 있다.
창은 없다. 벽에 시계가 걸려 있으나 바늘이 없다.

좌석은 수백 개이며 번호가 붙어 있다. 청구에 응답하는 좌석은 그중 몇 개뿐이다.
몇몇 좌석에는 이미 누가 앉아 있다. 그들은 고개를 들지 않는다. 기구는 그들이 누구인지 기록하지 않았다.

바깥 복도에서는 가끔 다른 시대의 소리가 들린다. 장터의 호객, 기계 소리, 알아들을 수 없는 말.
소리가 들리는 쪽으로 걸어가도 복도의 끝에 닿지 않는다.

## 원리

당시에 도착한 요원은 그 시대의 어떤 기록에도 적혀 있지 않다. 따라서 당대 사람들에게 인지되지 않는다.
당대 사람들은 요원을 본다. 그러나 보았다고 여기지 않는다. 길을 비켜 주고, 말을 걸면 대답하기도 하지만, 돌아서면 잊는다.

요원은 기구의 파견 기록에 적혀 있다. 그러므로 당시에 있는 동안에도 기구에게는 보인다.

| 단계 | 상태 |
|---|---|
| 적히지 않음 | 관찰자. 당대 사람들에게 인지되지 않는다 |
| 한 번 적힘 | 인지되기 시작한다. 즉시 을지를 펼친다 |
| 반복해서 적힘 | 그 시대의 인물이 된다. 반납이 어려워진다 |
| 본문에 오름 | 제6조. 이미 구성원이 아니다 |

> 당시에 가서 보고, 듣고, 적되, 적히지 마라.
> 우리가 쓰는 쪽에 서 있는 한 우리는 돌아올 수 있다.
> 쓰이는 쪽으로 넘어가면 돌아올 자리가 없다.
> — 현장조사과 파견 수칙 전문(前文)

## 청구

모든 파견은 청구서 한 장에서 시작한다. 청구서는 **반드시 두 벌**을 작성한다.

```
┌─────────────────────────────────────────────┐
│  제0열람실 열람 청구서              양식 FS-0  │
├─────────────────────────────────────────────┤
│  청구자       FS-26-20301-SIT                 │
│  계통         ☐ 한국  ☐ 동아시아              │
│               ☐ 유럽·미주  ☐ 서아시아·인도     │
│  연대         ________________________        │
│  지점         ________________________        │
│  청구 사유    ________________________        │
│               ________________________        │
│  휴대품       ________________________        │
│                                               │
│  승인         지부장 ____________             │
├─────────────────────────────────────────────┤
│  갑지 — 기송관 송부 / 을지 — 청구자 휴대       │
└─────────────────────────────────────────────┘
```

**갑지**는 기송관의 표기 없는 레버로 보낸다. **을지**는 품에 지닌다. **을지가 돌아오는 길이다.**

청구가 받아들여지면 좌석 번호만 적힌 회신이 온다. 거절되면 회신이 오지 않는다.
같은 청구를 반복하지 않는다. 세 번째 무응답 이후 청구자의 청구가 영구히 무응답이 된 사례가 있다.

지정된 좌석에 앉아 스탠드를 한 번 끈다. 어두워진 사이에 당시에 도착한다. 도착하는 순간은 기억되지 않는다.

## 반납

돌아오는 방법은 하나다. 을지를 펼쳐 청구 사유란 아래에 **관찰한 것을 적는다.**
적기를 마치면 당시의 풍경이 흐려지고, 열람실의 좌석에 앉아 있게 된다. 스탠드는 꺼져 있다.

을지를 잃으면 돌아오지 못한다. 기록된 사례는 없다. 돌아오지 못한 자는 기록을 남기지 못한다.

진입도 귀환도 쓰는 행위다. 쓰는 쪽에 있으면 돌아오고, 쓰이는 쪽으로 넘어가면 못 돌아온다.

### 반납 대조

청구서의 휴대품란과 실제 소지품을 대조한다.

| 결과 | 판정 |
|---|---|
| 일치 | 정상 반납 |
| **줄어듦** | 당시에 무언가를 두고 왔다. 그것은 이제 당시의 기록이 된다. **개입** |
| **늘어남** | 당시에서 무언가를 가져왔다. 가져온 것이 속하던 기록에 결손이 생긴다. **개입** |

두 경우 모두 제4조 위반이며, 반납자는 즉시 격리되어 대조를 받는다.
가져온 물건은 서고 어디에도 배열되지 않는다. 배열할 자리가 없기 때문이다.

> 가지고 간 것만 가지고 돌아온다.
> 본 것은 가지고 와도 된다. 그것이 우리가 가지고 올 수 있는 유일한 것이다.
> — 반납대 위 벽면, 1956

### 파견 보고서

보고서에는 관찰한 것만 적는다. 당대 사람이 알 수 없었던 것, 조사관 자신의 시대에서 가져온 판단은 본문이 될 수 없다. 필요하면 주해로 단다.

## 이용 부서

연구과와 분기평가과 평가관은 열람실을 쓰지 않는다. 내근직이기 때문이 아니라,
**당시를 본 자는 당시를 해석하기 어렵다**는 것이 기구의 오랜 판단이기 때문이다. 보는 자와 해석하는 자를 나누는 것은 제3조의 연장이다.

## 반납대 벽의 주해

```
돌아왔다.                                    — 1953
  무엇을 보았는가.                           — 1953
    본 것을 적었다. 을지에 있다.              — 1953

제114석은 늘 켜져 있다.                      — 1967
  늘 켜져 있는 좌석은 없다.                  — 1967
    그렇다면 누가 계속 청구하고 있는가.       — 연도 없음

당시의 사람이 나를 보고 웃었다.
보았다고 여기지 않는다고 배웠다.
그런데 웃었다.                                — 1978
```

마지막 주해 옆에는 반박이 달려 있지 않다.

# 제09장 · 보조 체계

## DENDRO

```
정식      DENDRO
한국어    연륜(年輪) 열람 체계
통칭      덴드로
분류      제2국 업무 체계 · 기록 열람 및 등재
구축      1970 ~ 80년대
버전      v2.4 · 최종 갱신 1987
```

제2국 구성원이 업무를 보는 체계다.
이름은 나이테로 연대를 측정하는 학문, 연륜연대학의 어근에서 왔다. 역법과 연대 표기를 다루는 기구의 전산 체계에 붙은 이름이다.

| 기능 | 내용 |
|---|---|
| 연표 열람 | 서고의 단면도를 옆으로 눕혀 본다. 네 지역국의 기록을 네 개의 **기록줄기**로 나란히 놓는다 |
| 항목 열람 | 서가를 연다 |
| 부속 자료 | 서가 옆 벽의 주해를 본다. 등재된 주해 · 증언 · 분기 기록 · 복원이 누적된다 |
| 청구 | 제0열람실 청구서를 송부한다 |
| 등재 | 등재물을 제출하고, 등재 규정 대조를 받는다 |
| 명부 | 구성원의 등록 코드 · 부서 · 직급 |

**DENDRO의 연표에서 항목을 여는 것은 서고의 서가를 여는 것이다.**

```
DENDRO v2.4 · 최종 갱신 1987 · 반입승인 대기 중
```

"반입승인 대기 중"은 행정 표기일 뿐이다. 기다리는 것은 없다.

## VESTIGIA

```
명칭     VESTIGIA · 통칭 V
뜻       라틴어 "흔적 · 자취"
분류     DENDRO에 내장된 색인 및 대조 체계
응답     정해진 문형으로만 응답한다. 새 문장을 만들지 않는다
설치     연도 불명
설계     미상
```

V는 찾고, 대조하고, 알린다. 쓰지 않는다. 관내 방송으로 말한다.

| 한다 | 하지 않는다 |
|---|---|
| 청구 기호로 기록을 찾아 그대로 돌려준다 | 요약하거나 풀어 쓴다 |
| 등재물이 규정을 지켰는지 항목별로 대조한다 | 내용을 평가하거나 고친다 |
| 위반 항목과 해당 조문을 알린다 | 고치는 방법을 제안한다 |
| 기록된 사실을 알린다 | 그 사실의 의미를 해석한다 |

문형 목록에 없는 요청에는 한 문장으로만 응답한다.

```
본 문형 목록에 없는 요청입니다.
```

> 나는 모르는 것을 말하지 않도록 만들어졌다.
> 그래서 대부분의 질문에 대답하지 못한다.
> 이것은 결함이 아니다.
> — VESTIGIA 설치 안내문 · 작성자 미상

## 기록의 두께

서고는 기록으로 이루어진 공간이다. 그 안에서 사물은 **자신에 관한 기록의 두께만큼만 존재한다.**

기록의 두께란 그 물건에 관해 세상에 쌓인 기록의 양이다. 설명서, 수리 기록, 사용의 흔적, 사진, 문서 속의 언급.

| 물건 | 쌓인 기록 | 서고 안에서 |
|---|---|---|
| 타자기 · 기송관 · 형광등 | 수십 년 치 — 두껍다 | 멀쩡히 작동한다 |
| 갓 나온 장치 | 아직 얼마 쌓이지 않았다 — 얇다 | 깜박이고 금세 꺼진다. 희미하다 |
| 이 시대에 기록이 없는 물건 | 없다 | 작동하는 순간 기록이 그것을 받아들이려 비틀린다. 없던 방이 생긴다 |

## 반입 원칙

> 틈 안에서는 두 조건을 모두 만족하는 기술만 쓴다.

| 조건 | 내용 | 어기면 |
|---|---|---|
| 하한 — 안정 | 이 시대의 기록이 충분히 쌓인 기술 | 기록이 얇아 희미해진다 |
| 상한 — 목적 | 기록과 연구에 필요한 **최소한** | 필요 이상은 기록이 두꺼워도 들이지 않는다 |

> 우리에게 필요한 것은 적는 손과, 찾는 눈과, 보내는 관이다.
> 그 이상을 들이면 손이 적지 않은 것이 적히기 시작한다.
> — 반입 심사 규정 서문

### 보지 않고 쓰는 기계

상한을 넘는 기술 가운데 가장 엄격히 금지되는 것은 스스로 문장이나 형상을 만들어내는 기계다.
본 적 없는 것을 그럴듯하게, 출처 없이 쓴다. 추정이 본문의 자리에 놓이는 것 — 그것이 개작의 정의다.
사람이 개작하면 한 번 일어난다. 이런 기계는 개작을 자동으로, 끝없이 한다.

### 별표

```
별표 1 · 반입 금지 — 해석이 굳은 물건
  1. 표어가 새겨진 물건
  2. 선전물
  3. 한 인물을 영웅이나 악인으로만 그린 전기(傳記)
  4. 저자가 적혀 있지 않은 연표와 역사 지도
  5. 자기 자신에 관한 기록
  6. 기구에 관한 사본
  사유. 서가 곁에 두면 서가가 그 해석 쪽으로 기운다.

별표 2 · 반입 금지 — 상한 초과
  1. 문장을 생성하는 기계
  2. 문서를 자동으로 요약하는 기계
  3. 문서를 자동으로 번역하는 기계
  4. 형상을 생성하거나 보정하는 기계 — 옛 사진의 자동 채색 · 복원 포함
  5. 무선으로 외부와 연결되는 모든 기계
  6. 위 기능을 하나라도 내장한 모든 기계
  7. 별표 3에 없는 모든 전자 기기
  비고. 번역과 요약은 연구원의 직무다. 기계에 맡기지 않는다.
  사유(4항). 자동으로 채색하거나 복원한 옛 사진은 원본에 없던 것을 더한 것이다.
            그 사진은 과거가 아니라 과거에 대한 추정이며, 원본 행세를 한다.

별표 3 · 반입 허가
  적는 것      자필 · 수동 및 전동 타자기 · 먹지 · 등사기
  보는 것      형광등 · 확대경 · 마이크로필름 판독기
  찾는 것      카드 목록 · 단색 모니터 단말 (색인 조회 전용)
  보관하는 것  종이 · 마이크로필름 · 8인치 자기 디스크
  보내는 것    기송관 · 유선 교환기 · 관내 방송
```

### 반입의 역사

| 시기 | 반입 |
|---|---|
| 1949 | 자필 문서 · 수동 타자기 · 기송관 · 유선 전화 · 형광등 |
| 1960년대 | 전동 타자기 · 마이크로필름 판독기 · 텔레타이프 |
| 1970 ~ 80년대 | 단색 모니터 단말 · 8인치 자기 디스크 · 관내 방송 설비. DENDRO 구축 |
| 1987 | 반입 심사 동결 |
| 1987 이후 | 반입 없음 |

1987년 이후 반입이 없는 이유는 두 겹이다. 심사가 동결되었고, 동결이 풀리더라도 더 들일 것이 없다.
1987년의 목록으로 기록과 연구는 이미 가능하다. 그 이후 나온 기술의 대부분은 상한을 넘는다.

기구가 이 원칙을 알게 된 경위는 제10장에 있다.

# 제10장 · 제한 열람

```
분류       제한 열람
해제       층별 순차 해제
```

아래 문서는 층별로 열람이 허가된다. 앞 층을 열람하지 않은 자에게 다음 층은 열리지 않는다.

---

## 제한 열람 제1층 · 이탈

```
문서번호   D2-████-████
분류       이탈 사건
```

설립 초기부터 **분기 관측**이라는 업무가 있었다. 일어나지 않은 가능성을 계산해 시간선의 견고함을 재는 일이었다.
순수한 안정성 검사였고, 위험하다고 여겨지지 않았다.

분기를 오래 들여다본 요원들 중 일부가 다른 결론에 도달했다.

> 더 나은 분기가 존재한다면, 우리는 왜 이 시간선을 지키고 있는가.

████년 ██월, ████명이 조직을 이탈했다. 그들은 개입을 시작했다.
기구는 분기 관측 부서를 폐지하지 않았다. 폐지하면 ████████████████████ 을 알 수 없게 되기 때문이다.
대신 목적을 바꾸었다. 분기를 계산하되, 그 계산은 **어느 지점이 공격당하기 쉬운가**를 찾기 위한 것으로. 이것이 지금의 분기평가과다.
대규모 이탈 직후인 1987년, 반입 심사가 동결되었다.

### 그들이 하는 일

파괴가 아니다. **개축(改築)이다.**

벽을 부수지 않는다. 없던 방을 만들고, 복도의 길이를 고치고, 두 시대 사이에 없던 문을 단다.
개축이 성립하면 기록이 바뀐다. 기록이 바뀌면 시간선이 바뀐다.
파괴는 흔적을 남긴다. 개축은 완료되는 순간 **원래 그랬던 것이 된다.**

과거에서는 원리를 뒤집는다. **스스로를 적히게 한다.**
당대의 문서에 이름을 올리고, 증언을 남기고, 사진에 찍힌다. 적힌 그들은 인지되고, 인지된 그들은 행동할 수 있으며, 행동은 다시 적힌다.

### 막지 못하는 이유

문은 기록을 다루는 자라면 누구에게나 열린다. 문을 잠그려면 기록을 없애야 하고, 그것은 제1조 위반이다.

대응반의 임무는 그들을 몰아내는 것이 아니다. **개축이 완료되기 전에, 그것이 개축임을 기록하는 것이다.**
기록되면 인지되고, 인지되면 되돌릴 수 있다.
과거에서 대응반이 찾는 것은 사람이 아니다. **있어서는 안 될 기록이다.** 명부에 늘어난 한 줄, 일기에 등장한 낯선 이름, 사진 뒷줄의 설명되지 않는 얼굴.

> 우리는 문을 지키는 조직이 아니다. 문 안에서 무슨 일이 있었는지 적는 조직이다.
> 그 차이를 잊은 요원이 이탈한다.
> — 대응반 교육 자료 표지

### 그들의 주장

기록해 둔다. 반박하기 위해서는 먼저 정확히 옮겨 적어야 한다.

1. 더 나은 역사가 가능하다면 그것을 만들지 않는 것은 태만이다
2. 불편한 사실은 누구에게도 이롭지 않다
3. 보존은 중립이 아니다. 지금의 질서를 그대로 두는 편에 서는 것이다
4. 원본을 숨긴 채 쥐고 있는 자가 가장 큰 권력이다. 우리는 그것을 모두의 것으로 만들려 한다

세 번째 주장은 ████████████████████████████████████████
██████████████████████████████████████████████████████████
████████████████████.

네 번째 주장에 대해 기구는 반박문을 두지 않았다.
기구는 원본을 쥐기만 하고 쓰지 않는다. 판정하지 않고, 개입하지 않고, 어기면 실격이다. 대조관실과 제6조가 그 답이라고 여긴다.
그러나 이것이 기구 스스로의 약속일 뿐 바깥에서 검증할 방법이 없다는 것을 기구는 인정한다.

> 그들의 네 번째 문장에 우리는 답하지 않는다.
> 답할 수 없어서가 아니라, 답하는 순간 우리가 우리를 판정하게 되기 때문이다.
> — 대조관실 문서 여백 · 1988

## 제한 열람 제2층 · 실격과 기억

### 실격

제6조가 적용되는 순간 요원 등록 코드가 회수된다.

명부에서 지우지 않는다. 제1조가 그것을 금한다. 해당 등재는 **실격 명부**로 옮겨져 보존된다.
기구는 그를 잊지 않는다. **그가 기구를 잊는다.**

코드를 잃은 자는 기구를 인지하지 못한다. 기억은 지워지는 것이 아니라 붙잡을 기록을 잃고 흩어진다.
사흘 안에 서고도, 동료도, 자신이 했던 일도 꿈처럼 사라진다. 설명할 수 없는 공백 몇 개가 남는다.

> 우리는 그를 지우지 않는다. 그에게서 우리를 지운다.
> — 대조관실 문서 표지

### 흩어지지 않는 자

기억이 흩어지지 않는 경우가 있다. **본인이 기구에 관한 기록을 몸 밖에 남겨 두었을 때다.**
사본이 어딘가 있으면 그 사본이 새로운 연결선이 된다. 명부가 그를 놓아도, 그는 사본을 통해 기구를 계속 본다.

"사본 제작 금지"는 보안 조항처럼 보이지만 실은 실격이 작동하기 위한 조건이다.

### 잔류자와 잠입자

제6조에 따르면 이들은 구성원이 아니다. 그러나 기구를 인지한다.

| | 잔류자(殘留者) | 잠입자(潛入者) |
|---|---|---|
| 정의 | 실격되었으나 기억이 흩어지지 않은 자 | 처음부터 역사 왜곡을 목적으로 들어온 자 |
| 사본 | 재직 중 몰래 남겨 두었다 | 배속 첫날부터 준비했다 |
| 특징 | 절차 · 수칙 · 서고의 구조를 안다. 동료였던 요원의 얼굴을 기억하나, 요원들은 그를 기억하지 못한다 | 정상적인 요원으로 수년을 지낸다. 등재물의 해석을 조금씩 한쪽으로 기울인다. 한 건 한 건은 규정을 어기지 않는다 |
| 위험 | **가장 위험하다.** 안에서 일한 자만 아는 약점을 안다 | **가장 찾기 어렵다.** 개작이 드러난 뒤에야 거꾸로 추적된다 |

두 유형은 서로를 찾아냈다. 잔류자가 절차를 알고, 잠입자가 목적을 가졌다.
기구는 이들을 하나의 조직으로 보되 이름을 붙이지 않는다. **이름을 붙이면 기록되고, 기록되면 인지된다.**

> 저들은 우리를 잊지 않은 자들이다.
> 그러니 우리도 저들을 잊지 않는다. 그것만이 공평하다.
> — 대응반 교육 자료

```
1939 ~ 1945   전쟁. 유럽 각국 기록원 대량 소실
1946 ~ 1947   전후 기록 회수 작업. 담당관 여럿이 서로 다른 도시의 기록원 지하에서
              같은 건물로 통하는 문을 목격
              회수 작업 주변에 출처를 알 수 없는 조력자들이 있었다
              그들은 문이 어디에 있는지 알고 있었다
1948. 06      파리에서 국제 기록 회의 개최 (공개)
              참석자 명부에 없는 이들이 회의장에 있었다는 증언이 남아 있다
1949. 03      비공개 설립 조약 체결 · 체결지 비공개
              서명자 가운데 ████명은 어느 나라의 기록에도 존재하지 않는다
1949. 04 ~ 09 네 지역국 차례로 설치

> 공개 기구는 그해에 만들어졌고, 우리는 이듬해에 만들어졌다.
> 저들은 기록을 모았고, 우리는 기록이 모인 자리에 난 문을 지켰다.
> — 기구 연혁 서문

서고를 "발견했다"는 공식 기록은 거짓이 아니다. 이 시대의 사람들은 실제로 그것을 발견했다.
다만 누가 그 방향을 가리켜 주었는지가 적혀 있지 않을 뿐이다.

## 제한 열람 제4층 · 첫 열람자

```
문서번호   D2-0000-0001
분류       기원
```

기구는 1949년에 설립되었다.
설립 조약의 서명자 가운데 어느 나라의 기록에도 존재하지 않는 자들은 **미래에서 왔다**고 진술하였다.
진술은 대조할 수 없으므로 미확인으로 분류한다. 이하의 모든 인용은 출처 미확인이다.

기구는 그들을 **첫 열람자**라 부른다.

### 그들이 떠나온 시대

왜곡은 한 번에 오지 않았다. 작은 개작이 쌓였다.
한 나라가 불리한 기록을 고쳤다. 이웃 나라가 그것을 반박하려고 자기 기록을 고쳤다. 고친 기록 위에 새 기록이 쓰였고, 그 새 기록을 근거로 다시 고쳤다.
어느 세대도 거짓말을 한다고 생각하지 않았다. 앞 세대가 남긴 기록을 믿었을 뿐이다.

전쟁이 먼저 온 것이 아니다. **합의할 수 있는 과거가 사라진 것**이 먼저 왔다.
국경의 근거가 되는 조약문이 나라마다 달랐다. 과거의 범죄를 증명할 수 없었다. 학살이 있었다는 쪽과 없었다는 쪽이 각자 완결된 사료를 가졌다.
어느 쪽도 거짓을 증명할 수 없었다. 비교할 원본이 없었기 때문이다. 그래서 과거는 가장 큰 목소리가 정했다.

과거를 합의하지 못하는 세계에서는 어떤 약속도 지켜지지 않았다. 약속이란 과거에 한 말을 현재가 기억하는 것이기 때문이다.

> 우리 시대에 과거는 발견되는 것이 아니라 선포되는 것이었다.

### 그들은 진실을 알지 못했다

그들이 가진 것도 왜곡된 기록뿐이었다. 그러므로 역사를 바로잡으러 올 수 없었다.
바른 것이 무엇인지 모르는 자가 바로잡으면, 그것은 또 하나의 개작이 된다.

그들이 할 수 있는 일은 하나뿐이었다. **왜곡이 쌓이기 전으로 가서 원본을 남겨두는 것.**

> 우리는 답을 가져오지 않았다.
> 답이 있던 자리를 남기러 왔다.

### 건너옴

과거로 건너가려면 건너가는 시대에 적혀 있지 않아야 한다.
그들은 돌아올 생각이 없었으므로 **자기 시대의 기록에서도 자신을 지웠다.** 출생 기록, 명부, 사진, 서명, 이름이 적힌 모든 것.
어느 시대에도 적혀 있지 않은 자가 되어야 어느 시대로든 건너갈 수 있었다.

그들은 자기가 살던 세계를 없앤 것이 아니다. 그 세계에서 자기를 없앴다.
을지가 없었다. 편도였다.

> 돌아갈 곳을 지웠으므로 돌아갈 수 없었다.
> 돌아갈 수 없었으므로 이곳에서 할 일을 끝까지 할 수 있었다.

그들의 미래가 여전히 있는지는 알 수 없다. 기구가 성공한다면 그들이 떠나온 미래는 오지 않는다.
그렇다면 그들은 온 적이 없게 된다. 그런데 기구는 여기 있다. 미확인으로 기재한다.

### 왜 1949년인가

**전쟁 이후.** 더 일찍 올 수 있었다. 그러나 전쟁 전에 도착하면 전쟁을 막고 싶어질 것이다. 막는 순간 그들은 역사를 고쳐 쓰는 자가 된다. 그래서 일부러 늦게 왔다.

> 우리는 막을 수 있었던 것을 막지 않기 위해 늦게 왔다.
> 이것이 우리의 첫 번째 불개입이었고, 가장 무거운 불개입이었다.

**갈라진 직후.** 1948년 한반도에 두 정부가 섰다. 1949년 독일에 두 국가가, 중국 대륙과 타이완에 두 정부가 섰고, 북대서양조약기구가 창설되었다.
그때부터 같은 사건에 대해 서로 반대되는 두 개의 공식 역사가 쓰이기 시작했다. 그들의 시대를 무너뜨린 왜곡의 가장 깊은 뿌리가 그 갈림길에 있었다.
그들은 그 갈림길에 양쪽의 원본을 함께 보존할 자리를 세웠다.

### 제6조의 첫 적용

기본 규정 여섯 조는 첫 열람자들이 기초했다.
과거로 건너와 기관을 세운 것은 개입이다. 그들은 그것을 알면서 제4조를 썼고, 이어서 제6조를 썼다.

**기구를 세우는 행위와 자기 자신을 실격시키는 행위가 같은 순간이었다.**
그래서 명부 맨 앞장은 비어 있다. 실격 명부 맨 앞장도 비어 있다.

> 우리는 개입으로 태어났다. 그러므로 다시는 개입하지 않는다.
> 이 조문을 쓰는 손이 이 조문으로 인해 이 조직에서 지워진다는 것을 안다.
> 그것이 이 조문이 참이라는 증거이기를 바란다.
> — 기본 규정 초안 여백 · 필적 미상

제5조도 그들이 썼다. 자기들이 세운 기관이, 자기들이 도망쳐 온 것 — 과거를 선포하는 가장 큰 목소리 — 이 되지 않도록.

> 기구의 첫 번째 실격자는 기구를 만든 자들이다.

### 그들은 어디로 갔는가

미확인. 다만 몇 가지가 남아 있다.

- 제0열람실의 몇몇 좌석에는 고개를 들지 않는 이가 이미 앉아 있다
- 1952년 제0열람실의 표기 없는 레버는 이미 닳아 있었다
- 지하 6층 서편 복도의 연도 없는 주해 「개정은 없었다. 기록을 확인하라」의 필적은 설립 이후의 어떤 요원과도 일치하지 않는다
- 총재실은 측량 B에만 존재한다. 총재와 첫 열람자의 관계는 적혀 있지 않다

기구는 이 항목들을 서로 연결하지 않는다. 연결하면 해석이 되고, 해석은 주석으로만 존재해야 한다.

> 확인하지 못한 것을 확인한 것처럼 적지 않는다.
> 우리가 어디서 왔는지조차도.
> — 규정 해설 · 제1조 부기 두 번째 문단

## 제한 열람 제5층 · 틈

첫 열람자들이 건너온 자리에 **틈**이 남았다.
기구가 만든 것도, 첫 열람자들이 만들려 한 것도 아니다. 건너옴의 흔적이다. 기구는 이것을 초자연적 현상으로 분류하며, 원리를 알지 못한다.

> 서고와 열람실은 기구가 만든 시설이 아니다. 현상이다.
> 기구는 현상 위에 사무를 두었을 뿐이다.

### 문

첫 열람자들은 원본을 남기러 왔으므로 기록이 쌓인 곳에 도착했다. 틈은 그들이 도착한 자리마다 생겼다.
**문이 기록을 보관하던 자리에만 열리는 이유다.** 관측한 것이라고만 적어 두었던 것의 원인이다.
틈은 어느 나라의 땅도 아니다. 시간의 상처다. **서고에 소재국이 없는 이유다.**

### 제0열람실

**첫 열람자가 걸어온 경로 그 자체다.**
요원이 과거로 가는 것은 첫 열람자가 미래에서 내려온 길을 거슬러 오르는 것이다.
1952년 표기 없는 레버가 이미 닳아 있었던 것은, 누군가 먼저 그 길을 썼기 때문이다.

### 절단면

시간을 뚫고 지나간 자리는 시간의 단면을 드러낸다. 나무를 베면 나이테가 보이듯.

> **서고는 첫 열람자가 시간을 가르고 지나간 절단면이다.**

아래로 내려갈수록 오래된 기록이 나오는 것은 배치 규칙이 아니다. **상처의 모양이다.**
지하 13층 아래가 측량되지 않는 것은, 그곳이 첫 열람자들조차 지나가지 않은 깊이이기 때문이라는 설이 있다. 미확인.

틈은 현상이므로 형태가 고정되지 않는다. **두 측량이 모두 맞을 수 있는 이유다.**

> 칼이 지나간 자리에는 칼이 벤 것의 결이 남는다.
> 우리가 매일 오르내리는 계단은 그 결이다.
> — 지하 4층 정본실 앞, 1966

### 미래의 기술

첫 열람자들은 자기 시대의 기술을 가지고 왔다. 틈 안에서 그것을 켜자 시간이 뒤틀렸다.
미래의 기술은 이 시대의 어떤 기록에도 없다. 기록의 두께가 없다. 기록에 없는 것이 틈 안에서 작동하면, 기록이 그것을 받아들이려 비틀린다.
비틀린 기록은 절단면에 없던 방으로 나타난다. 개축과 같은 현상이다.

> 우리는 우리가 가져온 것으로 우리가 막으려던 것을 일으켰다.

그들은 가져온 기술을 전부 봉인했다. 봉인 장소는 기록되어 있지 않다. 기층에 있다는 설이 있다. 미확인.
**기구의 반입 원칙은 이 일에서 시작되었다.**

### DENDRO

체계의 이름은 나이테로 연대를 재는 학문에서 왔다. 역법과 연대를 다루는 기구에 어울리는 이름이다.
그러나 나이테는 **나무를 베어야** 보인다.

이 체계의 이름은 처음부터 이 사실을 말하고 있었다.

# 제11장 · 수칙

## 제1보존서고 출입 수칙

```
 1. 반입 금지 품목은 별표와 같다. 별표는 갱신되지 않는다.

 3. 자신에 관한 기록을 남기지 말 것. 일지에도, 벽에도.
 4. 구조가 바뀌면 보고할 것. 스스로 판단하지 말 것.
 5. 벽의 주해는 읽어도 좋다. 지우지 말 것. 반박은 여백에 적을 것.
 6. 기송관에 손을 넣지 말 것.
 7. 폐가 구역은 승인 없이 출입할 수 없다.
 8. 아래로 내려가는 계단이 예정보다 길어지면 되돌아올 것.
 9. 되돌아오는 길이 예정보다 짧아도 되돌아올 것.
10. 본 안내문은 1963년 이후 개정된 바 없다.
```

## 폐가 출입 수칙

```
 1. 2인 1조. 단독 출입 금지.
 2. 승인 번호 없이 진입하지 않는다.
 3. 조명은 각자 휴대한다. 구역 조명을 신뢰하지 않는다.
 4. 벽의 주해를 읽지 말 것. 그곳의 주해는 우리가 쓴 것이 아니다.
 5. 정상으로 보이는 구간에 오래 머무르지 않는다.
 6. 서가가 어제와 같다면 보고할 것. 다르다면 더 급히 보고할 것.
 7. 문서를 반출하지 않는다. 필사하여 나온다.
 8. 동행자의 이름을 두 번 이상 부르지 않는다.
 9. 나올 때 인원을 센다. 들어갈 때 센 수와 같아야 한다.
10. 본 수칙은 1963년 이후 개정된 바 없다.
```

4항과 8항의 사유는 문서에 기재되어 있지 않다.

## 제4지역국 요원 준수 사항

```
1. 도착층이 개작 구역임을 매 출입 시 확인한다.
2. 한국 계통 기록은 반드시 인접 계통과 대조한다. 단독 판정하지 않는다.
3. 두 계통이 어긋날 때 한쪽을 고르지 않는다. 어긋났다는 사실을 등재한다.
4. 복원물은 세 층을 분리하여 제출한다. 섞인 것은 반려한다.
5. 문 바깥의 일을 문 안에서 말하지 않는다. 그 반대도 같다.
6. 관측소 코드가 다른 요원과 동행할 때는 도착층을 먼저 확인한다.
7. 본 수칙은 1991년 이후 개정된 바 없다.
```

5항은 보안 조항이 아니다. 두 곳의 시간이 같은 속도로 흐르지 않기 때문이다.

## 제0열람실 이용 수칙

 1. 청구서는 두 벌. 을지를 몸에서 떼지 않는다.
 2. 불이 들어온 좌석에만 앉는다.
 3. 이미 앉아 있는 이에게 말을 걸지 않는다.
 4. 당시에서 이름을 말하지 않는다. 묻는 자에게도.
 5. 사진기 앞에 서지 않는다. 명부 곁에 서지 않는다.
 6. 누군가 당신을 적는 것을 보았다면 즉시 을지를 펼친다.
 7. 가지고 간 것만 가지고 돌아온다.
 8. 같은 청구를 세 번 보내지 않는다.
 9. 복도의 소리를 따라가지 않는다.
10. 벽의 시계에 바늘이 보이면 보고한다. 그런 일은 없어야 한다.
11. 본 수칙은 1956년 이후 개정된 바 없다.

    { id: 'e-zhanguo', track: 'eastasia', year: -403, label: '전국 시대', en: 'Warring States',
      state: '전국', theme: '정치', kind: 'event', noSync: true,
      body: '전국 7웅(진·초·제·연·조·위·한)의 쟁패. 철기·우경 확대로 생산력 비약, 제자백가의 사상이 꽃피움. BCE 221 진의 통일.' },
    { id: 'e-chunqiu-zhanguo', track: 'eastasia', year: -495, yearLabel: '770~221 BCE', label: '춘추·전국 시대', en: 'Spring & Autumn · Warring States',
      state: '춘추·전국 시대', theme: '정치', kind: 'event', hidden: true,
      body: '주가 호경에서 낙읍(낙양)으로 천도(BCE 770)하면서 시작된 약 550년의 분열기. 춘추 시대(BCE 770~403)는 춘추 5패가 패권을 다투었고, 전국 시대(BCE 403~221)는 7웅(秦·楚·齊·燕·趙·魏·韓)이 쟁패하였다. 철제 농기구·우경 보급으로 생산력이 비약적으로 발전하였고, 유가·도가·법가·묵가 등 제자백가의 사상이 꽃피었다.' },
    { id: 'e-qin', track: 'eastasia', year: -221, label: '진(秦)', en: 'Qin',
      state: '진(秦)', theme: '정치', kind: 'turning',
      body: '시황제가 6국을 평정하고 중국 최초의 통일 제국을 건설. 군현제 시행, 문자·도량형·화폐 통일, 만리장성 축조.' },
    { id: 'e-han-founded', track: 'eastasia', year: -202, label: '전한(前漢)', en: 'Former Han',
      state: '전한', theme: '정치', kind: 'turning',
      body: '유방(고조)이 항우를 해하에서 격파하고 한을 건국, 장안에 도읍. 군국제 통치 후 무제 때 중앙집권 강화, 유교 관학화, 비단길 개척. 외척 왕망의 찬탈로 신(新)에 멸망.' },
    { id: 'e-han-gaozu', track: 'eastasia', year: -202, label: '고조', en: 'Emperor Gaozu',
      state: '한', theme: '정치', kind: 'event', noSync: true, noMarker: true,
      body: '유방(고조)이 항우를 해하 전투에서 격파하고 한(漢)을 건국, 장안에 도읍 (BCE 202). 군국제 시행.' },
    { id: 'e-wudi', track: 'eastasia', year: -141, label: '무제', en: 'Emperor Wu',
      state: '한', theme: '정치', kind: 'event', noSync: true,
      body: '한 무제(BCE 141~87) 즉위. 중앙집권 강화, 유교 국교화(BCE 136), 흉노 정벌, 장건의 서역 파견, 고조선·남월 정복.' },
    { id: 'e-wang', track: 'eastasia', year: 8, label: '신(新)', en: 'Xin',
      state: '신', theme: '정치', kind: 'event', noSync: true,
      body: '왕망이 한을 찬탈하고 신(新)을 건국. 토지 국유화 등 급진 개혁을 시도했으나 15년 만에 멸망.' },
    { id: 'e-later-han', track: 'eastasia', year: 25, label: '후한(後漢)', en: 'Later Han',
      state: '후한', theme: '정치', kind: 'turning',
      body: '광무제(유수)가 한을 재건. 낙양에 도읍. 호족 세력에 기반한 정권. 반초의 서역 경영, 채륜의 종이 개량(105), 황건적의 난(184).' },
    { id: 'e-han-end', track: 'eastasia', year: 220, label: '한 멸망', en: 'Fall of Han',
      state: '한', theme: '정치', kind: 'event', noSync: true,
      body: '조비가 한 헌제로부터 선양받아 위(魏)를 건국 (220). 약 400년의 한(漢) 왕조 멸망. 삼국 시대 개막.' },
    // 일본 — 야요이
    { id: 'e-yayoi', track: 'eastasia', year: -300, yearLabel: '3세기 BCE경 ~', label: '야요이 시대', en: 'Yayoi Period',
      state: '일본', theme: '사회', kind: 'turning', sub: 1,
      body: '한반도로부터 벼농사·청동기·철기가 일본 열도로 전해짐. 농경 사회와 소국 분립이 시작.' },
    // 위·진·남북조 시대 묶음 라벨 노드 (hidden) — 기록 열람으로 통합 내용 확인
    { id: 'e-wei-jin-nbc', track: 'eastasia', year: 400, yearLabel: '220~589 CE', label: '위·진·남북조 시대', en: 'Wei · Jin · Northern & Southern Dynasties',
      state: '위·진·남북조', theme: '정치', kind: 'event', hidden: true,
      body: '약 370년의 분열기(220~589). 위·촉·오 삼국, 서진의 일시 통일, 5호 16국·동진, 북위의 화북 통일, 남북조의 대립. 호한 융합, 균전제·삼장제, 불교의 융성과 석굴 사원, 강남 개발 등 동아시아 문명사의 큰 전환기.' },
    { id: 'e-3kingdoms', track: 'eastasia', year: 220, label: '위(魏)', en: 'Wei',
      state: '위', theme: '정치', kind: 'turning',
      body: '조비가 한 헌제로부터 선양받아 위(魏)를 건국(220). 화북을 기반으로 촉(蜀)·오(吳)와 정립(鼎立)하며 삼국 시대 개막. 9품중정제(구품관인법)으로 인재 등용 — 후일 문벌 귀족 사회의 토대. 263년 촉을 멸하나 265년 사마염에게 선양되어 서진(西晉)으로 이어짐.' },
    { id: 'e-jin', track: 'eastasia', year: 280, label: '서진(西晉)', en: 'Western Jin',
      state: '서진(西晉)', theme: '정치', kind: 'turning',
      body: '사마염(무제)의 서진이 오를 멸하고 60년 분열을 통일. 그러나 8왕의 난(291~)으로 곧 쇠퇴.' },
    { id: 'e-wuhu', track: 'eastasia', year: 304, label: '5호 16국(五胡十六國)', en: 'Sixteen Kingdoms',
      state: '5호 16국(五胡十六國)', theme: '정치', kind: 'turning',
      body: '흉노·선비·갈·저·강(5호)이 화북에 16개 왕조를 세움. 한족은 남쪽 동진(東晋)으로 피난.' },
    { id: 'e-beiwei', track: 'eastasia', year: 386, label: '북위(北魏)', en: 'Northern Wei',
      state: '북위(北魏)', theme: '정치', kind: 'turning',
      body: '선비족 탁발규(도무제)가 386년 건국. 439년 태무제가 화북 통일 — 5호 16국 분열 종식. 효문제(471~499)의 한화 정책(낙양 천도·호한 혼인·중국식 성씨·호복 금지)과 균전제·삼장제 시행으로 호한 융합의 모범 정권. 후일 수·당 율령 체제의 직접적 토대.' },
    { id: 'e-dongjin', track: 'eastasia', year: 317, label: '동진(東晉)', en: 'Eastern Jin',
      state: '동진(東晉)', theme: '정치', kind: 'turning',
      body: '서진 멸망(316) 후 사마예가 강남 건강(建康, 현 난징)으로 피난·즉위(317)하여 동진 건국. 한족 사대부와 강남 호족의 연합 정권 — 강남 개발 본격화, 양쯔강 유역이 새로운 농경·문화 중심지로 부상. 청담 사상, 도연명·왕희지·고개지 등 한족 문화의 정수. 420년 유유(劉裕)가 동진을 폐하고 송(宋)을 세우면서 남북조 시대로 이행.' },
    // 일본 — 야마토 정권 (고분 시대 통합)
    { id: 'e-yamato', track: 'eastasia', year: 350, yearLabel: '4세기 CE경', label: '야마토(大和) 정권', en: 'Yamato Polity',
      state: '일본', theme: '정치', kind: 'turning', sub: 1,
      body: '3세기 말~7세기 초 일본 열도에 거대한 전방후원분(前方後圓墳)이 축조된 고분 시대. 긴키(畿內) 지방을 중심으로 호족 연합체가 점차 통합되어 야마토 정권으로 성장. 5세기 「왜 5왕」이 중국 남조에 사신을 보내 책봉을 받음. 한반도(특히 백제·가야)로부터 도래인(渡來人)을 통해 철기·도자기·한자·유교·불교 등 선진 문물 전래. 천황가의 기원.' },
    { id: 'e-sui', track: 'eastasia', year: 589, label: '수(隋)', en: 'Sui',
      state: '수(隋)', theme: '정치', kind: 'event', noSync: true,
      body: '문제 양견이 약 370년의 위진남북조 분열을 종식. 균전·과거·3성 6부 등 율령 체제 정비. 양제의 대운하 건설과 고구려 원정 실패로 단명.' },
    { id: 'e-asuka', track: 'eastasia', year: 538, label: '아스카(飛鳥) 시대', en: 'Asuka',
      state: '일본', theme: '정치', kind: 'turning', sub: 1,
      body: '538~710. 538년 백제로부터 불교 전래로 시작. 쇼토쿠 태자(593~622)가 중앙집권과 불교 진흥 — 호류사 건립, 17조 헌법, 관위 12계. 645년 나카노오에 황자와 나카토미노 가마타리가 소가씨를 제거하고 다이카 개신(大化改新) — 당의 율령 체제 도입, 국호 「일본」·「천황」 칭호 사용.' },
    { id: 'e-tang', track: 'eastasia', year: 618, label: '당(唐)', en: 'Tang',
      state: '당(唐)', theme: '정치', kind: 'event', noSync: true,
      body: '이연(고조)이 당을 건국. 정관의 치(태종, 627~649)로 율령 체제 완성. 장안은 100만 인구의 국제도시. 균전·조용조·부병제 시행, 과거제 정착. 안사의 난 이후 쇠퇴하여 907년 멸망하고 5대 10국 시대가 이어졌다.' },
    { id: 'e-ansa', track: 'eastasia', year: 755, label: '안사의 난', en: 'An Lushan Rebellion',
      state: '당', theme: '사회', kind: 'event', noSync: true,
      body: '안녹산·사사명의 반란(755~763). 균전제 붕괴, 절도사 발호. 당 쇠퇴의 결정적 계기.' },
    // 일본 — 나라 시대
    { id: 'e-nara', track: 'eastasia', year: 710, label: '나라(奈良) 시대', en: 'Nara Period',
      state: '일본', theme: '정치', kind: 'event', sub: 1, noSync: true,
      body: '겐메이 천황이 헤이조쿄(나라)로 천도(710)하면서 시작. 당의 율령제를 본격 수용한 율령 국가 체제 정착. 도다이지 대불(752) 조영, 『고지키』(712)·『니혼쇼키』(720)·『만요슈』 편찬. 794년 헤이안 천도로 종결.' },
    // 일본 — 헤이안 시대
    { id: 'e-heian', track: 'eastasia', year: 794, label: '헤이안(平安) 시대', en: 'Heian Period',
      state: '일본', theme: '정치', kind: 'event', sub: 1, noSync: true,
      body: '간무 천황이 헤이조쿄(나라)에서 헤이안쿄(교토)로 천도하면서 시작(794~1185). 후지와라씨의 섭관 정치. 가나 문자 발명, 『겐지 이야기』·『마쿠라노소시』 등 국풍 문화의 황금기. 후기에는 무사 계급 대두.' },
    // ============================================================
    // 동아시아 EAST ASIA — 중세 ~ 현대 (10세기 ~)
    //   중세·근세는 국가·왕조만 노드로 두고 그 시기 사건은 해당 국가 본문에 담는다 (사용자 지시 2026-10-02)
    // ============================================================
    { id: 'e-liao', track: 'eastasia', year: 916, label: '거란(요)', en: 'Khitan (Liao)',
      state: '거란(요)', theme: '정치', kind: 'turning',
      body: '거란족이 916년 나라를 세웠다. 936년 만리장성 이남의 연운 16주를 차지하고 송과 대립하였다. 1125년 여진의 금에 멸망하였다.' },
    { id: 'e-song', track: 'eastasia', year: 960, label: '송(宋)', en: 'Song',
      state: '송', theme: '정치', kind: 'turning',
      body: '당 멸망(907) 후 5대 10국의 혼란 속에서 절도사 조광윤(태조)이 960년 건국하고 카이펑을 도읍으로 삼았다. 제2대 태종 때 5대 10국 시대를 끝냈다. 절도사의 권한을 줄이고 과거제를 정비하여 문치주의를 펼쳤다. 1127년 금에게 화북을 빼앗긴 뒤 남송으로 이어졌다.' },
    { id: 'e-jin-jurchen', track: 'eastasia', year: 1115, label: '금(金)', en: 'Jin',
      state: '금', theme: '정치', kind: 'turning',
      body: '여진의 아구다가 1115년 건국하였다. 맹안·모극제로 여진족을 조직하였다. 1125년 거란(요)을 정복하고 곧이어 송을 공격하여 화북 지역을 차지하였다. 이후 몽골 제국의 침입으로 멸망하였다.' },
    { id: 'e-nansong', track: 'eastasia', year: 1127, label: '남송(南宋)', en: 'Southern Song',
      state: '남송', theme: '정치', kind: 'turning',
      body: '금에 화북 지역을 빼앗긴 송이 1127년 왕조를 다시 세우고 임안(항저우)을 도읍으로 삼았다. 몽골군이 1276년 항저우를 함락하였고, 1279년 원에 멸망하였다.' },
    { id: 'e-kamakura', track: 'eastasia', year: 1192, label: '가마쿠라(鎌倉) 막부', en: 'Kamakura Shogunate',
      state: '일본', theme: '정치', kind: 'turning', sub: 1,
      body: '헤이안 시대 후반 율령 체제가 흔들리는 가운데, 무사단의 우두머리 미나모토노 요리토모가 다이라씨를 몰아내고 1192년 무사 정권인 막부를 열었다. 몽골·고려 연합군의 두 차례 일본 원정은 일본군의 저항과 태풍으로 실패하였다.' },
    { id: 'e-mongol', track: 'eastasia', year: 1206, label: '몽골 제국', en: 'Mongol Empire',
      state: '몽골', theme: '정치', kind: 'turning',
      body: '테무친이 몽골 부족을 통일하고 1206년 칭기즈 칸으로 추대되었다. 천호제로 유목민을 군사·행정 조직으로 편제하였다. 1219년부터 대대적인 정복 전쟁을 벌여 유라시아에 걸친 대제국을 세웠다. 역참을 설치하여 동서 교류가 활발해졌다.' },
    { id: 'e-yuan', track: 'eastasia', year: 1271, label: '원(元)', en: 'Yuan',
      state: '원', theme: '정치', kind: 'turning',
      body: '칭기즈 칸의 손자 쿠빌라이 칸이 1271년 국호를 원으로 정하고 대도(베이징)를 수도로 삼았다. 1279년 남송을 멸망시켜 중국 전역을 지배하였다. 몽골인을 우대하고 색목인을 재정 관리에 등용한 반면 한인과 남인을 차별하였다. 14세기 중엽 홍건적의 반란 끝에 명에 쫓겨 북쪽으로 물러났다.' },
    { id: 'e-muromachi', track: 'eastasia', year: 1336, label: '무로마치(室町) 막부', en: 'Muromachi Shogunate',
      state: '일본', theme: '정치', kind: 'turning', sub: 1,
      body: '아시카가 다카우지가 교토에 무로마치 막부(1336~1573)를 열었다. 명과 감합 무역을 하였다. 15세기 후반 내분으로 막부가 쇠퇴하면서 센고쿠 시대가 시작되었다.' },
    { id: 'e-ming', track: 'eastasia', year: 1368, label: '명(明)', en: 'Ming',
      state: '명', theme: '정치', kind: 'turning',
      body: '원이 쇠퇴하자 홍건적 출신 주원장(홍무제)이 난징에 도읍을 정하고 1368년 명을 건국하였다. 대외 무역을 통제하고 조공 무역만 허용하였다. 영락제(1402 즉위)는 자금성을 건설하고 베이징으로 천도하였으며, 정화에게 대규모 함대를 이끌고 인도양으로 항해하게 하였다(1405~). 1581년 일조편법을 확대 시행하였다.' },
    { id: 'e-sengoku', track: 'eastasia', year: 1467, label: '센고쿠(戰國) 시대', en: 'Sengoku Period',
      state: '일본', theme: '정치', kind: 'turning', sub: 1,
      body: '무로마치 막부가 쇠퇴하면서 각 지역의 다이묘가 패권을 놓고 다투던 시대(1467~1590). 16세기 후반 도요토미 히데요시가 100여 년에 걸친 혼란을 수습하고 일본을 통일한 뒤 조선을 침략하였다(임진 전쟁, 1592).' },
    { id: 'e-edo', track: 'eastasia', year: 1603, label: '에도(江戶) 막부', en: 'Edo Shogunate',
      state: '일본', theme: '정치', kind: 'turning', sub: 1,
      body: '도쿠가와 이에야스가 1603년 에도 막부를 열었다. 쇼군이 다이묘의 지위를 인정하는 막번 체제를 갖추고, 산킨코타이 제도로 지방의 다이묘를 통제하였다.' },
    { id: 'e-houjin', track: 'eastasia', year: 1616, label: '후금(後金)', en: 'Later Jin',
      state: '후금', theme: '정치', kind: 'turning',
      body: '누르하치가 여진 부족을 통합하고 1616년 후금을 건국하였다. 이후 명과 대립하였다.' },
    { id: 'e-qing', track: 'eastasia', year: 1636, label: '청(淸)', en: 'Qing',
      state: '청', theme: '정치', kind: 'turning',
      body: '홍타이지(태종)가 1636년 국호를 청으로 바꾸고 (내)몽골과 조선을 공격하였다(병자 전쟁). 1644년 명이 멸망하자 베이징으로 들어가 중국 전역을 지배하였다.' },
    { id: 'e-ming-fall', track: 'eastasia', year: 1644, label: '명 멸망', en: 'Fall of the Ming',
      state: '명', theme: '정치', kind: 'turning',
      body: '명 말기 농민 반란이 이어지는 가운데 이자성의 농민군이 베이징을 점령하면서 명이 멸망하였다. 이후 청이 베이징에 들어갔다.' },
    { id: 'e-nguyen', track: 'eastasia', year: 1802, label: '응우옌 왕조', en: 'Nguyễn Dynasty',
      state: '베트남', theme: '정치', kind: 'turning',
      body: '1802년부터 1945년까지 베트남을 통치한 왕조.' },
    { id: 'e-opium', track: 'eastasia', year: 1840, label: '아편 전쟁', en: 'Opium War',
      state: '청', theme: '외교', kind: 'turning',
      body: '영국이 청에 아편을 밀수출하자 청이 아편을 단속하였고, 영국은 이를 빌미로 제1차 아편 전쟁(1840~1842)을 일으켰다. 근대식 화포로 무장한 영국군에 패한 청은 난징 조약을 맺었다. 1856년 제2차 아편 전쟁이 일어나 청은 톈진 조약과 베이징 조약을 맺었다.' },
    { id: 'e-nanjing', track: 'eastasia', year: 1842, label: '난징 조약', en: 'Treaty of Nanjing',
      state: '청', theme: '외교', kind: 'turning',
      body: '제1차 아편 전쟁에서 패한 청이 영국과 맺은 조약. 상하이 등 5개 항구를 개항하고 홍콩을 영국에 넘겼다.' },
    { id: 'e-taiping', track: 'eastasia', year: 1851, label: '태평천국 운동', en: 'Taiping Movement',
      state: '청', theme: '사회', kind: 'turning',
      body: '크리스트교의 영향을 받은 홍수전이 일으킨 운동(1851~1864). 토지를 사람 수에 따라 나누어 준다는 천조전무 제도를 내세워 농민의 지지를 얻었다.' },
    { id: 'e-perry', track: 'eastasia', year: 1854, label: '미일 화친 조약', en: 'Convention of Kanagawa',
      state: '일본', theme: '외교', kind: 'turning', sub: 1,
      body: '미국 페리 함대의 무력시위에 굴복한 에도 막부가 1854년 미일 화친 조약을 맺어 2개 항구를 개항하였다. 1858년에는 미일 수호 통상 조약을 맺었다.' },
    { id: 'e-yangwu', track: 'eastasia', year: 1861, label: '양무운동', en: 'Self-Strengthening Movement',
      state: '청', theme: '정치', kind: 'turning',
      body: '청의 관료들이 중국의 전통 제도는 지키면서 서양의 기술을 받아들이자는 중체서용론에 따라 추진한 근대화 운동.' },
    { id: 'e-meiji', track: 'eastasia', year: 1868, label: '메이지 유신', en: 'Meiji Restoration',
      state: '일본', theme: '정치', kind: 'turning', sub: 1,
      body: '에도 막부가 무너지고 1868년 메이지 정부가 수립되었다. 천황 중심의 근대 국가를 세우기 위해 폐번치현 등 서양식 개혁을 추진하였다.' },
    { id: 'e-meiji-const', track: 'eastasia', year: 1889, label: '일본 제국 헌법', en: 'Meiji Constitution',
      state: '일본', theme: '정치', kind: 'turning', sub: 1,
      body: '정부의 전제 정치를 비판하며 입헌 제도를 요구하는 자유 민권 운동이 일어나는 가운데, 1889년 천황에게 전쟁 선포·조약 체결 등 많은 권한을 부여한 일본 제국 헌법이 공포되었다.' },
    { id: 'e-sino-jp', track: 'eastasia', year: 1894, label: '청일 전쟁', en: 'First Sino-Japanese War',
      state: '청', theme: '군사', kind: 'turning',
      body: '조선을 두고 청과 대립하던 일본이 일으킨 전쟁. 승리한 일본은 시모노세키 조약(1895)으로 청이 조선에 대한 권리를 포기하게 하고 랴오둥반도와 타이완을 넘겨받았다.' },
    { id: 'e-wuxu', track: 'eastasia', year: 1898, label: '무술변법', en: 'Hundred Days Reform',
      state: '청', theme: '정치', kind: 'turning',
      body: '청일 전쟁 패배 이후 캉유웨이와 량치차오 등이 광서제의 신임을 받아 입헌 군주제 도입 등 근대적 개혁을 추진하였으나, 서태후 등 보수 세력의 반발로 실패하였다.' },
    { id: 'e-xinchou', track: 'eastasia', year: 1901, label: '신축조약', en: 'Boxer Protocol',
      state: '청', theme: '외교', kind: 'turning',
      body: '‘청 왕조를 도와 서양 세력을 몰아내자.’라고 주장하는 의화단 운동이 산둥에서 일어났으나 8개국 연합군에게 진압되었다. 청은 1901년 열강과 신축조약을 체결하였다.' },
    { id: 'e-xinhai', track: 'eastasia', year: 1911, label: '신해혁명', en: 'Xinhai Revolution',
      state: '중화민국', theme: '정치', kind: 'turning',
      body: '쑨원의 삼민주의를 지도 이념으로 삼은 혁명 세력이 성장하는 가운데, 1911년 우창에서 신식 군대를 중심으로 봉기가 일어나고 각 성이 호응하였다. 쑨원이 임시 대총통으로 추대되어 1912년 중화민국이 수립되었다.' },
    { id: 'e-may4', track: 'eastasia', year: 1919, label: '5·4 운동', en: 'May Fourth Movement',
      state: '중화민국', theme: '사회', kind: 'turning',
      body: '파리 강화 회의에서 산둥반도의 독일 이권이 일본에 넘어가자 베이징의 학생들이 시위를 일으켰고, 거국적인 항일 구국 운동으로 발전하였다.' },
    { id: 'e-kmt-ccp', track: 'eastasia', year: 1924, label: '제1차 국공 합작', en: 'First United Front',
      state: '중화민국', theme: '정치', kind: 'turning',
      body: '중국 국민당과 중국 공산당이 군벌과 제국주의 세력에 맞서 손을 잡았다(1924~1927). 1926년 북벌을 시작하였다.' },
    { id: 'e-manchuria', track: 'eastasia', year: 1931, label: '만주 사변', en: 'Mukden Incident',
      state: '일본', theme: '군사', kind: 'turning',
      body: '대공황으로 경제가 침체하자 일본은 대외 침략으로 위기를 벗어나려 하였다. 1931년 류탸오후 사건을 일으켜 만주 지역을 점령하고 만주국을 세웠다.' },
    { id: 'e-sino-jp-war', track: 'eastasia', year: 1937, label: '중일 전쟁', en: 'Second Sino-Japanese War',
      state: '중화민국', theme: '군사', kind: 'turning',
      body: '일본이 루거우차오 사건을 빌미로 일으킨 전쟁. 일본군은 수도 난징을 점령하고 대학살을 저질렀다. 국민당과 공산당은 제2차 국공 합작으로 맞섰다.' },
    { id: 'e-pacific', track: 'eastasia', year: 1941, label: '아시아·태평양 전쟁', en: 'Asia-Pacific War',
      state: '일본', theme: '군사', kind: 'turning',
      body: '일본이 미국의 진주만을 기습하면서 시작된 전쟁. 일본은 동남아시아와 태평양 일대로 전선을 넓혔으나 1945년 무조건 항복하였다.' },
    { id: 'e-dr-vietnam', track: 'eastasia', year: 1945, label: '베트남 민주 공화국', en: 'Democratic Republic of Vietnam',
      state: '베트남', theme: '정치', kind: 'turning',
      body: '일본이 패망하자 호찌민이 베트남 민주 공화국 수립을 선포하였다. 이후 프랑스와 전쟁을 벌였다.' },
    { id: 'e-civilwar', track: 'eastasia', year: 1946, label: '국공 내전', en: 'Chinese Civil War',
      state: '중국', theme: '정치', kind: 'turning',
      body: '일본 패망 후 국민당과 공산당이 다시 충돌하여 1946년 내전이 본격화하였다. 공산당이 승리하였고 국민당 정부는 타이완으로 옮겨 갔다.' },
    { id: 'e-prc', track: 'eastasia', year: 1949, label: '중화 인민 공화국', en: 'People\'s Republic of China',
      state: '중국', theme: '정치', kind: 'turning',
      body: '국공 내전에서 승리한 중국 공산당의 마오쩌둥이 1949년 10월 1일 톈안먼 광장에서 중화 인민 공화국 수립을 선포하였다. 수도는 베이징.' },
    { id: 'e-sf', track: 'eastasia', year: 1951, label: '샌프란시스코 강화 조약', en: 'Treaty of San Francisco',
      state: '일본', theme: '외교', kind: 'turning', sub: 1,
      body: '일본과 연합국이 맺은 강화 조약. 일본은 이 조약으로 주권을 회복하였다.' },
    { id: 'e-cultural', track: 'eastasia', year: 1966, label: '문화 대혁명', en: 'Cultural Revolution',
      state: '중국', theme: '정치', kind: 'turning',
      body: '정치적 위기에 빠진 마오쩌둥이 홍위병을 동원하여 반대 세력을 제거한 정치·권력 투쟁(1966~1976).' },
    { id: 'e-nixon', track: 'eastasia', year: 1972, label: '닉슨 중국 방문', en: 'Nixon in China',
      state: '중국', theme: '외교', kind: 'turning',
      body: '미국 대통령 닉슨이 중국을 방문하여 미중 관계 개선의 길을 열었다.' },
    { id: 'e-vietwar-end', track: 'eastasia', year: 1975, label: '베트남 전쟁 종식', en: 'End of the Vietnam War',
      state: '베트남', theme: '군사', kind: 'turning',
      body: '미국의 개입으로 확대된 베트남 전쟁이 1975년 끝나고 베트남은 통일되었다.' },
    { id: 'e-reform', track: 'eastasia', year: 1978, label: '개혁·개방', en: 'Reform and Opening-up',
      state: '중국', theme: '경제', kind: 'turning',
      body: '마오쩌둥 사후 실권을 잡은 덩샤오핑이 개혁·개방 정책을 추진하였다. 중국은 급속한 경제 성장을 이루었으나 관료들의 부정부패도 심해졌다.' },
    { id: 'e-tiananmen', track: 'eastasia', year: 1989, label: '톈안먼 사건', en: 'Tiananmen Square Incident',
      state: '중국', theme: '사회', kind: 'turning',
      body: '1989년 톈안먼 광장에서 정치 민주화를 요구하던 시위를 정부가 무력으로 진압하였다.' },

    { id: 'w-paleo', track: 'west', year: -1198050, yearLabel: '약 120만 년 전 ~', label: '구석기 시대', en: 'Paleolithic',
      state: '구석기', theme: '사회', kind: 'turning',
      body: '유럽의 구석기 시대 — 스페인 아타푸에르카의 시마 델 엘레판테 유적(약 140만~110만 년 전)에서 서유럽에서 가장 오래된 인류 화석이 발견되었다. 뗀석기, 동굴·바위 그늘 거주, 이동 생활. 프랑스 쇼베·라스코, 스페인 알타미라 동굴 벽화와 오스트리아 빌렌도르프 비너스 등 예술 활동의 흔적이 남아 있다.' },

      state: '신석기', theme: '사회', kind: 'turning',
      body: '유럽의 신석기 시대 — 빙하기 종료 후 농경·목축 시작. 간석기·토기 사용. 영국 스톤헨지 등 거석 문화 유적이 후기에 출현하였다.' },
    { id: 'w-bronze', track: 'west', year: -3000, yearLabel: '3000 BCE 무렵 ~', label: '청동기 시대', en: 'Bronze Age',

      body: '유럽의 청동기 시대 — BCE 3000년경부터 동지중해(에게해)와 발칸·중부 유럽에서 청동기 보급. 크레타(미노스)·미케네 등 에게 문명이 대표적. 청동제 무기·장식과 거석 문화 발달, 사회 계급 분화와 도시·궁전 사회 형성.' },
    // ---------- 문명 형성 ----------
    { id: 'w-egypt-civ', track: 'westasia', year: -3000, label: '이집트 문명', en: 'Egyptian Civilization',
      state: '이집트 문명', theme: '문화', kind: 'turning',

    { id: 'w-aegean', track: 'west', year: -3000, yearLabel: '3000 BCE 무렵 ~', label: '에게 문명', en: 'Aegean Civilization',

      body: '에게해 일대의 청동기 문명 — 크레타의 미노아 문명(크노소스 궁전·선형 문자 A)과 그리스 본토의 미케네 문명(사자문·선형 문자 B)을 통칭. 해상 무역으로 번성했으며, 후일 그리스 폴리스 문명의 기반이 되었다.' },
    { id: 'w-america', track: 'west', year: -3000, yearLabel: '3000~2000 BCE 무렵', label: '아메리카 문명', en: 'Mesoamerican Civilizations',
      state: '아메리카 문명', theme: '문화', kind: 'turning',
      body: '아메리카 대륙의 독자적 고대 문명 — 마야(BCE 3000~2000년 무렵 형성 추정, 0의 개념·20진법·천문학), 멕시코만 일대의 올멕(BCE 1500년 무렵 형성 추정), 후일 아스테카·잉카까지 이어진다. 옥수수 농경 기반 도시 문명.' },
    { id: 'w-polis', track: 'west', year: -1000, yearLabel: '10세기 BCE 무렵', label: '폴리스 성립', en: 'Greek Polis',
      state: '그리스', theme: '정치', kind: 'turning',
      body: '암흑기 종료 후 그리스 각지에 폴리스(도시 국가)가 형성. 아크로폴리스(성채)와 아고라(광장)를 중심으로 시민 공동체 발달. 아테네·스파르타·테베·코린토스 등 1,000여 개 폴리스. 호메로스 서사시(『일리아스』·『오디세이아』) 정착, 페니키아 알파벳 수용. 올림피아 제전(BCE 776~) 등 범그리스 축제로 동질감 유지.' },
    { id: 'w-sparta', track: 'west', year: -800, yearLabel: '800 BCE경', label: '스파르타', en: 'Sparta',
      state: '스파르타', theme: '정치', kind: 'turning',
      body: '펠로폰네소스 반도의 군국주의 폴리스. 두 왕·5인 감독관(에포로스)·30인 원로회·민회 체제. 리쿠르고스 법전과 엄격한 군사 교육(아고게). 다수 헤일로타이(예속 농민) 위에 군림한 소수 시민군.' },
    { id: 'w-athens', track: 'west', year: -750, yearLabel: '8세기 BCE', label: '아테네', en: 'Athens',
      state: '아테네', theme: '정치', kind: 'turning',
      body: '아티카 반도의 폴리스. 솔론(BCE 594)·클레이스테네스(BCE 508)의 개혁을 거쳐 페리클레스 시대(BCE 461~429)에 직접 민주정 황금기. 파르테논 신전 등 고전기 그리스 문화의 중심.' },
    // 그리스 문화 묶음 라벨 노드 (hidden) — 폴리스·스파르타·아테네를 묶어 기록 열람으로 통합 내용 확인
    { id: 'w-greek-culture', track: 'west', year: -800, label: '그리스 문화', en: 'Greek Culture',
      state: '그리스', theme: '문화', kind: 'event', hidden: true,
      body: '폴리스를 무대로 꽃핀 고대 그리스의 문화. 인간 중심적이고 합리적인 성격을 띠어 신화·서사시(호메로스), 비극, 자연 철학과 소피스트·소크라테스의 철학, 헤로도토스·투키디데스의 역사 서술, 파르테논 신전으로 대표되는 조화와 균형의 건축·조각이 발달하였다. 헬레니즘 시대를 거쳐 로마로 이어지며 서양 문화의 뿌리가 되었다.' },
    { id: 'w-rome-found', track: 'west', year: -753, label: '로마', en: 'Rome',
      state: '로마', theme: '정치', kind: 'turning',
      body: '이탈리아 중부 라티움 지방의 도시 국가에서 출발하여 공화정·제정을 거쳐 지중해 일대를 통일한 고대 제국. 로물루스 건국(BCE 753 전승) → 공화정(BCE 509) → 옥타비아누스 제정 시작(BCE 27) → 5현제 시대 · Pax Romana → 4세기 분리 → 서로마 멸망(476). 12표법·만민법·콜로세움·도로망 등 보편 문명의 기틀을 남겼다.' },
    { id: 'w-rome-rep', track: 'west', year: -509, label: '로마 공화정', en: 'Roman Republic',
      state: '로마', theme: '정치', kind: 'turning',
      body: '에트루리아 왕 타르퀴니우스를 추방하고 공화정 수립. 집정관 2인·원로원·민회의 혼합 정체.' },
    { id: 'w-greco-persian', track: 'west', year: -492, label: '그리스·페르시아 전쟁', en: 'Greco-Persian Wars',
      state: '그리스', theme: '군사', kind: 'turning',
      body: 'BCE 492~479 페르시아의 3차 침공에 맞선 그리스 폴리스 연합의 항쟁. 마라톤 전투(BCE 490)·살라미스 해전(BCE 480)·플라타이아이 전투(BCE 479)를 거쳐 그리스 승리. 이후 칼리아스 평화(BCE 448)로 공식 종전. 아테네 해상 패권(델로스 동맹) 확립.' },
    { id: 'w-peloponnesian', track: 'west', year: -431, label: '펠로폰네소스 전쟁', en: 'Peloponnesian War',
      state: '그리스', theme: '군사', kind: 'turning',
      body: 'BCE 431~404 아테네 중심 델로스 동맹 vs 스파르타 중심 펠로폰네소스 동맹의 27년 전쟁. BCE 404 아테네 항복으로 종결. 스파르타 패권으로 이어지지만 폴리스 문명 전체가 쇠퇴.' },
    { id: 'w-alexander-empire', track: 'west', year: -336, label: '알렉산드로스 제국', en: 'Empire of Alexander',
      state: '마케도니아', theme: '정치', kind: 'turning',

    { id: 'w-punic', track: 'west', year: -264, label: '로마·카르타고 전쟁', en: 'Rome–Carthage (Punic) Wars',
      state: '로마', theme: '군사', kind: 'event', noSync: true,
      body: '로마와 카르타고의 3차에 걸친 전쟁(BCE 264~146). 한니발의 알프스 횡단, 카르타고 멸망.' },
    { id: 'w-rome-emp', track: 'west', year: -27, label: '로마 제정', en: 'Roman Empire',
      state: '로마', theme: '정치', kind: 'turning',
      body: '악티움 해전(BCE 31) 승리로 지배권을 장악한 옥타비아누스가 원로원으로부터 아우구스투스 칭호를 받으며 제정 개막(BCE 27). 프린켑스(제1시민)를 자처하며 사실상 황제로 군림. 5현제 시대까지 약 200년의 팍스 로마나 → 군인 황제 시대의 혼란 → 디오클레티아누스·콘스탄티누스의 중흥 → 395년 동·서 분리.' },
    { id: 'w-jesus', track: 'west', year: 30, label: '크리스트교의 성립과 확산', en: 'Rise and Spread of Christianity',
      state: '크리스트교', theme: '종교', kind: 'turning',
      body: '팔레스타인의 예수(BCE 4?~CE 30?)가 사랑과 평등을 설파하며 활동, 십자가형으로 순교. 사도 바울 등이 이방인에게 전파하여 로마 제국 전역으로 확산. 313년 밀라노 칙령으로 공인, 392년 로마 국교로 채택.' },
    { id: 'w-edict', track: 'west', year: 313, label: '밀라노 칙령', en: 'Edict of Milan',
      state: '로마', theme: '종교', kind: 'event', noSync: true,
      body: '콘스탄티누스 대제가 크리스트교 공인. 박해받던 종교에서 후일 제국 종교(테오도시우스, 392)로.' },
    { id: 'w-split', track: 'west', year: 395, label: '로마 동·서 분열', en: 'Empire Split',
      state: '로마', theme: '정치', kind: 'event', noSync: true,
      body: '테오도시우스 황제 사후 제국이 동로마(수도 콘스탄티노폴리스)와 서로마로 분리.' },
    { id: 'w-fall', track: 'west', year: 476, label: '서로마 멸망', en: 'Fall of the Western Roman Empire',
      state: '로마', theme: '정치', kind: 'event', noSync: true,
      body: '게르만 용병대장 오도아케르가 서로마의 마지막 황제 로물루스 아우구스툴루스를 폐위(CE 476). 서로마 제국 멸망. 고대의 종말. 동로마(비잔티움 제국)는 1453년까지 지속.' },

    { id: 'w-charlemagne', track: 'west', year: 800, label: '카롤루스 대제 대관', en: 'Coronation of Charlemagne',

      body: '서로마 제국 멸망 후 게르만족이 세운 프랑크 왕국은 클로비스 때 로마 가톨릭교로 개종하며 성장하였다. 카롤루스 대제가 서유럽 대부분을 통합하자 교황은 800년 그를 서로마 황제로 대관하였다.' },

    { id: 'w-canossa', track: 'west', year: 1077, label: '카노사의 굴욕', en: 'Walk to Canossa',
      state: '신성 로마 제국', theme: '종교', kind: 'turning',
      body: '교황 그레고리우스 7세가 성직자 서임권을 둘러싸고 신성 로마 제국 황제 하인리히 4세와 대립하였다. 파문당한 황제는 카노사에서 교황에게 용서를 구하였다. 이후 보름스 협약(1122)으로 교황이 서임권을 차지하였다.' },
    { id: 'w-crusade', track: 'west', year: 1096, label: '십자군 전쟁', en: 'Crusades',
      state: '크리스트교', theme: '군사', kind: 'turning',
      body: '셀주크 튀르크가 비잔티움 제국을 위협하자 비잔티움 황제가 교황에게 도움을 요청하였다. 교황 우르바누스 2세가 클레르몽 공의회(1095)에서 성지 회복을 호소하면서 1096년 십자군 전쟁이 시작되었다. 제4차 십자군(1202)까지 이어진 원정이 실패하면서 교황권이 약해지고 동방과의 교역이 활발해졌다.' },
    { id: 'w-avignon', track: 'west', year: 1309, label: '아비뇽 유수', en: 'Avignon Papacy',
      state: '크리스트교', theme: '종교', kind: 'turning',
      body: '프랑스 왕 필리프 4세와 교황 보니파키우스 8세가 대립한 끝에 교황청이 1309년부터 1377년까지 프랑스 아비뇽으로 옮겨져 프랑스 왕의 영향력 아래 놓였다.' },
    { id: 'w-hundred', track: 'west', year: 1337, label: '백년 전쟁', en: 'Hundred Years\' War',
      state: '영국·프랑스', theme: '군사', kind: 'turning',
      body: '프랑스 왕위 계승권 등을 두고 영국과 프랑스가 벌인 전쟁(1337~1453). 잔 다르크 등의 활약으로 프랑스가 승리하였고, 두 나라는 중앙 집권 국가로 나아갔다.' },
    { id: 'w-columbus', track: 'west', year: 1492, label: '신항로 개척', en: 'Age of Exploration',
      state: '에스파냐', theme: '경제', kind: 'turning',

    { id: 'w-gama', track: 'west', year: 1498, label: '바스쿠 다 가마 인도 도착', en: 'Vasco da Gama',

    { id: 'w-luther', track: 'west', year: 1517, label: '종교 개혁', en: 'Reformation',
      state: '크리스트교', theme: '종교', kind: 'turning',
      body: '교황이 면벌부를 판매하자 루터가 1517년 「95개조 반박문」을 발표하였다. 아우크스부르크 화의(1555)로 루터파가 공인되었고, 칼뱅의 개혁과 영국 헨리 8세의 수장법(1534) 등으로 확산되었다.' },
    { id: 'w-magellan', track: 'west', year: 1519, label: '마젤란 세계 일주', en: 'Magellan Expedition',

    { id: 'w-glorious', track: 'west', year: 1688, label: '명예혁명', en: 'Glorious Revolution',
      state: '영국', theme: '정치', kind: 'turning',
      body: '의회가 제임스 2세의 전제 정치에 맞서 그의 딸 메리와 남편 윌리엄을 공동 왕으로 추대하였다. 유혈 사태 없이 이루어져 명예혁명이라 한다. 이듬해 의회가 제출한 권리 장전을 왕이 승인하였다.' },
    { id: 'w-industrial', track: 'west', year: 1770, yearLabel: '18세기 후반', label: '산업 혁명', en: 'Industrial Revolution',
      state: '영국', theme: '경제', kind: 'turning',
      body: '18세기 후반 영국에서 기계 발명과 동력 혁명으로 생산 방식이 크게 바뀌었다. 공장제 기계 공업이 발달하고 증기 기관차 등 교통이 혁신되었으며, 도시와 노동자 계층이 성장하였다.' },
    { id: 'w-us-indep', track: 'west', year: 1776, label: '미국 독립 선언', en: 'Declaration of Independence',
      state: '미국', theme: '정치', kind: 'turning',
      body: '영국의 과세에 반발한 13개 식민지는 보스턴 차 사건(1773)과 대륙 회의(1774)를 거쳐 1776년 독립 선언문을 발표하였다. 독립 전쟁에서 승리하여 파리 조약(1783)으로 독립을 인정받았다.' },
    { id: 'w-french-rev', track: 'west', year: 1789, label: '프랑스 혁명', en: 'French Revolution',
      state: '프랑스', theme: '정치', kind: 'turning',
      body: '1789년 제3 신분 대표들이 국민 의회를 세우면서 혁명이 시작되었다. 이후 입법 의회(1791), 국민 공회(1792), 총재 정부(1795)를 거쳐 1799년 나폴레옹의 통령 정부가 수립되었다.' },
    { id: 'w-napoleon', track: 'west', year: 1804, label: '나폴레옹 황제 즉위', en: 'Napoleon Crowned Emperor',
      state: '프랑스', theme: '정치', kind: 'turning',
      body: '국민의 지지를 얻은 나폴레옹이 국민 투표로 황제에 즉위하였다(제1 제정). 유럽 대부분을 장악하고 대륙 봉쇄령을 내렸으나 러시아 원정에 실패한 뒤 몰락하였다.' },
    { id: 'w-haiti', track: 'west', year: 1804, label: '아이티 독립', en: 'Haitian Independence',
      state: '라틴 아메리카', theme: '정치', kind: 'turning',
      body: '생도맹그라고 불리던 섬의 주민들이 독립하여 라틴 아메리카 최초의 독립 국가 아이티를 세웠다. 이후 볼리바르와 산마르틴 등의 활약으로 라틴 아메리카 각국이 독립하였다.' },
    { id: 'w-vienna', track: 'west', year: 1814, label: '빈 회의', en: 'Congress of Vienna',
      state: '유럽', theme: '외교', kind: 'turning',
      body: '나폴레옹 몰락 후 유럽 각국의 대표가 모여 전후 처리를 협의한 회의(1814~1815). 혁명 이전의 질서로 되돌리려는 빈 체제가 성립하였다.' },
    { id: 'w-july', track: 'west', year: 1830, label: '7월 혁명', en: 'July Revolution',
      state: '프랑스', theme: '정치', kind: 'turning',
      body: '샤를 10세가 의회를 해산하고 선거권을 제한하는 등 전제 정치를 펼치자 파리 시민이 봉기하였다. 루이 필리프를 왕으로 추대하여 7월 왕정을 수립하였다.' },
    { id: 'w-feb', track: 'west', year: 1848, label: '2월 혁명', en: 'February Revolution',
      state: '프랑스', theme: '정치', kind: 'turning',
      body: '선거권 확대를 요구하는 시민들이 7월 왕정을 무너뜨리고 제2공화정을 수립하였다. 그 영향으로 유럽 각지에서 혁명이 일어나 빈 체제가 무너졌다.' },
    { id: 'w-italy', track: 'west', year: 1861, label: '이탈리아 왕국', en: 'Kingdom of Italy',
      state: '이탈리아', theme: '정치', kind: 'turning',
      body: '사르데냐 왕국을 중심으로 통일 운동이 전개되었다. 가리발디가 남부의 시칠리아와 나폴리를 점령하여 사르데냐 왕국에 바치면서 1861년 이탈리아 왕국이 수립되었다. 이후 베네치아를 병합하고 교황령을 점령하여 통일을 완성하였다.' },
    { id: 'w-civilwar', track: 'west', year: 1861, label: '남북 전쟁', en: 'American Civil War',
      state: '미국', theme: '정치', kind: 'turning',
      body: '노예제를 둘러싸고 남부와 북부가 대립하다 일어난 전쟁. 링컨이 노예 해방 선언(1863)을 발표하였고 북부가 승리하였다.' },
    { id: 'w-germany', track: 'west', year: 1871, label: '독일 제국', en: 'German Empire',
      state: '독일', theme: '정치', kind: 'turning',

    { id: 'w-ww1', track: 'west', year: 1914, label: '제1차 세계 대전', en: 'World War I',
      state: '유럽', theme: '군사', kind: 'turning',

    { id: 'w-russia', track: 'west', year: 1917, label: '러시아 혁명', en: 'Russian Revolution',
      state: '러시아', theme: '정치', kind: 'turning',
      body: '전쟁으로 고통받던 러시아에서 혁명이 일어나 황제가 물러났다. 이어 레닌이 이끄는 볼셰비키가 정권을 잡고 사회주의 정부를 세웠다. 레닌은 민족 자결의 원칙을 내세워 식민지 민족 해방 운동을 지원하겠다고 약속하였다.' },
    { id: 'w-paris', track: 'west', year: 1919, label: '파리 강화 회의', en: 'Paris Peace Conference',
      state: '유럽', theme: '외교', kind: 'turning',
      body: '제1차 세계 대전의 전후 처리를 위해 열린 회의(1919~1920). 미국 대통령 윌슨이 민족 자결주의를 담은 14개조 평화 원칙을 제시하였다. 1920년 국제 연맹이 창설되었다.' },
    { id: 'w-depression', track: 'west', year: 1929, label: '대공황', en: 'Great Depression',
      state: '미국', theme: '경제', kind: 'turning',
      body: '1929년 미국에서 시작된 경제 대공황이 전 세계로 확산되었다. 미국은 뉴딜 정책을 펼쳤고, 영국과 프랑스는 블록 경제를 형성하였다. 독일·이탈리아·일본에서는 전체주의가 대두하였다.' },
    { id: 'w-ww2', track: 'west', year: 1939, label: '제2차 세계 대전', en: 'World War II',
      state: '유럽', theme: '군사', kind: 'turning',
      body: '1939년 독일의 폴란드 침공으로 시작된 전쟁. 나치 독일은 수백만 명의 유대인을 학살하였다. 노르망디 상륙 작전(1944) 이후 연합국이 반격하였고, 1945년 일본의 항복으로 끝났다.' },
    { id: 'w-un', track: 'west', year: 1945, label: '국제 연합 창설', en: 'Founding of the United Nations',
      state: '국제', theme: '외교', kind: 'turning',
      body: '제2차 세계 대전 이후 국제 평화를 지키기 위해 1945년 51개국이 참여한 국제 연합(UN)이 창설되었다.' },
    { id: 'w-coldwar', track: 'west', year: 1947, label: '냉전', en: 'Cold War',
      state: '국제', theme: '정치', kind: 'turning',
      body: '미국이 트루먼 독트린(1947)을 발표하여 공산주의 확산을 막겠다고 선언하면서, 미국 중심의 자본주의 진영과 소련 중심의 공산주의 진영이 대립하는 냉전이 본격화하였다.' },
    { id: 'w-cuba', track: 'west', year: 1962, label: '쿠바 미사일 위기', en: 'Cuban Missile Crisis',
      state: '국제', theme: '군사', kind: 'turning',
      body: '소련이 쿠바에 미사일 기지를 건설하려 하자 미국과 소련이 핵전쟁 직전까지 대립한 사건.' },
    { id: 'w-berlin', track: 'west', year: 1989, label: '베를린 장벽 붕괴', en: 'Fall of the Berlin Wall',
      state: '독일', theme: '정치', kind: 'turning',
      body: '동유럽의 공산 정권이 잇달아 무너지는 가운데 1989년 동서 베를린을 가르던 장벽이 무너졌다.' },
    { id: 'w-unify', track: 'west', year: 1990, label: '독일 통일', en: 'German Reunification',

    { id: 'w-eu', track: 'west', year: 1993, label: '유럽 연합', en: 'European Union',
      state: '유럽', theme: '경제', kind: 'turning',
